# =============================================================================
# spark-defaults.conf — JupyterHub singleuser (driver) defaults
#
# spark.master points at the internal ClusterIP service (port 17077) which does
# not NAT through NodePort, avoiding the port-mismatch that broke spark-sql CLI.
#
# S3A / S3 filesystem is wired here so every notebook gets it automatically.
# Credentials (access.key / secret.key / endpoint) are NOT set here — they must
# come from OpenBao in each notebook (Cell 1 → Cell 2).
#
# spark.driver.host is intentionally absent: the notebook resolves the pod IP at
# runtime via socket.gethostbyname(socket.gethostname()) and sets it in the
# SparkSession builder.  That single line in Cell 2 is the permanent solution.
# =============================================================================

# ----- Cluster ----------------------------------------------------------------
spark.master                                    spark://spark-master-internal.prod.svc.cluster.local:17077

# ----- Iceberg extensions -----------------------------------------------------
spark.sql.extensions                            org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# ----- Polaris REST catalog ---------------------------------------------------
spark.sql.catalog.polaris                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.polaris.type                  rest
spark.sql.catalog.polaris.uri                   http://polaris-rest.prod.svc.cluster.local:8181/api/catalog
spark.sql.catalog.polaris.oauth2-server-uri     http://polaris-rest.prod.svc.cluster.local:8181/api/catalog/v1/oauth/tokens

# ----- Driver classpath (JARs baked into this image) -------------------------
# hadoop-aws and aws-java-sdk-bundle live next to the other pyspark jars.
# Using a relative-style path via the known pyspark install location.
spark.driver.extraClassPath                     /opt/conda/lib/python3.11/site-packages/pyspark/jars/iceberg-spark-runtime.jar:/opt/conda/lib/python3.11/site-packages/pyspark/jars/iceberg-aws-bundle.jar:/opt/conda/lib/python3.11/site-packages/pyspark/jars/postgresql.jar:/opt/conda/lib/python3.11/site-packages/pyspark/jars/hadoop-aws-3.3.4.jar:/opt/conda/lib/python3.11/site-packages/pyspark/jars/aws-java-sdk-bundle-1.12.262.jar

# ----- Executor classpath (JARs pre-exist on every Spark worker node) ---------
# Workers already have these at /opt/spark/jars/ — reference them directly so
# nothing is uploaded from the driver.
spark.executor.extraClassPath                   /opt/spark/jars/hadoop-aws-3.3.4.jar:/opt/spark/jars/aws-java-sdk-bundle-1.12.262.jar

# ----- S3A filesystem (handles both s3a:// and plain s3:// URIs) --------------
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3.impl                         org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.connection.ssl.enabled      false
