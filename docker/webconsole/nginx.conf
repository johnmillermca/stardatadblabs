# ── console.stardatadb.com — StarData access console SPA ──────────────────────
# The webconsole-proxy (master2) forwards console.stardatadb.com / here.
# /auth/* and /api/* are handled upstream by the console-backend BFF;
# everything else serves console.html (the access-policy SPA).
server {
    listen 80;
    server_name console.stardatadb.com;

    root /usr/share/nginx/html;

    # ── BFF proxy: /auth/* and /api/* → console-backend ───────────────────────
    # These paths must reach the console-backend BFF (access namespace).
    # The webconsole-proxy on master2 already routes them there, but requests
    # that bypass the proxy (e.g. direct NodePort access) are handled here too.
    # Using a variable defers DNS resolution so nginx starts even if the service
    # is temporarily unresolvable.
    resolver 10.96.0.10 valid=10s ipv6=off;

    location ~* ^/(auth|api)(/|$) {
        set $bff "console-backend.access.svc.cluster.local";
        proxy_pass         http://$bff:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # console.html — the access-policy SPA; never cache so deployments are instant
    location / {
        try_files $uri /console.html;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
        try_files $uri /console.html;
    }

    # ── Invite mailer proxy (same worker8 host, port 8025) ─────────────────────
    location /api/invite {
        proxy_pass         http://127.0.0.1:8025/send-invite;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        add_header         Access-Control-Allow-Origin  "https://console.stardatadb.com" always;
        add_header         Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# ── www.stardatadb.com — marketing / landing page ──────────────────────────────
server {
    listen 80;
    server_name www.stardatadb.com stardatadb.com _;

    root /usr/share/nginx/html;
    index index.html;

    # Use kube-dns for dynamic upstream resolution (required for in-cluster service names).
    resolver 10.96.0.10 valid=10s ipv6=off;

    # /api/signup disabled — self-registration now goes through ZITADEL Login v2
    # at auth.stardatadb.com/ui/v2/login/register directly from the www landing page.
    # Keeping this endpoint active would let the old BFF path create passwordless
    # orphan users that block subsequent ZITADEL registration with "User already exists".
    location = /api/signup {
        return 410;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirect old console.html → stargraph.html
    location = /console.html {
        return 301 /stargraph.html;
    }

    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Prevent browser caching of HTML files so deployments are picked up immediately
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
        try_files $uri $uri/ /index.html;
    }

    # ── SQL Proxy — forwards /api/iceberg/* to the stargraph-sql-proxy ────────
    location /api/iceberg/ {
        set $stargraph_proxy "stargraph-sql-proxy.prod.svc.cluster.local";
        proxy_pass         http://$stargraph_proxy:8680/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header         Access-Control-Allow-Origin  * always;
        add_header         Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # ── Invite mailer — forwards /api/invite to invite-mailer-worker8 ─────────
    location /api/invite {
        proxy_pass         http://127.0.0.1:8025/send-invite;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        add_header         Access-Control-Allow-Origin  "https://www.stardatadb.com" always;
        add_header         Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
