server {
    listen 80;
    server_name www.stardatadb.com stardatadb.com _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirect old console.html → stargraph.html
    location = /console.html {
        return 301 /stargraph.html;
    }

    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Prevent browser caching of HTML files so deployments are picked up immediately
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
        try_files $uri $uri/ /index.html;
    }

    # ── SQL Proxy — forwards /api/iceberg/* to the stargraph-sql-proxy ────────
    # The console page POSTs to /api/iceberg/sql and /api/iceberg/cypher.
    # The proxy strips the /api/iceberg prefix before forwarding.
    location /api/iceberg/ {
        proxy_pass         http://stargraph-sql-proxy.prod.svc.cluster.local:8680/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header         Access-Control-Allow-Origin  * always;
        add_header         Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # ── Invite mailer — forwards /api/invite to invite-mailer-worker8 ─────────
    # invite-mailer-worker8 is a hostNetwork pod on worker8 (same node), port 8025.
    location /api/invite {
        proxy_pass         http://127.0.0.1:8025/send-invite;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        add_header         Access-Control-Allow-Origin  "https://www.stardatadb.com" always;
        add_header         Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
}
