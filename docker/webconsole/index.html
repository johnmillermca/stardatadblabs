<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarDataLabs — Sign in</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #0b0b0f;
      color: #f0f0f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .bg-arc {
      position: fixed; bottom: -120px; left: -120px;
      width: 520px; height: 520px; border-radius: 50%;
      border: 1.5px solid rgba(139,92,246,0.35);
      pointer-events: none; z-index: 0;
    }
    .bg-arc::after {
      content: ''; position: absolute;
      top: 60px; left: 60px; right: 60px; bottom: 60px;
      border-radius: 50%; border: 1px solid rgba(139,92,246,0.15);
    }
    .bg-glow {
      position: fixed; bottom: -200px; left: -200px;
      width: 700px; height: 700px; border-radius: 50%;
      background: radial-gradient(circle, rgba(109,40,217,0.12) 0%, transparent 65%);
      pointer-events: none; z-index: 0;
    }

    .corner-brand {
      position: fixed; top: 22px; left: 28px;
      display: flex; align-items: center; gap: 11px; z-index: 100;
    }
    .corner-brand svg.icon { width: 56px; height: 56px; flex-shrink: 0; }
    .corner-brand .wordmark { display: flex; flex-direction: column; line-height: 1; }
    .corner-brand .brand-line {
      font-size: 16px; font-weight: 900; letter-spacing: 0.03em;
      text-transform: uppercase; white-space: nowrap; color: #c8c8d4;
    }

    .center-wrap {
      display: flex; flex-direction: column; align-items: center;
      width: 100%; max-width: 680px; padding: 20px 24px 48px;
      position: relative; z-index: 1; text-align: center;
    }

    .hero-brand { margin-bottom: 36px; }
    .hero-brand .hero-name {
      display: flex; align-items: baseline; justify-content: center;
      white-space: nowrap; line-height: 1;
    }
    .hero-brand .h-star, .hero-brand .h-data, .hero-brand .h-labs {
      font-size: 52px; font-weight: 900; color: #d4d4de; letter-spacing: -2px;
    }
    .hero-brand .h-sub {
      display: block; font-size: 11px; font-weight: 700;
      letter-spacing: 0.48em; color: #8b8ba0;
      text-transform: uppercase; margin-top: 8px;
    }

    .tech-pills {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 8px; margin-top: 18px; margin-bottom: 36px;
    }
    .pill {
      font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
      padding: 4px 13px; border-radius: 20px; white-space: nowrap;
    }
    .pill-stream   { background: rgba(14,165,233,0.12);  color: #38bdf8; border: 1px solid rgba(14,165,233,0.3); }
    .pill-etl      { background: rgba(139,92,246,0.12);  color: #a78bfa; border: 1px solid rgba(139,92,246,0.3); }
    .pill-graphrag { background: rgba(109,40,217,0.15);  color: #c4b5fd; border: 1px solid rgba(109,40,217,0.35); }
    .pill-openrag  { background: rgba(16,185,129,0.1);   color: #34d399; border: 1px solid rgba(16,185,129,0.28); }
    .pill-lakehouse{ background: rgba(255,255,255,0.06); color: #d1d5db; border: 1px solid rgba(255,255,255,0.15); }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; width: 100%; max-width: 400px;
      padding: 32px 32px 28px; backdrop-filter: blur(8px);
    }

    .tabs {
      display: flex; border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 28px;
    }
    .tab {
      flex: 1; text-align: center; padding: 10px 0;
      font-size: 14px; font-weight: 600; color: #6b7280;
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s; user-select: none;
    }
    .tab.active { color: #a78bfa; border-bottom-color: #7c3aed; }
    .tab:hover:not(.active) { color: #d1d5db; }

    .panel { display: none; }
    .panel.active { display: block; }

    .field { margin-bottom: 16px; }
    label {
      display: block; font-size: 13px; font-weight: 600;
      color: #9ca3af; margin-bottom: 6px;
    }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    input {
      width: 100%; padding: 9px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 7px; color: #f0f0f5; font-size: 14px;
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,0.18);
    }
    input::placeholder { color: #4b5563; }

    .btn {
      width: 100%; padding: 10px; border: none; border-radius: 7px;
      font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px;
      transition: background 0.15s, box-shadow 0.15s; letter-spacing: 0.02em;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, #6d28d9 0%, #7c3aed 100%);
      color: #fff; box-shadow: 0 2px 12px rgba(109,40,217,0.4);
    }
    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #5b21b6 0%, #6d28d9 100%);
      box-shadow: 0 4px 18px rgba(109,40,217,0.5);
    }
    .btn-secondary {
      background: transparent; color: #a78bfa;
      border: 1.5px solid rgba(139,92,246,0.4);
    }
    .btn-secondary:hover { background: rgba(139,92,246,0.08); border-color: #7c3aed; }

    .divider {
      display: flex; align-items: center; gap: 10px;
      margin: 20px 0; color: #374151; font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.08);
    }

    .msg {
      margin-top: 12px; padding: 10px 14px; border-radius: 8px;
      font-size: 13px; line-height: 1.5; text-align: left; display: none;
    }
    .msg-error  { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.3);  color: #fca5a5; }
    .msg-success{ background: rgba(34,197,94,0.1);  border: 1px solid rgba(34,197,94,0.3);  color: #86efac; }

    .page-footer {
      margin-top: 28px; font-size: 11.5px; color: #374151;
      text-align: center; letter-spacing: 0.03em;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>
  <div class="bg-arc"></div>

  <!-- Corner logo -->
  <div class="corner-brand">
    <svg class="icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="24" cy="24" r="22" fill="#1e0a3c" stroke="#a78bfa" stroke-width="1.5"/>
      <path d="M8 30 Q13 41 24 42.5 Q35 41 40 30 Z" fill="#3b0f8c"/>
      <path d="M9 31.5 Q14 28 19 31.5 Q24 35 29 31.5 Q34 28 39 31.5" stroke="#c4b5fd" stroke-width="1.6" fill="none"/>
      <path d="M10 35 Q15 32 20 35 Q25 38 30 35 Q35 32 38 35" stroke="#a78bfa" stroke-width="1.2" fill="none" opacity="0.7"/>
      <ellipse cx="24" cy="17" rx="7.5" ry="2.8" fill="#5b21b6" stroke="#ddd6fe" stroke-width="1.5"/>
      <rect x="16.5" y="17" width="15" height="10" fill="#4c1d95" stroke="#ddd6fe" stroke-width="1.5"/>
      <ellipse cx="24" cy="27" rx="7.5" ry="2.8" fill="#5b21b6" stroke="#ddd6fe" stroke-width="1.5"/>
      <line x1="17" y1="22" x2="31" y2="22" stroke="#ddd6fe" stroke-width="1" opacity="0.6"/>
      <ellipse cx="35.5" cy="20.5" rx="4.5" ry="1.8" fill="#3b0f8c" stroke="#c4b5fd" stroke-width="1.3"/>
      <rect x="31" y="20.5" width="9" height="6" fill="#2e0a6e" stroke="#c4b5fd" stroke-width="1.3"/>
      <ellipse cx="35.5" cy="26.5" rx="4.5" ry="1.8" fill="#3b0f8c" stroke="#c4b5fd" stroke-width="1.3"/>
      <line x1="4" y1="18" x2="14" y2="18" stroke="#e9d5ff" stroke-width="1.6" stroke-dasharray="2.5 1.5"/>
      <line x1="4" y1="22" x2="14" y2="22" stroke="#c4b5fd" stroke-width="1.4" stroke-dasharray="2.5 1.5" opacity="0.75"/>
      <polyline points="11.5,15.5 15.5,18 11.5,20.5" stroke="#e9d5ff" stroke-width="1.6" fill="none"/>
      <g transform="translate(33,11)">
        <path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4 Z" fill="#f5f3ff"/>
        <circle cx="0" cy="0" r="1.4" fill="#ffffff"/>
      </g>
      <g transform="translate(13,11)">
        <path d="M0,-3.5 L0.8,-0.8 L3.5,0 L0.8,0.8 L0,3.5 L-0.8,0.8 L-3.5,0 L-0.8,-0.8 Z" fill="#ddd6fe"/>
      </g>
    </svg>
    <div class="wordmark">
      <span class="brand-line">StarDataLabs</span>
    </div>
  </div>

  <div class="center-wrap">

    <!-- Hero brand -->
    <div class="hero-brand">
      <div class="hero-name">
        <span class="h-star">Star</span><span class="h-data">Data</span><span class="h-labs">Labs</span>
      </div>
      <span class="h-sub">Realtime &middot; Agentic AI &middot; Lakehouse &middot; Extreme Performance</span>
    </div>

    <!-- Tech pills -->
    <div class="tech-pills">
      <span class="pill pill-stream">Realtime Streaming</span>
      <span class="pill pill-etl">ETL / ELT</span>
      <span class="pill pill-graphrag">GraphRAG</span>
      <span class="pill pill-openrag">OpenRAG</span>
      <span class="pill pill-lakehouse">Lakehouse</span>
    </div>

    <!-- Auth card -->
    <div class="card">
      <div class="tabs">
        <div class="tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</div>
        <div class="tab"        id="tab-signup" onclick="switchTab('signup')">Sign Up</div>
      </div>

      <!-- ── Sign In ── -->
      <div class="panel active" id="panel-signin">
        <button class="btn btn-primary" id="si-btn" onclick="doSignIn()">Sign In</button>
        <div class="divider">or</div>
        <button class="btn btn-secondary" onclick="switchTab('signup')">Create an account</button>
      </div>

      <!-- ── Sign Up ── -->
      <div class="panel" id="panel-signup">
        <button class="btn btn-primary" id="su-btn" onclick="doSignUp()">Create an account</button>
        <div class="divider">or</div>
        <button class="btn btn-secondary" onclick="switchTab('signin')">Already have an account?</button>
      </div>
    </div>

    <p class="page-footer" style="margin-top:16px">www.stardatadb.com &nbsp;&bull;&nbsp; StarDataLabs Platform</p>

  </div>

  <script>
    // ── Tab switcher ──────────────────────────────────────────────
    function switchTab(name) {
      ['signin','signup'].forEach(function(t) {
        document.getElementById('tab-'+t).classList.toggle('active', t === name);
        document.getElementById('panel-'+t).classList.toggle('active', t === name);
      });
    }

    // Sign In — go directly to Pocket ID login page.
    // After successful authentication Pocket ID redirects to console.stardatadb.com.
    function doSignIn() {
      window.location.href = 'https://auth.stardatadb.com';
    }

    // Sign Up — Pocket ID registration page.
    function doSignUp() {
      window.location.href = 'https://auth.stardatadb.com/register';
    }
  </script>

</body>
</html>
