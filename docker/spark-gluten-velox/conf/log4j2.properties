# =============================================================================
# Spark log4j2 configuration — spark-gluten-velox image
#
# Goals
# -----
# 1. Console   : WARN and above only — suppresses known-harmless ERRORs so
#                interactive / kubectl-exec sessions stay clean.
# 2. Log file  : /home/spark/logs/spark-warnings.log
#                Accepts all levels (DEBUG+).  Single rolling file capped at
#                500 MB — on rollover the file is *overwritten* (not rotated)
#                so disk usage never exceeds one copy.
#
# Harmless loggers silenced on console (still written to file)
# ------------------------------------------------------------
#   TransportRequestHandler  — StacklessClosedChannelException when an executor
#                              drops a JAR-fetch stream it no longer needs.
#   OAuth2Manager            — "missing OAuth2 server URI" fallback warning
#                              (suppressed at runtime by bao_spark_init but
#                              may print once before SparkConf is applied).
#   NativeCodeLoader         — "Unable to load native-hadoop library" (harmless
#                              on non-matching glibc / JVM environments).
# =============================================================================

# ── Root logger ───────────────────────────────────────────────────────────────
rootLogger.level                        = warn
rootLogger.appenderRef.console.ref      = Console
rootLogger.appenderRef.file.ref         = RollingFile

# ── Console appender (WARN+ only) ────────────────────────────────────────────
appender.console.type                   = Console
appender.console.name                   = Console
appender.console.target                 = SYSTEM_ERR
appender.console.layout.type            = PatternLayout
appender.console.layout.pattern         = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex
appender.console.filter.threshold.type  = ThresholdFilter
appender.console.filter.threshold.level = WARN

# ── Rolling file appender (all levels, 500 MB cap, overwrite on rollover) ────
appender.file.type                            = RollingFile
appender.file.name                            = RollingFile
appender.file.fileName                        = /home/spark/logs/spark-warnings.log
appender.file.filePattern                     = /home/spark/logs/spark-warnings.log
appender.file.layout.type                     = PatternLayout
appender.file.layout.pattern                  = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%t] %c: %m%n%ex
# DefaultRolloverStrategy with max=1 + fileIndex=min means the single rolled
# file overwrites the previous one — total on-disk size stays ≤ 500 MB.
appender.file.policies.type                   = Policies
appender.file.policies.size.type              = SizeBasedTriggeringPolicy
appender.file.policies.size.size              = 500MB
appender.file.strategy.type                   = DefaultRolloverStrategy
appender.file.strategy.max                    = 1
appender.file.strategy.fileIndex              = min
# Start writing to the file even if DEBUG is below root level
appender.file.filter.threshold.type           = ThresholdFilter
appender.file.filter.threshold.level          = DEBUG

# =============================================================================
# Per-logger overrides
#
# Strategy: route noisy-but-harmless loggers to the file appender only by
# setting additivity=false and attaching only RollingFile — not Console.
# This means their WARN/ERROR events land in spark-warnings.log but are
# never printed to the terminal, regardless of level.
# =============================================================================

# Netty / Spark transport — StacklessClosedChannelException on JAR stream close
# Fires at ERROR level; file-only so it never reaches the console.
logger.transport.name                        = org.apache.spark.network.server.TransportRequestHandler
logger.transport.level                       = warn
logger.transport.additivity                  = false
logger.transport.appenderRef.file.ref        = RollingFile

# Iceberg REST OAuth2 fallback — fires at WARN level; file-only.
logger.oauth2.name                           = org.apache.iceberg.rest.OAuth2Manager
logger.oauth2.level                          = warn
logger.oauth2.additivity                     = false
logger.oauth2.appenderRef.file.ref           = RollingFile

# Hadoop native library unavailable — fires at WARN level; file-only.
logger.nativeloader.name                     = org.apache.hadoop.util.NativeCodeLoader
logger.nativeloader.level                    = warn
logger.nativeloader.additivity               = false
logger.nativeloader.appenderRef.file.ref     = RollingFile

# Spark BlockManager / DAGScheduler — keep at WARN, normal routing (both appenders).
logger.blockmanager.name                     = org.apache.spark.storage.BlockManagerInfo
logger.blockmanager.level                    = warn
logger.blockmanager.additivity               = true

logger.dagscheduler.name                     = org.apache.spark.scheduler.DAGScheduler
logger.dagscheduler.level                    = warn
logger.dagscheduler.additivity               = true
