# =============================================================================
# Spark log4j2 configuration — spark-gluten-velox image
#
# Goals
# -----
# 1. Console   : application INFO/WARN/ERROR only (Python logger, sf2iceberg,
#                bao_spark_init, spark_iceberg_utils).  All Spark/Hadoop/
#                Iceberg/Snowflake/Netty internal messages are suppressed.
# 2. Log file  : /home/spark/logs/spark-warnings.log
#                Captures everything (DEBUG+) from ALL loggers — nothing is
#                lost.  Single rolling file capped at 500 MB; on rollover the
#                file is overwritten so disk usage never exceeds one copy.
#
# Console-suppressed logger packages (file-only)
# -----------------------------------------------
#   org.apache.spark.*        — all Spark internals (Inbox, BlockManager, etc.)
#   org.apache.hadoop.*       — NativeCodeLoader, S3A, HDFS internals
#   org.apache.iceberg.*      — OAuth2Manager, REST catalog internals
#   com.snowflake.*           — JDBC credential provider chain (IMDS probes)
#   net.snowflake.*           — Snowflake Spark connector internals
#   com.amazonaws.*           — AWS SDK request/retry noise
#   io.netty.*                — Netty channel / transport noise
#   com.google.*              — GCP metadata client noise
#   py4j.*                    — py4j gateway internals
# =============================================================================

# ── Root logger ───────────────────────────────────────────────────────────────
# Routes to both appenders by default.
# Python-side loggers (sf2iceberg, bao_spark_init, spark_iceberg_utils) use
# the Python logging module and write directly to stdout/stderr — they are
# unaffected by log4j2 entirely and will continue to appear on the console.
rootLogger.level                        = warn
rootLogger.appenderRef.console.ref      = Console
rootLogger.appenderRef.file.ref         = RollingFile

# ── Console appender ──────────────────────────────────────────────────────────
appender.console.type                   = Console
appender.console.name                   = Console
appender.console.target                 = SYSTEM_ERR
appender.console.layout.type            = PatternLayout
appender.console.layout.pattern         = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# ── Rolling file appender (500 MB cap, single-file overwrite on rollover) ─────
appender.file.type                            = RollingFile
appender.file.name                            = RollingFile
appender.file.fileName                        = /home/spark/logs/spark-warnings.log
appender.file.filePattern                     = /home/spark/logs/spark-warnings.log
appender.file.layout.type                     = PatternLayout
appender.file.layout.pattern                  = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%t] %c: %m%n%ex
appender.file.policies.type                   = Policies
appender.file.policies.size.type              = SizeBasedTriggeringPolicy
appender.file.policies.size.size              = 500MB
appender.file.strategy.type                   = DefaultRolloverStrategy
appender.file.strategy.max                    = 1
appender.file.strategy.fileIndex              = min
appender.file.filter.threshold.type           = ThresholdFilter
appender.file.filter.threshold.level          = DEBUG

# =============================================================================
# Package-level overrides — file-only (additivity=false, no Console ref)
#
# Every logger whose name starts with these prefixes is redirected to the
# rolling log file and never reaches the console appender.
# =============================================================================

# ── All Spark internals ───────────────────────────────────────────────────────
# Covers: Inbox NotSerializableException, BlockManager, DAGScheduler,
#         TransportRequestHandler StacklessClosedChannelException, SparkContext
#         startup messages, executor lifecycle, shuffle service, etc.
logger.spark.name                        = org.apache.spark
logger.spark.level                       = warn
logger.spark.additivity                  = false
logger.spark.appenderRef.file.ref        = RollingFile

# ── All Hadoop internals ──────────────────────────────────────────────────────
# Covers: NativeCodeLoader, S3A filesystem, HDFS client, yarn utils.
logger.hadoop.name                       = org.apache.hadoop
logger.hadoop.level                      = warn
logger.hadoop.additivity                 = false
logger.hadoop.appenderRef.file.ref       = RollingFile

# ── All Iceberg internals ─────────────────────────────────────────────────────
# Covers: OAuth2Manager fallback warning, REST catalog init, manifest writes.
logger.iceberg.name                      = org.apache.iceberg
logger.iceberg.level                     = warn
logger.iceberg.additivity                = false
logger.iceberg.appenderRef.file.ref      = RollingFile

# ── Snowflake JDBC driver ─────────────────────────────────────────────────────
# Covers: cloud IMDS credential provider probes (GCP/AWS/Azure metadata),
#         connection pool management, query lifecycle.
logger.sfJdbc.name                       = com.snowflake
logger.sfJdbc.level                      = warn
logger.sfJdbc.additivity                 = false
logger.sfJdbc.appenderRef.file.ref       = RollingFile

# ── Snowflake Spark connector ─────────────────────────────────────────────────
logger.sfSpark.name                      = net.snowflake
logger.sfSpark.level                     = warn
logger.sfSpark.additivity                = false
logger.sfSpark.appenderRef.file.ref      = RollingFile

# ── AWS SDK (v1 + v2) ─────────────────────────────────────────────────────────
# Covers: RestRequest IMDS timeouts, S3 request retries, credential chain.
logger.aws.name                          = com.amazonaws
logger.aws.level                         = warn
logger.aws.additivity                    = false
logger.aws.appenderRef.file.ref          = RollingFile

logger.awsSdk2.name                      = software.amazon
logger.awsSdk2.level                     = warn
logger.awsSdk2.additivity                = false
logger.awsSdk2.appenderRef.file.ref      = RollingFile

# ── Netty transport ───────────────────────────────────────────────────────────
# Covers: StacklessClosedChannelException, channel lifecycle, buffer warnings.
logger.netty.name                        = io.netty
logger.netty.level                       = warn
logger.netty.additivity                  = false
logger.netty.appenderRef.file.ref        = RollingFile

# ── GCP metadata client (inside Snowflake JDBC) ───────────────────────────────
logger.gcp.name                          = com.google
logger.gcp.level                         = warn
logger.gcp.additivity                    = false
logger.gcp.appenderRef.file.ref          = RollingFile

# ── py4j gateway ──────────────────────────────────────────────────────────────
# Covers: "Closing down clientserver connection" on spark.stop().
logger.py4j.name                         = py4j
logger.py4j.level                        = warn
logger.py4j.additivity                   = false
logger.py4j.appenderRef.file.ref         = RollingFile

# ── Hive metastore / parquet internals ───────────────────────────────────────
logger.hive.name                         = org.apache.hive
logger.hive.level                        = warn
logger.hive.additivity                   = false
logger.hive.appenderRef.file.ref         = RollingFile

logger.parquet.name                      = org.apache.parquet
logger.parquet.level                     = warn
logger.parquet.additivity                = false
logger.parquet.appenderRef.file.ref      = RollingFile
