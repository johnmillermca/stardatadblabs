<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Lakehouse Realtime Streaming</title>
<style>
/* ── Reset & Base ── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}

/* ── Layout ── */
#app{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ── */
#sidebar{
  width:220px;min-width:220px;
  background:linear-gradient(180deg,#06090f 0%,#0d1a2e 100%);
  border-right:1px solid #1c2a3a;
  display:flex;flex-direction:column;
  overflow-y:auto;
}
.sidebar-logo{
  padding:20px 16px 16px;
  border-bottom:1px solid #1c2a3a;
  display:flex;align-items:center;gap:10px;
}
.logo-icon{
  width:36px;height:36px;
  background:linear-gradient(135deg,#4fc3f7 0%,#0288d1 100%);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
  box-shadow:0 0 12px rgba(79,195,247,0.3);
}
.logo-text{font-size:13px;font-weight:700;color:#e6edf3;line-height:1.3}
.logo-sub{font-size:10px;color:#4fc3f7;letter-spacing:.5px;text-transform:uppercase}

.nav-section{padding:12px 0}
.nav-label{font-size:10px;color:#586374;text-transform:uppercase;letter-spacing:.8px;padding:6px 16px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 16px;font-size:13px;color:#8b949e;
  cursor:pointer;border-left:3px solid transparent;
  transition:all .15s;
}
.nav-item:hover{background:rgba(79,195,247,.07);color:#e6edf3}
.nav-item.active{background:rgba(79,195,247,.12);color:#4fc3f7;border-left-color:#4fc3f7}
.nav-icon{font-size:15px;width:18px;text-align:center}
.nav-badge{
  margin-left:auto;background:#1a2e42;color:#4fc3f7;
  font-size:10px;padding:1px 6px;border-radius:10px;font-weight:600;
}

/* ── Main content ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── Topbar ── */
#topbar{
  height:52px;background:#0d1117;border-bottom:1px solid #1c2a3a;
  display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0;
}
#topbar h1{font-size:16px;font-weight:600;color:#e6edf3;flex:1}
.status-pill{
  display:flex;align-items:center;gap:6px;
  background:#0d1f30;border:1px solid #1c3a55;
  padding:4px 10px;border-radius:20px;font-size:12px;color:#8b949e;
}
.status-dot{width:7px;height:7px;border-radius:50%}
.dot-green{background:#2ea043;box-shadow:0 0 6px #2ea043}
.dot-red{background:#da3633;box-shadow:0 0 6px #da3633}
.dot-yellow{background:#d29922;box-shadow:0 0 6px #d29922}
.dot-gray{background:#444}

/* ── Page content ── */
#content{flex:1;overflow-y:auto;padding:24px}

/* ── Cards ── */
.card{
  background:#0d1f30;border:1px solid #1c2a3a;
  border-radius:10px;padding:20px;margin-bottom:20px;
}
.card-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.card-title{font-size:14px;font-weight:600;color:#e6edf3;display:flex;align-items:center;gap:8px}
.card-subtitle{font-size:12px;color:#586374;margin-top:2px}

/* ── Source tabs ── */
.source-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.src-tab{
  padding:7px 16px;border-radius:6px;font-size:13px;font-weight:500;
  border:1px solid #1c2a3a;background:#0d1f30;color:#8b949e;cursor:pointer;
  transition:all .15s;display:flex;align-items:center;gap:6px;
}
.src-tab:hover{border-color:#4fc3f7;color:#4fc3f7}
.src-tab.active{background:rgba(79,195,247,.15);border-color:#4fc3f7;color:#4fc3f7}
.src-badge{
  width:8px;height:8px;border-radius:50%;
}
.badge-pg{background:#336791}
.badge-ora{background:#f80000}
.badge-mg{background:#4db33d}

/* ── Table ── */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{
  text-align:left;padding:9px 12px;
  border-bottom:1px solid #1c2a3a;
  color:#586374;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
}
.data-table td{padding:9px 12px;border-bottom:1px solid #0d1a2e;color:#c9d1d9;vertical-align:middle}
.data-table tr:hover td{background:rgba(79,195,247,.04)}
.data-table tr:last-child td{border-bottom:none}

/* ── Status badge ── */
.s-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600;
}
.s-running{background:#0f2a1a;color:#2ea043;border:1px solid #1a4429}
.s-paused{background:#2a2200;color:#d29922;border:1px solid #4a3a00}
.s-failed{background:#2a0f0f;color:#da3633;border:1px solid #4a1f1f}
.s-stopped{background:#1a1f2a;color:#586374;border:1px solid #2a3040}

/* ── Buttons ── */
.btn{
  padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;
  border:1px solid;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px;
}
.btn-primary{background:#0969da;border-color:#1f6feb;color:#fff}
.btn-primary:hover{background:#1473e6}
.btn-secondary{background:transparent;border-color:#30363d;color:#c9d1d9}
.btn-secondary:hover{border-color:#8b949e;color:#e6edf3}
.btn-danger{background:transparent;border-color:#da3633;color:#da3633}
.btn-danger:hover{background:#2a0f0f}
.btn-success{background:transparent;border-color:#2ea043;color:#2ea043}
.btn-success:hover{background:#0f2a1a}
.btn-warn{background:transparent;border-color:#d29922;color:#d29922}
.btn-warn:hover{background:#2a2200}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-group{display:flex;gap:6px;flex-wrap:wrap}

/* ── Actions dropdown ── */
.act-wrap{position:relative;display:inline-block}
.act-trigger{
  display:flex;align-items:center;gap:5px;
  padding:4px 10px;font-size:11px;font-weight:500;
  background:#0d1f30;border:1px solid #1c2a3a;border-radius:6px;
  color:#e6edf3;cursor:pointer;white-space:nowrap;
}
.act-trigger:hover{border-color:#4fc3f7;color:#4fc3f7}
.act-trigger .caret{font-size:9px;margin-left:2px}
.act-menu{
  display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:999;
  background:#0d1f30;border:1px solid #1c2a3a;border-radius:8px;
  min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,.5);overflow:hidden;
}
.act-wrap.open .act-menu{display:block}
.act-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;font-size:12px;color:#e6edf3;
  cursor:pointer;white-space:nowrap;background:none;border:none;
  width:100%;text-align:left;
}
.act-item:hover{background:#1c2a3a}
.act-item.danger{color:#f85149}
.act-item.danger:hover{background:#2d1a1a}
.act-sep{border:none;border-top:1px solid #1c2a3a;margin:4px 0}

/* ── Table picker ── */
.tpick-wrap{background:#06090f;border:1px solid #1c2a3a;border-radius:8px;padding:14px;margin-bottom:14px}
.tpick-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tpick-title{font-size:12px;font-weight:600;color:#e6edf3}
.tpick-toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:#8b949e;cursor:pointer}
.tpick-search{width:100%;background:#0d1117;border:1px solid #1c2a3a;border-radius:6px;padding:6px 10px;color:#e6edf3;font-size:12px;margin-bottom:8px}
.tpick-search:focus{outline:none;border-color:#4fc3f7}
.tpick-list{max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.tpick-schema{font-size:10px;color:#586374;text-transform:uppercase;letter-spacing:.6px;padding:4px 0 2px;font-weight:600}
.tpick-item{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:12px;color:#8b949e}
.tpick-item:hover{background:#1c2a3a;color:#e6edf3}
.tpick-item input{accent-color:#4fc3f7;cursor:pointer}
.tpick-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.tpick-status{font-size:11px;color:#586374;flex:1}

/* ── Form ── */
.form-row{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-bottom:12px;align-items:start}
.form-label{font-size:12px;color:#8b949e;padding-top:8px;font-weight:500}
.form-input{
  width:100%;padding:7px 10px;background:#06090f;border:1px solid #30363d;
  border-radius:6px;color:#e6edf3;font-size:13px;outline:none;
  transition:border-color .15s;
}
.form-input:focus{border-color:#4fc3f7}
.form-textarea{
  width:100%;padding:8px 10px;background:#06090f;border:1px solid #30363d;
  border-radius:6px;color:#e6edf3;font-size:12px;font-family:'Fira Code','Courier New',monospace;
  outline:none;resize:vertical;min-height:120px;
}
.form-textarea:focus{border-color:#4fc3f7}
.form-select{
  width:100%;padding:7px 10px;background:#06090f;border:1px solid #30363d;
  border-radius:6px;color:#e6edf3;font-size:13px;outline:none;
}

/* ── Modal ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  display:flex;align-items:center;justify-content:center;z-index:1000;
  backdrop-filter:blur(3px);
}
.modal{
  background:#0d1f30;border:1px solid #1c2a3a;border-radius:12px;
  width:680px;max-width:95vw;max-height:90vh;overflow-y:auto;
  padding:24px;
}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-size:15px;font-weight:600;color:#e6edf3}
.modal-close{
  background:none;border:none;color:#586374;font-size:20px;cursor:pointer;line-height:1;
}
.modal-close:hover{color:#e6edf3}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid #1c2a3a}

/* ── Kafka query ── */
.query-bar{display:flex;gap:10px;margin-bottom:16px;align-items:flex-end;flex-wrap:wrap}
.query-field{display:flex;flex-direction:column;gap:4px}
.query-label{font-size:11px;color:#586374;font-weight:500}
.query-input{
  padding:7px 10px;background:#06090f;border:1px solid #30363d;
  border-radius:6px;color:#e6edf3;font-size:13px;outline:none;min-width:200px;
}
.query-input:focus{border-color:#4fc3f7}
.msg-container{
  background:#06090f;border:1px solid #1c2a3a;border-radius:8px;
  overflow:auto;max-height:500px;
}
.msg-row{
  border-bottom:1px solid #0d1a2e;padding:10px 14px;
  font-family:'Fira Code','Courier New',monospace;font-size:12px;
  cursor:pointer;
}
.msg-row:hover{background:rgba(79,195,247,.05)}
.msg-row:last-child{border-bottom:none}
.msg-offset{color:#4fc3f7;margin-right:12px;font-size:11px}
.msg-op{
  display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;margin-right:8px;
}
.op-c{background:#0f2a1a;color:#2ea043}
.op-u{background:#0d2a40;color:#4fc3f7}
.op-d{background:#2a0f0f;color:#da3633}
.op-r{background:#1a2040;color:#8b949e}
.msg-body{color:#c9d1d9;white-space:pre-wrap;word-break:break-all;margin-top:6px;display:none}
.msg-row.expanded .msg-body{display:block}
.msg-summary{color:#8b949e;font-size:12px}

/* ── Dashboard stats ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:20px}
.stat-card{
  background:#06090f;border:1px solid #1c2a3a;border-radius:8px;
  padding:16px;text-align:center;
}
.stat-value{font-size:28px;font-weight:700;color:#4fc3f7;line-height:1}
.stat-label{font-size:11px;color:#586374;margin-top:6px;text-transform:uppercase;letter-spacing:.5px}

/* ── Start CDC modal ── */
.cdc-option-group{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.cdc-option{
  display:flex;align-items:flex-start;gap:12px;
  padding:14px 16px;border-radius:8px;border:2px solid #1c2a3a;
  cursor:pointer;transition:all .15s;background:#06090f;
}
.cdc-option:hover{border-color:#4fc3f7}
.cdc-option.selected{border-color:#4fc3f7;background:rgba(79,195,247,.07)}
.cdc-option input[type=radio]{margin-top:3px;accent-color:#4fc3f7;flex-shrink:0}
.cdc-option-label{font-size:13px;font-weight:600;color:#e6edf3;margin-bottom:3px}
.cdc-option-desc{font-size:11px;color:#8b949e;line-height:1.5}
.cdc-pos-row{
  display:flex;gap:8px;align-items:center;margin-top:10px;
  padding:10px 12px;background:#0d1a2e;border-radius:6px;
  border:1px solid #1c2a3a;
}
.cdc-pos-row .form-input{flex:1;font-family:'Fira Code','Courier New',monospace;font-size:12px}
.cdc-pos-badge{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;
  border-radius:12px;font-size:10px;font-weight:700;letter-spacing:.3px;
  border:1px solid;flex-shrink:0;
}
.badge-scn{background:#1a2040;color:#79c0ff;border-color:#30405a}
.badge-lsn{background:#1a2a1a;color:#56d364;border-color:#2a4030}
.badge-ts{background:#2a1a0a;color:#d29922;border-color:#4a3010}

/* ── Connector config editor ── */
.kv-editor{width:100%}
.kv-row{display:grid;grid-template-columns:1fr 1.5fr auto;gap:8px;margin-bottom:6px;align-items:start}
.kv-input{
  padding:6px 9px;background:#06090f;border:1px solid #30363d;
  border-radius:5px;color:#e6edf3;font-size:12px;outline:none;width:100%;box-sizing:border-box;
}
.kv-input:focus{border-color:#4fc3f7}
select.kv-input{appearance:auto;cursor:pointer;padding-right:4px}
select.kv-input option{background:#0d1117;color:#e6edf3}
select.kv-input optgroup{background:#0d1117;color:#586374;font-size:11px}
.kv-del{
  background:none;border:none;color:#586374;cursor:pointer;font-size:14px;padding:4px;
}
.kv-del:hover{color:#da3633}
.kv-add{
  background:none;border:1px dashed #30363d;color:#586374;
  padding:6px 12px;border-radius:5px;font-size:12px;cursor:pointer;
  width:100%;margin-top:4px;
}
.kv-add:hover{border-color:#4fc3f7;color:#4fc3f7}

/* ── Toast ── */
#toast-area{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{
  background:#0d1f30;border:1px solid #1c2a3a;border-radius:8px;
  padding:12px 16px;font-size:13px;color:#e6edf3;min-width:260px;
  display:flex;align-items:center;gap:10px;
  animation:slideIn .2s ease;
}
.toast-success{border-left:3px solid #2ea043}
.toast-error{border-left:3px solid #da3633}
.toast-info{border-left:3px solid #4fc3f7}
.toast-warn{border-left:3px solid #d29922;color:#d29922}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── Code highlight ── */
.json-key{color:#79c0ff}
.json-str{color:#a5d6ff}
.json-num{color:#ff7b72}
.json-bool{color:#56d364}
.json-null{color:#8b949e}

/* ── Query Space ── */
.qs-wrap{display:grid;grid-template-columns:220px 1fr;gap:0;height:calc(100vh - 52px - 48px);min-height:0}
.qs-sidebar{border-right:1px solid #1c2a3a;overflow-y:auto;padding:12px 0;background:#06090f}
/* ── Query Space source dropdown ── */
.qs-src-dd-wrap{position:relative;padding:10px 12px 12px;border-bottom:1px solid #1c2a3a}
.qs-src-dd-trigger{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:8px;
  border:2px solid #1c2a3a;background:#0d1f30;color:#e6edf3;
  cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;
  font-family:inherit;
}
.qs-src-dd-trigger:hover{border-color:#4fc3f7}
.qs-src-dd-trigger.src-pg{border-color:#336791;color:#79c0ff;background:rgba(51,103,145,.18)}
.qs-src-dd-trigger.src-ora{border-color:#f80000;color:#ff7b72;background:rgba(248,0,0,.12)}
.qs-src-dd-trigger.src-mg{border-color:#4db33d;color:#56d364;background:rgba(77,179,61,.12)}
.qs-src-dd-icon{font-size:20px;line-height:1;flex-shrink:0}
.qs-src-dd-label{flex:1;text-align:left}
.qs-src-dd-caret{font-size:10px;color:#586374;transition:transform .2s;flex-shrink:0}
.qs-src-dd-wrap.open .qs-src-dd-caret{transform:rotate(180deg)}
.qs-src-dd-menu{
  display:none;position:absolute;left:12px;right:12px;top:calc(100% - 4px);z-index:200;
  background:#0d1f30;border:1px solid #1c2a3a;border-radius:8px;
  overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.qs-src-dd-wrap.open .qs-src-dd-menu{display:block}
.qs-src-dd-item{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:9px 14px;font-size:13px;font-weight:600;
  background:none;border:none;color:#8b949e;cursor:pointer;
  font-family:inherit;transition:background .12s;text-align:left;
}
.qs-src-dd-item:hover{background:#1c2a3a;color:#e6edf3}
.qs-src-dd-item.active-pg{color:#79c0ff}
.qs-src-dd-item.active-ora{color:#ff7b72}
.qs-src-dd-item.active-mg{color:#56d364}
.qs-src-dd-item-icon{font-size:18px;line-height:1;flex-shrink:0}
.qs-tree{padding:8px 0}
.qs-tree-db{
  font-size:11px;font-weight:700;color:#8b949e;
  padding:5px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;
  text-transform:uppercase;letter-spacing:.5px;
  user-select:none;
}
.qs-tree-db:hover{color:#e6edf3}
.qs-tree-db .qs-arrow{font-size:9px;color:#586374;transition:transform .15s;display:inline-block}
.qs-tree-db.open .qs-arrow{transform:rotate(90deg)}
.qs-tree-tables{display:none;padding-left:8px}
.qs-tree-db.open + .qs-tree-tables{display:block}
.qs-tree-table{
  font-size:12px;color:#8b949e;padding:4px 12px;cursor:pointer;
  display:flex;align-items:center;gap:6px;border-radius:4px;margin:1px 4px;
}
.qs-tree-table:hover{background:#1c2a3a;color:#e6edf3}
.qs-tree-table .qs-tbl-icon{font-size:10px;color:#586374}
.qs-editor-pane{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.qs-toolbar{
  display:flex;align-items:center;gap:8px;padding:10px 16px;
  border-bottom:1px solid #1c2a3a;background:#0d1117;flex-shrink:0;flex-wrap:wrap;
}
.qs-toolbar-label{font-size:11px;color:#586374;font-weight:500}
.qs-limit-select{
  padding:4px 8px;background:#06090f;border:1px solid #30363d;
  border-radius:5px;color:#e6edf3;font-size:12px;outline:none;
}
.qs-dialect-badge{
  padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700;
  background:#1a2040;color:#79c0ff;border:1px solid #30405a;
}
.qs-dialect-badge.ora{background:#2a0a0a;color:#ff7b72;border-color:#4a1010}
.qs-dialect-badge.mg{background:#0a200a;color:#56d364;border-color:#104a10}
.qs-sql-area{
  flex:1;width:100%;padding:14px 16px;
  background:#06090f;border:none;border-bottom:1px solid #1c2a3a;
  color:#e6edf3;font-size:13px;font-family:'Fira Code','Courier New',monospace;
  outline:none;resize:none;min-height:120px;max-height:260px;
}
.qs-sql-area:focus{background:#070b10}
.qs-results{flex:1;overflow:auto;min-height:0}
.qs-results-inner{padding:0}
.qs-res-bar{
  display:flex;align-items:center;gap:12px;padding:8px 16px;
  background:#0d1117;border-bottom:1px solid #1c2a3a;font-size:12px;
  color:#586374;flex-shrink:0;flex-wrap:wrap;
}

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  GLOBALS
// ═══════════════════════════════════════════════════════════════════════════
const SOURCES = ['postgres','oracle','mongodb'];
const SOURCE_LABELS = { postgres:'PostgreSQL', oracle:'Oracle', mongodb:'MongoDB' };
const SOURCE_BADGE  = { postgres:'badge-pg', oracle:'badge-ora', mongodb:'badge-mg' };
const SOURCE_ICON   = { postgres:'🐘', oracle:'🔶', mongodb:'🍃' };

let currentPage = 'dashboard';
let currentSource = 'postgres';
let allConnectors = {};   // { source: [{name,status},...] }
let allStreamings = [];
let kafkaTopics = [];

// ═══════════════════════════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════════════════════════
function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toast-area').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ═══════════════════════════════════════════════════════════════════════════
//  API HELPERS
// ═══════════════════════════════════════════════════════════════════════════
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  let json;
  try { json = await r.json(); } catch { json = {}; }
  return { ok: r.ok, status: r.status, data: json };
}
const apiGet  = p      => api('GET',    p);
const apiPost = (p, b) => api('POST',   p, b);
const apiPut  = (p, b) => api('PUT',    p, b);
const apiDel  = p      => api('DELETE', p);

// ═══════════════════════════════════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════════════════════════════════
function navigate(page) {
  const prevPage = currentPage;   // capture BEFORE overwriting
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navEl = document.getElementById('nav-' + page);
  if (navEl) navEl.classList.add('active');

  const titles = {
    dashboard: 'Dashboard',
    connectors: 'Debezium Connectors',
    'connector-new': 'New Connector',
    topics: 'Kafka Topics',
    ksql: 'Kafka Query (ksqlDB)',
    streaming: 'Kafka → Iceberg Streaming Jobs',
    'query-space': 'Query Space',
    'compare-job': 'Compare Jobs',
    'compare-dashboard': 'Compare History',
  };
  document.getElementById('page-title').textContent = titles[page] || page;
  renderPage(page, prevPage);
}

// ═══════════════════════════════════════════════════════════════════════════
//  RENDER ROUTER
// ═══════════════════════════════════════════════════════════════════════════
function renderPage(page, prevPage) {
  const c = document.getElementById('content');

  // ── Save compare-job snapshot before navigating away ────────────────────
  // prevPage is the page the user is leaving — if it was compare-job and
  // there is active state, snapshot the current DOM before overwriting it.
  if (prevPage === 'compare-job' && page !== 'compare-job') {
    const wrap = c.querySelector('.cj-wrap');
    if (wrap && (_cjState.jobStatus !== 'idle' || _cjState.lastResult)) {
      _cjPageSnapshot = c.innerHTML;
    }
  }

  // Reset layout overrides set by query-space
  const fullH = page === 'query-space' || page === 'ksql';
  c.style.padding  = fullH ? '0' : '24px';
  c.style.overflow = fullH ? 'hidden' : 'auto';
  c.innerHTML = '<div style="color:#586374;padding:40px;text-align:center">Loading…</div>';
  if (page === 'dashboard')       renderDashboard();
  else if (page === 'connectors') renderConnectors();
  else if (page === 'connector-new') renderConnectorNew();
  else if (page === 'topics')     renderTopics();
  else if (page === 'ksql')       renderKSQL();
  else if (page === 'streaming')  renderStreaming();
  else if (page === 'query-space') renderQuerySpace();
  else if (page === 'compare-job') renderCompareJob();
  else if (page === 'compare-dashboard') renderCompareDashboard();
}

// ═══════════════════════════════════════════════════════════════════════════
//  DASHBOARD
// ═══════════════════════════════════════════════════════════════════════════
async function renderDashboard() {
  const c = document.getElementById('content');

  // fetch connectors + streaming deployments in parallel
  const [results, streamR] = await Promise.all([
    Promise.all(SOURCES.map(s =>
      apiGet(`/api/connectors/${s}`).then(r => ({ source: s, data: r.data }))
    )),
    apiGet('/api/streaming/deployments'),
  ]);

  // ── Build per-connector summary ─────────────────────────────────────────
  let totalConn = 0, runningConn = 0, failedConn = 0;
  // connsBySource: { postgres: [{name, state, unstarted, taskState, anyTaskFailed, tableList}], ... }
  const connsBySource = {};
  for (const { source, data } of results) {
    connsBySource[source] = [];
    if (typeof data === 'object' && !Array.isArray(data)) {
      for (const [name, info] of Object.entries(data)) {
        if (!info || typeof info !== 'object' || !('status' in info)) continue;
        totalConn++;
        const st       = info?.status?.connector?.state || 'UNKNOWN';
        const allTasks = info?.status?.tasks || [];
        const taskState= allTasks[0]?.state || '–';
        const anyTaskFailed = allTasks.some(t => t.state === 'FAILED');
        const includeRaw = info?.info?.config?.['table.include.list'] || info?.info?.config?.['collection.include.list'] || '';
        const tableList  = includeRaw ? includeRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
        const unstarted  = st === 'PAUSED' && !tableList.length;
        if (st === 'RUNNING') runningConn++;
        else if (st === 'FAILED') failedConn++;
        connsBySource[source].push({ source, name, state: st, taskState, anyTaskFailed, tableList, unstarted });
      }
    }
  }

  // ── Group streaming jobs by pipeline.source label ─────────────────────────
  const deploys = streamR.data?.items || [];
  const streamRunning = deploys.filter(d => (d.status?.readyReplicas || 0) > 0).length;
  const jobsBySource = {};
  for (const d of deploys) {
    const src = (d.metadata.labels || {})['pipeline.source'] || 'other';
    if (!jobsBySource[src]) jobsBySource[src] = [];
    jobsBySource[src].push(d);
  }

  // ── Stats row ────────────────────────────────────────────────────────────
  const statsHtml = `
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value">${totalConn}</div>
      <div class="stat-label">CDC Connectors</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:#2ea043">${runningConn}</div>
      <div class="stat-label">Connectors Running</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:#da3633">${failedConn}</div>
      <div class="stat-label">Connectors Failed</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${deploys.length}</div>
      <div class="stat-label">Streaming Jobs</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:#2ea043">${streamRunning}</div>
      <div class="stat-label">Jobs Running</div>
    </div>
  </div>`;

  // ── One card per source: connectors + their streaming jobs inline ─────────
  const groupCards = SOURCES.map(src => {
    const conns = connsBySource[src] || [];
    const jobs  = jobsBySource[src]  || [];
    if (!conns.length && !jobs.length) return '';

    // connector rows
    const connRows = conns.map(conn => {
      const tables = conn.tableList;
      const tableCell = tables.length === 0
        ? `<span style="color:#586374;font-size:11px">—</span>`
        : (() => {
            const vis   = tables.slice(0, 3);
            const extra = tables.length - 3;
            let html = vis.map(t => {
              const short = t.includes('.') ? t.split('.').pop() : t;
              return `<span title="${escHtml(t)}" style="display:inline-block;padding:1px 6px;margin:1px 2px 1px 0;
                background:#0d2a10;border:1px solid #1a4429;border-radius:10px;
                font-size:10px;color:#56d364;font-family:'Fira Code',monospace;white-space:nowrap">${escHtml(short)}</span>`;
            }).join('');
            if (extra > 0) html += `<span style="font-size:10px;color:#586374" title="${escHtml(tables.slice(3).join(', '))}">+${extra}</span>`;
            return html;
          })();
      const taskBadge = conn.unstarted
        ? `<span class="s-badge s-stopped" style="font-size:10px"><span class="status-dot dot-gray"></span>NO TABLES</span>`
        : conn.anyTaskFailed
        ? `<span class="s-badge s-failed" style="font-size:10px;cursor:pointer"
               onclick="currentSource='${src}';navigate('connectors')"
             ><span class="status-dot dot-red"></span>TASK FAILED ⚠</span>`
        : stateBadge(conn.taskState);
      return `<tr style="background:rgba(79,195,247,0.04)">
        <td style="padding-left:12px">
          <span style="font-size:10px;color:#4fc3f7;font-weight:700;letter-spacing:.4px;
                       text-transform:uppercase;margin-right:6px">CDC</span>
          <code style="color:#4fc3f7;font-size:12px;cursor:pointer;text-decoration:underline dotted"
                onclick="currentSource='${src}';navigate('connectors')"
                title="Manage connector">${escHtml(conn.name)}</code>
        </td>
        <td>${stateBadge(conn.state)}</td>
        <td>${taskBadge}</td>
        <td style="max-width:180px">${tableCell}</td>
        <td>
          <button class="btn btn-secondary btn-sm"
            onclick="currentSource='${src}';navigate('connectors')"
            title="Go to connector">⚙ Manage</button>
        </td>
      </tr>`;
    }).join('');

    // streaming job rows for this source
    const jobRows = jobs.map(d => {
      const jname   = d.metadata.name;
      const labels  = d.metadata.labels || {};
      const ready   = d.status?.readyReplicas || 0;
      const desired = d.spec?.replicas || 0;
      const st      = desired === 0 ? 'STOPPED' : ready > 0 ? 'RUNNING' : 'STARTING';
      const modeRaw = labels['pipeline.write-mode'] || '';
      const modeLabel = modeRaw.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ') || '–';
      return `<tr>
        <td style="padding-left:28px">
          <span style="font-size:10px;color:#586374;font-weight:700;letter-spacing:.4px;
                       text-transform:uppercase;margin-right:6px">JOB</span>
          <code style="font-size:12px;color:#c9d1d9">${escHtml(jname)}</code>
          <span style="font-size:11px;color:#4fc3f7;margin-left:8px;font-weight:500">${escHtml(modeLabel)}</span>
        </td>
        <td>${stateBadge(st)}</td>
        <td><span style="color:#586374;font-size:11px">${ready}/${desired} pods</span></td>
        <td></td>
        <td>
          <div class="btn-group">
            ${desired === 0
              ? `<button class="btn btn-success btn-sm" onclick="scaleJob('${escHtml(jname)}',1)">▶ Start</button>`
              : `<button class="btn btn-danger btn-sm" onclick="scaleJob('${escHtml(jname)}',0)">⏹ Stop</button>`}
            <button class="btn btn-secondary btn-sm" onclick="restartJob('${escHtml(jname)}')" title="Restart">↻</button>
          </div>
        </td>
      </tr>`;
    }).join('');

    return `
    <div class="card" style="margin-bottom:16px">
      <div class="card-header" style="margin-bottom:4px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:18px">${SOURCE_ICON[src]}</span>
          <div class="card-title">${SOURCE_LABELS[src]} Pipeline</div>
        </div>
        <div class="btn-group">
          <button class="btn btn-secondary btn-sm"
            onclick="currentSource='${src}';navigate('connectors')">🔌 Connectors</button>
          <button class="btn btn-secondary btn-sm"
            onclick="navigate('streaming')">🌊 Jobs</button>
        </div>
      </div>
      <table class="data-table">
        <thead><tr>
          <th>Name</th><th>State</th><th>Task / Status</th><th>Tables</th><th>Actions</th>
        </tr></thead>
        <tbody>
          ${connRows}
          ${jobRows}
        </tbody>
      </table>
    </div>`;
  }).join('');

  c.innerHTML = statsHtml + `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="font-size:13px;font-weight:600;color:#e6edf3">Pipeline Groups</div>
      <button class="btn btn-secondary btn-sm" onclick="renderDashboard()">↻ Refresh</button>
    </div>
  ` + groupCards;
}

// ═══════════════════════════════════════════════════════════════════════════
//  CONNECTORS PAGE
// ═══════════════════════════════════════════════════════════════════════════
async function renderConnectors() {
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="source-tabs" id="src-tabs">
      ${SOURCES.map(s => `
        <div class="src-tab ${s===currentSource?'active':''}" onclick="switchSource('${s}')">
          <span class="src-badge ${SOURCE_BADGE[s]}"></span>
          ${SOURCE_ICON[s]} ${SOURCE_LABELS[s]}
        </div>`).join('')}
    </div>
    <div id="connector-list"><div style="color:#586374;padding:20px">Loading…</div></div>
  `;
  loadConnectorList(currentSource);
}

function switchSource(src) {
  currentSource = src;
  document.querySelectorAll('.src-tab').forEach((t,i) => t.classList.toggle('active', SOURCES[i]===src));
  loadConnectorList(src);
}

async function loadConnectorList(src) {
  const el = document.getElementById('connector-list');
  const r = await apiGet(`/api/connectors/${src}`);
  const data = r.data;

  if (!r.ok || !data || Object.keys(data).length === 0) {
    el.innerHTML = `<div class="card" style="text-align:center;color:#586374;padding:32px">
      No connectors found for ${SOURCE_LABELS[src]}.
      <br><br><button class="btn btn-primary" onclick="navigate('connector-new')">+ Create Connector</button>
    </div>`;
    return;
  }

  const rows = Object.entries(data)
    // Skip top-level error/metadata keys Debezium returns alongside connectors
    .filter(([, info]) => info && typeof info === 'object' && 'status' in info)
    .map(([name, info]) => {
    const state     = info?.status?.connector?.state || 'UNKNOWN';
    const allTasks  = info?.status?.tasks || [];
    const taskState = allTasks[0]?.state || '–';
    const taskCount = allTasks.length;
    const running   = state === 'RUNNING';
    const paused    = state === 'PAUSED';
    const anyTaskFailed = allTasks.some(t => t.state === 'FAILED');
    const taskFailed    = taskState === 'FAILED';   // kept for first-task error shortcut
    // A connector is "unstarted" when it is PAUSED and has no table/collection include list set
    const includeListRaw = info?.info?.config?.['table.include.list'] || info?.info?.config?.['collection.include.list'] || '';
    const hasTables  = !!includeListRaw;
    const tableList  = includeListRaw ? includeListRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
    const unstarted  = paused && !hasTables;
    // MongoDB supports multiple tasks; Oracle/PG are always single-task
    const multiTaskSupported = src === 'mongodb';
    const singleTaskTitle = (src === 'oracle' ? 'Oracle' : 'PostgreSQL') +
      ' CDC only supports 1 task — to add tables use Edit Config → table.include.list';

    // ── Task state cell: show a badge per task when > 1 ─────────────────────
    let taskBadge;
    if (unstarted) {
      taskBadge = `<span class="s-badge s-stopped"><span class="status-dot dot-gray"></span>NO TABLES</span>`;
    } else if (taskCount > 1) {
      // Multi-task: one badge per task with id and state
      taskBadge = allTasks.map(t => {
        const isFailed = t.state === 'FAILED';
        const badge = isFailed
          ? `<span class="s-badge s-failed" style="cursor:pointer" title="Click to view error trace"
               onclick="showTaskError('${escHtml(src)}','${escHtml(name)}')"
             ><span class="status-dot dot-red"></span>T${t.id} FAILED ⚠</span>`
          : `<span class="s-badge ${t.state === 'RUNNING' ? 's-running' : 's-paused'}"
             ><span class="status-dot ${t.state === 'RUNNING' ? 'dot-green' : 'dot-yellow'}"></span>T${t.id} ${escHtml(t.state)}</span>`;
        return badge;
      }).join(' ');
    } else if (taskFailed) {
      taskBadge = `<span class="s-badge s-failed" style="cursor:pointer" title="Click to view error trace"
           onclick="showTaskError('${escHtml(src)}','${escHtml(name)}')"
         ><span class="status-dot dot-red"></span>FAILED ⚠</span>
         <span style="color:#586374;font-size:11px">(${taskCount} task)</span>`;
    } else {
      taskBadge = `${stateBadge(taskState)} <span style="color:#586374;font-size:11px">(${taskCount} task)</span>`;
    }

    // Build compact table badges — show first 3, collapse rest into "+N more"
    const tableCell = tableList.length === 0
      ? `<span style="color:#586374;font-size:11px">—</span>`
      : (() => {
          const visible = tableList.slice(0, 3);
          const extra   = tableList.length - 3;
          let html = visible.map(t => {
            const short = t.includes('.') ? t.split('.').pop() : t;
            return `<span title="${escHtml(t)}" style="
              display:inline-block;padding:1px 7px;margin:1px 2px 1px 0;
              background:#0d2a10;border:1px solid #1a4429;border-radius:10px;
              font-size:10px;color:#56d364;font-family:'Fira Code','Courier New',monospace;
              cursor:default;white-space:nowrap">${escHtml(short)}</span>`;
          }).join('');
          if (extra > 0) html += `<span style="font-size:10px;color:#586374;margin-left:2px" title="${escHtml(tableList.slice(3).join(', '))}">+${extra} more</span>`;
          return html;
        })();

    return `<tr>
      <td><code style="color:#4fc3f7;font-size:12px">${name}</code></td>
      <td>${stateBadge(state)}</td>
      <td>${taskBadge}</td>
      <td style="max-width:240px">${tableCell}</td>
      <td>
        <div class="act-wrap" id="act-conn-${src}-${name}">
          <button class="act-trigger" onclick="toggleActMenu('act-conn-${src}-${name}')">
            Actions <span class="caret">▾</span>
          </button>
          <div class="act-menu">
            ${unstarted
              ? `<button class="act-item" style="color:#56d364;font-weight:600"
                   onclick="closeActMenus();showAssignTablesModal('${src}','${name}')">
                   ▶ Assign Tables &amp; Start</button>
                 <hr class="act-sep"/>`
              : ''
            }
            ${anyTaskFailed
              ? `<button class="act-item" style="color:#f85149" onclick="closeActMenus();showTaskError('${escHtml(src)}','${escHtml(name)}')">⚠ View Task Error</button>`
              : ''
            }
            <button class="act-item" onclick="closeActMenus();editConnector('${src}','${name}')">✎ Edit Config</button>
            <hr class="act-sep"/>
            ${running || taskState !== '–'
              ? `<button class="act-item"
                   title="Stop connector and task — offset is preserved"
                   onclick="closeActMenus();stopConnector('${escHtml(src)}','${escHtml(name)}')">⏹ Stop</button>`
              : ''
            }
            ${paused || taskState === 'FAILED' || taskState === 'STOPPED' || taskState === '–'
              ? `<button class="act-item"
                   title="Start connector and task — choose how to resume or pick a new position"
                   onclick="closeActMenus();showStartConnectorModal('${escHtml(src)}','${escHtml(name)}')">▶ Start</button>`
              : ''
            }
            <hr class="act-sep"/>
            <button class="act-item"
              title="${escHtml(multiTaskSupported
                ? 'Add or remove collections captured by this connector'
                : 'Add or remove tables captured by this connector')}"
              onclick="closeActMenus();showAddTaskModal('${escHtml(src)}','${escHtml(name)}',${taskCount})">➕ Add Table</button>
            <hr class="act-sep"/>
            <button class="act-item danger" onclick="closeActMenus();deleteConnector('${src}','${name}')">🗑 Delete</button>
          </div>
        </div>
      </td>
    </tr>`;
  }).join('');

  el.innerHTML = `
  <div class="card">
    <div class="card-header">
      <div class="card-title">${SOURCE_ICON[src]} ${SOURCE_LABELS[src]} Connectors</div>
      <div class="btn-group">
        <button class="btn btn-secondary btn-sm" onclick="loadConnectorList('${src}')">↻ Refresh</button>
        <button class="btn btn-secondary btn-sm" onclick="showConnectorLogs('${src}')">📋 Logs</button>
        <button class="btn btn-primary btn-sm" onclick="navigate('connector-new')">+ New</button>
      </div>
    </div>
    <table class="data-table">
      <thead><tr><th>Name</th><th>Connector State</th><th>Task State</th><th>Tables</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

async function editConnector(src, name) {
  const r = await apiGet(`/api/connectors/${src}/${name}/config`);
  if (!r.ok) return toast('Failed to load config', 'error');
  showConnectorModal(src, name, r.data, false);
}

// ─── helpers shared by both Start Task and Start Connector modals ─────────────
function _startModalHtml(modalId, title, subtitle, pos, src, name, applyFn) {

  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <div>
        <div class="modal-title">${title}</div>
        <div style="font-size:11px;color:#586374;margin-top:3px">${subtitle}</div>
      </div>

    </div>

    <div class="cdc-option-group">

      <label class="cdc-option selected" id="${modalId}-opt-resume" onclick="_smSelect('${modalId}','resume')">
        <input type="radio" name="${modalId}-mode" value="resume" checked/>
        <div>
          <div class="cdc-option-label">▶ Resume — Continue from Last Offset
            <span class="cdc-pos-badge badge-ts" style="margin-left:8px">SAFE</span>
          </div>
          <div class="cdc-option-desc">
            Picks up exactly where it left off using the stored Kafka offset.<br>
            No config change. No data loss.
          </div>
        </div>
      </label>

      <label class="cdc-option" id="${modalId}-opt-now" onclick="_smSelect('${modalId}','now')">
        <input type="radio" name="${modalId}-mode" value="now"/>
        <div>
          <div class="cdc-option-label">⏱ Begin Now (Current Time)</div>
          <div class="cdc-option-desc">
            Starts from this moment — skips all changes that happened while stopped.<br>
            Sets <code style="color:#4fc3f7">snapshot.mode=no_data</code>.
          </div>
        </div>
      </label>

      <label class="cdc-option" id="${modalId}-opt-live" onclick="_smSelect('${modalId}','live')">
        <input type="radio" name="${modalId}-mode" value="live"/>
        <div style="width:100%">
          <div class="cdc-option-label">
            📡 Use Current ${pos.name} from Source
            <span class="cdc-pos-badge ${pos.badge}" style="margin-left:8px">${pos.name}</span>
          </div>
          <div class="cdc-option-desc" style="margin-bottom:8px">${pos.hint}</div>
          <div class="cdc-pos-row">
            <input class="form-input" id="${modalId}-live-val" placeholder="${pos.placeholder}" readonly
              style="font-family:'Fira Code','Courier New',monospace;font-size:12px;background:#06090f"/>
            <button class="btn btn-secondary btn-sm"
              onclick="_smFetchPos('${escHtml(src)}','${escHtml(name)}','${modalId}',event)">⟳ Fetch</button>
          </div>
          <div id="${modalId}-live-status" style="font-size:11px;margin-top:6px;color:#586374"></div>
        </div>
      </label>

      <label class="cdc-option" id="${modalId}-opt-manual" onclick="_smSelect('${modalId}','manual')">
        <input type="radio" name="${modalId}-mode" value="manual"/>
        <div style="width:100%">
          <div class="cdc-option-label">
            ✎ Enter ${pos.name} Manually
            <span class="cdc-pos-badge ${pos.badge}" style="margin-left:8px">${pos.name}</span>
          </div>
          <div class="cdc-option-desc" style="margin-bottom:8px">
            Provide a specific ${pos.name} to start from a known checkpoint.
          </div>
          <div class="cdc-pos-row">
            <input class="form-input" id="${modalId}-manual-val" placeholder="${pos.placeholder}"
              style="font-family:'Fira Code','Courier New',monospace;font-size:12px;background:#06090f"
              onclick="_smSelect('${modalId}','manual')"/>
          </div>
        </div>
      </label>

    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('${modalId}')">Cancel</button>
      <button class="btn btn-primary" id="${modalId}-submit"
              onclick="${applyFn}('${escHtml(src)}','${escHtml(name)}','${modalId}')">
        ▶ Start
      </button>

  </div>`;
}

function _smSelect(modalId, mode) {
  ['resume','now','live','manual'].forEach(m => {
    const el = document.getElementById(`${modalId}-opt-${m}`);
    if (!el) return;
    el.classList.toggle('selected', m === mode);
    const radio = el.querySelector('input[type=radio]');
    if (radio) radio.checked = (m === mode);
  });
}

async function _smFetchPos(src, name, modalId, evt) {
  evt && evt.stopPropagation();
  _smSelect(modalId, 'live');
  const statusEl = document.getElementById(`${modalId}-live-status`);
  const valEl    = document.getElementById(`${modalId}-live-val`);
  statusEl.innerHTML = '<span style="color:#d29922">⏳ Fetching live position…</span>';
  valEl.value = '';
  const r = await apiGet(`/api/connectors/${src}/${name}/offset-position`);
  if (r.ok && r.data?.position) {
    valEl.value = r.data.position;
    statusEl.innerHTML = `<span style="color:#2ea043">✓ Fetched at ${new Date().toLocaleTimeString()}</span>`;
  } else {
    statusEl.innerHTML = `<span style="color:#da3633">⚠ ${escHtml((r.data?.error||'Failed to fetch').slice(0,120))}</span>`;
  }
}

function _smGetMode(modalId) {
  const radio = document.querySelector(`#${modalId} input[type=radio]:checked`);
  return radio ? radio.value : null;
}
function _smGetPosition(modalId) {
  const mode = _smGetMode(modalId);
  if (mode === 'live')   return document.getElementById(`${modalId}-live-val`)?.value?.trim()   || null;
  if (mode === 'manual') return document.getElementById(`${modalId}-manual-val`)?.value?.trim() || null;
  return null;
}

// ═══════════════════════════════════════════════════════════════════════════
//  STOP TASK  — calls PUT /pause (pauses connector+task; offset preserved)
// ═══════════════════════════════════════════════════════════════════════════
async function stopTask(src, name) {
  const r = await apiPost(`/api/connectors/${src}/${name}/pause`);
  if (r.ok) {
    toast(`Task stopped for "${name}" — offset preserved. Use "Start Task" to resume.`, 'success');
  } else {
    toast(`Stop Task failed: ${JSON.stringify(r.data).slice(0,120)}`, 'error');
  }
  setTimeout(() => {
    if (currentPage === 'connectors') loadConnectorList(src);
    else renderDashboard();
  }, 2500);
}

// ═══════════════════════════════════════════════════════════════════════════
//  START TASK modal
//  Resume        → POST /connectors/{name}/tasks/{taskId}/restart
//  Now/SCN/LSN   → POST /connectors/{name}/start-from  (delete+recreate)
// ═══════════════════════════════════════════════════════════════════════════
function showStartTaskModal(src, name, taskId) {
  const pos      = CDC_POS_LABEL[src] || { name:'Position', badge:'badge-lsn', placeholder:'', hint:'' };
  const modalId  = 'start-task-modal';
  const existing = document.getElementById(modalId);
  if (existing) existing.remove();

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = modalId;
  modal.dataset.taskId = taskId;
  modal.innerHTML = _startModalHtml(
    modalId,
    `▶ Start Task — ${SOURCE_ICON[src]} ${SOURCE_LABELS[src]}`,
    `Connector: <code style="color:#4fc3f7">${escHtml(name)}</code> &nbsp;·&nbsp; Task ID: <code style="color:#d29922">${taskId}</code>`,
    pos, src, name, 'applyStartTask'
  );
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(modalId); });
  document.body.appendChild(modal);
}

async function applyStartTask(src, name, modalId) {
  const mode     = _smGetMode(modalId);
  const position = _smGetPosition(modalId);
  const taskId   = document.getElementById(modalId)?.dataset?.taskId ?? 0;
  const btn      = document.getElementById(`${modalId}-submit`);

  if (!mode) return toast('Select a start mode', 'error');
  if (mode === 'live'   && !position) return toast('Fetch the live position first', 'error');
  if (mode === 'manual' && !position) return toast('Enter a position value', 'error');

  if (btn) { btn.disabled = true; btn.textContent = '⏳ Starting…'; }

  if (mode === 'resume') {
    // Task-level restart — does NOT reset position
    const r = await apiPost(`/api/connectors/${src}/${name}/tasks/${taskId}/restart`);
    if (r.ok) {
      toast(`Task ${taskId} restarted for "${name}" ✓`, 'success');
      closeModal(modalId);
      setTimeout(() => { if (currentPage === 'connectors') loadConnectorList(src); else renderDashboard(); }, 2000);
    } else {
      toast(`Start Task failed: ${JSON.stringify(r.data).slice(0,120)}`, 'error');
      if (btn) { btn.disabled = false; btn.textContent = '▶ Start'; }
    }
    return;
  }

  // Now / SCN / LSN — delete+recreate connector with new position
  const r = await apiPost(`/api/connectors/${src}/${name}/start-from`, { mode, position });
  if (r.ok) {
    toast(`Task started for "${name}" (${mode}) ✓`, 'success');
    closeModal(modalId);
    setTimeout(() => { if (currentPage === 'connectors') loadConnectorList(src); else renderDashboard(); }, 2000);
  } else {
    toast(`Error: ${JSON.stringify(r.data).slice(0,160)}`, 'error');
    if (btn) { btn.disabled = false; btn.textContent = '▶ Start'; }
  }
}

// ═══════════════════════════════════════════════════════════════════════════
//  STOP CONNECTOR  — calls PUT /pause (same API; pauses connector+tasks)
// ═══════════════════════════════════════════════════════════════════════════
async function stopConnector(src, name) {
  const r = await apiPost(`/api/connectors/${src}/${name}/pause`);
  if (r.ok) {
    toast(`Connector "${name}" stopped — use "Start Connector" to resume.`, 'success');
  } else {
    toast(`Stop Connector failed: ${JSON.stringify(r.data).slice(0,120)}`, 'error');
  }
  setTimeout(() => {
    if (currentPage === 'connectors') loadConnectorList(src);
    else renderDashboard();
  }, 2500);
}

// ═══════════════════════════════════════════════════════════════════════════
//  START CONNECTOR modal
//  Resume        → PUT /resume   (no config change)
//  Now/SCN/LSN   → POST /start-from  (delete+recreate)
// ═══════════════════════════════════════════════════════════════════════════
function showStartConnectorModal(src, name) {
  const pos     = CDC_POS_LABEL[src] || { name:'Position', badge:'badge-lsn', placeholder:'', hint:'' };
  const modalId = 'start-conn-modal';
  const existing = document.getElementById(modalId);
  if (existing) existing.remove();

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = modalId;
  modal.innerHTML = _startModalHtml(
    modalId,
    `▶ Start Connector — ${SOURCE_ICON[src]} ${SOURCE_LABELS[src]}`,
    `Connector: <code style="color:#4fc3f7">${escHtml(name)}</code>`,
    pos, src, name, 'applyStartConnector'
  );
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(modalId); });
  document.body.appendChild(modal);
}

async function applyStartConnector(src, name, modalId) {
  const mode     = _smGetMode(modalId);
  const position = _smGetPosition(modalId);
  const btn      = document.getElementById(`${modalId}-submit`);

  if (!mode) return toast('Select a start mode', 'error');
  if (mode === 'live'   && !position) return toast('Fetch the live position first', 'error');
  if (mode === 'manual' && !position) return toast('Enter a position value', 'error');

  if (btn) { btn.disabled = true; btn.textContent = '⏳ Starting…'; }

  if (mode === 'resume') {
    const r = await apiPost(`/api/connectors/${src}/${name}/resume`);
    if (r.ok) {
      toast(`Connector "${name}" started — resuming from last offset ✓`, 'success');
      closeModal(modalId);
      setTimeout(() => { if (currentPage === 'connectors') loadConnectorList(src); else renderDashboard(); }, 2500);
    } else {
      toast(`Start Connector failed: ${JSON.stringify(r.data).slice(0,120)}`, 'error');
      if (btn) { btn.disabled = false; btn.textContent = '▶ Start'; }
    }
    return;
  }

  const r = await apiPost(`/api/connectors/${src}/${name}/start-from`, { mode, position });
  if (r.ok) {
    toast(`Connector "${name}" started (${mode}) ✓`, 'success');
    closeModal(modalId);
    setTimeout(() => { if (currentPage === 'connectors') loadConnectorList(src); else renderDashboard(); }, 2000);
  } else {
    toast(`Error: ${JSON.stringify(r.data).slice(0,160)}`, 'error');
    if (btn) { btn.disabled = false; btn.textContent = '▶ Start'; }
  }
}
async function restartConnector(src, name) {
  const r = await apiPost(`/api/connectors/${src}/${name}/restart`);
  toast(r.ok ? `${name} restarted ✓` : 'Restart failed', r.ok ? 'success' : 'error');
  setTimeout(() => { if (currentPage === 'connectors') loadConnectorList(src); else renderDashboard(); }, 2000);
}
async function deleteConnector(src, name) {
  if (!confirm(`Delete connector "${name}"?`)) return;
  const r = await apiDel(`/api/connectors/${src}/${name}`);
  toast(r.ok ? `${name} deleted` : 'Delete failed', r.ok ? 'success' : 'error');
  loadConnectorList(src);
}

// ═══════════════════════════════════════════════════════════════════════════
//  ADD TASK MODAL
//  MongoDB  → new task thread: table picker → POST /add-task (increments tasks.max)
//  Oracle/PG → single-task only: redirect to Assign Tables modal which patches
//              table.include.list on the existing task via start-with-tables
// ═══════════════════════════════════════════════════════════════════════════
async function showAddTaskModal(src, name, currentTaskCount) {
  // Oracle/PG: tasks.max is always 1 — redirect to the table-assignment flow
  // which patches table.include.list on the existing connector (no tasks.max change).
  if (src !== 'mongodb') {
    return showAssignTablesModal(src, name);
  }
  // Build modal shell immediately so the user sees something while we fetch
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'add-task-modal';
  modal.innerHTML = `
  <div class="modal" style="max-width:640px">
    <div class="modal-header">
      <div>
        <div class="modal-title">➕ Add Task — ${SOURCE_ICON[src]} ${SOURCE_LABELS[src]}</div>
        <div style="font-size:11px;color:#586374;margin-top:3px">
          Connector: <code style="color:#4fc3f7">${escHtml(name)}</code>
          &nbsp;·&nbsp; Current tasks: <code style="color:#d29922">${currentTaskCount}</code>
          &nbsp;→&nbsp; After add: <code style="color:#56d364">${currentTaskCount + 1}</code>
        </div>
      </div>
      <button class="modal-close" onclick="closeModal('add-task-modal')">✕</button>
    </div>

    <div style="font-size:12px;color:#8b949e;margin-bottom:14px;padding:10px 12px;
      background:#06090f;border-radius:6px;border-left:3px solid #4fc3f7">
      Select the <b style="color:#e6edf3">new collections</b> for the new task to capture.
      Collections already tracked by existing tasks are shown greyed out — they will remain
      assigned to their current task. After saving, Debezium increments
      <code style="color:#4fc3f7">tasks.max</code> to <b style="color:#56d364">${currentTaskCount + 1}</b>
      and redistributes work automatically.
    </div>

    <div class="tpick-wrap" id="atm-tpick-wrap">
      <div class="tpick-header">
        <div class="tpick-title">📋 Collection Selection</div>
        <span id="atm-tpick-status" class="tpick-status"></span>
      </div>
      <div id="atm-tpick-body">
        <div style="color:#586374;font-size:12px">⏳ Loading connector config and collections…</div>
      </div>
    </div>

    <div id="atm-result" style="margin-top:10px"></div>

    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('add-task-modal')">Cancel</button>
      <button class="btn btn-primary" id="atm-submit-btn"
              onclick="applyAddTask('${escHtml(src)}','${escHtml(name)}')">
        ➕ Add Task
      </button>
    </div>
  </div>`;
  modal.addEventListener('click', e => { if (e.target === modal) closeModal('add-task-modal'); });
  document.body.appendChild(modal);

  // ── Fetch live config first, then use it for schema call ────────────────
  const bodyEl   = document.getElementById('atm-tpick-body');
  const statusEl = document.getElementById('atm-tpick-status');

  const cfgR = await apiGet(`/api/connectors/${src}/${name}/config`);
  if (!cfgR.ok) {
    bodyEl.innerHTML = `<div style="color:#f85149;font-size:12px">⚠ Failed to load connector config: ${escHtml((cfgR.data?.error||'unknown').slice(0,120))}</div>`;
    return;
  }

  // Pass live connector config to schema endpoint so it can connect to the source DB
  const schemaR = await apiPost(`/api/schema/${src}`, cfgR.data);
  if (!schemaR.ok) {
    bodyEl.innerHTML = `<div style="color:#f85149;font-size:12px">⚠ Failed to connect to ${escHtml(SOURCE_LABELS[src])}: ${escHtml((schemaR.data?.error||'unknown').slice(0,160))}</div>`;
    return;
  }

  // Collections already tracked — shown greyed, pre-checked, disabled
  const includeKey = src === 'mongodb' ? 'collection.include.list' : 'table.include.list';
  const existing   = new Set((cfgR.data[includeKey] || '').split(',').map(t => t.trim()).filter(Boolean));

  const databases = schemaR.data.databases || {};
  let total = 0, newCount = 0;

  let html = `<input class="tpick-search" placeholder="Filter collections…"
                oninput="atmFilter(this.value)"
                style="width:100%;background:#0d1117;border:1px solid #1c2a3a;border-radius:6px;
                       padding:6px 10px;color:#e6edf3;font-size:12px;margin-bottom:8px"/>
              <div class="tpick-list" id="atm-tpick-list">`;

  Object.entries(databases).forEach(([dbName, schemasOrCols]) => {
    html += `<div class="tpick-schema">${escHtml(dbName)}</div>`;

    if (Array.isArray(schemasOrCols)) {
      // MongoDB — array of collection names
      schemasOrCols.forEach(col => {
        const full    = `${dbName}.${col}`;
        const already = existing.has(full);
        total++;
        if (!already) newCount++;
        html += `<label class="tpick-item" data-col="${escHtml(full)}"
                   style="padding-left:20px;${already ? 'opacity:0.45;' : ''}">
                   <input type="checkbox" value="${escHtml(full)}"
                     ${already ? 'checked disabled' : ''} />
                   ${escHtml(col)}
                   ${already
                     ? `<span style="color:#586374;font-size:10px;margin-left:auto">already tracked</span>`
                     : `<span style="color:#586374;font-size:11px;margin-left:auto">${escHtml(dbName)}</span>`
                   }
                 </label>`;
      });
    } else {
      // Postgres / Oracle — { schema: [tables] }
      Object.entries(schemasOrCols).forEach(([schemaName, tables]) => {
        html += `<div class="tpick-schema" style="padding-left:14px">${escHtml(schemaName)}</div>`;
        tables.forEach(tbl => {
          const full    = `${schemaName}.${tbl}`;
          const already = existing.has(full);
          total++;
          if (!already) newCount++;
          html += `<label class="tpick-item" data-col="${escHtml(full)}"
                     style="padding-left:32px;${already ? 'opacity:0.45;' : ''}">
                     <input type="checkbox" value="${escHtml(full)}"
                       ${already ? 'checked disabled' : ''} />
                     ${escHtml(tbl)}
                     ${already
                       ? `<span style="color:#586374;font-size:10px;margin-left:auto">already tracked</span>`
                       : `<span style="color:#586374;font-size:11px;margin-left:auto">${escHtml(schemaName)}</span>`
                     }
                   </label>`;
        });
      });
    }
  });
  html += '</div>';
  bodyEl.innerHTML = html;

  statusEl.innerHTML = newCount > 0
    ? `<span style="color:#2ea043">✓ ${total} total · ${newCount} available to add</span>`
    : `<span style="color:#d29922">⚠ All ${total} collections are already tracked</span>`;

  // Disable submit if nothing new is available
  if (newCount === 0) {
    const btn = document.getElementById('atm-submit-btn');
    if (btn) { btn.disabled = true; btn.style.opacity = '0.45'; }
  }
}

function atmFilter(q) {
  const lq = q.toLowerCase();
  document.querySelectorAll('#atm-tpick-list .tpick-item').forEach(el => {
    el.style.display = el.dataset.col.toLowerCase().includes(lq) ? '' : 'none';
  });
}

async function applyAddTask(src, name) {
  const checked = [...document.querySelectorAll('#atm-tpick-list .tpick-item input:checked:not(:disabled)')];
  if (!checked.length) return toast('Select at least one new collection to add', 'warn');

  const tables  = checked.map(c => c.value);
  const resultEl = document.getElementById('atm-result');
  const btn      = document.getElementById('atm-submit-btn');
  btn.disabled   = true;
  btn.textContent = '⏳ Adding task…';
  resultEl.innerHTML = '';

  const r = await apiPost(`/api/connectors/${src}/${name}/add-task`, { tables });

  if (r.ok) {
    toast(`Task added to "${name}" — tasks.max is now ${r.data.tasksMax} ✓`, 'success');
    closeModal('add-task-modal');
    setTimeout(() => {
      if (currentPage === 'connectors') loadConnectorList(src);
      else renderDashboard();
    }, 1500);
    return;
  }

  // ── 409: all tables already tracked ───────────────────────────────────────
  if (r.status === 409) {
    resultEl.innerHTML = `<div style="color:#d29922;font-size:12px;padding:8px 12px;
      background:#1a1500;border-radius:6px;border:1px solid #4a3800;margin-top:4px">
      ⚠ ${escHtml(r.data?.error || 'All selected collections are already tracked.')}
    </div>`;
    btn.disabled   = false;
    btn.textContent = '➕ Add Task';
    return;
  }

  // ── Other error ────────────────────────────────────────────────────────────
  const detail = r.data?.error || JSON.stringify(r.data).slice(0, 200);
  resultEl.innerHTML = `<div style="color:#f85149;font-size:12px;margin-top:6px">⚠ ${escHtml(detail)}</div>`;
  btn.disabled   = false;
  btn.textContent = '➕ Add Task';
}

    el = document.createElement('div');

    el.className = 'modal-overlay';
    el.addEventListener('click', e => { if (e.target === el) closeModal(id); });
    document.body.appendChild(el);
  }
  el.innerHTML = `
    <div class="modal" style="max-width:900px;width:97%">
      <div class="modal-header">
        <span class="modal-title">📋 Debezium Logs — <code style="color:#4fc3f7;font-size:13px">${escHtml(src)}</code></span>

      <div style="color:#586374;padding:12px;font-size:12px">⏳ Loading logs…</div>
    </div>`;
  const r = await apiGet(`/api/connectors/${escHtml(src)}/logs?tail=${tailLines}`);

  }).join('');
  el.innerHTML = `
    <div class="modal" style="max-width:900px;width:97%">
      <div class="modal-header">
        <span class="modal-title">📋 Debezium Logs — <code style="color:#4fc3f7;font-size:13px">${escHtml(src)}</code></span>

        <span style="font-size:11px;color:#586374">Last ${tailLines} lines</span>
        <button class="btn btn-secondary btn-sm" onclick="showConnectorLogs('${escHtml(src)}',300)">300</button>
        <button class="btn btn-secondary btn-sm" onclick="showConnectorLogs('${escHtml(src)}',1000)">1000</button>
        <button class="btn btn-secondary btn-sm" onclick="showConnectorLogs('${escHtml(src)}',${tailLines})">↻ Refresh</button>
      </div>
      <div style="background:#06090f;border:1px solid #1c2a3a;border-radius:6px;padding:12px;
                  font-size:11px;font-family:'Fira Code','Courier New',monospace;
                  white-space:pre-wrap;word-break:break-all;max-height:500px;overflow-y:auto;
                  line-height:1.6">${lines || '<span style="color:#586374">(no logs)</span>'}</div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" onclick="closeModal('${id}')">Close</button>
      </div>
    </div>`;
  // Auto-scroll to bottom
  const pre = el.querySelector('[style*="overflow-y:auto"]');
  if (pre) pre.scrollTop = pre.scrollHeight;
}

      <button class="btn btn-secondary" onclick="closeModal('start-cdc-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="applyStartCdc('${src}','${name}')">
        ▶ Start CDC
      </button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

function selectCdcOption(mode) {
  ['resume','now','live','manual'].forEach(m => {
    const el = document.getElementById(`cdc-opt-${m}`);
    if (el) el.classList.toggle('selected', m === mode);
    const radio = el?.querySelector('input[type=radio]');
    if (radio) radio.checked = (m === mode);
  });
}

async function fetchLivePosition(src, name, evt) {
  evt && evt.stopPropagation();
  selectCdcOption('live');
  const statusEl = document.getElementById('live-pos-status');
  const valEl    = document.getElementById('live-pos-val');
  statusEl.innerHTML = `<span style="color:#d29922">⏳ Fetching live position…</span>`;
  valEl.value = '';
  const r = await apiGet(`/api/connectors/${src}/${name}/offset-position`);
  if (r.ok && r.data?.position) {
    valEl.value = r.data.position;
    statusEl.innerHTML = `<span style="color:#2ea043">✓ Fetched at ${new Date().toLocaleTimeString()}</span>`;
  } else {
    statusEl.innerHTML = `<span style="color:#da3633">⚠ ${escHtml((r.data?.error || 'Failed to fetch position').slice(0,120))}</span>`;
  }
}

async function applyStartCdc(src, name) {
  const selectedRadio = document.querySelector('#start-cdc-modal input[type=radio]:checked');
  if (!selectedRadio) return toast('Select a start mode', 'error');
  const mode = selectedRadio.value;

  // Resume — connector is paused (never deleted), just call PUT /resume
  if (mode === 'resume') {
    const btn = document.querySelector('#start-cdc-modal .btn-primary');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Resuming…'; }
    const r = await apiPost(`/api/connectors/${src}/${name}/resume`);
    if (r.ok) {
      toast(`${name} resumed — picking up from last offset ✓`, 'success');
      closeModal('start-cdc-modal');
      if (currentPage === 'connectors') loadConnectorList(src);
      else renderDashboard();
    } else {
      toast(`Resume failed: ${JSON.stringify(r.data).slice(0,160)}`, 'error');
      if (btn) { btn.disabled = false; btn.textContent = '▶ Start CDC'; }
    }
    return;
  }

  let position = null;
  if (mode === 'live') {
    position = document.getElementById('live-pos-val')?.value?.trim();
    if (!position) return toast('Fetch the live position first, or choose another option', 'error');
  } else if (mode === 'manual') {
    position = document.getElementById('manual-pos-val')?.value?.trim();
    if (!position) return toast('Enter a position value', 'error');
  }

  const btn = document.querySelector('#start-cdc-modal .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Starting…'; }

  const r = await apiPost(`/api/connectors/${src}/${name}/start-from`, { mode, position });
  if (r.ok) {
    toast(`CDC started for "${name}" (${mode})`, 'success');
    closeModal('start-cdc-modal');
    if (currentPage === 'connectors') loadConnectorList(src);
    else renderDashboard();
  } else {
    toast(`Error: ${JSON.stringify(r.data).slice(0,160)}`, 'error');
    if (btn) { btn.disabled = false; btn.textContent = '▶ Start CDC'; }
  }
}

// Load table list — already-tracked tables are pre-checked and enabled so
// the user can uncheck them to remove, or check new ones to add.
async function assignTpickLoad(src, name) {
  const statusEl = document.getElementById('assign-tpick-status');
  const bodyEl   = document.getElementById('assign-tpick-body');
  statusEl.innerHTML = `<span style="color:#d29922">⏳ Connecting to ${escHtml(src)}…</span>`;
  bodyEl.innerHTML = '';

  const cfgR = await apiGet(`/api/connectors/${src}/${name}/config`);
  const cfg  = cfgR.ok ? cfgR.data : {};

  const r = await apiPost(`/api/schema/${src}`, cfg);
  if (!r.ok) {
    statusEl.innerHTML = `<span style="color:#f85149">⚠ ${escHtml((r.data?.error||'Failed').slice(0,180))}</span>`;
    return;
  }

  // Build set of currently tracked tables
  const includeKey = src === 'mongodb' ? 'collection.include.list' : 'table.include.list';
  const existing   = new Set((cfg[includeKey] || '').split(',').map(t => t.trim()).filter(Boolean));

  const databases = r.data.databases || {};
  let total = 0, trackedCount = 0;

  let html = `<input class="tpick-search" placeholder="Filter…"
                oninput="assignTpickFilter(this.value)"
                style="width:100%;background:#0d1117;border:1px solid #1c2a3a;border-radius:6px;
                       padding:6px 10px;color:#e6edf3;font-size:12px;margin-bottom:8px"/>
              <div class="tpick-list" id="assign-tpick-list">`;

  Object.entries(databases).forEach(([dbName, schemasOrCols]) => {
    if (Array.isArray(schemasOrCols)) {
      schemasOrCols.forEach(col => {
        const full    = `${dbName}.${col}`;
        const tracked = existing.has(full);
        total++;
        if (tracked) trackedCount++;
        html += `<label class="tpick-item" data-table="${escHtml(full)}" style="padding-left:20px">
                   <input type="checkbox" value="${escHtml(full)}" ${tracked ? 'checked' : ''}/>
                   ${escHtml(col)}
                   <span style="margin-left:auto;font-size:10px;${tracked
                     ? 'color:#56d364;background:#0d2a10;border:1px solid #1a4429;padding:1px 6px;border-radius:8px'
                     : 'color:#586374'}">
                     ${tracked ? '● tracked' : escHtml(dbName)}
                   </span>
                 </label>`;
      });
    } else {
      Object.entries(schemasOrCols).forEach(([schemaName, tables]) => {
        html += `<div class="tpick-schema">${escHtml(schemaName)}</div>`;
        tables.forEach(tbl => {
          const full    = `${schemaName}.${tbl}`;
          const tracked = existing.has(full);
          total++;
          if (tracked) trackedCount++;
          html += `<label class="tpick-item" data-table="${escHtml(full)}" style="padding-left:20px">
                     <input type="checkbox" value="${escHtml(full)}" ${tracked ? 'checked' : ''}/>
                     ${escHtml(tbl)}
                     <span style="margin-left:auto;font-size:10px;${tracked
                       ? 'color:#56d364;background:#0d2a10;border:1px solid #1a4429;padding:1px 6px;border-radius:8px'
                       : 'color:#586374'}">
                       ${tracked ? '● tracked' : escHtml(schemaName)}
                     </span>
                   </label>`;
        });
      });
    }
  });
  html += '</div>';
  bodyEl.innerHTML = html;

  statusEl.innerHTML = trackedCount > 0
    ? `<span style="color:#2ea043">✓ ${total} table(s)</span> — <span style="color:#56d364">${trackedCount} currently tracked</span> · uncheck to remove, check new to add`
    : `<span style="color:#2ea043">✓ ${total} table(s) loaded — check tables to start replicating</span>`;

  document.getElementById('assign-log-check').innerHTML = '';
}

function assignTpickFilter(q) {
  const lq = q.toLowerCase();
  document.querySelectorAll('#assign-tpick-list .tpick-item').forEach(el => {
    el.style.display = el.dataset.table.toLowerCase().includes(lq) ? '' : 'none';
  });
}

async function assignTablesAndStart(src, name) {
  // Collect every CHECKED box — this is the full desired final list.
  // Unchecked previously-tracked tables are intentionally excluded (= removed).
  const checked = [...document.querySelectorAll('#assign-tpick-list .tpick-item input:checked')];
  if (!checked.length) return toast('Select at least one table to replicate', 'warn');

  const tables  = checked.map(c => c.value);
  const logEl   = document.getElementById('assign-log-check');
  const btn     = document.getElementById('assign-start-btn');
  btn.disabled  = true;
  btn.textContent = '⏳ Checking supplemental logging…';
  logEl.innerHTML = '';

  // replace:true → server uses tables as the exact final list (enables removal)
  const r = await apiPost(`/api/connectors/${src}/${name}/start-with-tables`, { tables, replace: true });

  // ── Supplemental logging check failed ─────────────────────────────────────
  if (r.status === 409 && r.data?.logErrors) {
    const rows = r.data.logErrors.map(e =>
      `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #1c2a3a">
         <span style="color:#da3633;font-size:13px">✗</span>
         <code style="color:#f85149;flex:1">${escHtml(e.table)}</code>
         <span style="color:#8b949e;font-size:11px">${escHtml(e.reason)}</span>
       </div>`
    ).join('');
    logEl.innerHTML = `
      <div style="background:#2a0f0f;border:1px solid #6a2020;border-radius:6px;padding:12px 14px;margin-top:4px">
        <div style="font-weight:700;color:#f85149;margin-bottom:8px">
          🚫 Cannot start — supplemental logging not enabled for ${r.data.logErrors.length} table(s)
        </div>
        ${rows}
        <div style="margin-top:10px;font-size:11px;color:#d29922;border-top:1px solid #4a2020;padding-top:8px">
          <b>Action required:</b> ${escHtml(r.data.fixHint || 'Enable supplemental logging on the listed tables then retry.')}
        </div>
      </div>`;
    btn.disabled    = false;
    btn.textContent = '✓ Apply & Restart';
    return;
  }

  // ── Success ────────────────────────────────────────────────────────────────
  if (r.ok) {
    const jobsRestarted = r.data?.streamingJobsRestarted;
    const msg = jobsRestarted
      ? `Table list updated for "${name}" — ${tables.length} table(s) tracked · streaming jobs restarted ✓`
      : `Table list updated for "${name}" — ${tables.length} table(s) now tracked ✓`;
    toast(msg, 'success');
    closeModal('assign-modal');
    if (currentPage === 'connectors') loadConnectorList(src);
    else renderDashboard();
    return;
  }

  // ── Other error ───────────────────────────────────────────────────────────
  const detail = r.data?.error || r.data?.message || JSON.stringify(r.data).slice(0,200);
  logEl.innerHTML = `<div style="color:#f85149;font-size:12px;margin-top:6px">⚠ ${escHtml(detail)}</div>`;
  btn.disabled    = false;
  btn.textContent = '✓ Apply & Restart';
}
