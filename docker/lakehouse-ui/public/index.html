<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Lakehouse Realtime Streaming</title>
<style>
/* ── Reset & Base ── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}

/* ── Layout ── */
#app{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ── */
#sidebar{
  width:220px;min-width:220px;
  background:linear-gradient(180deg,#06090f 0%,#0d1a2e 100%);
  border-right:1px solid #1c2a3a;
  display:flex;flex-direction:column;
  overflow-y:auto;
}
.sidebar-logo{
  padding:20px 16px 16px;
  border-bottom:1px solid #1c2a3a;
  display:flex;align-items:center;gap:10px;
}
.logo-icon{
  width:36px;height:36px;
  background:linear-gradient(135deg,#4fc3f7 0%,#0288d1 100%);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
  box-shadow:0 0 12px rgba(79,195,247,0.3);
}
.logo-text{font-size:13px;font-weight:700;color:#e6edf3;line-height:1.3}
.logo-sub{font-size:10px;color:#4fc3f7;letter-spacing:.5px;text-transform:uppercase}

.nav-section{padding:12px 0}
.nav-label{font-size:10px;color:#586374;text-transform:uppercase;letter-spacing:.8px;padding:6px 16px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 16px;font-size:13px;color:#8b949e;
  cursor:pointer;border-left:3px solid transparent;
  transition:all .15s;
}
.nav-item:hover{background:rgba(79,195,247,.07);color:#e6edf3}
.nav-item.active{background:rgba(79,195,247,.12);color:#4fc3f7;border-left-color:#4fc3f7}
.nav-icon{font-size:15px;width:18px;text-align:center}
.nav-badge{
  margin-left:auto;background:#1a2e42;color:#4fc3f7;
  font-size:10px;padding:1px 6px;border-radius:10px;font-weight:600;
}

/* ── Main content ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── Topbar ── */
#topbar{
  height:52px;background:#0d1117;border-bottom:1px solid #1c2a3a;
  display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0;
}
#topbar h1{font-size:16px;font-weight:600;color:#e6edf3;flex:1}
.status-pill{
  display:flex;align-items:center;gap:6px;
  background:#0d1f30;border:1px solid #1c3a55;
  padding:4px 10px;border-radius:20px;font-size:12px;color:#8b949e;
}
.status-dot{width:7px;height:7px;border-radius:50%}
.dot-green{background:#2ea043;box-shadow:0 0 6px #2ea043}
.dot-red{background:#da3633;box-shadow:0 0 6px #da3633}
.dot-yellow{background:#d29922;box-shadow:0 0 6px #d29922}
.dot-gray{background:#444}

/* ── Page content ── */
#content{flex:1;overflow-y:auto;padding:24px}

/* ── Cards ── */
.card{
  background:#0d1f30;border:1px solid #1c2a3a;
  border-radius:10px;padding:20px;margin-bottom:20px;
}
.card-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.card-title{font-size:14px;font-weight:600;color:#e6edf3;display:flex;align-items:center;gap:8px}
.card-subtitle{font-size:12px;color:#586374;margin-top:2px}

/* ── Source tabs ── */
.source-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.src-tab{
  padding:7px 16px;border-radius:6px;font-size:13px;font-weight:500;
  border:1px solid #1c2a3a;background:#0d1f30;color:#8b949e;cursor:pointer;
  transition:all .15s;display:flex;align-items:center;gap:6px;
}
.src-tab:hover{border-color:#4fc3f7;color:#4fc3f7}
.src-tab.active{background:rgba(79,195,247,.15);border-color:#4fc3f7;color:#4fc3f7}
.src-badge{
  width:8px;height:8px;border-radius:50%;
}
.badge-pg{background:#336791}
.badge-ora{background:#f80000}
.badge-mg{background:#4db33d}

/* ── Table ── */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{
  text-align:left;padding:9px 12px;
  border-bottom:1px solid #1c2a3a;
  color:#586374;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
}
.data-table td{padding:9px 12px;border-bottom:1px solid #0d1a2e;color:#c9d1d9;vertical-align:middle}
.data-table tr:hover td{background:rgba(79,195,247,.04)}
.data-table tr:last-child td{border-bottom:none}

/* ── Status badge ── */
.s-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600;
}
.s-running{background:#0f2a1a;color:#2ea043;border:1px solid #1a4429}
.s-paused{background:#2a2200;color:#d29922;border:1px solid #4a3a00}
.s-failed{background:#2a0f0f;color:#da3633;border:1px solid #4a1f1f}
.s-stopped{background:#1a1f2a;color:#586374;border:1px solid #2a3040}

/* ── Buttons ── */
.btn{
  padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;
  border:1px solid;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px;
}
.btn-primary{background:#0969da;border-color:#1f6feb;color:#fff}
.btn-primary:hover{background:#1473e6}
.btn-secondary{background:transparent;border-color:#30363d;color:#c9d1d9}
.btn-secondary:hover{border-color:#8b949e;color:#e6edf3}
.btn-danger{background:transparent;border-color:#da3633;color:#da3633}
.btn-danger:hover{background:#2a0f0f}
.btn-success{background:transparent;border-color:#2ea043;color:#2ea043}
.btn-success:hover{background:#0f2a1a}
.btn-warn{background:transparent;border-color:#d29922;color:#d29922}
.btn-warn:hover{background:#2a2200}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-group{display:flex;gap:6px;flex-wrap:wrap}

/* ── Actions dropdown ── */
.act-wrap{position:relative;display:inline-block}
.act-trigger{
  display:flex;align-items:center;gap:5px;
  padding:4px 10px;font-size:11px;font-weight:500;
  background:#0d1f30;border:1px solid #1c2a3a;border-radius:6px;
  color:#e6edf3;cursor:pointer;white-space:nowrap;
}
.act-trigger:hover{border-color:#4fc3f7;color:#4fc3f7}
.act-trigger .caret{font-size:9px;margin-left:2px}
.act-menu{
  display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:999;
  background:#0d1f30;border:1px solid #1c2a3a;border-radius:8px;
  min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,.5);overflow:hidden;
}
.act-wrap.open .act-menu{display:block}
.act-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;font-size:12px;color:#e6edf3;
  cursor:pointer;white-space:nowrap;background:none;border:none;
  width:100%;text-align:left;
}
.act-item:hover{background:#1c2a3a}
.act-item.danger{color:#f85149}
.act-item.danger:hover{background:#2d1a1a}
.act-sep{border:none;border-top:1px solid #1c2a3a;margin:4px 0}

/* ── Table picker ── */
.tpick-wrap{background:#06090f;border:1px solid #1c2a3a;border-radius:8px;padding:14px;margin-bottom:14px}
.tpick-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tpick-title{font-size:12px;font-weight:600;color:#e6edf3}
.tpick-toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:#8b949e;cursor:pointer}
.tpick-search{width:100%;background:#0d1117;border:1px solid #1c2a3a;border-radius:6px;padding:6px 10px;color:#e6edf3;font-size:12px;margin-bottom:8px}
.tpick-search:focus{outline:none;border-color:#4fc3f7}
.tpick-list{max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.tpick-schema{font-size:10px;color:#586374;text-transform:uppercase;letter-spacing:.6px;padding:4px 0 2px;font-weight:600}
.tpick-item{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:12px;color:#8b949e}
.tpick-item:hover{background:#1c2a3a;color:#e6edf3}
.tpick-item input{accent-color:#4fc3f7;cursor:pointer}
.tpick-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.tpick-status{font-size:11px;color:#586374;flex:1}

/* ── Form ── */
.form-row{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-bottom:12px;align-items:start}
.form-label{font-size:12px;color:#8b949e;padding-top:8px;font-weight:500}
.form-input{
  width:100%;padding:7px 10px;background:#06090f;border:1px solid #30363d;
  border-radius:6px;color:#e6edf3;font-size:13px;outline:none;
  transition:border-color .15s;
}
.form-input:focus{border-color:#4fc3f7}
.form-textarea{
  width:100%;padding:8px 10px;background:#06090f;border:1px solid #30363d;
  border-radius:6px;color:#e6edf3;font-size:12px;font-family:'Fira Code','Courier New',monospace;
  outline:none;resize:vertical;min-height:120px;
}
.form-textarea:focus{border-color:#4fc3f7}
.form-select{
  width:100%;padding:7px 10px;background:#06090f;border:1px solid #30363d;
  border-radius:6px;color:#e6edf3;font-size:13px;outline:none;
}

/* ── Modal ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  display:flex;align-items:center;justify-content:center;z-index:1000;
  backdrop-filter:blur(3px);
}
.modal{
  background:#0d1f30;border:1px solid #1c2a3a;border-radius:12px;
  width:680px;max-width:95vw;max-height:90vh;overflow-y:auto;
  padding:24px;
}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-size:15px;font-weight:600;color:#e6edf3}
.modal-close{
  background:none;border:none;color:#586374;font-size:20px;cursor:pointer;line-height:1;
}
.modal-close:hover{color:#e6edf3}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid #1c2a3a}

/* ── Kafka query ── */
.query-bar{display:flex;gap:10px;margin-bottom:16px;align-items:flex-end;flex-wrap:wrap}
.query-field{display:flex;flex-direction:column;gap:4px}
.query-label{font-size:11px;color:#586374;font-weight:500}
.query-input{
  padding:7px 10px;background:#06090f;border:1px solid #30363d;
  border-radius:6px;color:#e6edf3;font-size:13px;outline:none;min-width:200px;
}
.query-input:focus{border-color:#4fc3f7}
.msg-container{
  background:#06090f;border:1px solid #1c2a3a;border-radius:8px;
  overflow:auto;max-height:500px;
}
.msg-row{
  border-bottom:1px solid #0d1a2e;padding:10px 14px;
  font-family:'Fira Code','Courier New',monospace;font-size:12px;
  cursor:pointer;
}
.msg-row:hover{background:rgba(79,195,247,.05)}
.msg-row:last-child{border-bottom:none}
.msg-offset{color:#4fc3f7;margin-right:12px;font-size:11px}
.msg-op{
  display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;margin-right:8px;
}
.op-c{background:#0f2a1a;color:#2ea043}
.op-u{background:#0d2a40;color:#4fc3f7}
.op-d{background:#2a0f0f;color:#da3633}
.op-r{background:#1a2040;color:#8b949e}
.msg-body{color:#c9d1d9;white-space:pre-wrap;word-break:break-all;margin-top:6px;display:none}
.msg-row.expanded .msg-body{display:block}
.msg-summary{color:#8b949e;font-size:12px}

/* ── Dashboard stats ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:20px}
.stat-card{
  background:#06090f;border:1px solid #1c2a3a;border-radius:8px;
  padding:16px;text-align:center;
}
.stat-value{font-size:28px;font-weight:700;color:#4fc3f7;line-height:1}
.stat-label{font-size:11px;color:#586374;margin-top:6px;text-transform:uppercase;letter-spacing:.5px}

/* ── Start CDC modal ── */
.cdc-option-group{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.cdc-option{
  display:flex;align-items:flex-start;gap:12px;
  padding:14px 16px;border-radius:8px;border:2px solid #1c2a3a;
  cursor:pointer;transition:all .15s;background:#06090f;
}
.cdc-option:hover{border-color:#4fc3f7}
.cdc-option.selected{border-color:#4fc3f7;background:rgba(79,195,247,.07)}
.cdc-option input[type=radio]{margin-top:3px;accent-color:#4fc3f7;flex-shrink:0}
.cdc-option-label{font-size:13px;font-weight:600;color:#e6edf3;margin-bottom:3px}
.cdc-option-desc{font-size:11px;color:#8b949e;line-height:1.5}
.cdc-pos-row{
  display:flex;gap:8px;align-items:center;margin-top:10px;
  padding:10px 12px;background:#0d1a2e;border-radius:6px;
  border:1px solid #1c2a3a;
}
.cdc-pos-row .form-input{flex:1;font-family:'Fira Code','Courier New',monospace;font-size:12px}
.cdc-pos-badge{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;
  border-radius:12px;font-size:10px;font-weight:700;letter-spacing:.3px;
  border:1px solid;flex-shrink:0;
}
.badge-scn{background:#1a2040;color:#79c0ff;border-color:#30405a}
.badge-lsn{background:#1a2a1a;color:#56d364;border-color:#2a4030}
.badge-ts{background:#2a1a0a;color:#d29922;border-color:#4a3010}

/* ── Connector config editor ── */
.kv-editor{width:100%}
.kv-row{display:grid;grid-template-columns:1fr 1.5fr auto;gap:8px;margin-bottom:6px;align-items:center}
.kv-input{
  padding:6px 9px;background:#06090f;border:1px solid #30363d;
  border-radius:5px;color:#e6edf3;font-size:12px;outline:none;width:100%;
}
.kv-input:focus{border-color:#4fc3f7}
.kv-del{
  background:none;border:none;color:#586374;cursor:pointer;font-size:14px;padding:4px;
}
.kv-del:hover{color:#da3633}
.kv-add{
  background:none;border:1px dashed #30363d;color:#586374;
  padding:6px 12px;border-radius:5px;font-size:12px;cursor:pointer;
  width:100%;margin-top:4px;
}
.kv-add:hover{border-color:#4fc3f7;color:#4fc3f7}

/* ── Toast ── */
#toast-area{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{
  background:#0d1f30;border:1px solid #1c2a3a;border-radius:8px;
  padding:12px 16px;font-size:13px;color:#e6edf3;min-width:260px;
  display:flex;align-items:center;gap:10px;
  animation:slideIn .2s ease;
}
.toast-success{border-left:3px solid #2ea043}
.toast-error{border-left:3px solid #da3633}
.toast-info{border-left:3px solid #4fc3f7}
.toast-warn{border-left:3px solid #d29922;color:#d29922}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── Code highlight ── */
.json-key{color:#79c0ff}
.json-str{color:#a5d6ff}
.json-num{color:#ff7b72}
.json-bool{color:#56d364}
.json-null{color:#8b949e}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#06090f}
::-webkit-scrollbar-thumb{background:#1c2a3a;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#30363d}

/* ── Responsive ── */
@media(max-width:768px){
  #sidebar{width:0;min-width:0;overflow:hidden}
  #sidebar.open{width:220px;min-width:220px;position:fixed;z-index:100;height:100vh}
}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">

<!-- ═══ SIDEBAR ═══ -->
<nav id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"
          fill="#4fc3f7" stroke="#0288d1" stroke-width="1"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">Lakehouse</div>
      <div class="logo-sub">Realtime Streaming</div>
    </div>
  </div>

  <div class="nav-section">
    <div class="nav-label">Overview</div>
    <div class="nav-item active" onclick="navigate('dashboard')" id="nav-dashboard">
      <span class="nav-icon">🏠</span> Dashboard
    </div>
  </div>

  <div class="nav-section">
    <div class="nav-label">Debezium CDC</div>
    <div class="nav-item" onclick="navigate('connectors')" id="nav-connectors">
      <span class="nav-icon">🔌</span> Connectors
    </div>
    <div class="nav-item" onclick="navigate('connector-new')" id="nav-connector-new">
      <span class="nav-icon">➕</span> New Connector
    </div>
  </div>

  <div class="nav-section">
    <div class="nav-label">Kafka</div>
    <div class="nav-item" onclick="navigate('topics')" id="nav-topics">
      <span class="nav-icon">📨</span> Topics
    </div>
    <div class="nav-item" onclick="navigate('ksql')" id="nav-ksql">
      <span class="nav-icon">🔍</span> Query (KSQL-style)
    </div>
  </div>

  <div class="nav-section">
    <div class="nav-label">Streaming Jobs</div>
    <div class="nav-item" onclick="navigate('streaming')" id="nav-streaming">
      <span class="nav-icon">🌊</span> Kafka → Iceberg
    </div>
  </div>

  <div class="nav-section">
    <div class="nav-label">Configuration</div>
    <div class="nav-item" onclick="navigate('iceberg-config')" id="nav-iceberg-config">
      <span class="nav-icon">🧊</span> Iceberg Settings
    </div>
  </div>
</nav>

<!-- ═══ MAIN ═══ -->
<div id="main">
  <!-- Topbar -->
  <div id="topbar">
    <h1 id="page-title">Dashboard</h1>
    <div class="status-pill" id="cluster-status">
      <div class="status-dot dot-gray"></div>
      <span>Connecting…</span>
    </div>
  </div>

  <!-- Content -->
  <div id="content"></div>
</div>

</div><!-- #app -->

<!-- Toast area -->
<div id="toast-area"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  GLOBALS
// ═══════════════════════════════════════════════════════════════════════════
const SOURCES = ['postgres','oracle','mongodb'];
const SOURCE_LABELS = { postgres:'PostgreSQL', oracle:'Oracle', mongodb:'MongoDB' };
const SOURCE_BADGE  = { postgres:'badge-pg', oracle:'badge-ora', mongodb:'badge-mg' };
const SOURCE_ICON   = { postgres:'🐘', oracle:'🔶', mongodb:'🍃' };

let currentPage = 'dashboard';
let currentSource = 'postgres';
let allConnectors = {};   // { source: [{name,status},...] }
let allStreamings = [];
let kafkaTopics = [];

// ═══════════════════════════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════════════════════════
function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toast-area').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ═══════════════════════════════════════════════════════════════════════════
//  API HELPERS
// ═══════════════════════════════════════════════════════════════════════════
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  let json;
  try { json = await r.json(); } catch { json = {}; }
  return { ok: r.ok, status: r.status, data: json };
}
const apiGet  = p      => api('GET',    p);
const apiPost = (p, b) => api('POST',   p, b);
const apiPut  = (p, b) => api('PUT',    p, b);
const apiDel  = p      => api('DELETE', p);

// ═══════════════════════════════════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════════════════════════════════
function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navEl = document.getElementById('nav-' + page);
  if (navEl) navEl.classList.add('active');

  const titles = {
    dashboard: 'Dashboard',
    connectors: 'Debezium Connectors',
    'connector-new': 'New Connector',
    topics: 'Kafka Topics',
    ksql: 'Kafka Query (KSQL-style)',
    streaming: 'Kafka → Iceberg Streaming Jobs',
    'iceberg-config': 'Iceberg Configuration',
  };
  document.getElementById('page-title').textContent = titles[page] || page;
  renderPage(page);
}

// ═══════════════════════════════════════════════════════════════════════════
//  RENDER ROUTER
// ═══════════════════════════════════════════════════════════════════════════
function renderPage(page) {
  const c = document.getElementById('content');
  c.innerHTML = '<div style="color:#586374;padding:40px;text-align:center">Loading…</div>';
  if (page === 'dashboard')       renderDashboard();
  else if (page === 'connectors') renderConnectors();
  else if (page === 'connector-new') renderConnectorNew();
  else if (page === 'topics')     renderTopics();
  else if (page === 'ksql')       renderKSQL();
  else if (page === 'streaming')  renderStreaming();
  else if (page === 'iceberg-config') renderIcebergConfig();
}

// ═══════════════════════════════════════════════════════════════════════════
//  DASHBOARD
// ═══════════════════════════════════════════════════════════════════════════
async function renderDashboard() {
  const c = document.getElementById('content');

  // fetch all connector statuses in parallel
  const results = await Promise.all(SOURCES.map(s =>
    apiGet(`/api/connectors/${s}`).then(r => ({ source: s, data: r.data }))
  ));

  let totalConn = 0, runningConn = 0, failedConn = 0;
  const connSummary = [];
  for (const { source, data } of results) {
    if (typeof data === 'object' && !Array.isArray(data)) {
      for (const [name, info] of Object.entries(data)) {
        // Skip top-level error/metadata keys that Debezium returns alongside connectors
        if (!info || typeof info !== 'object' || !('status' in info)) continue;
        totalConn++;
        const st = info?.status?.connector?.state || 'UNKNOWN';
        if (st === 'RUNNING') runningConn++;
        else if (st === 'FAILED') failedConn++;
        connSummary.push({ source, name, state: st });
      }
    }
  }

  // streaming deployments
  const streamR = await apiGet('/api/streaming/deployments');
  const deploys = streamR.data?.items || [];
  const streamRunning = deploys.filter(d => (d.status?.readyReplicas || 0) > 0).length;

  c.innerHTML = `
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value">${totalConn}</div>
      <div class="stat-label">CDC Connectors</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:#2ea043">${runningConn}</div>
      <div class="stat-label">Running</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:#da3633">${failedConn}</div>
      <div class="stat-label">Failed</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${deploys.length}</div>
      <div class="stat-label">Streaming Jobs</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:#2ea043">${streamRunning}</div>
      <div class="stat-label">Jobs Running</div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title">🔌 CDC Connector Status</div>
      <button class="btn btn-secondary btn-sm" onclick="renderDashboard()">↻ Refresh</button>
    </div>
    <table class="data-table">
      <thead><tr>
        <th>Source</th><th>Connector Name</th><th>Status</th><th>Actions</th>
      </tr></thead>
      <tbody>
        ${connSummary.map(c => {
          const isRunning = c.state === 'RUNNING';
          const isPaused  = c.state === 'PAUSED';
          return `
          <tr>
            <td>${SOURCE_ICON[c.source]} ${SOURCE_LABELS[c.source]}</td>
            <td><code style="color:#4fc3f7;font-size:12px">${c.name}</code></td>
            <td>${stateBadge(c.state)}</td>
            <td>
              <div class="act-wrap" id="act-dash-${c.source}-${c.name}">
                <button class="act-trigger" onclick="toggleActMenu('act-dash-${c.source}-${c.name}')">
                  Actions <span class="caret">▾</span>
                </button>
                <div class="act-menu">
                  <button class="act-item" onclick="closeActMenus();navigate('connectors');currentSource='${c.source}'">⚙ Config</button>
                  ${isPaused
                    ? `<button class="act-item" onclick="closeActMenus();showStartCdcModal('${c.source}','${c.name}')">▶ Start</button>`
                    : ''
                  }
                  ${isRunning
                    ? `<button class="act-item" onclick="closeActMenus();pauseConnector('${c.source}','${c.name}')">⏹ Stop</button>`
                    : ''
                  }
                  <hr class="act-sep"/>
                  <button class="act-item danger" onclick="closeActMenus();deleteConnector('${c.source}','${c.name}')">🗑 Delete</button>
                </div>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title">🌊 Streaming Jobs</div>
    </div>
    <table class="data-table">
      <thead><tr><th>Job Name</th><th>Ready</th><th>Desired</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
        ${deploys.map(d => {
          const name = d.metadata.name;
          const ready = d.status?.readyReplicas || 0;
          const desired = d.spec?.replicas || 0;
          const st = desired === 0 ? 'STOPPED' : ready > 0 ? 'RUNNING' : 'STARTING';
          return `<tr>
            <td><code style="font-size:12px;color:#c9d1d9">${name}</code></td>
            <td>${ready}</td><td>${desired}</td>
            <td>${stateBadge(st)}</td>
            <td>
              <div class="btn-group">
                ${desired === 0
                  ? `<button class="btn btn-success btn-sm" onclick="scaleJob('${name}',1)">▶ Start</button>`
                  : `<button class="btn btn-danger btn-sm" onclick="scaleJob('${name}',0)">⏹ Stop</button>`}
                <button class="btn btn-secondary btn-sm" onclick="restartJob('${name}')">↻</button>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>
  `;
}

async function renderConnectors() {
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="source-tabs" id="src-tabs">
      ${SOURCES.map(s => `
        <div class="src-tab ${s===currentSource?'active':''}" onclick="switchSource('${s}')">
          <span class="src-badge ${SOURCE_BADGE[s]}"></span>
          ${SOURCE_ICON[s]} ${SOURCE_LABELS[s]}
        </div>`).join('')}
    </div>
    <div id="connector-list"><div style="color:#586374;padding:20px">Loading…</div></div>
  `;
  loadConnectorList(currentSource);
}

function switchSource(src) {
  currentSource = src;
  document.querySelectorAll('.src-tab').forEach((t,i) => t.classList.toggle('active', SOURCES[i]===src));
  loadConnectorList(src);
}

async function loadConnectorList(src) {
  const el = document.getElementById('connector-list');
  const r = await apiGet(`/api/connectors/${src}`);
  const data = r.data;

  if (!r.ok || !data || Object.keys(data).length === 0) {
    el.innerHTML = `<div class="card" style="text-align:center;color:#586374;padding:32px">
      No connectors found for ${SOURCE_LABELS[src]}.
      <br><br><button class="btn btn-primary" onclick="navigate('connector-new')">+ Create Connector</button>
    </div>`;
    return;
  }

  const rows = Object.entries(data)
    // Skip top-level error/metadata keys Debezium returns alongside connectors
    .filter(([, info]) => info && typeof info === 'object' && 'status' in info)
    .map(([name, info]) => {
    const state = info?.status?.connector?.state || 'UNKNOWN';
    const taskState = info?.status?.tasks?.[0]?.state || '–';
    const tasks = info?.status?.tasks?.length || 0;
    const running = state === 'RUNNING';
    const paused  = state === 'PAUSED';
    return `<tr>
      <td><code style="color:#4fc3f7;font-size:12px">${name}</code></td>
      <td>${stateBadge(state)}</td>
      <td>${stateBadge(taskState)} <span style="color:#586374;font-size:11px">(${tasks} task)</span></td>
      <td>
        <div class="act-wrap" id="act-conn-${src}-${name}">
          <button class="act-trigger" onclick="toggleActMenu('act-conn-${src}-${name}')">
            Actions <span class="caret">▾</span>
          </button>
          <div class="act-menu">
            <button class="act-item" onclick="closeActMenus();editConnector('${src}','${name}')">✎ Edit Config</button>
            ${paused
              ? `<button class="act-item" onclick="closeActMenus();showStartCdcModal('${src}','${name}')">▶ Start</button>`
              : ''
            }
            ${running
              ? `<button class="act-item" onclick="closeActMenus();pauseConnector('${src}','${name}')">⏹ Stop</button>`
              : ''
            }
            <hr class="act-sep"/>
            <button class="act-item danger" onclick="closeActMenus();deleteConnector('${src}','${name}')">🗑 Delete</button>
          </div>
        </div>
      </td>
    </tr>`;
  }).join('');

  el.innerHTML = `
  <div class="card">
    <div class="card-header">
      <div class="card-title">${SOURCE_ICON[src]} ${SOURCE_LABELS[src]} Connectors</div>
      <div class="btn-group">
        <button class="btn btn-secondary btn-sm" onclick="loadConnectorList('${src}')">↻ Refresh</button>
        <button class="btn btn-primary btn-sm" onclick="navigate('connector-new')">+ New</button>
      </div>
    </div>
    <table class="data-table">
      <thead><tr><th>Name</th><th>Connector State</th><th>Task State</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

async function editConnector(src, name) {
  const r = await apiGet(`/api/connectors/${src}/${name}/config`);
  if (!r.ok) return toast('Failed to load config', 'error');
  showConnectorModal(src, name, r.data, false);
}

async function pauseConnector(src, name) {
  // PUT /pause — stops the task thread so no more data flows from source to Kafka.
  // The connector stays registered and the offset is preserved.
  // Use Start to unpause from the exact same position.
  const r = await apiPost(`/api/connectors/${src}/${name}/pause`);
  if (r.ok) {
    toast(`${name} stopped — data capture halted. Use Start to resume.`, 'success');
  } else {
    toast(`Stop failed: ${JSON.stringify(r.data).slice(0,120)}`, 'error');
  }
  // Wait for Debezium to propagate PAUSED state before refreshing
  setTimeout(() => {
    if (currentPage === 'connectors') loadConnectorList(src);
    else renderDashboard();
  }, 2500);
}
async function resumeConnector(src, name) {
  const r = await apiPost(`/api/connectors/${src}/${name}/resume`);
  toast(r.ok ? `${name} resumed` : 'Resume failed', r.ok ? 'success' : 'error');
  setTimeout(() => {
    if (currentPage === 'connectors') loadConnectorList(src);
    else renderDashboard();
  }, 2500);
}
async function restartConnector(src, name) {
  const r = await apiPost(`/api/connectors/${src}/${name}/restart`);
  toast(r.ok ? `${name} restarted` : 'Restart failed', r.ok ? 'success' : 'error');
  setTimeout(() => loadConnectorList(src), 2000);
}
async function deleteConnector(src, name) {
  if (!confirm(`Delete connector "${name}"?`)) return;
  const r = await apiDel(`/api/connectors/${src}/${name}`);
  toast(r.ok ? `${name} deleted` : 'Delete failed', r.ok ? 'success' : 'error');
  loadConnectorList(src);
}

//  START CDC MODAL
// ═══════════════════════════════════════════════════════════════════════════
const CDC_POS_LABEL = {
  postgres: { name: 'LSN',  badge: 'badge-lsn', placeholder: 'e.g. 0/3F8E020', hint: 'PostgreSQL Log Sequence Number (pg_current_wal_lsn())' },
  oracle:   { name: 'SCN',  badge: 'badge-scn', placeholder: 'e.g. 12345678',   hint: 'Oracle System Change Number (SELECT current_scn FROM v$database)' },
  mongodb:  { name: 'Resume Token', badge: 'badge-lsn', placeholder: 'e.g. {"_data":"82..."}', hint: 'MongoDB change-stream resume token or timestamp' },
};

async function showStartCdcModal(src, name) {
  // Always check live status — don't trust the state passed from stale rendered HTML
  const statusR = await apiGet(`/api/connectors/${src}/${name}/status`);
  const liveState = (statusR?.data?.connector?.state || '').toUpperCase();
  if (liveState === 'RUNNING') {
    toast(`CDC already running for "${name}"`, 'warn');
    return;
  }
  // If paused, default to Resume and skip the modal entirely for speed
  if (liveState === 'PAUSED') {
    const r = await apiPost(`/api/connectors/${src}/${name}/resume`);
    toast(r.ok ? `${name} resumed — picking up from last offset ✓` : `Resume failed: ${JSON.stringify(r.data).slice(0,120)}`, r.ok ? 'success' : 'error');
    if (r.ok) {
      setTimeout(() => {
        if (currentPage === 'connectors') loadConnectorList(src);
        else renderDashboard();
      }, 2500);
    }
    return;
  }
  const pos = CDC_POS_LABEL[src] || { name:'Position', badge:'badge-lsn', placeholder:'', hint:'' };

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'start-cdc-modal';
  modal.innerHTML = `
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <div>
        <div class="modal-title">▶ Start CDC — ${SOURCE_ICON[src]} ${SOURCE_LABELS[src]}</div>
        <div style="font-size:11px;color:#586374;margin-top:3px">Connector: <code style="color:#4fc3f7">${name}</code></div>
      </div>
      <button class="modal-close" onclick="closeModal('start-cdc-modal')">✕</button>
    </div>

    <div style="font-size:12px;color:#8b949e;margin-bottom:14px;padding:10px 12px;
      background:#06090f;border-radius:6px;border-left:3px solid #4fc3f7">
      Choose how to start CDC. <b style="color:#e6edf3">Resume</b> continues from the last saved offset.
      The other options delete and recreate the connector with a new starting position.
    </div>

    <div class="cdc-option-group" id="cdc-opts">

      <!-- Option 0: Resume as-is (planned stop / normal restart) -->
      <label class="cdc-option selected" id="cdc-opt-resume" onclick="selectCdcOption('resume')">
        <input type="radio" name="cdc-mode" value="resume" checked/>
        <div>
          <div class="cdc-option-label">▶ Resume — Continue from Last Offset
            <span class="cdc-pos-badge badge-ts" style="margin-left:8px">SAFE</span>
          </div>
          <div class="cdc-option-desc">
            Use this after a <b style="color:#e6edf3">planned stop</b> or normal Debezium pause.<br>
            Calls <code style="color:#4fc3f7">PUT /connectors/{name}/resume</code> — no config change,
            no data loss. Picks up exactly where it left off using the stored Kafka offset.
          </div>
        </div>
      </label>

      <!-- Option 1: Current time / Now -->
      <label class="cdc-option" id="cdc-opt-now" onclick="selectCdcOption('now')">
        <input type="radio" name="cdc-mode" value="now"/>
        <div>
          <div class="cdc-option-label">⏱ Current Time (Now)</div>
          <div class="cdc-option-desc">
            Starts CDC from this moment — skips all historical data.<br>
            Sets <code style="color:#4fc3f7">snapshot.mode=no_data</code> so Debezium
            reads only new changes going forward.
          </div>
        </div>
      </label>

      <!-- Option 2: Live position fetched from source -->
      <label class="cdc-option" id="cdc-opt-live" onclick="selectCdcOption('live')">
        <input type="radio" name="cdc-mode" value="live"/>
        <div style="width:100%">
          <div class="cdc-option-label">
            📡 Use Current ${pos.name} from Source
            <span class="cdc-pos-badge ${pos.badge}" style="margin-left:8px">${pos.name}</span>
          </div>
          <div class="cdc-option-desc" style="margin-bottom:8px">
            ${pos.hint}<br>
            ${src === 'postgres'
              ? 'Fetches the current WAL LSN for reference. PostgreSQL CDC will resume from the replication slot\'s current position (<code style="color:#d29922">snapshot.mode=no_data</code>).'
              : 'Fetches the live position from the source database and pins CDC to start there.'
            }
          </div>
          <div class="cdc-pos-row" id="live-pos-row">
            <input class="form-input" id="live-pos-val" placeholder="${pos.placeholder}" readonly
              style="font-family:'Fira Code','Courier New',monospace;font-size:12px;background:#06090f"/>
            <button class="btn btn-secondary btn-sm" onclick="fetchLivePosition('${src}','${name}',event)">
              ⟳ Fetch
            </button>
          </div>
          <div id="live-pos-status" style="font-size:11px;margin-top:6px;color:#586374"></div>
        </div>
      </label>

      <!-- Option 3: Manual position -->
      <label class="cdc-option" id="cdc-opt-manual" onclick="selectCdcOption('manual')">
        <input type="radio" name="cdc-mode" value="manual"/>
        <div style="width:100%">
          <div class="cdc-option-label">
            ✎ Enter ${pos.name} Manually
            <span class="cdc-pos-badge ${pos.badge}" style="margin-left:8px">${pos.name}</span>
          </div>
          <div class="cdc-option-desc" style="margin-bottom:8px">
            ${src === 'postgres'
              ? 'Note: PostgreSQL CDC cannot pin to an arbitrary LSN via connector config — the replication slot position is used instead (<code style="color:#d29922">snapshot.mode=no_data</code>). The LSN entered here is stored for reference only.'
              : `Provide a specific ${pos.name} to start from. Useful when replaying from a known checkpoint.`
            }
          </div>
          <div class="cdc-pos-row">
            <input class="form-input" id="manual-pos-val" placeholder="${pos.placeholder}"
              style="font-family:'Fira Code','Courier New',monospace;font-size:12px;background:#06090f"
              onclick="selectCdcOption('manual')"/>
          </div>
        </div>
      </label>

    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('start-cdc-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="applyStartCdc('${src}','${name}')">
        ▶ Start CDC
      </button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

function selectCdcOption(mode) {
  ['resume','now','live','manual'].forEach(m => {
    const el = document.getElementById(`cdc-opt-${m}`);
    if (el) el.classList.toggle('selected', m === mode);
    const radio = el?.querySelector('input[type=radio]');
    if (radio) radio.checked = (m === mode);
  });
}

async function fetchLivePosition(src, name, evt) {
  evt && evt.stopPropagation();
  selectCdcOption('live');
  const statusEl = document.getElementById('live-pos-status');
  const valEl    = document.getElementById('live-pos-val');
  statusEl.innerHTML = `<span style="color:#d29922">⏳ Fetching live position…</span>`;
  valEl.value = '';
  const r = await apiGet(`/api/connectors/${src}/${name}/offset-position`);
  if (r.ok && r.data?.position) {
    valEl.value = r.data.position;
    statusEl.innerHTML = `<span style="color:#2ea043">✓ Fetched at ${new Date().toLocaleTimeString()}</span>`;
  } else {
    statusEl.innerHTML = `<span style="color:#da3633">⚠ ${escHtml((r.data?.error || 'Failed to fetch position').slice(0,120))}</span>`;
  }
}

async function applyStartCdc(src, name) {
  const selectedRadio = document.querySelector('#start-cdc-modal input[type=radio]:checked');
  if (!selectedRadio) return toast('Select a start mode', 'error');
  const mode = selectedRadio.value;

  // Resume — connector is paused (never deleted), just call PUT /resume
  if (mode === 'resume') {
    const btn = document.querySelector('#start-cdc-modal .btn-primary');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Resuming…'; }
    const r = await apiPost(`/api/connectors/${src}/${name}/resume`);
    if (r.ok) {
      toast(`${name} resumed — picking up from last offset ✓`, 'success');
      closeModal('start-cdc-modal');
      if (currentPage === 'connectors') loadConnectorList(src);
      else renderDashboard();
    } else {
      toast(`Resume failed: ${JSON.stringify(r.data).slice(0,160)}`, 'error');
      if (btn) { btn.disabled = false; btn.textContent = '▶ Start CDC'; }
    }
    return;
  }

  let position = null;
  if (mode === 'live') {
    position = document.getElementById('live-pos-val')?.value?.trim();
    if (!position) return toast('Fetch the live position first, or choose another option', 'error');
  } else if (mode === 'manual') {
    position = document.getElementById('manual-pos-val')?.value?.trim();
    if (!position) return toast('Enter a position value', 'error');
  }

  const btn = document.querySelector('#start-cdc-modal .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Starting…'; }

  const r = await apiPost(`/api/connectors/${src}/${name}/start-from`, { mode, position });
  if (r.ok) {
    toast(`CDC started for "${name}" (${mode})`, 'success');
    closeModal('start-cdc-modal');
    if (currentPage === 'connectors') loadConnectorList(src);
    else renderDashboard();
  } else {
    toast(`Error: ${JSON.stringify(r.data).slice(0,160)}`, 'error');
    if (btn) { btn.disabled = false; btn.textContent = '▶ Start CDC'; }
  }
}

// ═══════════════════════════════════════════════════════════════════════════
//  TABLE / COLLECTION PICKER  (fully dynamic — reads live kv-editor config)
// ═══════════════════════════════════════════════════════════════════════════

// Read all kv-editor rows into a plain object
function tpickReadConfig() {
  const cfg = {};
  document.querySelectorAll('#kv-editor .kv-row').forEach(r => {
    const [k, v] = r.querySelectorAll('.kv-input');
    if (k?.value.trim()) cfg[k.value.trim()] = v?.value.trim() || '';
  });
  return cfg;
}

// Resolve the include-list key name for this source
function tpickIncludeKey(src, cfg) {
  const cls = (cfg['connector.class'] || '').toLowerCase();
  if (src === 'mongodb' || cls.includes('mongodb')) return 'collection.include.list';
  return 'table.include.list';
}

// Read the current include-list value from kv-editor
function tpickGetCurrentValue(key) {
  for (const row of document.querySelectorAll('#kv-editor .kv-row')) {
    const [k, v] = row.querySelectorAll('.kv-input');
    if (k?.value.trim() === key) return v?.value || '';
  }
  return '';
}

async function tpickLoad(src) {
  const statusEl = document.getElementById('tpick-status');
  const bodyEl   = document.getElementById('tpick-body');
  statusEl.innerHTML = `<span style="color:#d29922">⏳ Connecting to ${src}…</span>`;
  bodyEl.innerHTML   = '';

  // Send the full live connector config to the server — no hardcoding
  const cfg = tpickReadConfig();
  const r   = await apiPost(`/api/schema/${src}`, cfg);
  if (!r.ok) {
    statusEl.innerHTML = `<span style="color:#f85149">⚠ ${escHtml((r.data?.error || 'Failed').slice(0, 180))}</span>`;
    return;
  }

  // { databases: { dbName: { schemaName: [table,...] } } }  (postgres/oracle)
  // { databases: { dbName: [collection,...] } }              (mongodb)
  const databases = r.data.databases || {};
  const includeKey = tpickIncludeKey(src, cfg);
  const selected   = new Set(
    tpickGetCurrentValue(includeKey).split(',').map(s => s.trim()).filter(Boolean)
  );

  let total = 0;
  let html  = `<input class="tpick-search" id="tpick-search" placeholder="Filter…" oninput="tpickFilter(this.value)"/>
               <div class="tpick-list" id="tpick-list">`;

  Object.entries(databases).forEach(([dbName, schemasOrCols]) => {
    // Database-level "select all" row
    html += `<div class="tpick-schema" style="display:flex;align-items:center;gap:6px;cursor:pointer"
                  onclick="tpickToggleDb(this)">
               <input type="checkbox" class="tpick-db-chk" data-db="${escHtml(dbName)}" style="accent-color:#4fc3f7"/>
               🗄 ${escHtml(dbName)}
             </div>`;

    if (Array.isArray(schemasOrCols)) {
      // MongoDB: array of collection names
      schemasOrCols.forEach(col => {
        const full = `${dbName}.${col}`;
        total++;
        html += `<label class="tpick-item" data-table="${escHtml(full)}" data-db="${escHtml(dbName)}">
                   <input type="checkbox" value="${escHtml(full)}" ${selected.has(full) ? 'checked' : ''}/>
                   ${escHtml(col)}
                 </label>`;
      });
    } else {
      // Postgres / Oracle: object of { schema: [tables] }
      Object.entries(schemasOrCols).forEach(([schemaName, tables]) => {
        html += `<div class="tpick-schema" style="padding-left:18px;display:flex;align-items:center;gap:6px;cursor:pointer"
                      onclick="tpickToggleSchema(this)">
                   <input type="checkbox" class="tpick-schema-chk"
                          data-db="${escHtml(dbName)}" data-schema="${escHtml(schemaName)}"
                          style="accent-color:#4fc3f7"/>
                   ${escHtml(schemaName)}
                 </div>`;
        tables.forEach(tbl => {
          const full = `${schemaName}.${tbl}`;
          total++;
          html += `<label class="tpick-item" data-table="${escHtml(full)}"
                          data-db="${escHtml(dbName)}" data-schema="${escHtml(schemaName)}"
                          style="padding-left:34px">
                     <input type="checkbox" value="${escHtml(full)}" ${selected.has(full) ? 'checked' : ''}/>
                     ${escHtml(tbl)}
                     <span style="color:#586374;font-size:11px;margin-left:auto">${escHtml(schemaName)}</span>
                   </label>`;
        });
      });
    }
  });

  html += `</div>`;
  bodyEl.innerHTML = html;

  // Sync db/schema checkboxes with current selections
  tpickSyncGroupChecks();

  const selCount = bodyEl.querySelectorAll('.tpick-item input:checked').length;
  statusEl.innerHTML = `<span style="color:#2ea043">✓ ${total} tables across ${Object.keys(databases).length} database(s)</span> — ${selCount} selected`;

  bodyEl.addEventListener('change', e => {
    if (e.target.classList.contains('tpick-db-chk') || e.target.classList.contains('tpick-schema-chk')) return;
    tpickSyncGroupChecks();
    const n = bodyEl.querySelectorAll('.tpick-item input:checked').length;
    statusEl.innerHTML = `<span style="color:#2ea043">✓ ${total} tables</span> — ${n} selected`;
  });
}

// Toggle all items under a database header
function tpickToggleDb(headerEl) {
  const chk = headerEl.querySelector('.tpick-db-chk');
  const db  = chk?.dataset.db;
  if (!db) return;
  const newState = !chk.checked;
  chk.checked = newState;
  document.querySelectorAll(`#tpick-list .tpick-item[data-db="${CSS.escape(db)}"] input`).forEach(i => i.checked = newState);
  document.querySelectorAll(`#tpick-list .tpick-schema-chk[data-db="${CSS.escape(db)}"]`).forEach(i => i.checked = newState);
}

// Toggle all items under a schema header
function tpickToggleSchema(headerEl) {
  const chk    = headerEl.querySelector('.tpick-schema-chk');
  const db     = chk?.dataset.db;
  const schema = chk?.dataset.schema;
  if (!db || !schema) return;
  const newState = !chk.checked;
  chk.checked = newState;
  document.querySelectorAll(`#tpick-list .tpick-item[data-db="${CSS.escape(db)}"][data-schema="${CSS.escape(schema)}"] input`)
    .forEach(i => i.checked = newState);
}

// Sync db/schema group checkboxes to reflect their children
function tpickSyncGroupChecks() {
  document.querySelectorAll('#tpick-list .tpick-schema-chk').forEach(chk => {
    const db     = chk.dataset.db;
    const schema = chk.dataset.schema;
    const items  = document.querySelectorAll(`#tpick-list .tpick-item[data-db="${CSS.escape(db)}"][data-schema="${CSS.escape(schema)}"] input`);
    chk.checked = items.length > 0 && [...items].every(i => i.checked);
  });
  document.querySelectorAll('#tpick-list .tpick-db-chk').forEach(chk => {
    const db    = chk.dataset.db;
    const items = document.querySelectorAll(`#tpick-list .tpick-item[data-db="${CSS.escape(db)}"] input`);
    chk.checked = items.length > 0 && [...items].every(i => i.checked);
  });
}

function tpickFilter(q) {
  const lq = q.toLowerCase();
  document.querySelectorAll('#tpick-list .tpick-item').forEach(el => {
    el.style.display = el.dataset.table.toLowerCase().includes(lq) ? '' : 'none';
  });
}

function tpickToggleAll(checked) {
  const bodyEl = document.getElementById('tpick-body');
  bodyEl.style.opacity       = checked ? '0.4' : '';
  bodyEl.style.pointerEvents = checked ? 'none' : '';
}

function tpickApply(src) {
  const cfg        = tpickReadConfig();
  const includeKey = tpickIncludeKey(src, cfg);
  const allChecked = document.getElementById('tpick-all')?.checked;

  let value = '';
  if (!allChecked) {
    const checked = [...document.querySelectorAll('#tpick-list .tpick-item input:checked')];
    if (!checked.length) return toast('Select at least one table, or tick "All tables (no filter)"', 'warn');
    value = checked.map(c => c.value).join(',');
  }

  // Update or insert the include-list key in kv-editor
  let found = false;
  document.querySelectorAll('#kv-editor .kv-row').forEach(row => {
    const [k, v] = row.querySelectorAll('.kv-input');
    if (k?.value.trim() === includeKey) {
      value === '' ? row.remove() : (v.value = value);
      found = true;
    }
  });
  if (!found && value !== '') {
    document.getElementById('kv-editor').insertAdjacentHTML('beforeend', kvRow(includeKey, value));
  }

  const msg = value === '' ? 'Cleared — capturing all tables' : `Applied ${value.split(',').length} table(s)`;
  document.getElementById('tpick-status').innerHTML = `<span style="color:#2ea043">✓ ${msg} — click Save to persist</span>`;
}

function kvRow(k='', v='') {
  return `<div class="kv-row">
    <input class="kv-input" placeholder="property.key" value="${escHtml(String(k))}"/>
    <input class="kv-input" placeholder="value" value="${escHtml(String(v))}"/>
    <button class="kv-del" onclick="this.parentElement.remove()">✕</button>
  </div>`;
}
function addKvRow() {
  const ed = document.getElementById('kv-editor');
  ed.insertAdjacentHTML('beforeend', kvRow());
}
function loadJsonToKv() {
  const raw = document.getElementById('modal-json').value.trim();
  if (!raw) return;
  try {
    const obj = JSON.parse(raw);
    const ed = document.getElementById('kv-editor');
    ed.innerHTML = Object.entries(obj).filter(([k])=>k!=='name').map(([k,v])=>kvRow(k,v)).join('');
    toast('JSON applied to editor', 'info');
  } catch { toast('Invalid JSON', 'error'); }
}
function getKvConfig() {
  const rows = document.querySelectorAll('#kv-editor .kv-row');
  const cfg = {};
  rows.forEach(r => {
    const inputs = r.querySelectorAll('.kv-input');
    const k = inputs[0].value.trim();
    const v = inputs[1].value.trim();
    if (k) cfg[k] = v;
  });
  return cfg;
}
async function saveConnector(src, oldName, isNew) {
  const actualSrc = isNew ? (document.getElementById('modal-src')?.value || src) : src;
  const name = isNew ? document.getElementById('modal-name')?.value?.trim() : oldName;
  if (!name) return toast('Connector name required', 'error');

  let cfg = getKvConfig();
  // if JSON field has content, prefer it
  const jsonRaw = document.getElementById('modal-json')?.value?.trim();
  if (jsonRaw) {
    try { cfg = JSON.parse(jsonRaw); } catch { return toast('Invalid JSON', 'error'); }
  }

  if (isNew) {
    const body = { name, config: cfg };
    const r = await apiPost(`/api/connectors/${actualSrc}`, body);
    if (r.ok) {
      toast(`Connector "${name}" created`, 'success');
      closeModal('conn-modal');
      currentSource = actualSrc;
      navigate('connectors');
    } else {
      toast(`Error: ${JSON.stringify(r.data).slice(0,120)}`, 'error');
    }
  } else {
    const r = await apiPut(`/api/connectors/${src}/${name}`, cfg);
    if (r.ok) {
      toast(`Connector "${name}" updated`, 'success');
      closeModal('conn-modal');
      loadConnectorList(src);
    } else {
      toast(`Error: ${JSON.stringify(r.data).slice(0,120)}`, 'error');
    }
  }
}

function renderKSQL(presetTopic) {

function _ksqlSetEditorFromControls() {
  const topic   = document.getElementById('q-topic')?.value?.trim();
  if (!topic) return;
  const part    = document.getElementById('q-partition')?.value || '0';
  const offMode = document.getElementById('q-offset-mode')?.value || 'latest';
  const offVal  = offMode === 'custom'
    ? document.getElementById('q-custom-offset')?.value || '0'
    : offMode === '0' ? '0' : 'LATEST';
  const limit   = document.getElementById('q-limit')?.value || '20';
  const offsetStr = String(offVal).toUpperCase() === 'LATEST' ? 'LATEST' : offVal;
  const ed = document.getElementById('ksql-editor');
  if (ed) ed.value = `SELECT * FROM ${topic} PARTITION ${part} OFFSET ${offsetStr} LIMIT ${limit}`;
}

function clearQuery() {
  const ed = document.getElementById('ksql-editor');
  if (ed) ed.value = '';
  document.getElementById('q-status').textContent = '';
  document.getElementById('q-results').innerHTML = '';
}

// Parse simple SQL: SELECT * FROM <topic> [PARTITION n] [OFFSET n|LATEST|EARLIEST] [LIMIT n]
function _parseKSQL(sql) {
  const s = sql.replace(/\s+/g,' ').trim().toUpperCase();
  const topic   = sql.match(/FROM\s+(\S+)/i)?.[1] || document.getElementById('q-topic')?.value?.trim();
  const partM   = s.match(/PARTITION\s+(\d+)/);
  const offM    = s.match(/OFFSET\s+(\S+)/);
  const limM    = s.match(/LIMIT\s+(\d+)/);
  const partition = partM  ? Number(partM[1])  : Number(document.getElementById('q-partition')?.value||0);
  const limit     = limM   ? Number(limM[1])   : Number(document.getElementById('q-limit')?.value||20);
  let offset = 'latest';
  if (offM) {
    const ov = offM[1].toUpperCase();
    offset = (ov === 'LATEST') ? 'latest' : (ov === 'EARLIEST' || ov === '0') ? 0 : Number(ov);
  } else {
    const om = document.getElementById('q-offset-mode')?.value;
    if (om === '0') offset = 0;
    else if (om === 'custom') offset = Number(document.getElementById('q-custom-offset')?.value||0);
  }
  return { topic, partition, limit, offset };
}

async function runKafkaQuery() {
  const sql = document.getElementById('ksql-editor')?.value?.trim();
  const { topic, partition, limit, offset } = _parseKSQL(sql || '');
  const filterRaw = document.getElementById('q-filter')?.value?.trim() || '';

  if (!topic) return toast('Specify a topic — e.g. SELECT * FROM oracle.CACHE_TESTING.CUSTOMERS LIMIT 20', 'error');

  // Sync controls to match parsed SQL
  const topicEl = document.getElementById('q-topic');
  if (topicEl && !topicEl.value) topicEl.value = topic;

  document.getElementById('q-status').innerHTML =
    `⏳ <code>${topic}</code>  partition=${partition}  offset=${offset}  limit=${limit} …`;
  document.getElementById('q-results').innerHTML = '';

  const r = await apiPost('/api/kafka/query', { topic, partition, offset, limit });
  let msgs = r.data?.messages || [];
  const err = r.data?.error;

  if (err) {
    document.getElementById('q-status').innerHTML =
      `<span style="color:#da3633">⚠ ${escHtml(err.slice(0,200))}</span>`;
    return;
  }

  // Drop unparseable messages (Avro binary or non-JSON legacy messages)
  const rawSkipped = msgs.filter(m => !m.parsed).length;
  msgs = msgs.filter(m => m.parsed !== null && m.parsed !== undefined);

  // Client-side key=value filter
  if (filterRaw && msgs.length) {
    const eqIdx = filterRaw.indexOf('=');
    const fk = filterRaw.slice(0, eqIdx).trim();
    const fv = filterRaw.slice(eqIdx + 1).trim();
    msgs = msgs.filter(m => {
      const p = m.parsed || {};
      const val = p[fk] ?? p.after?.[fk] ?? p.before?.[fk] ?? '';
      return String(val).toLowerCase().includes(fv.toLowerCase());
    });
  }

  const skippedNote = rawSkipped > 0
    ? ` <span style="color:#d29922;font-size:11px">(${rawSkipped} binary/legacy msg${rawSkipped>1?'s':''} skipped)</span>`
    : '';

  document.getElementById('q-status').innerHTML =
    `<span style="color:#2ea043">✓ ${msgs.length} row(s) returned</span>${skippedNote}` +
    (filterRaw ? ` <span style="color:#586374">(filtered: <code>${escHtml(filterRaw)}</code>)</span>` : '') +
    `<span style="color:#586374;margin-left:12px">topic: <code>${topic}</code>  partition: ${partition}  offset: ${offset}</span>`;

  if (!msgs.length) {
    document.getElementById('q-results').innerHTML =
      `<div style="color:#586374;padding:20px;text-align:center">No decodable JSON messages found in this range.${rawSkipped > 0 ? '<br><span style="font-size:11px">'+rawSkipped+' binary (pre-JSON converter) message(s) were skipped.</span>' : ''}</div>`;
    return;
  }

  // Build column headers from the first message that has after/before payload
  const firstWithData = msgs.find(m => m.parsed?.after || m.parsed?.before);
  const refParsed = firstWithData?.parsed ?? msgs[0].parsed;
  const dataKeys = Object.keys(refParsed?.after || refParsed?.before || refParsed || {}).filter(k => k !== 'op');
  const allKeys = dataKeys.length ? ['op', ...dataKeys] : [];

  let rowIdx = 0;
  const tableRows = msgs.map(m => {
    const idx = rowIdx++;
    const p = m.parsed;
    const op = p?.op;
    const opCls = op==='c'?'op-c':op==='u'?'op-u':op==='d'?'op-d':'op-r';
    const opLabel = op==='c'?'INSERT':op==='u'?'UPDATE':op==='d'?'DELETE':op?op.toUpperCase():'MSG';
    const data = p?.after || p?.before || p || {};

    if (allKeys.length > 1) {
      const cells = allKeys.map(k => {
        if (k === 'op') return `<td>${op ? `<span class="msg-op ${opCls}">${opLabel}</span>` : '–'}</td>`;
        const v = data[k];
        const vs = v === null ? '<span style="color:#586374">null</span>'
                 : v === undefined ? '<span style="color:#30363d">–</span>'
                 : escHtml(String(v).slice(0, 60)) + (String(v).length > 60 ? '…' : '');
        return `<td style="font-size:12px">${vs}</td>`;
      }).join('');
      return `<tr class="msg-row" onclick="toggleMsgDetail(${idx})" style="cursor:pointer">${cells}</tr>
        <tr id="detail-${idx}" style="display:none">
          <td colspan="${allKeys.length}" style="padding:0">
            <pre style="background:#06090f;padding:12px 16px;margin:0;font-size:11px;
              color:#8b949e;white-space:pre-wrap;word-break:break-all">${syntaxHighlight(JSON.stringify(p, null, 2))}</pre>
          </td>
        </tr>`;
    } else {
      return `<tr class="msg-row" onclick="toggleMsgDetail(${idx})" style="cursor:pointer">
        <td style="font-size:12px;font-family:'Fira Code',monospace;color:#c9d1d9">${escHtml(m.raw.slice(0, 200))}</td>
      </tr>
      <tr id="detail-${idx}" style="display:none">
        <td><pre style="background:#06090f;padding:12px;font-size:11px;color:#8b949e;
          white-space:pre-wrap;word-break:break-all">${syntaxHighlight(JSON.stringify(p || m.raw, null, 2))}</pre></td>
      </tr>`;
    }
  }).join('');

  const thead = allKeys.length > 1
    ? `<thead><tr>${allKeys.map(k => `<th>${escHtml(k)}</th>`).join('')}</tr></thead>`
    : `<thead><tr><th>Raw Message</th></tr></thead>`;

  document.getElementById('q-results').innerHTML = `
  <div style="overflow-x:auto">
    <table class="data-table" style="min-width:100%">
      ${thead}
      <tbody>${tableRows}</tbody>
    </table>
  </div>
  <div style="font-size:11px;color:#586374;margin-top:8px;text-align:right">
    ${msgs.length} row(s) • Click a row to expand full JSON
  </div>`;
}

function toggleMsgDetail(idx) {
  const row = document.getElementById(`detail-${idx}`);
  if (row) row.style.display = row.style.display === 'none' ? '' : 'none';
}

function toggleMsg(el) { el.classList.toggle('expanded'); }

async function renderStreaming() {
  const c = document.getElementById('content');
  c.innerHTML = `<div style="color:#586374;padding:40px;text-align:center">Loading…</div>`;

  const r = await apiGet('/api/streaming/deployments');
  const deploys = r.data?.items || [];

  if (!deploys.length) {
    c.innerHTML = `<div class="card" style="text-align:center;color:#586374;padding:32px">No streaming deployments found.</div>`;
    return;
  }

  const rows = deploys.map(d => {
    const name   = d.metadata.name;
    const labels = d.metadata.labels || {};
    const ready   = d.status?.readyReplicas || 0;
    const desired = d.spec?.replicas || 0;
    const st = desired === 0 ? 'STOPPED' : ready > 0 ? 'RUNNING' : 'STARTING';

    // Read source + write-mode from actual K8s labels (not the deployment name)
    const srcRaw  = labels['pipeline.source']     || '';
    const modeRaw = labels['pipeline.write-mode'] || '';
    // Title-case the mode words: "soft-delete" → "Soft Delete"
    const modeLabel = modeRaw
      .split('-')
      .map(w => w.charAt(0).toUpperCase() + w.slice(1))
      .join(' ') || '–';
    const srcLabel = SOURCE_LABELS[srcRaw] || srcRaw || '–';
    const srcIcon  = SOURCE_ICON[srcRaw]   || '🔵';

    return `<tr id="row-${name}">
      <td><code style="font-size:12px;color:#c9d1d9">${name}</code></td>
      <td>${srcIcon} ${srcLabel}</td>
      <td><span style="color:#4fc3f7;font-size:12px;font-weight:500">${modeLabel}</span></td>
      <td>${stateBadge(st)}</td>
      <td style="color:#586374;font-size:11px">${ready}/${desired}</td>
      <td>
        <div class="btn-group">
          ${desired === 0
            ? `<button class="btn btn-success btn-sm" onclick="scaleJob('${name}',1)">▶ Start</button>`
            : `<button class="btn btn-danger btn-sm" onclick="scaleJob('${name}',0)">⏹ Stop</button>`}
          <button class="btn btn-warn btn-sm" onclick="restartJob('${name}')">↻ Restart</button>
          <button class="btn btn-secondary btn-sm" onclick="showJobLogs('${name}')">📋 Logs</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  c.innerHTML = `
  <div class="card">
    <div class="card-header">
      <div class="card-title">🌊 Kafka → Iceberg Streaming Jobs</div>
      <div class="btn-group">
        <button class="btn btn-secondary btn-sm" onclick="renderStreaming()">↻ Refresh</button>
        <button class="btn btn-success btn-sm" onclick="scaleAll(1)">▶ Start All</button>
        <button class="btn btn-danger btn-sm" onclick="scaleAll(0)">⏹ Stop All</button>
      </div>
    </div>
    <table class="data-table">
      <thead><tr><th>Deployment</th><th>Source</th><th>Mode</th><th>Status</th><th>Pods</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>
  <div id="log-panel"></div>`;
}

async function scaleJob(name, replicas) {
  const r = await apiPost(`/api/streaming/${name}/scale`, { replicas });
  toast(r.ok ? `${name} scaled to ${replicas}` : `Scale failed: ${JSON.stringify(r.data).slice(0,80)}`,
        r.ok ? 'success' : 'error');
  setTimeout(renderStreaming, 1500);
}
async function restartJob(name) {
  const r = await apiPost(`/api/streaming/${name}/restart`);
  toast(r.ok ? `${name} restarted` : `Restart failed`, r.ok ? 'success' : 'error');
  setTimeout(renderStreaming, 1500);
}
async function scaleAll(replicas) {
  const r = await apiGet('/api/streaming/deployments');
  const deploys = r.data?.items || [];
  await Promise.all(deploys.map(d => apiPost(`/api/streaming/${d.metadata.name}/scale`, { replicas })));
  toast(`All jobs scaled to ${replicas}`, 'success');
  setTimeout(renderStreaming, 2000);
}
async function showJobLogs(name) {
  document.getElementById('log-panel').innerHTML = `<div class="card"><div style="color:#586374;padding:12px">⏳ Loading logs for <code>${name}</code>…</div></div>`;
  const r = await apiGet(`/api/streaming/${name}/logs`);
  if (!r.ok || r.data?.error) {
    document.getElementById('log-panel').innerHTML = `<div class="card">
      <div style="color:#da3633;padding:12px">Error: ${r.data?.error || 'Failed to load logs'}</div></div>`;
    return;
  }
  const logs = r.data?.logs || 'No logs';
  const podName = r.data?.podName || '';
  // colour-code log lines by level
  const lines = logs.split('\n').slice(-150).map(l => {
    if (!l.trim()) return '';
    const cls = /ERROR|EXCEPTION|Exception/i.test(l) ? 'color:#da3633' :
                /WARN/i.test(l)  ? 'color:#d29922' :
                /INFO.*batch=.*written|upsert|delete/i.test(l) ? 'color:#2ea043' :
                /INFO/i.test(l)  ? 'color:#8b949e' : 'color:#c9d1d9';
    return `<span style="${cls}">${escHtml(l)}</span>`;
  }).filter(Boolean).join('\n');

  document.getElementById('log-panel').innerHTML = `
  <div class="card" style="margin-top:16px">
    <div class="card-header">
      <div>
        <div class="card-title">📋 Logs: <code style="color:#4fc3f7;font-size:13px">${name}</code></div>
        ${podName ? `<div class="card-subtitle">Pod: ${podName}</div>` : ''}
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary btn-sm" onclick="showJobLogs('${name}')">↻ Refresh</button>
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('log-panel').innerHTML=''">✕ Close</button>
      </div>
    </div>
    <pre style="background:#06090f;border:1px solid #1c2a3a;border-radius:6px;padding:14px;
      font-size:11px;font-family:'Fira Code','Courier New',monospace;
      overflow:auto;max-height:480px;white-space:pre-wrap;word-break:break-all;line-height:1.5">${lines}</pre>
  </div>`;
  // scroll to bottom of log
  const pre = document.querySelector('#log-panel pre');
  if (pre) pre.scrollTop = pre.scrollHeight;
}

function stateBadge(state) {
  const s = (state||'').toUpperCase();
  if (s==='RUNNING')  return `<span class="s-badge s-running"><span class="status-dot dot-green"></span>${s}</span>`;
  if (s==='PAUSED')   return `<span class="s-badge s-paused"><span class="status-dot dot-yellow"></span>${s}</span>`;
  if (s==='FAILED')   return `<span class="s-badge s-failed"><span class="status-dot dot-red"></span>${s}</span>`;
  if (s==='STOPPED')  return `<span class="s-badge s-stopped"><span class="status-dot dot-gray"></span>${s}</span>`;
  if (s==='STARTING') return `<span class="s-badge s-paused"><span class="status-dot dot-yellow"></span>${s}</span>`;
  return `<span class="s-badge s-stopped">${s||'–'}</span>`;
}

}
// Close on any outside click
document.addEventListener('click', e => {
  if (!e.target.closest('.act-wrap')) closeActMenus();
});

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function syntaxHighlight(json) {
  if (typeof json !== 'string') json = JSON.stringify(json, null, 2);
  return escHtml(json)
    .replace(/"([^"]+)":/g, '<span class="json-key">"$1"</span>:')
    .replace(/: "([^"]*)"/g, ': <span class="json-str">"$1"</span>')
    .replace(/: (-?\d+\.?\d*)/g, ': <span class="json-num">$1</span>')
    .replace(/: (true|false)/g, ': <span class="json-bool">$1</span>')
    .replace(/: null/g, ': <span class="json-null">null</span>');
}

function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

// ═══════════════════════════════════════════════════════════════════════════
//  CLUSTER STATUS  (poll every 10s)
// ═══════════════════════════════════════════════════════════════════════════
async function refreshClusterStatus() {
  const el = document.getElementById('cluster-status');
  try {
    const r = await apiGet('/api/connectors/postgres');
    const ok = r.ok && typeof r.data === 'object';
    const count = ok ? Object.keys(r.data).length : 0;
    el.innerHTML = `<div class="status-dot ${ok?'dot-green':'dot-red'}"></div>
      <span>${ok ? `Cluster OK • ${count} connector(s)` : 'Cluster unreachable'}</span>`;
  } catch {
    el.innerHTML = `<div class="status-dot dot-red"></div><span>Error</span>`;
  }
}

// ─── Init ───────────────────────────────────────────────────────────────────
refreshClusterStatus();
setInterval(refreshClusterStatus, 10000);
navigate('dashboard');
</script>
