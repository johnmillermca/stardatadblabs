// ═══════════════════════════════════════════════════════════════════════════
//  TABLE / COLLECTION PICKER  (fully dynamic — reads live kv-editor config)
// ═══════════════════════════════════════════════════════════════════════════

// Read all kv-editor rows into a plain object
function tpickReadConfig() {
  const cfg = {};
  document.querySelectorAll('#kv-editor .kv-row').forEach(r => {
    const sel    = r.querySelector('.kv-key-select');
    const custom = r.querySelector('.kv-custom-key');
    const valEl  = r.querySelector('.kv-value');
    const k = sel
      ? ((sel.value === '__custom__' || !sel.value) ? (custom?.value.trim()||'') : sel.value)
      : (r.querySelectorAll('.kv-input')[0]?.value.trim()||'');
    const v = valEl ? valEl.value.trim() : (r.querySelectorAll('.kv-input')[1]?.value.trim()||'');
    if (k) cfg[k] = v;
  });
  return cfg;
}

// Resolve the include-list key name for this source
function tpickIncludeKey(src, cfg) {
  const cls = (cfg['connector.class'] || '').toLowerCase();
  if (src === 'mongodb' || cls.includes('mongodb')) return 'collection.include.list';
  return 'table.include.list';
}

// Read the current include-list value from kv-editor
function tpickGetCurrentValue(key) {
  for (const row of document.querySelectorAll('#kv-editor .kv-row')) {
    const sel    = row.querySelector('.kv-key-select');
    const custom = row.querySelector('.kv-custom-key');
    const valEl  = row.querySelector('.kv-value');
    const k = sel
      ? ((sel.value === '__custom__' || !sel.value) ? (custom?.value.trim()||'') : sel.value)
      : (row.querySelectorAll('.kv-input')[0]?.value.trim()||'');
    if (k === key) return valEl ? valEl.value : (row.querySelectorAll('.kv-input')[1]?.value||'');
  }
  return '';
}

async function tpickLoad(src) {
  const statusEl = document.getElementById('tpick-status');
  const bodyEl   = document.getElementById('tpick-body');
  statusEl.innerHTML = `<span style="color:#d29922">⏳ Connecting to ${src}…</span>`;
  bodyEl.innerHTML   = '';

  // Send the full live connector config to the server — no hardcoding
  const cfg = tpickReadConfig();
  const r   = await apiPost(`/api/schema/${src}`, cfg);
  if (!r.ok) {
    statusEl.innerHTML = `<span style="color:#f85149">⚠ ${escHtml((r.data?.error || 'Failed').slice(0, 180))}</span>`;
    return;
  }

  // { databases: { dbName: { schemaName: [table,...] } } }  (postgres/oracle)
  // { databases: { dbName: [collection,...] } }              (mongodb)
  const databases = r.data.databases || {};
  const includeKey = tpickIncludeKey(src, cfg);
  const selected   = new Set(
    tpickGetCurrentValue(includeKey).split(',').map(s => s.trim()).filter(Boolean)
  );

  let total = 0;
  let html  = `<input class="tpick-search" id="tpick-search" placeholder="Filter…" oninput="tpickFilter(this.value)"/>
               <div class="tpick-list" id="tpick-list">`;

  Object.entries(databases).forEach(([dbName, schemasOrCols]) => {
    // Database-level "select all" row
    html += `<div class="tpick-schema" style="display:flex;align-items:center;gap:6px;cursor:pointer"
                  onclick="tpickToggleDb(this)">
               <input type="checkbox" class="tpick-db-chk" data-db="${escHtml(dbName)}" style="accent-color:#4fc3f7"/>
               🗄 ${escHtml(dbName)}
             </div>`;

    if (Array.isArray(schemasOrCols)) {
      // MongoDB: array of collection names
      schemasOrCols.forEach(col => {
        const full = `${dbName}.${col}`;
        total++;
        html += `<label class="tpick-item" data-table="${escHtml(full)}" data-db="${escHtml(dbName)}">
                   <input type="checkbox" value="${escHtml(full)}" ${selected.has(full) ? 'checked' : ''}/>
                   ${escHtml(col)}
                 </label>`;
      });
    } else {
      // Postgres / Oracle: object of { schema: [tables] }
      Object.entries(schemasOrCols).forEach(([schemaName, tables]) => {
        html += `<div class="tpick-schema" style="padding-left:18px;display:flex;align-items:center;gap:6px;cursor:pointer"
                      onclick="tpickToggleSchema(this)">
                   <input type="checkbox" class="tpick-schema-chk"
                          data-db="${escHtml(dbName)}" data-schema="${escHtml(schemaName)}"
                          style="accent-color:#4fc3f7"/>
                   ${escHtml(schemaName)}
                 </div>`;
        tables.forEach(tbl => {
          const full = `${schemaName}.${tbl}`;
          total++;
          html += `<label class="tpick-item" data-table="${escHtml(full)}"
                          data-db="${escHtml(dbName)}" data-schema="${escHtml(schemaName)}"
                          style="padding-left:34px">
                     <input type="checkbox" value="${escHtml(full)}" ${selected.has(full) ? 'checked' : ''}/>
                     ${escHtml(tbl)}
                     <span style="color:#586374;font-size:11px;margin-left:auto">${escHtml(schemaName)}</span>
                   </label>`;
        });
      });
    }
  });

  html += `</div>`;
  bodyEl.innerHTML = html;

  // Sync db/schema checkboxes with current selections
  tpickSyncGroupChecks();

  const selCount = bodyEl.querySelectorAll('.tpick-item input:checked').length;
  statusEl.innerHTML = `<span style="color:#2ea043">✓ ${total} tables across ${Object.keys(databases).length} database(s)</span> — ${selCount} selected`;

  bodyEl.addEventListener('change', e => {
    if (e.target.classList.contains('tpick-db-chk') || e.target.classList.contains('tpick-schema-chk')) return;
    tpickSyncGroupChecks();
    const n = bodyEl.querySelectorAll('.tpick-item input:checked').length;
    statusEl.innerHTML = `<span style="color:#2ea043">✓ ${total} tables</span> — ${n} selected`;
  });
}

// Toggle all items under a database header
function tpickToggleDb(headerEl) {
  const chk = headerEl.querySelector('.tpick-db-chk');
  const db  = chk?.dataset.db;
  if (!db) return;
  const newState = !chk.checked;
  chk.checked = newState;
  document.querySelectorAll(`#tpick-list .tpick-item[data-db="${CSS.escape(db)}"] input`).forEach(i => i.checked = newState);
  document.querySelectorAll(`#tpick-list .tpick-schema-chk[data-db="${CSS.escape(db)}"]`).forEach(i => i.checked = newState);
}

// Toggle all items under a schema header
function tpickToggleSchema(headerEl) {
  const chk    = headerEl.querySelector('.tpick-schema-chk');
  const db     = chk?.dataset.db;
  const schema = chk?.dataset.schema;
  if (!db || !schema) return;
  const newState = !chk.checked;
  chk.checked = newState;
  document.querySelectorAll(`#tpick-list .tpick-item[data-db="${CSS.escape(db)}"][data-schema="${CSS.escape(schema)}"] input`)
    .forEach(i => i.checked = newState);
}

// Sync db/schema group checkboxes to reflect their children
function tpickSyncGroupChecks() {
  document.querySelectorAll('#tpick-list .tpick-schema-chk').forEach(chk => {
    const db     = chk.dataset.db;
    const schema = chk.dataset.schema;
    const items  = document.querySelectorAll(`#tpick-list .tpick-item[data-db="${CSS.escape(db)}"][data-schema="${CSS.escape(schema)}"] input`);
    chk.checked = items.length > 0 && [...items].every(i => i.checked);
  });
  document.querySelectorAll('#tpick-list .tpick-db-chk').forEach(chk => {
    const db    = chk.dataset.db;
    const items = document.querySelectorAll(`#tpick-list .tpick-item[data-db="${CSS.escape(db)}"] input`);
    chk.checked = items.length > 0 && [...items].every(i => i.checked);
  });
}

function tpickFilter(q) {
  const lq = q.toLowerCase();
  document.querySelectorAll('#tpick-list .tpick-item').forEach(el => {
    el.style.display = el.dataset.table.toLowerCase().includes(lq) ? '' : 'none';
  });
}

function tpickToggleAll(checked) {
  const bodyEl = document.getElementById('tpick-body');
  bodyEl.style.opacity       = checked ? '0.4' : '';
  bodyEl.style.pointerEvents = checked ? 'none' : '';
}

function tpickApply(src) {
  const cfg        = tpickReadConfig();
  const includeKey = tpickIncludeKey(src, cfg);
  const allChecked = document.getElementById('tpick-all')?.checked;

  let value = '';
  if (!allChecked) {
    const checked = [...document.querySelectorAll('#tpick-list .tpick-item input:checked')];
    if (!checked.length) return toast('Select at least one table, or tick "All tables (no filter)"', 'warn');
    value = checked.map(c => c.value).join(',');
  }

  // Update or insert the include-list key in kv-editor
  let found = false;
  document.querySelectorAll('#kv-editor .kv-row').forEach(row => {
    const sel    = row.querySelector('.kv-key-select');
    const custom = row.querySelector('.kv-custom-key');
    const valEl  = row.querySelector('.kv-value');
    const k = sel
      ? ((sel.value === '__custom__' || !sel.value) ? (custom?.value.trim()||'') : sel.value)
      : (row.querySelectorAll('.kv-input')[0]?.value.trim()||'');
    if (k === includeKey) {
      if (value === '') { row.remove(); }
      else if (valEl) { valEl.value = value; }
      found = true;
    }
  });
  if (!found && value !== '') {
    document.getElementById('kv-editor').insertAdjacentHTML('beforeend', kvRow(includeKey, value));
  }

  const msg = value === '' ? 'Cleared — capturing all tables' : `Applied ${value.split(',').length} table(s)`;
  document.getElementById('tpick-status').innerHTML = `<span style="color:#2ea043">✓ ${msg} — click Save to persist</span>`;
}

function _dbzPropSelect(selectedKey, src) {
  let html = `<option value="">— pick a property —</option>`;
  for (const g of DBZ_PROP_GROUPS) {
    // Filter keys to only those supported by this source
    const visibleKeys = g.keys.filter(k => {
      if (!DBZ_PROPS[k]) return false;
      // Always show the selectedKey even if it doesn't belong to this source
      // (so existing rows loaded from a saved config display correctly)
      if (k === selectedKey) return true;
      return DBZ_PROPS[k].src.includes(src);
    });
    if (!visibleKeys.length) continue;
    html += `<optgroup label="${g.label}">`;
    for (const k of visibleKeys) {
      const meta = DBZ_PROPS[k];
      const sel  = k === selectedKey ? ' selected' : '';
      html += `<option value="${k}"${sel} title="${escHtml(meta.desc)}">${k}</option>`;
    }
    html += `</optgroup>`;
  }
  html += `<optgroup label="Custom"><option value="__custom__">✎ Custom key…</option></optgroup>`;
  return html;
}

function _onKvKeyChange(selectEl, src) {
  // Always resolve src live from the DOM so switching source in the modal
  // immediately reflects in sample values and tooltips — the baked-in src
  // argument is kept only as a last-resort fallback for edge-cases.
  src = document.getElementById('modal-src')?.value
     || document.getElementById('new-src')?.value
     || src || currentSource || 'postgres';
  const key    = selectEl.value;
  const row    = selectEl.closest('.kv-row');
  const valEl  = row.querySelector('.kv-value');
  const custEl = row.querySelector('.kv-custom-key');

  if (key === '__custom__') {
    custEl.style.display = 'block';
    custEl.focus();
    valEl.value = '';
    return;
  }
  custEl.style.display = 'none';

  const meta = DBZ_PROPS[key];
  if (!meta) { valEl.value = ''; return; }
  const sample = meta.sample?.[src] ?? '';
  if (valEl.value === '' || valEl.value === valEl.dataset.lastSample) {
    valEl.value = sample;
  }
  valEl.dataset.lastSample = sample;
  valEl.title = meta.desc;
}

function kvRow(k='', v='', src='') {
  // Detect active source from modal if not passed
  if (!src) src = document.getElementById('modal-src')?.value || currentSource || 'postgres';
  const isCustom = k && !DBZ_PROPS[k];
  const selectVal = isCustom ? '__custom__' : k;
  const customDisplay = isCustom ? 'block' : 'none';
  return `<div class="kv-row">
    <div style="display:flex;flex-direction:column;flex:1;gap:3px">
      <select class="kv-input kv-key-select"
              onchange="_onKvKeyChange(this,'')"
              title="Select a property">${_dbzPropSelect(selectVal, src)}</select>
      <input  class="kv-input kv-custom-key"
              placeholder="custom.property.key"
              style="display:${customDisplay};font-size:11px;padding:3px 6px"
              value="${escHtml(isCustom ? k : '')}"/>
    </div>
    <input class="kv-input kv-value" placeholder="value" value="${escHtml(String(v))}"
           data-last-sample=""/>
    <button class="kv-del" onclick="this.parentElement.remove()">✕</button>
  </div>`;
}
function addKvRow() {
  const src = document.getElementById('modal-src')?.value || currentSource || 'postgres';
  const ed  = document.getElementById('kv-editor');
  ed.insertAdjacentHTML('beforeend', kvRow('', '', src));
}
function loadJsonToKv() {
  const raw = document.getElementById('modal-json').value.trim();
  if (!raw) return;
  try {
    const obj = JSON.parse(raw);
    const src = document.getElementById('modal-src')?.value || currentSource || 'postgres';
    const ed  = document.getElementById('kv-editor');
    ed.innerHTML = Object.entries(obj).filter(([k])=>k!=='name').map(([k,v])=>kvRow(k,v,src)).join('');
    toast('JSON applied to editor', 'info');
  } catch { toast('Invalid JSON', 'error'); }
}
function getKvConfig() {
  const rows = document.querySelectorAll('#kv-editor .kv-row');
  const cfg = {};
  rows.forEach(r => {
    const sel    = r.querySelector('.kv-key-select');
    const custom = r.querySelector('.kv-custom-key');
    const valEl  = r.querySelector('.kv-value');
    let k;
    if (sel) {
      // New-style row: key comes from select or custom input
      k = (sel.value === '__custom__' || sel.value === '')
        ? (custom?.value.trim() || '')
        : sel.value;
    } else {
      // Legacy plain-input row (should not appear but keep safe)
      k = r.querySelectorAll('.kv-input')[0]?.value.trim() || '';
    }
    const v = valEl ? valEl.value.trim() : (r.querySelectorAll('.kv-input')[1]?.value.trim() || '');
    if (k) cfg[k] = v;
  });
  return cfg;
}
async function saveConnector(src, oldName, isNew) {
  const actualSrc = isNew ? (document.getElementById('modal-src')?.value || src) : src;
  const name = isNew ? document.getElementById('modal-name')?.value?.trim() : oldName;
  if (!name) return toast('Connector name required', 'error');

  let cfg = getKvConfig();
  // if JSON field has content, prefer it
  const jsonRaw = document.getElementById('modal-json')?.value?.trim();
  if (jsonRaw) {
    try { cfg = JSON.parse(jsonRaw); } catch { return toast('Invalid JSON', 'error'); }
  }

  if (isNew) {
    const body = { name, config: cfg };
    const r = await apiPost(`/api/connectors/${actualSrc}`, body);
    if (r.ok) {
      toast(`Connector "${name}" created`, 'success');
      closeModal('conn-modal');
      currentSource = actualSrc;
      navigate('connectors');
    } else {
      toast(`Error: ${JSON.stringify(r.data).slice(0,120)}`, 'error');
    }
  } else {
    const r = await apiPut(`/api/connectors/${src}/${name}`, cfg);
    if (r.ok) {
      toast(`Connector "${name}" updated`, 'success');
      closeModal('conn-modal');
      loadConnectorList(src);
    } else {
      toast(`Error: ${JSON.stringify(r.data).slice(0,120)}`, 'error');
    }
  }
}

// Tracks whether the last preflight passed — used by createConnectorFromPage()
let _preflightOk = false;

async function loadTemplate() {
  const src = document.getElementById('new-src').value;
  const nameEl   = document.getElementById('new-name');
  const checkEl  = document.getElementById('new-connector-check');
  const ed       = document.getElementById('kv-editor-new');
  const jsonEl   = document.getElementById('new-json');
  const createBtn = document.querySelector('button[onclick="createConnectorFromPage()"]');

  // Reset preflight gate
  _preflightOk = false;
  if (createBtn) { createBtn.disabled = true; createBtn.style.opacity = '0.45'; createBtn.title = 'Preflight check pending…'; }

  // Default connector name
  const defaultNames = { postgres: 'postgres-cdc', oracle: 'oracle-cdc', mongodb: 'mongodb-cdc' };
  if (!nameEl.value) nameEl.value = defaultNames[src] || `${src}-cdc`;

  // Show loading state
  checkEl.innerHTML = `<div style="font-size:12px;color:#d29922;padding:8px 12px;background:#1a1500;border-radius:6px;border:1px solid #4a3800">
    ⏳ Checking Spark external catalog and credentials for ${SOURCE_LABELS[src]}…</div>`;
  ed.innerHTML = `<div style="color:#586374;font-size:12px;padding:8px">Loading…</div>`;

  // Run preflight, template fetch and existing-connector check in parallel
  const [preflightR, tmplR, existingR] = await Promise.all([
    apiGet(`/api/connectors/preflight/${src}`),
    apiGet(`/api/connectors/template/${src}`),
    apiGet(`/api/connectors/${src}`)
  ]);

  // ── Preflight result (hard gate) ──────────────────────────────────────────
  if (!preflightR.ok || preflightR.data?.ok === false) {
    const pfErr  = preflightR.data?.error  || 'Preflight check failed.';
    const pfAct  = preflightR.data?.action || '';
    checkEl.innerHTML = `
      <div style="font-size:12px;padding:12px 14px;background:#2a0f0f;border-radius:6px;border:1px solid #6a2020;color:#f85149;margin-bottom:6px">
        <div style="font-weight:700;margin-bottom:6px">🚫 Cannot create connector — pre-requisite missing</div>
        <div style="margin-bottom:6px">${escHtml(pfErr)}</div>
        ${pfAct ? `<div style="color:#d29922;font-size:11px;border-top:1px solid #4a2020;padding-top:6px;margin-top:4px">
          <b>Action required:</b> ${escHtml(pfAct)}</div>` : ''}
      </div>`;
    // Keep the KV editor empty / disabled so the user can see the error clearly
    ed.innerHTML = `<div style="color:#586374;font-size:12px;padding:8px">Resolve the pre-requisite above before configuring the connector.</div>`;
    jsonEl.value = '';
    // Leave Create button disabled
    return;
  }

  // Preflight passed — enable Create button
  _preflightOk = true;
  if (createBtn) { createBtn.disabled = false; createBtn.style.opacity = ''; createBtn.title = ''; }

  // ── Existing-connector info banner ────────────────────────────────────────
  const existing = existingR.ok ? Object.keys(existingR.data).filter(k => {
    const info = existingR.data[k];
    return info && typeof info === 'object' && 'status' in info;
  }) : [];

  if (existing.length > 0) {
    checkEl.innerHTML = `<div style="font-size:12px;padding:10px 14px;background:#0f2a1a;border-radius:6px;border:1px solid #1a4429;color:#56d364">
      ✓ <b>Existing connector(s) found:</b> ${existing.map(n=>`<code style="color:#4fc3f7">${n}</code>`).join(', ')}
      — Creating a new connector will add alongside these. Use <b>Edit Config</b> on the existing connector to modify it.
    </div>`;
  } else {
    checkEl.innerHTML = `<div style="font-size:12px;padding:10px 14px;background:#0d2a10;border-radius:6px;border:1px solid #1a4a20;color:#56d364">
      ✅ <b>Pre-requisites met</b> — Spark external catalog <code style="color:#4fc3f7">${escHtml(preflightR.data.catalog)}</code>
      found and credentials are present in OpenBao / debezium-credentials secret.
    </div>`;
  }

  // ── Template fetch warning (non-blocking) ─────────────────────────────────
  if (!tmplR.ok) {
    checkEl.innerHTML += `<div style="font-size:12px;color:#d29922;margin-top:6px;padding:8px 12px;background:#1a1500;border-radius:6px;border:1px solid #4a3800">
      ⚠ Could not load server template: ${escHtml((tmplR.data?.error||'unknown').slice(0,120))}. Using built-in fallback template — verify the values below before creating.</div>`;
  }

  // KV editor — strip schema.include.list so it comes only from the picker below
  const tmpl = tmplR.ok ? tmplR.data.template : (TEMPLATES[src] || {});
  const SCHEMA_KEY = src === 'mongodb' ? 'database.include.list' : 'schema.include.list';
  const kvEntries = Object.entries(tmpl).filter(([k]) => k !== SCHEMA_KEY);
  ed.innerHTML = kvEntries.map(([k,v]) => kvRowNew(k,v)).join('');
  jsonEl.value = JSON.stringify(tmpl, null, 2);

  // ── Schema / database picker ──────────────────────────────────────────────
  const schemaBodyEl  = document.getElementById('schema-pick-body');
  const schemaStatEl  = document.getElementById('schema-pick-status');
  schemaBodyEl.innerHTML = `<div style="color:#d29922;font-size:12px">⏳ Loading schemas…</div>`;
  schemaStatEl.innerHTML = '';

  const dbParam  = tmpl['database.dbname'] || 'cache_testing';
  const schemaR  = await apiGet(`/api/schemas/${src}?db=${encodeURIComponent(dbParam)}`);

  if (!schemaR.ok) {
    schemaBodyEl.innerHTML = `<div style="color:#f85149;font-size:12px">
      ⚠ Could not load schemas: ${escHtml((schemaR.data?.error||'unknown').slice(0,120))}</div>`;
    return;
  }

  const schemas      = schemaR.data.schemas || [];
  const schemaLabel  = src === 'mongodb' ? 'database' : 'schema';
  const defaultSel   = src === 'oracle'   ? 'CACHE_TESTING'
                     : src === 'mongodb'  ? 'cache_testing'
                     : 'public';

  schemaBodyEl.innerHTML = `
    <div style="display:flex;flex-wrap:wrap;gap:8px;padding:6px 0" id="schema-pick-list">
      ${schemas.map(s => `
        <label style="display:flex;align-items:center;gap:6px;padding:5px 10px;
                       background:${s===defaultSel?'rgba(79,195,247,.12)':'#0d1117'};
                       border:1px solid ${s===defaultSel?'#4fc3f7':'#1c2a3a'};
                       border-radius:6px;cursor:pointer;font-size:12px;color:#c9d1d9;
                       transition:border-color .15s" id="schema-chip-${escHtml(s)}">
          <input type="checkbox" value="${escHtml(s)}"
                 ${s === defaultSel ? 'checked' : ''}
                 style="accent-color:#4fc3f7"
                 onchange="schemaPickSync()"/>
          ${escHtml(s)}
        </label>`).join('')}
    </div>`;
  schemaStatEl.innerHTML = `<span style="color:#2ea043">✓ ${schemas.length} ${schemaLabel}(s) found</span>`;
  schemaPickSync();
}

// Keep the visual state of schema chips in sync and update the JSON textarea
function schemaPickSync() {
  const checked = [...document.querySelectorAll('#schema-pick-list input:checked')].map(i => i.value);
  // Sync chip border colours
  document.querySelectorAll('#schema-pick-list label').forEach(lbl => {
    const inp = lbl.querySelector('input');
    lbl.style.borderColor = inp.checked ? '#4fc3f7' : '#1c2a3a';
    lbl.style.background  = inp.checked ? 'rgba(79,195,247,.12)' : '#0d1117';
  });
  // Warn if nothing selected
  const statEl = document.getElementById('schema-pick-status');
  if (statEl) {
    statEl.innerHTML = checked.length === 0
      ? `<span style="color:#da3633">⚠ Select at least one schema</span>`
      : `<span style="color:#2ea043">✓ ${checked.length} selected: ${checked.map(s=>`<code style="color:#4fc3f7">${escHtml(s)}</code>`).join(', ')}</span>`;
  }
  // Reflect into JSON textarea so user can see the full config
  const jsonEl = document.getElementById('new-json');
  if (jsonEl && checked.length) {
    try {
      const obj = JSON.parse(jsonEl.value);
      const src = document.getElementById('new-src')?.value || 'postgres';
      const SCHEMA_KEY = src === 'mongodb' ? 'database.include.list' : 'schema.include.list';
      obj[SCHEMA_KEY] = checked.join(',');
      jsonEl.value = JSON.stringify(obj, null, 2);
    } catch { /* textarea may be empty or mid-edit — skip */ }
  }
}
// kvRowNew delegates to kvRow — same select/value UI, just reads src from new-src
function kvRowNew(k='', v='') {
  const src = document.getElementById('new-src')?.value || 'postgres';
  return kvRow(k, v, src);
}
function addKvRowNew() {
  const src = document.getElementById('new-src')?.value || 'postgres';
  document.getElementById('kv-editor-new').insertAdjacentHTML('beforeend', kvRow('', '', src));
}
function applyNewJson() {
  const raw = document.getElementById('new-json').value.trim();
  try {
    const obj = JSON.parse(raw);
    const src = document.getElementById('new-src')?.value || 'postgres';
    const ed  = document.getElementById('kv-editor-new');
    ed.innerHTML = Object.entries(obj).filter(([k])=>k!=='name').map(([k,v])=>kvRow(k,v,src)).join('');
    toast('JSON applied', 'info');
  } catch { toast('Invalid JSON', 'error'); }
}
function _getKvConfigFrom(editorId) {
  const cfg = {};
  document.querySelectorAll(`#${editorId} .kv-row`).forEach(r => {
    const sel    = r.querySelector('.kv-key-select');
    const custom = r.querySelector('.kv-custom-key');
    const valEl  = r.querySelector('.kv-value');
    let k = sel
      ? ((sel.value === '__custom__' || sel.value === '') ? (custom?.value.trim()||'') : sel.value)
      : (r.querySelectorAll('.kv-input')[0]?.value.trim()||'');
    const v = valEl ? valEl.value.trim() : (r.querySelectorAll('.kv-input')[1]?.value.trim()||'');
    if (k) cfg[k] = v;
  });
  return cfg;
}
async function createConnectorFromPage() {
  const src  = document.getElementById('new-src').value;
  const name = document.getElementById('new-name').value.trim();
  if (!name) return toast('Connector name required', 'error');

  // Hard gate: preflight must have passed for this source
  if (!_preflightOk) {
    toast('Cannot create connector — Spark external catalog or credentials are missing. See the error banner above.', 'error');
    return;
  }

  // prefer JSON editor
  let cfg;
  const jsonRaw = document.getElementById('new-json').value.trim();
  try { cfg = JSON.parse(jsonRaw); } catch { cfg = null; }
  if (!cfg) {
    cfg = _getKvConfigFrom('kv-editor-new');
  }

  // ── (a) Connector is always created STOPPED with no tables assigned ────────
  // The server immediately issues PUT /pause after creation — tasks.max=0 was
  // the old approach but Debezium rejects it as invalid (must be >= 1).
  // Strip include-lists here too; the server does the same as a safety net.
  delete cfg['table.include.list'];
  delete cfg['collection.include.list'];

  const body = { name, config: cfg };
  const r = await apiPost(`/api/connectors/${src}`, body);
  if (r.ok) {
    toast(`Connector "${name}" created — use "Assign Tables & Start" to begin CDC ✓`, 'success');
    currentSource = src;
    navigate('connectors');
  } else {
    // Show schema validation errors inline below the form, not just as a toast
    if (r.status === 422 && r.data?.error) {
      const checkEl = document.getElementById('new-connector-check');
      if (checkEl) {
        checkEl.innerHTML = `
          <div style="font-size:12px;padding:12px 14px;background:#2a0f0f;border-radius:6px;
                      border:1px solid #6a2020;color:#f85149;margin-bottom:6px">
            <div style="font-weight:700;margin-bottom:6px">🚫 Invalid configuration — connector not created</div>
            <div style="margin-bottom:6px">${escHtml(r.data.error)}</div>
            ${r.data.hint
              ? `<div style="color:#d29922;font-size:11px;border-top:1px solid #4a2020;padding-top:6px;margin-top:4px">
                   <b>Fix:</b> ${escHtml(r.data.hint)}</div>`
              : ''}
          </div>`;
        checkEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      toast(r.data.error.slice(0, 120), 'error');
    } else {
      const detail = r.data?.message || r.data?.error || JSON.stringify(r.data).slice(0, 200);
      toast(`Error creating connector: ${detail}`, 'error');
    }
  }
}

  document.getElementById('kq-pane').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runKafkaQuery(); }
  });

  _ksqlPingStatus();
  kqLoadTables(presetTopic);
}

// Load materialised table list from ksqlDB (backed by RocksDB)
async function kqLoadTables(presetTopic) {
  const r = await apiGet('/api/ksql/tables');
  const raw = r.data?.tables || [];
  _kqStreams = raw
    .filter(t => t.name && !t.name.startsWith('KSQL_'))
    .map(t => ({ name: t.name, streamName: t.streamName, topic: t.topic || '', state: t.state || 'RUNNING' }))
    .sort((a, b) => a.name.localeCompare(b.name));

  kqRenderStreamList(_kqStreams);

  // Auto-select: preset topic → derive table name, or first table
  if (presetTopic) {
    const derived = presetTopic.replace(/[^a-zA-Z0-9_]/g, '_').toUpperCase() + '_TBL';
    const match = _kqStreams.find(s => s.name === derived);
    if (match) { kqSelectStream(match.name, match.topic); return; }
  }
  if (_kqStreams.length > 0) kqSelectStream(_kqStreams[0].name, _kqStreams[0].topic);
}

// Render the sidebar table list, grouped by source
function kqRenderStreamList(tables) {
  const el = document.getElementById('kq-stream-list');
  if (!el) return;
  if (!tables.length) {
    el.innerHTML = `<div style="padding:20px 14px;color:#586374;font-size:12px">No tables found</div>`;
    return;
  }
  const groups = { postgres: [], oracle: [], mongodb: [], other: [] };
  for (const t of tables) {
    const n = t.name.toLowerCase();
    if (n.startsWith('postgres'))     groups.postgres.push(t);
    else if (n.startsWith('oracle'))  groups.oracle.push(t);
    else if (n.startsWith('mongodb')) groups.mongodb.push(t);
    else                              groups.other.push(t);
  }
  const srcMeta = {
    postgres: { label: '🐘 PostgreSQL', dot: 'kq-dot-pg' },
    oracle:   { label: '🔶 Oracle',     dot: 'kq-dot-ora' },
    mongodb:  { label: '🍃 MongoDB',    dot: 'kq-dot-mg' },
    other:    { label: '📦 Other',      dot: 'kq-dot-other' },
  };
  let html = '';
  for (const [grp, list] of Object.entries(groups)) {
    if (!list.length) continue;
    const { label, dot } = srcMeta[grp];
    html += `<div class="kq-stream-group-label">${label}</div>`;
    for (const t of list) {
      const isActive  = t.name === _kqActiveName;
      const isRunning = t.state === 'RUNNING';
      const shortName = t.name
        .replace(/^(POSTGRES_|ORACLE_|MONGODB_)/, '')
        .replace(/_TBL$/, '')
        .replace(/_/g, ' ');
      html += `<div class="kq-stream-item${isActive?' active':''}"
                    id="kq-item-${t.name}"
                    onclick="kqSelectStream('${t.name}','${t.topic}')">
        <span class="kq-stream-dot ${dot}"></span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
              title="${escHtml(t.name)}">${escHtml(shortName)}</span>
        <span class="kq-stream-badge ${isRunning?'kq-badge-table':'kq-badge-stream'}"
              title="${isRunning?'RocksDB RUNNING':'Building…'}">${isRunning?'TABLE':'⏳'}</span>
      </div>`;
    }
  }
  el.innerHTML = html;
}

// Filter sidebar by search text
function kqFilterStreams(q) {
  const lq = q.toLowerCase();
  document.querySelectorAll('.kq-stream-item').forEach(el => {
    const name = el.querySelector('span[title]')?.title || '';
    el.style.display = name.toLowerCase().includes(lq) ? '' : 'none';
  });
  // Show/hide group labels based on whether any item in group is visible
  document.querySelectorAll('.kq-stream-group-label').forEach(label => {
    let sib = label.nextElementSibling;
    let anyVisible = false;
    while (sib && sib.classList.contains('kq-stream-item')) {
      if (sib.style.display !== 'none') anyVisible = true;
      sib = sib.nextElementSibling;
    }
    label.style.display = anyVisible ? '' : 'none';
  });
}

// Select a stream: highlight sidebar + auto-fill SQL editor
function kqSelectStream(name, topic) {
  _kqActiveName = name;
  // Update sidebar highlight
  document.querySelectorAll('.kq-stream-item').forEach(el =>
    el.classList.toggle('active', el.id === 'kq-item-' + name)
  );
  // Scroll selected item into view
  const active = document.getElementById('kq-item-' + name);
  if (active) active.scrollIntoView({ block: 'nearest' });
  // Build SQL
  kqRebuildSQL();
}

// Update the display bar to reflect current table + where clause
function kqRebuildSQL() {
  const limit = document.getElementById('kq-limit')?.value || '20';
  const where = document.getElementById('kq-where')?.value?.trim() || '';
  const disp  = document.getElementById('kq-sql-display');
  if (!disp) return;
  if (!_kqActiveName) {
    disp.innerHTML = `<span style="color:#586374">← Select a table to query via RocksDB</span>`;
    return;
  }
  const streamName = _kqActiveName.replace(/_TBL$/, '');
  let html =
    `<span style="color:#c084fc;font-weight:600">SELECT</span>` +
    `<span style="color:#586374"> * FROM </span>` +
    `<span style="color:#4fc3f7;font-weight:700">${escHtml(_kqActiveName)}</span>` +
    `<span style="color:#586374"> LIMIT </span>` +
    `<span style="color:#e6edf3;font-weight:700">${limit}</span>`;
  if (where) {
    html += `<span style="color:#586374"> WHERE </span>` +
            `<span style="color:#d29922;font-weight:600">${escHtml(where)}</span>`;
  }
  disp.innerHTML = html;
}

function kqClear() {
  _kqActiveName = '';
  document.querySelectorAll('.kq-stream-item').forEach(el => el.classList.remove('active'));
  const w = document.getElementById('kq-where');
  if (w) w.value = '';
  kqRebuildSQL();
  const st = document.getElementById('kq-status');
  if (st) st.textContent = 'Ready — select a stream on the left';
  const res = document.getElementById('kq-results');
  if (res) res.innerHTML = `<div class="kq-hint">
    <div>▸ Click any stream on the left → instantly preview its latest messages</div>
    <div>▸ Use <b>WHERE</b> to filter: <b>id = 123</b> · <b>email LIKE %gmail%</b> · <b>status != deleted</b></div>
    <div>▸ <b>Ctrl+Enter</b> or <b>▶ Run Query</b> to fetch</div>
  </div>`;
}

// runKafkaQuery — pull query against RocksDB materialised table via /api/ksql/table-query
// Returns instantly regardless of topic size — RocksDB lookup, not topic scan.
async function runKafkaQuery() {
  if (!_kqActiveName) return toast('Select a table first', 'warn');

  const limit = parseInt(document.getElementById('kq-limit')?.value || '20', 10);
  const where = document.getElementById('kq-where')?.value?.trim() || '';
  // streamName = table name without _TBL suffix
  const streamName = _kqActiveName.replace(/_TBL$/, '');

  const statusEl  = document.getElementById('kq-status');
  const resultsEl = document.getElementById('kq-results');
  if (statusEl)  statusEl.innerHTML = `<span style="color:#586374">⏳ Querying RocksDB…</span>`;
  if (resultsEl) resultsEl.innerHTML = '';

  const t0 = Date.now();
  const r  = await apiPost('/api/ksql/table-query', { streamName, limit, where });
  const elapsed = ((Date.now() - t0) / 1000).toFixed(1);

  const { columns = [], rows = [], error, tableName, scanned, matched } = r.data || {};

  if (!r.ok || error) {
    if (statusEl) statusEl.innerHTML =
      `<span style="color:#da3633">⚠ ${escHtml((error || 'Failed').slice(0, 300))}</span>`;
    if (resultsEl) resultsEl.innerHTML =
      `<div class="kq-error">${escHtml((error || 'Failed').slice(0, 500))}</div>`;
    return;
  }

  const whereNote = where ? ` · WHERE matched ${matched} of ${scanned} scanned` : '';
  if (statusEl) statusEl.innerHTML =
    `<span style="color:#2ea043">✓ ${rows.length} row(s)</span>` +
    ` <span style="color:#586374">· <b>${escHtml(tableName||_kqActiveName)}</b> · ${elapsed}s${whereNote}</span>`;

  if (!rows.length) {
    if (resultsEl) resultsEl.innerHTML = `<div class="kq-empty">` +
      (where ? `No rows matched <b>${escHtml(where)}</b> in <b>${escHtml(tableName||_kqActiveName)}</b>.`
             : `No rows in <b>${escHtml(tableName||_kqActiveName)}</b>.`) +
      `</div>`;
    return;
  }

  // _payload hidden in table, shown in expand; _op gets colour badge
  const displayCols = columns.filter(c => c !== '_payload');
  const payIdx      = columns.indexOf('_payload');

  let rowIdx = 0;
  const tableRows = rows.map(row => {
    const idx     = rowIdx++;
    const rawPay  = payIdx >= 0 ? row[payIdx] : null;
    const cells   = displayCols.map(col => {
      const ci = columns.indexOf(col);
      const v  = row[ci];
      if (col === '_op') {
        const op = v || 'r';
        const opCls   = op==='c'?'op-c':op==='u'?'op-u':op==='d'?'op-d':'op-r';
        const opLabel = op==='c'?'INSERT':op==='u'?'UPDATE':op==='d'?'DELETE':op==='r'?'READ':String(op).toUpperCase();
        return `<td><span class="msg-op ${opCls}">${opLabel}</span></td>`;
      }
      if (v === null || v === undefined) return `<td class="null-val">null</td>`;
      const sv = String(v);
      return `<td style="font-size:12px" title="${escHtml(sv)}">${escHtml(sv.slice(0,120))}${sv.length>120?'…':''}</td>`;
    }).join('');

    let expandContent = '';
    try { expandContent = syntaxHighlight(JSON.stringify(JSON.parse(rawPay||'{}'), null, 2)); }
    catch { expandContent = escHtml(rawPay||''); }

    return `<tr onclick="toggleMsgDetail(${idx})" style="cursor:pointer">${cells}</tr>
      <tr id="detail-${idx}" style="display:none">
        <td colspan="${displayCols.length}" style="padding:0">
          <pre style="background:#06090f;padding:12px 16px;margin:0;font-size:11px;
            color:#8b949e;white-space:pre-wrap;word-break:break-all">${expandContent}</pre>
        </td>
      </tr>`;
  }).join('');

  const thead = `<thead><tr>${displayCols.map(k =>
    `<th>${escHtml(k==='_op'?'OP':k==='_rowkey'?'ROWKEY':k)}</th>`).join('')}</tr></thead>`;

  if (resultsEl) resultsEl.innerHTML = `
  <div style="overflow-x:auto">
    <table class="qs-data-table" style="min-width:100%">
      ${thead}<tbody>${tableRows}</tbody>
    </table>
  </div>
  <div style="font-size:11px;color:#586374;padding:6px 14px;border-top:1px solid #1c2a3a">
    ${rows.length} row(s) · Click a row to expand full payload JSON
  </div>`;
}

function toggleMsgDetail(idx) {
  const row = document.getElementById(`detail-${idx}`);
  if (row) row.style.display = row.style.display === 'none' ? '' : 'none';
}

function toggleMsg(el) { el.classList.toggle('expanded'); }

// Ordered write-mode keys for the streaming page tabs
const STREAM_MODES = ['standard', 'soft-delete', 'history-tracking'];
const STREAM_MODE_LABELS = {
  'standard':         'Standard',
  'soft-delete':      'Soft Delete',
  'history-tracking': 'History Tracking',
};
let currentStreamingMode = 'standard';

async function renderStreaming() {
  const c = document.getElementById('content');
  c.innerHTML = `<div style="color:#586374;padding:40px;text-align:center">Loading…</div>`;

  const r = await apiGet('/api/streaming/deployments');
  const deploys = r.data?.items || [];

  if (!deploys.length) {
    c.innerHTML = `<div class="card" style="text-align:center;color:#586374;padding:32px">No streaming deployments found.</div>`;
    return;
  }

  // Group deployments by pipeline.write-mode label
  const groups = {};
  for (const d of deploys) {
    const mode = (d.metadata.labels || {})['pipeline.write-mode'] || 'other';
    if (!groups[mode]) groups[mode] = [];
    groups[mode].push(d);
  }

  // Determine which tab to show — default to 'standard', or first available
  const availableModes = STREAM_MODES.filter(m => groups[m]);
  if (!availableModes.length) availableModes.push(...Object.keys(groups));
  if (!groups[currentStreamingMode]) currentStreamingMode = availableModes[0] || 'standard';

  function buildStreamingRows(mode) {
    const modeDeploys = groups[mode] || [];
    if (!modeDeploys.length) {
      return `<tr><td colspan="5" style="text-align:center;color:#586374;padding:24px">
        No streaming jobs found for ${STREAM_MODE_LABELS[mode] || mode}.
      </td></tr>`;
    }
    return modeDeploys.map(d => {
      const name    = d.metadata.name;
      const labels  = d.metadata.labels || {};
      const src     = labels['pipeline.source'] || '—';
      const ready   = d.status?.readyReplicas || 0;
      const desired = d.spec?.replicas || 0;
      const st = desired === 0 ? 'STOPPED' : ready > 0 ? 'RUNNING' : 'STARTING';
      return `<tr id="row-${name}">
        <td><code style="font-size:12px;color:#c9d1d9">${escHtml(name)}</code></td>
        <td>${stateBadge(st)}</td>
        <td style="color:#586374;font-size:11px">${ready}/${desired} pods</td>
        <td>
          <div class="btn-group">
            ${desired === 0
              ? `<button class="btn btn-success btn-sm" onclick="scaleJob('${escHtml(name)}',1)">▶ Start</button>`
              : `<button class="btn btn-danger btn-sm" onclick="scaleJob('${escHtml(name)}',0)">⏹ Stop</button>`}
            <button class="btn btn-warn btn-sm" onclick="restartJob('${escHtml(name)}')">↻ Restart</button>
            <button class="btn btn-secondary btn-sm" onclick="showJobLogs('${escHtml(name)}')">📋 Logs</button>
          </div>
        </td>
        <td>
          <button class="btn btn-secondary btn-sm" onclick="openJobConfig('${escHtml(name)}')">⚙ Configure</button>
        </td>
      </tr>`;
    }).join('');
  }

  function buildStreamingTabs() {
    return availableModes.map(mode => {
      const modeDeploys = groups[mode] || [];
      const anyFailed  = modeDeploys.some(d => {
        const desired = d.spec?.replicas || 0;
        const ready   = d.status?.readyReplicas || 0;
        return desired > 0 && ready === 0;
      });
      const allStopped = modeDeploys.every(d => (d.spec?.replicas || 0) === 0);
      const dotColor = allStopped ? '#586374' : anyFailed ? '#e3b341' : '#2ea043';
      return `<div class="src-tab ${mode===currentStreamingMode?'active':''}"
                   onclick="switchStreamingMode('${mode}')">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;
                     background:${dotColor};margin-right:4px;vertical-align:middle"></span>
        ${STREAM_MODE_LABELS[mode] || mode}
        <span style="font-size:10px;color:#586374;margin-left:4px">(${modeDeploys.length})</span>
      </div>`;
    }).join('');
  }

  c.innerHTML = `
    <div class="source-tabs" id="streaming-mode-tabs">${buildStreamingTabs()}</div>
    <div class="card">
      <div class="card-header">
        <div class="card-title">🌊 ${STREAM_MODE_LABELS[currentStreamingMode] || currentStreamingMode} Jobs</div>
        <div class="btn-group">
          <button class="btn btn-secondary btn-sm" onclick="renderStreaming()">↻ Refresh</button>
          <button class="btn btn-success btn-sm" onclick="scaleModeJobs(currentStreamingMode,1)">▶ Start All</button>
          <button class="btn btn-danger btn-sm" onclick="scaleModeJobs(currentStreamingMode,0)">⏹ Stop All</button>
        </div>
      </div>
      <table class="data-table">
        <thead><tr><th>Deployment</th><th>Status</th><th>Pods</th><th>Actions</th><th>Config</th></tr></thead>
        <tbody id="streaming-body">${buildStreamingRows(currentStreamingMode)}</tbody>
      </table>
    </div>
    <div id="log-panel"></div>`;

  // store groups for tab switching without re-fetching
  window._streamingGroups = groups;
}

function switchStreamingMode(mode) {
  currentStreamingMode = mode;
  const groups = window._streamingGroups || {};
  const tabsEl = document.getElementById('streaming-mode-tabs');
  if (tabsEl) {
    tabsEl.innerHTML = STREAM_MODES.filter(m => groups[m]).map(m => {
      const modeDeploys = groups[m] || [];
      const anyFailed  = modeDeploys.some(d => (d.spec?.replicas||0) > 0 && (d.status?.readyReplicas||0) === 0);
      const allStopped = modeDeploys.every(d => (d.spec?.replicas||0) === 0);
      const dotColor = allStopped ? '#586374' : anyFailed ? '#e3b341' : '#2ea043';
      return `<div class="src-tab ${m===mode?'active':''}" onclick="switchStreamingMode('${m}')">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;
                     background:${dotColor};margin-right:4px;vertical-align:middle"></span>
        ${STREAM_MODE_LABELS[m] || m}
        <span style="font-size:10px;color:#586374;margin-left:4px">(${modeDeploys.length})</span>
      </div>`;
    }).join('');
  }
  const titleEl = document.querySelector('#streaming-mode-tabs ~ .card .card-title');
  if (titleEl) titleEl.textContent = `🌊 ${STREAM_MODE_LABELS[mode] || mode} Jobs`;
  const bodyEl = document.getElementById('streaming-body');
  if (!bodyEl) return;
  const modeDeploys = groups[mode] || [];
  if (!modeDeploys.length) {
    bodyEl.innerHTML = `<tr><td colspan="4" style="text-align:center;color:#586374;padding:24px">
      No streaming jobs found for ${STREAM_MODE_LABELS[mode] || mode}.
    </td></tr>`;
    return;
  }
  bodyEl.innerHTML = modeDeploys.map(d => {
    const name    = d.metadata.name;
    const labels  = d.metadata.labels || {};
    const ready   = d.status?.readyReplicas || 0;
    const desired = d.spec?.replicas || 0;
    const st = desired === 0 ? 'STOPPED' : ready > 0 ? 'RUNNING' : 'STARTING';
    return `<tr id="row-${name}">
      <td><code style="font-size:12px;color:#c9d1d9">${escHtml(name)}</code></td>
      <td>${stateBadge(st)}</td>
      <td style="color:#586374;font-size:11px">${ready}/${desired} pods</td>
      <td>
        <div class="btn-group">
          ${desired === 0
            ? `<button class="btn btn-success btn-sm" onclick="scaleJob('${escHtml(name)}',1)">▶ Start</button>`
            : `<button class="btn btn-danger btn-sm" onclick="scaleJob('${escHtml(name)}',0)">⏹ Stop</button>`}
          <button class="btn btn-warn btn-sm" onclick="restartJob('${escHtml(name)}')">↻ Restart</button>
          <button class="btn btn-secondary btn-sm" onclick="showJobLogs('${escHtml(name)}')">📋 Logs</button>
        </div>
      </td>
      <td><button class="btn btn-secondary btn-sm" onclick="openJobConfig('${escHtml(name)}')">⚙ Configure</button></td>
    </tr>`;
  }).join('');
}

async function scaleModeJobs(mode, replicas) {
  const groups = window._streamingGroups || {};
  const deps   = groups[mode] || [];
  if (!deps.length) return toast(`No streaming jobs for ${STREAM_MODE_LABELS[mode] || mode}`, 'warn');
  await Promise.all(deps.map(d => apiPost(`/api/streaming/${d.metadata.name}/scale`, { replicas })));
  toast(`All ${STREAM_MODE_LABELS[mode] || mode} jobs scaled to ${replicas}`, 'success');
  setTimeout(renderStreaming, 1500);
}

async function scaleJob(name, replicas) {
  const r = await apiPost(`/api/streaming/${name}/scale`, { replicas });
  toast(r.ok ? `${name} scaled to ${replicas}` : `Scale failed: ${JSON.stringify(r.data).slice(0,80)}`,
        r.ok ? 'success' : 'error');
  setTimeout(renderStreaming, 1500);
}
async function restartJob(name) {
  const r = await apiPost(`/api/streaming/${name}/restart`);
  toast(r.ok ? `${name} restarted` : `Restart failed`, r.ok ? 'success' : 'error');
  setTimeout(renderStreaming, 1500);
}
async function scaleAll(replicas) {
  const r = await apiGet('/api/streaming/deployments');
  const deploys = r.data?.items || [];
  await Promise.all(deploys.map(d => apiPost(`/api/streaming/${d.metadata.name}/scale`, { replicas })));
  toast(`All jobs scaled to ${replicas}`, 'success');
  setTimeout(renderStreaming, 1500);
}

      <div class="modal-title">⚙ Configure: <code style="color:#4fc3f7">${escHtml(name)}</code></div>
      <button class="modal-close" onclick="document.getElementById('job-config-overlay').remove()">✕</button>
    </div>

    <!-- Tabs -->
    <div style="display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid #1c2a3a;padding-bottom:0">
      <button id="jctab-tables" onclick="jcSwitchTab('tables')"
        style="padding:7px 18px;border:none;background:rgba(79,195,247,.15);border-bottom:2px solid #4fc3f7;
               color:#4fc3f7;font-size:13px;font-weight:600;cursor:pointer;border-radius:6px 6px 0 0">
        📋 Tables
      </button>
      <button id="jctab-params" onclick="jcSwitchTab('params')"
        style="padding:7px 18px;border:none;background:transparent;border-bottom:2px solid transparent;
               color:#8b949e;font-size:13px;font-weight:600;cursor:pointer;border-radius:6px 6px 0 0">
        ⚙ Parameters
      </button>
    </div>

    <div id="jc-body">
      <div style="color:#586374;padding:30px;text-align:center">⏳ Loading…</div>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

  await jcLoadTab('tables');
}

function jcSwitchTab(tab) {
  _jobConfigTab = tab;
  ['tables','params'].forEach(t => {
    const btn = document.getElementById('jctab-' + t);
    if (!btn) return;
    const active = t === tab;
    btn.style.background    = active ? 'rgba(79,195,247,.15)' : 'transparent';
    btn.style.borderBottom  = active ? '2px solid #4fc3f7' : '2px solid transparent';
    btn.style.color         = active ? '#4fc3f7' : '#8b949e';
  });
  jcLoadTab(tab);
}

async function jcLoadTab(tab) {
  const body = document.getElementById('jc-body');
  if (!body) return;
  if (tab === 'tables') {
    await jcRenderTables(body);
  } else {
    await jcRenderParams(body);
  }
}

// ── Tables tab ────────────────────────────────────────────────────────────────
// Shows Kafka topics for this job. When TABLE_FILTER is blank the job processes
// ALL topics — user can pin specific ones. When a filter is set, shows active
// (pinned) topics with a remove button, and a dropdown to add more from the pool.
// Saves by patching TABLE_FILTER env var on the deployment — NO restart triggered.
// Changes take effect on next Stop/Start.

let _jcTopicData = null; // { topics, tableFilter, sources } cached per modal open

async function jcRenderTables(body) {
  body.innerHTML = `<div style="color:#586374;padding:20px;text-align:center">⏳ Loading topics…</div>`;

  const r = await apiGet(`/api/streaming/${_jobConfigName}/topics`);
  if (!r.ok) {
    body.innerHTML = `<div style="color:#ff7b72;padding:20px;text-align:center">Failed to load topics: ${escHtml(r.data?.error||'unknown')}</div>`;
    return;
  }

  _jcTopicData = r.data; // { topics: string[], tableFilter: string[], sources: string[] }
  _jcRedrawTopics(body);
}

function _jcRedrawTopics(body) {
  const { topics, tableFilter } = _jcTopicData;
  const filterActive = tableFilter.length > 0;

  // Topics currently active = filterActive ? only those in tableFilter : all topics
  const activeTopic  = filterActive ? topics.filter(t => tableFilter.includes(t)) : [...topics];
  // Topics available to add  = all topics not already active
  const available    = topics.filter(t => !activeTopic.includes(t));

  const srcColors = { postgres:'#79c0ff', oracle:'#ff7b72', mongodb:'#56d364' };
  const getSrcColor = t => {
    for (const [src, col] of Object.entries(srcColors)) if (t.startsWith(src+'.')) return col;
    return '#8b949e';
  };

  const activeRows = activeTopic.map(t => {
    const tablePart = t.split('.').slice(2).join('.') || t;
    const col = getSrcColor(t);
    return `<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;
                 background:#06090f;border:1px solid #1c2a3a;border-radius:6px;margin-bottom:4px"
                 id="jct-row-${escHtml(t)}">
      <span style="width:8px;height:8px;border-radius:50%;background:${col};flex-shrink:0"></span>
      <code style="font-size:12px;color:#c9d1d9;flex:1">${escHtml(t)}</code>
      <span style="font-size:10px;color:#586374;margin-right:6px">→ <b style="color:#8b949e">${escHtml(tablePart)}</b></span>
      <button onclick="jcRemoveTopic('${escHtml(t)}')"
              style="padding:2px 8px;font-size:11px;border:1px solid #3d1f1f;border-radius:4px;
                     background:#1f0d0d;color:#ff7b72;cursor:pointer">✕ Remove</button>
    </div>`;
  }).join('');

  const addDropdown = available.length ? `
    <div style="display:flex;gap:8px;align-items:center;margin-top:12px">
      <select id="jct-add-sel" style="flex:1;padding:6px 10px;background:#0d1117;border:1px solid #30363d;
              border-radius:6px;color:#c9d1d9;font-size:12px;font-family:'Fira Code',monospace">
        <option value="">— select topic to add —</option>
        ${available.map(t => `<option value="${escHtml(t)}">${escHtml(t)}</option>`).join('')}
      </select>
      <button onclick="jcAddTopic()"
              style="padding:6px 14px;background:#1a3a1a;border:1px solid #1a4429;border-radius:6px;
                     color:#56d364;font-size:12px;cursor:pointer;white-space:nowrap">➕ Add</button>
    </div>` : `<div style="font-size:12px;color:#586374;margin-top:12px">All available topics are already active.</div>`;

  const infoMsg = filterActive
    ? `<b style="color:#e3b341">Filtered mode:</b> only the ${activeTopic.length} topic(s) below are processed by this job.
       Remove all to revert to <b>ALL topics</b> mode.`
    : `<b style="color:#4fc3f7">All topics mode:</b> this job processes <b>all ${topics.length}</b> Kafka topic(s) for its source(s).
       Add a topic below to switch to filtered mode (only listed topics will be processed).`;

  body.innerHTML = `
  <div style="margin-bottom:14px;padding:10px 14px;background:#0d1a2e;border:1px solid #1c2a3a;
              border-radius:6px;font-size:12px;color:#8b949e;line-height:1.7">
    ${infoMsg}
  </div>

  <div style="font-size:11px;font-weight:700;color:#4fc3f7;text-transform:uppercase;
              letter-spacing:.5px;margin-bottom:8px">
    Active Topics (${activeTopic.length})
  </div>

  <div id="jct-active-list">
    ${activeRows || `<div style="color:#586374;font-size:12px;padding:8px 0">No topics active — job is in ALL-topics mode.</div>`}
  </div>

  ${addDropdown}

  <div style="display:flex;gap:10px;justify-content:flex-end;padding-top:16px;margin-top:8px;border-top:1px solid #1c2a3a">
    <button class="btn btn-secondary" onclick="document.getElementById('job-config-overlay').remove()">Cancel</button>
    <button class="btn btn-primary" onclick="jcSaveTopics()">💾 Save  <span style="font-size:10px;opacity:.7">(takes effect on next Stop/Start)</span></button>
  </div>`;
}

function jcAddTopic() {
  const sel = document.getElementById('jct-add-sel');
  const topic = sel?.value;
  if (!topic) return;
  // If currently in all-topics mode, seed the filter with ALL existing topics
  // first — this is what makes Remove work correctly afterward too.
  if (_jcTopicData.tableFilter.length === 0) {
    _jcTopicData.tableFilter = [..._jcTopicData.topics];
  }
  if (!_jcTopicData.tableFilter.includes(topic)) {
    _jcTopicData.tableFilter.push(topic);
  }
  const body = document.getElementById('jc-body');
  if (body) _jcRedrawTopics(body);
}

function jcRemoveTopic(topic) {
  if (!_jcTopicData) return;
  // In all-topics mode (tableFilter empty), seed the filter with ALL topics
  // first so removing one actually switches us into filtered mode.
  if (_jcTopicData.tableFilter.length === 0) {
    _jcTopicData.tableFilter = [..._jcTopicData.topics];
  }
  _jcTopicData.tableFilter = _jcTopicData.tableFilter.filter(t => t !== topic);
  const body = document.getElementById('jc-body');
  if (body) _jcRedrawTopics(body);
}

async function jcSaveTopics() {
  if (!_jcTopicData) return;
  const filterVal = _jcTopicData.tableFilter.join(',');
  const r = await fetch(`/api/streaming/${_jobConfigName}/env`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      set: [{ name: 'TABLE_FILTER', value: filterVal }],
      del: filterVal ? [] : ['TABLE_FILTER'],
    }),
  });
  if (!r.ok) { toast('Failed to save table filter', 'error'); return; }
  const msg = filterVal
    ? `✓ Table filter saved — ${_jcTopicData.tableFilter.length} topic(s) pinned. Takes effect on next Stop/Start.`
    : `✓ Table filter cleared — job will process ALL topics on next Stop/Start.`;
  toast(msg, 'success');
  document.getElementById('job-config-overlay')?.remove();
}

// ── Parameters tab ────────────────────────────────────────────────────────────
// Two sections:
//   • Shared ConfigMap params — apply to ALL jobs (dropdown to add, delete row)
//   • Job-specific env overrides — apply to this job only (same UX)
// Save writes to k8s immediately but does NOT restart — changes take effect on
// next Stop/Start of the job.

// Working copies for the params tab (mutated in-memory, flushed on Save)
let _jcCmRows  = [];  // [{ key, value }]  shared ConfigMap entries being edited
let _jcEnvRows = [];  // [{ key, value }]  job-specific env entries being edited

async function jcRenderParams(body) {
  body.innerHTML = `<div style="color:#586374;padding:20px;text-align:center">⏳ Loading parameters…</div>`;

  const [cfR, envR] = await Promise.all([
    apiGet('/api/streaming/configmap'),
    apiGet(`/api/streaming/${_jobConfigName}/env`),
  ]);

  const cmData  = cfR.data?.data  || {};
  const envVars = envR.data?.env  || [];

  // Seed working copies from live data
  _jcCmRows  = JOB_PARAMS
    .filter(p => cmData[p.key] !== undefined && cmData[p.key] !== '')
    .map(p => ({ key: p.key, value: cmData[p.key] }));

  const directEnv = {};
  for (const e of envVars) { if (e.value !== undefined) directEnv[e.name] = e.value; }
  _jcEnvRows = JOB_DIRECT_ENV
    .filter(p => directEnv[p.key] !== undefined && directEnv[p.key] !== '')
    .map(p => ({ key: p.key, value: directEnv[p.key] }));

  _jcRedrawParams(body);
}

function _jcRedrawParams(body) {
  const cmRowsHtml = _jcCmRows.map((r, i) => {
    const meta = JOB_PARAMS.find(p => p.key === r.key) || { label: r.key, desc: '', type: 'text' };
    return `<tr id="jcp-cm-row-${i}">
      <td style="padding:6px 10px;font-size:12px;color:#e6edf3;font-weight:600;white-space:nowrap">
        ${escHtml(meta.label)}<br><code style="font-size:10px;color:#586374">${escHtml(r.key)}</code></td>
      <td style="padding:6px 10px">
        <input class="form-input" style="font-size:12px;font-family:'Fira Code',monospace" type="text"
               value="${escHtml(r.value)}" placeholder="${escHtml(meta.desc)}"
               oninput="_jcCmRows[${i}].value=this.value"/>
      </td>
      <td style="padding:6px 10px;font-size:11px;color:#586374">${escHtml(meta.desc)}</td>
      <td style="padding:6px 10px">
        <button onclick="_jcDeleteCmRow(${i})"
                style="padding:2px 8px;font-size:11px;border:1px solid #3d1f1f;border-radius:4px;
                       background:#1f0d0d;color:#ff7b72;cursor:pointer">✕</button>
      </td>
    </tr>`;
  }).join('');

  // Dropdown: only params not already in the list
  const usedCmKeys = new Set(_jcCmRows.map(r => r.key));
  const cmAddOptions = JOB_PARAMS
    .filter(p => !usedCmKeys.has(p.key))
    .map(p => `<option value="${escHtml(p.key)}">${escHtml(p.label)} — ${escHtml(p.desc)}</option>`)
    .join('');

  const envRowsHtml = _jcEnvRows.map((r, i) => {
    const meta = JOB_DIRECT_ENV.find(p => p.key === r.key) || { label: r.key, desc: '', readonly: false };
    const ro   = meta.readonly ? 'readonly style="opacity:.5;cursor:not-allowed"' : '';
    return `<tr id="jcp-env-row-${i}">
      <td style="padding:6px 10px;font-size:12px;color:#e6edf3;font-weight:600;white-space:nowrap">
        ${escHtml(meta.label)}<br><code style="font-size:10px;color:#586374">${escHtml(r.key)}</code></td>
      <td style="padding:6px 10px">
        <input class="form-input" style="font-size:12px;font-family:'Fira Code',monospace" type="text"
               value="${escHtml(r.value)}" placeholder="${escHtml(meta.desc)}" ${ro}
               oninput="_jcEnvRows[${i}].value=this.value"/>
      </td>
      <td style="padding:6px 10px;font-size:11px;color:#586374">${escHtml(meta.desc)}</td>
      <td style="padding:6px 10px">
        ${meta.readonly ? '' : `<button onclick="_jcDeleteEnvRow(${i})"
                style="padding:2px 8px;font-size:11px;border:1px solid #3d1f1f;border-radius:4px;
                       background:#1f0d0d;color:#ff7b72;cursor:pointer">✕</button>`}
      </td>
    </tr>`;
  }).join('');

  const usedEnvKeys = new Set(_jcEnvRows.map(r => r.key));
  const envAddOptions = JOB_DIRECT_ENV
    .filter(p => !p.readonly && !usedEnvKeys.has(p.key))
    .map(p => `<option value="${escHtml(p.key)}">${escHtml(p.label)} — ${escHtml(p.desc)}</option>`)
    .join('');

  body.innerHTML = `
  <div style="margin-bottom:14px;padding:10px 14px;background:#0d1a2e;border:1px solid #1c2a3a;border-radius:6px;font-size:12px;color:#8b949e;line-height:1.6">
    <b style="color:#4fc3f7">Shared</b> parameters (ConfigMap) apply to <b>all</b> jobs. &nbsp;
    <b style="color:#d29922">Job-specific</b> overrides apply only to <b>${escHtml(_jobConfigName)}</b>.<br>
    Changes are saved immediately but take effect on the <b>next Stop/Start</b> of the job.
  </div>

  <!-- Shared ConfigMap params -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
    <div style="font-size:11px;font-weight:700;color:#4fc3f7;text-transform:uppercase;letter-spacing:.5px">
      Shared Parameters — all jobs (${_jcCmRows.length})
    </div>
  </div>
  <table style="width:100%;border-collapse:collapse;margin-bottom:8px">
    <thead><tr style="border-bottom:1px solid #1c2a3a">
      <th style="text-align:left;padding:5px 10px;font-size:10px;color:#586374;text-transform:uppercase">Parameter</th>
      <th style="text-align:left;padding:5px 10px;font-size:10px;color:#586374;text-transform:uppercase">Value</th>
      <th style="text-align:left;padding:5px 10px;font-size:10px;color:#586374;text-transform:uppercase">Description</th>
      <th style="width:36px"></th>
    </tr></thead>
    <tbody id="jcp-cm-tbody">
      ${cmRowsHtml || `<tr><td colspan="4" style="padding:12px 10px;color:#586374;font-size:12px">No shared parameters set — add one below.</td></tr>`}
    </tbody>
  </table>
  ${cmAddOptions ? `
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:20px">
    <select id="jcp-cm-add-sel" style="flex:1;padding:6px 10px;background:#0d1117;border:1px solid #30363d;
            border-radius:6px;color:#c9d1d9;font-size:12px">
      <option value="">— pick a shared parameter to add —</option>
      ${cmAddOptions}
    </select>
    <button onclick="_jcAddCmRow()"
            style="padding:6px 14px;background:#1a3a1a;border:1px solid #1a4429;border-radius:6px;
                   color:#56d364;font-size:12px;cursor:pointer;white-space:nowrap">➕ Add</button>
  </div>` : `<div style="font-size:12px;color:#586374;margin-bottom:20px">All shared parameters are already configured.</div>`}

  <!-- Job-specific env overrides -->
  <div style="font-size:11px;font-weight:700;color:#d29922;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">
    Job-Specific Overrides — ${escHtml(_jobConfigName)} only (${_jcEnvRows.length})
  </div>
  <table style="width:100%;border-collapse:collapse;margin-bottom:8px">
    <thead><tr style="border-bottom:1px solid #1c2a3a">
      <th style="text-align:left;padding:5px 10px;font-size:10px;color:#586374;text-transform:uppercase">Env Var</th>
      <th style="text-align:left;padding:5px 10px;font-size:10px;color:#586374;text-transform:uppercase">Value</th>
      <th style="text-align:left;padding:5px 10px;font-size:10px;color:#586374;text-transform:uppercase">Description</th>
      <th style="width:36px"></th>
    </tr></thead>
    <tbody id="jcp-env-tbody">
      ${envRowsHtml || `<tr><td colspan="4" style="padding:12px 10px;color:#586374;font-size:12px">No job-specific overrides set — add one below.</td></tr>`}
    </tbody>
  </table>
  ${envAddOptions ? `
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:20px">
    <select id="jcp-env-add-sel" style="flex:1;padding:6px 10px;background:#0d1117;border:1px solid #30363d;
            border-radius:6px;color:#c9d1d9;font-size:12px">
      <option value="">— pick a job-specific parameter to add —</option>
      ${envAddOptions}
    </select>
    <button onclick="_jcAddEnvRow()"
            style="padding:6px 14px;background:#1a3a1a;border:1px solid #1a4429;border-radius:6px;
                   color:#56d364;font-size:12px;cursor:pointer;white-space:nowrap">➕ Add</button>
  </div>` : ''}

  <div style="display:flex;gap:10px;justify-content:flex-end;padding-top:12px;border-top:1px solid #1c2a3a">
    <button class="btn btn-secondary" onclick="document.getElementById('job-config-overlay').remove()">Cancel</button>
    <button class="btn btn-primary" onclick="jcSaveParams()">💾 Save  <span style="font-size:10px;opacity:.7">(takes effect on next Stop/Start)</span></button>
  </div>`;
}

function _jcDeleteCmRow(i) {
  _jcCmRows.splice(i, 1);
  const body = document.getElementById('jc-body');
  if (body) _jcRedrawParams(body);
}
function _jcAddCmRow() {
  const sel = document.getElementById('jcp-cm-add-sel');
  const key = sel?.value; if (!key) return;
  _jcCmRows.push({ key, value: '' });
  const body = document.getElementById('jc-body');
  if (body) _jcRedrawParams(body);
}
function _jcDeleteEnvRow(i) {
  _jcEnvRows.splice(i, 1);
  const body = document.getElementById('jc-body');
  if (body) _jcRedrawParams(body);
}
function _jcAddEnvRow() {
  const sel = document.getElementById('jcp-env-add-sel');
  const key = sel?.value; if (!key) return;
  _jcEnvRows.push({ key, value: '' });
  const body = document.getElementById('jc-body');
  if (body) _jcRedrawParams(body);
}

async function jcSaveParams() {
  let ok = true;

  // 1. Patch shared ConfigMap — send current _jcCmRows
  const cmPatch = {};
  for (const r of _jcCmRows) {
    if (r.value.trim() !== '') cmPatch[r.key] = r.value.trim();
  }
  // Also determine which JOB_PARAMS keys were removed (existed before, not in list now)
  // We don't null-out ConfigMap keys for safety — only update present ones.
  if (Object.keys(cmPatch).length) {
    const r = await fetch('/api/streaming/configmap', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: cmPatch }),
    });
    if (!r.ok) { toast('ConfigMap update failed', 'error'); ok = false; }
  }

  // 2. Patch deployment env vars — set all _jcEnvRows, delete removed non-readonly ones
  if (ok) {
    const envSet = _jcEnvRows
      .filter(r => !JOB_DIRECT_ENV.find(p => p.key === r.key)?.readonly)
      .map(r => ({ name: r.key, value: r.value.trim() }));

    // Keys in JOB_DIRECT_ENV that are not readonly and not in current list = deleted
    const envDel = JOB_DIRECT_ENV
      .filter(p => !p.readonly && !_jcEnvRows.find(r => r.key === p.key))
      .map(p => p.key);

    if (envSet.length || envDel.length) {
      const r = await fetch(`/api/streaming/${_jobConfigName}/env`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ set: envSet, del: envDel }),
      });
      if (!r.ok) { toast('Env update failed', 'error'); ok = false; }
    }
  }

  if (ok) {
    toast(`✓ Parameters saved for ${_jobConfigName}. Takes effect on next Stop/Start.`, 'success');
    document.getElementById('job-config-overlay')?.remove();
  }
}

async function showJobLogs(name) {
  document.getElementById('log-panel').innerHTML = `<div class="card"><div style="color:#586374;padding:12px">⏳ Loading logs for <code>${name}</code>…</div></div>`;
  const r = await apiGet(`/api/streaming/${name}/logs`);
  if (!r.ok || r.data?.error) {
    document.getElementById('log-panel').innerHTML = `<div class="card">
      <div style="color:#da3633;padding:12px">Error: ${r.data?.error || 'Failed to load logs'}</div></div>`;
    return;
  }
  const logs = r.data?.logs || 'No logs';
  const podName = r.data?.podName || '';
  // colour-code log lines by level
  const lines = logs.split('\n').slice(-150).map(l => {
    if (!l.trim()) return '';
    const cls = /ERROR|EXCEPTION|Exception/i.test(l) ? 'color:#da3633' :
                /WARN/i.test(l)  ? 'color:#d29922' :
                /INFO.*batch=.*written|upsert|delete/i.test(l) ? 'color:#2ea043' :
                /INFO/i.test(l)  ? 'color:#8b949e' : 'color:#c9d1d9';
    return `<span style="${cls}">${escHtml(l)}</span>`;
  }).filter(Boolean).join('\n');

  document.getElementById('log-panel').innerHTML = `
  <div class="card" style="margin-top:16px">
    <div class="card-header">
      <div>
        <div class="card-title">📋 Logs: <code style="color:#4fc3f7;font-size:13px">${name}</code></div>
        ${podName ? `<div class="card-subtitle">Pod: ${podName}</div>` : ''}
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary btn-sm" onclick="showJobLogs('${name}')">↻ Refresh</button>
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('log-panel').innerHTML=''">✕ Close</button>
      </div>
    </div>
    <pre style="background:#06090f;border:1px solid #1c2a3a;border-radius:6px;padding:14px;
      font-size:11px;font-family:'Fira Code','Courier New',monospace;
      overflow:auto;max-height:480px;white-space:pre-wrap;word-break:break-all;line-height:1.5">${lines}</pre>
  </div>`;
  // scroll to bottom of log
  const pre = document.querySelector('#log-panel pre');
  if (pre) pre.scrollTop = pre.scrollHeight;
}

function stateBadge(state) {
  const s = (state||'').toUpperCase();
  if (s==='RUNNING')  return `<span class="s-badge s-running"><span class="status-dot dot-green"></span>${s}</span>`;
  if (s==='PAUSED')   return `<span class="s-badge s-paused"><span class="status-dot dot-yellow"></span>${s}</span>`;
  if (s==='FAILED')   return `<span class="s-badge s-failed"><span class="status-dot dot-red"></span>${s}</span>`;
  if (s==='STOPPED')  return `<span class="s-badge s-stopped"><span class="status-dot dot-gray"></span>${s}</span>`;
  if (s==='STARTING') return `<span class="s-badge s-paused"><span class="status-dot dot-yellow"></span>${s}</span>`;
  return `<span class="s-badge s-stopped">${s||'–'}</span>`;
}

// ── Actions dropdown helpers ─────────────────────────────────────────────────
function toggleActMenu(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const isOpen = el.classList.contains('open');
  closeActMenus();
  if (!isOpen) el.classList.add('open');
}
function closeActMenus() {
  document.querySelectorAll('.act-wrap.open').forEach(el => el.classList.remove('open'));
}
// Close on any outside click
document.addEventListener('click', e => {
  if (!e.target.closest('.act-wrap')) closeActMenus();
});

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function syntaxHighlight(json) {
  if (typeof json !== 'string') json = JSON.stringify(json, null, 2);
  return escHtml(json)
    .replace(/"([^"]+)":/g, '<span class="json-key">"$1"</span>:')
    .replace(/: "([^"]*)"/g, ': <span class="json-str">"$1"</span>')
    .replace(/: (-?\d+\.?\d*)/g, ': <span class="json-num">$1</span>')
    .replace(/: (true|false)/g, ': <span class="json-bool">$1</span>')
    .replace(/: null/g, ': <span class="json-null">null</span>');
}

function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

async function refreshClusterStatus() {
  const el = document.getElementById('cluster-status');
  try {
    const r = await apiGet('/api/connectors/postgres');
    const ok = r.ok && typeof r.data === 'object';
    const count = ok ? Object.keys(r.data).length : 0;
    el.innerHTML = `<div class="status-dot ${ok?'dot-green':'dot-red'}"></div>
      <span>${ok ? `Cluster OK • ${count} connector(s)` : 'Cluster unreachable'}</span>`;
  } catch {
    el.innerHTML = `<div class="status-dot dot-red"></div><span>Error</span>`;
  }
}

  if (_cjState.jobStatus === 'running') {

      `<span class="nav-badge" style="background:#0d2a40;color:#4fc3f7;animation:navpulse 1s ease-in-out infinite">⏳</span>`);

// Fetch all CDC topics once and cache them
async function cjLoadTopicsCache() {
  // Only use cache after a successful load — never cache an empty result,
  // so a transient failure (SASL file not yet written, pod not ready) retries
  // on the next table selection rather than permanently returning [].
  if (_cjTopicsLoaded && _cjTopicsCache.length) return _cjTopicsCache;
  const r = await apiGet('/api/kafka/topics');
  const topics = (r.data?.topics || []).filter(t => t.includes('.'));
  if (topics.length) {
    _cjTopicsCache  = topics;
    _cjTopicsLoaded = true;
  }
  return topics;
}

// Populate the table dropdown from the schema API
async function cjLoadTableDropdown(src) {
  const sel = document.getElementById('cj-table');
  if (!sel) return;
  sel.innerHTML = `<option value="">⏳ Loading tables…</option>`;

  // Use cache if available
  if (!_cjSchemaCache[src]) {
    const r = await apiPost(`/api/schema/${src}`, {});
    if (!r.ok) { sel.innerHTML = `<option value="">— could not load tables —</option>`; return; }
    _cjSchemaCache[src] = r.data.databases || {};
  }

  const data = _cjSchemaCache[src];
  const options = [];

  if (src === 'oracle') {
    // { SCHEMA: [TABLE, …] }
    for (const [schema, tables] of Object.entries(data)) {
      if (!Array.isArray(tables)) continue;
      for (const tbl of tables) {
        // value encodes schema||table||db for easy parsing
        options.push({ label: `${schema}.${tbl}`, value: `${schema}||${tbl}||` });
      }
    }
  } else if (src === 'mongodb') {
    // { db: [collection, …] }
    for (const [db, colls] of Object.entries(data)) {
      if (!Array.isArray(colls)) continue;
      for (const c of colls) {
        options.push({ label: `${db}.${c}`, value: `||${c}||${db}` });
      }
    }
  } else {
    // postgres: { db: { schema: [tables] } }
    for (const [db, schemas] of Object.entries(data)) {
      for (const [schema, tables] of Object.entries(schemas)) {
        if (!Array.isArray(tables)) continue;
        for (const tbl of tables) {
          options.push({ label: `${db} › ${schema}.${tbl}`, value: `${schema}||${tbl}||${db}` });
        }
      }
    }
  }

  if (!options.length) { sel.innerHTML = `<option value="">— no tables found —</option>`; return; }

  // Restore previous selection if possible
  const prevVal = _cjState.schema && _cjState.table
    ? `${_cjState.schema}||${_cjState.table}||${_cjState.db}`
    : '';

  sel.innerHTML = `<option value="">— select a table —</option>` +
    options.map(o => `<option value="${escHtml(o.value)}" ${o.value===prevVal?'selected':''}>${escHtml(o.label)}</option>`).join('');

  // If there was a prior selection, trigger auto-match
  if (prevVal && sel.value === prevVal) cjOnTableChange();
}
