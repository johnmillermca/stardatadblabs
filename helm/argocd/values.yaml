# ArgoCD Helm values
# Deploys ArgoCD with NodePort access and sensible resource limits.
# Chart: argo/argo-cd

global:
  image:
    tag: ""   # uses chart default

## ArgoCD Server
server:
  replicas: 1

  service:
    type: NodePort
    nodePortHttp: 30080
    nodePortHttps: 30443

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

## Repo Server
repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

## Application Set Controller
applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

## Redis
redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

## Controller
controller:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

## DEX (SSO) - disabled for simplicity; enable later with your OIDC provider
dex:
  enabled: false

## Notifications
notifications:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

## Global configs
configs:
  params:
    server.insecure: "false"   # serve HTTPS on port 8080; expose via NodePort 30443
  secret:
    argocdServerAdminPassword: ""
    argocdServerAdminPasswordMtime: ""
  cm:
    url: "https://192.168.1.50:30443"
    # Exclude Strimzi-operator-owned PVCs and ClusterRoleBindings from ArgoCD
    # tracking entirely. These resources are created by the Strimzi operator at
    # runtime (not in git) and carry label app.kubernetes.io/managed-by: strimzi-cluster-operator.
    # Without this exclusion, ArgoCD marks them requiresPruning → OutOfSync on
    # every sync because they are "not present in application source".
    # prune: false alone is insufficient — it changes the action to PruneSkipped
    # but still marks the app OutOfSync. This exclusion removes them from the
    # comparison entirely so the app stays Synced/Healthy.
    resource.exclusions: |
      - apiGroups:
        - ""
        kinds:
        - PersistentVolumeClaim
        clusters:
        - "*"
        labelSelectors:
        - matchLabels:
            app.kubernetes.io/managed-by: strimzi-cluster-operator
      - apiGroups:
        - rbac.authorization.k8s.io
        kinds:
        - ClusterRoleBinding
        clusters:
        - "*"
        labelSelectors:
        - matchLabels:
            app.kubernetes.io/managed-by: strimzi-cluster-operator
  rbac:
    policy.default: role:readonly
    policy.csv: |
      p, role:admin, applications, *, */*, allow
      p, role:admin, clusters,      get, *, allow
      p, role:admin, repositories,  *, *, allow
      g, admin, role:admin
