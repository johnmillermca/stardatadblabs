# =============================================================================
# Strimzi Kafka Operator — strimzi/strimzi-kafka-operator 1.2.0
# Namespace   : strimzi-system
# Image       : 192.168.1.50:30500/strimzi/operator:1.2.0 (private registry)
# HA          : 2 replicas for operator HA during upgrades
# K8s compat  : 1.30+ (supports Kafka 4.2.0 – 4.3.1)
# =============================================================================

watchNamespaces: ["prod"]
watchAnyNamespace: false

replicas: 2

# Pull from private registry (1.2.0 images seeded)
defaultImageRegistry: 192.168.1.50:30500
defaultImageRepository: strimzi
defaultImageTag: "1.2.0"

image:
  registry: ""
  repository: ""
  name: operator
  tag: ""

logLevel: INFO
fullReconciliationIntervalMs: 120000
operationTimeoutMs: 300000
kubernetesServiceDnsDomain: cluster.local

featureGates: ""

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

# Kafka pool only
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: workload
              operator: In
              values:
                - kafka

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "kafka"
    effect: "NoSchedule"
createGlobalResources: true

# ── Override STRIMZI_KAFKA_IMAGES to include Kafka 4.3.1 ─────────────────────
# The 1.2.0 Helm chart builds STRIMZI_KAFKA_IMAGES only for 4.2.0, 4.2.1, 4.3.0.
# Override the env var to add 4.3.1 so the operator accepts the Kafka CR.
extraEnvs:
  - name: STRIMZI_KAFKA_IMAGES
    value: |
      4.2.0=192.168.1.50:30500/strimzi/kafka:1.2.0-kafka-4.2.0
      4.2.1=192.168.1.50:30500/strimzi/kafka:1.2.0-kafka-4.2.1
      4.3.0=192.168.1.50:30500/strimzi/kafka:1.2.0-kafka-4.3.0
      4.3.1=192.168.1.50:30500/strimzi/kafka:1.2.0-kafka-4.3.1
