# =============================================================================
# JupyterHub — hub.jupyter.org/helm-chart 4.4.0
# Namespace   : prod
# Image       : private registry for singleuser; standard hub images cached
# Access      : http://192.168.1.5x:30888
# Secret      : jupyterhub-credentials
# =============================================================================

hub:
  config:
    JupyterHub:
      admin_access: true
      authenticator_class: dummy
    Authenticator:
      admin_users: [admin]
    DummyAuthenticator:
      password: ""
  extraEnv:
    JUPYTERHUB_CRYPT_KEY:
      valueFrom:
        secretKeyRef:
          name: jupyterhub-credentials
          key: crypt-key
          optional: true
    DUMMY_AUTH_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: jupyterhub-credentials
          key: admin-password
  extraConfig:
    00-auth: |
      import os
      c.DummyAuthenticator.password = os.environ.get('DUMMY_AUTH_PASSWORD', 'changeme')
    01-tolerations: |
      c.KubeSpawner.tolerations = []
    02-no-cloud-metadata: |
      c.KubeSpawner.extra_container_config = {}
      c.KubeSpawner.init_containers = []
  # Workers only — no master
  nodeSelector: {}

proxy:
  service:
    type: NodePort
    nodePorts:
      http: 30888
  chp:
    image:
      name: 192.168.1.50:30500/jupyterhub/configurable-http-proxy
      tag: "4.6.2"

singleuser:
  cloudMetadata:
    blockWithIptables: false
  networkPolicy:
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app: spark
    egress:
      - ports:
          - port: 8200
            protocol: TCP
          - port: 8201
            protocol: TCP
        to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: openbao
      - ports:
          - port: 7077
            protocol: TCP
          - port: 17077
            protocol: TCP
          - port: 4040
            protocol: TCP
        to:
          - podSelector:
              matchLabels:
                app: spark
      - ports:
          - port: 8181
            protocol: TCP
        to:
          - podSelector:
              matchLabels:
                app: polaris
  image:
    name: 192.168.1.50:30500/jupyter-spark
    tag: latest
    pullPolicy: Always
  # Inject pod IP as SPARK_LOCAL_IP so the Spark driver binds to and advertises
  # the pod's routable IP — executors can then connect back without DNS.
  # status.podIP is available via the Downward API at pod start.
  extraEnv:
    SPARK_LOCAL_IP:
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
  storage:
    type: dynamic
    capacity: 10Gi
    dynamic:
      storageClass: local-path
  cpu:
    limit: 2
    guarantee: 0.25
  memory:
    limit: 4G
    guarantee: 512M
  profileList:
    - display_name: "Standard — Python + PySpark"
      description: "Python 3.11, PySpark 3.5, Iceberg"
      default: true
  extraTolerations: []

scheduling:
  userScheduler:
    enabled: false
  corePods:
    tolerations:
      - key: hub.jupyter.org/dedicated
        operator: Equal
        value: core
        effect: NoSchedule
      - key: hub.jupyter.org_dedicated
        operator: Equal
        value: core
        effect: NoSchedule
  userPods:
    tolerations:
      - key: hub.jupyter.org/dedicated
        operator: Equal
        value: user
        effect: NoSchedule
      - key: hub.jupyter.org_dedicated
        operator: Equal
        value: user
        effect: NoSchedule

cull:
  enabled: true
  timeout: 3600
  every: 300
