# =============================================================================
# JupyterHub — hub.jupyter.org/helm-chart 4.4.0
# Namespace   : prod
# Image       : private registry for singleuser; standard hub images cached
# Access      : http://192.168.1.5x:30888
# Secret      : jupyterhub-credentials
# =============================================================================

hub:
  config:
    JupyterHub:
      admin_access: true
      authenticator_class: dummy
    Authenticator:
      admin_users: [admin]
    DummyAuthenticator:
      password: ""
  extraEnv:
    JUPYTERHUB_CRYPT_KEY:
      valueFrom:
        secretKeyRef:
          name: jupyterhub-credentials
          key: crypt-key
          optional: true
    DUMMY_AUTH_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: jupyterhub-credentials
          key: admin-password
  extraConfig:
    00-auth: |
      import os
      c.DummyAuthenticator.password = os.environ.get('DUMMY_AUTH_PASSWORD', 'changeme')
    01-tolerations: |
      c.KubeSpawner.tolerations = []
    02-no-cloud-metadata: |
      c.KubeSpawner.extra_container_config = {}
      c.KubeSpawner.init_containers = []
  # Pin hub to worker4 — hub-db-dir PVC has node affinity to worker4.local.
  # worker4 must remain uncordoned for the hub pod to schedule.
  nodeSelector:
    kubernetes.io/hostname: worker4.local

proxy:
  service:
    type: NodePort
    nodePorts:
      http: 30888
  chp:
    image:
      name: 192.168.1.50:30500/jupyterhub/configurable-http-proxy
      tag: "4.6.2"

singleuser:
  # Allow the singleuser pod to use its K8s SA JWT to authenticate to OpenBao.
  # The default SA in prod is bound to the platform-secrets-read role in OpenBao.
  # Without this, bao_spark_init.py cannot obtain a token and spark fails to start.
  serviceAccountName: default
  extraPodConfig:
    automountServiceAccountToken: true
  cloudMetadata:
    blockWithIptables: false
  networkPolicy:
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app: spark
    egress:
      - ports:
          - port: 8200
            protocol: TCP
          - port: 8201
            protocol: TCP
        to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: openbao
      - ports:
          - port: 7077
            protocol: TCP
          - port: 17077
            protocol: TCP
          - port: 4040
            protocol: TCP
        to:
          - podSelector:
              matchLabels:
                app: spark
      - ports:
          - port: 8181
            protocol: TCP
        to:
          - podSelector:
              matchLabels:
                app: polaris
  image:
    name: 192.168.1.50:30500/jupyter-spark
    tag: latest
    pullPolicy: Always
  # Pin singleuser pods to worker2 — low resource pressure, no PVC affinity conflict.
  # Change to {} to let the scheduler decide freely.
  nodeSelector:
    kubernetes.io/hostname: worker2.local
  # Inject pod IP as SPARK_LOCAL_IP so the Spark driver binds to and advertises
  # the pod's routable IP — executors can then connect back without DNS.
  # status.podIP is available via the Downward API at pod start.
  extraEnv:
    SPARK_LOCAL_IP:
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    # Pass the JupyterHub username into the kernel so startup.py can set
    # SPARK_USER correctly (used by IcebergTableBuilder RBAC and Spark app name).
    JUPYTERHUB_USER:
      valueFrom:
        fieldRef:
          fieldPath: metadata.annotations['hub.jupyter.org/username']
  # Temporary: use emptyDir so the pod runs on worker2 without needing
  # the claim-admin PVC (which has node affinity to worker5).
  # Switch back to dynamic after verifying Spark/Iceberg works from Jupyter.
  storage:
    type: none
    extraVolumes:
      - name: home
        emptyDir: {}
      # Mount the IPython startup script from a ConfigMap so it survives the
      # emptyDir wipe of /home/jovyan on every pod start. Without this the
      # Dockerfile-baked startup script is lost and `spark` is never defined.
      - name: jupyter-spark-startup
        configMap:
          name: jupyter-spark-startup
    extraVolumeMounts:
      - name: home
        mountPath: /home/jovyan
      - name: jupyter-spark-startup
        mountPath: /home/jovyan/.ipython/profile_default/startup
        readOnly: true
  cpu:
    limit: 2
    guarantee: 0.25
  memory:
    limit: 4G
    guarantee: 512M
  profileList:
    - display_name: "Standard — Python + PySpark"
      description: "Python 3.11, PySpark 3.5, Iceberg"
      default: true
  extraTolerations: []

scheduling:
  userScheduler:
    enabled: false
  corePods:
    tolerations:
      - key: hub.jupyter.org/dedicated
        operator: Equal
        value: core
        effect: NoSchedule
      - key: hub.jupyter.org_dedicated
        operator: Equal
        value: core
        effect: NoSchedule
  userPods:
    tolerations:
      - key: hub.jupyter.org/dedicated
        operator: Equal
        value: user
        effect: NoSchedule
      - key: hub.jupyter.org_dedicated
        operator: Equal
        value: user
        effect: NoSchedule

cull:
  enabled: true
  timeout: 3600
  every: 300
