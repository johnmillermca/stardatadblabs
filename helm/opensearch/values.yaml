# =============================================================================
# OpenSearch — single node (opensearch-project/helm-charts 3.7.0)
# Namespace   : prod
# Node        : worker3.local
# Image       : 192.168.1.50:30500/opensearch/opensearch:3.7.0 (private registry)
# Access      : http://192.168.1.53:30920 (NodePort)
#               opensearch-cluster-master.prod.svc.cluster.local:9200 (internal)
# HA          : single node
# Secret      : opensearch-credentials
# PVC         : 50Gi on /home (worker3.local)
# =============================================================================

singleNode: true
replicas: 1

image:
  repository: "192.168.1.50:30500/opensearch/opensearch"
  tag: "3.7.0"
  pullPolicy: IfNotPresent

opensearchJavaOpts: >-
  -Xms1g -Xmx1g
  -Djava.security.krb5.conf=/etc/krb5.conf.d/cluster.conf

extraEnvs:
  - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: opensearch-credentials
        key: opensearch-password

config:
  opensearch.yml: |
    cluster.name: opensearch-prod
    network.host: 0.0.0.0
    discovery.type: single-node

    # ── Transport SSL (required by opensearch-security plugin >= 3.x) ─────────
    # Certs mounted from secret opensearch-tls-certs at /usr/share/opensearch/config/tls/
    plugins.security.ssl.transport.enabled: true
    plugins.security.ssl.transport.pemcert_filepath: tls/node.pem
    plugins.security.ssl.transport.pemkey_filepath: tls/node-key.pem
    plugins.security.ssl.transport.pemtrustedcas_filepath: tls/root-ca.pem
    plugins.security.ssl.transport.enforce_hostname_verification: false

    # ── HTTP SSL (enabled — required for securityadmin.sh REST API access) ────
    # admin_dn cert is used by securityadmin.sh to apply security config changes.
    plugins.security.ssl.http.enabled: true
    plugins.security.ssl.http.pemcert_filepath: tls/node.pem
    plugins.security.ssl.http.pemkey_filepath: tls/node-key.pem
    plugins.security.ssl.http.pemtrustedcas_filepath: tls/root-ca.pem

    # ── Security plugin ───────────────────────────────────────────────────────
    plugins.security.disabled: false
    plugins.security.allow_default_init_securityindex: true
    plugins.security.authcz.admin_dn:
      - "CN=admin,O=opensearch-cluster,C=US"
    plugins.security.nodes_dn:
      - "CN=opensearch-cluster-master-0,O=opensearch-cluster,C=US"
    plugins.security.audit.type: internal_opensearch

# ── TLS certs + Kerberos mounts ──────────────────────────────────────────────
# Kerberos toggle: kerberos-integration-config data.kerberos.enabled
# When enabled=true: enable kerberos_auth_domain in config.yml and apply via
#   securityadmin.sh (see runbook-11). The keytab + krb5.conf are pre-mounted
#   here regardless of toggle so no restart is needed when enabling Kerberos.
#   Principal: svc/opensearch@STARDATADBLABS.LOCAL (secret: opensearch-keytab)
extraVolumes:
  - name: tls-certs
    secret:
      secretName: opensearch-tls-certs
  # krb5.conf — always mounted; included by /etc/krb5.conf via includedir
  - name: krb5-conf
    configMap:
      name: kerberos-integration-config
      items:
        - key: krb5.conf
          path: krb5.conf
  # opensearch-keytab — svc/opensearch@STARDATADBLABS.LOCAL
  - name: opensearch-keytab
    secret:
      secretName: opensearch-keytab

extraVolumeMounts:
  - name: tls-certs
    mountPath: /usr/share/opensearch/config/tls
    readOnly: true
  - name: krb5-conf
    mountPath: /etc/krb5.conf.d/cluster.conf
    subPath: krb5.conf
    readOnly: true
  - name: opensearch-keytab
    mountPath: /etc/security/keytabs/opensearch.service.keytab
    subPath: keytab
    readOnly: true

persistence:
  enabled: true
  size: 50Gi
  storageClass: local-path

service:
  type: NodePort
  nodePort: 30920

resources:
  requests:
    memory: 2Gi
    cpu: 500m
  limits:
    memory: 4Gi
    cpu: "2"

antiAffinity: soft
nodeSelector:
  kubernetes.io/hostname: worker3.local

podDisruptionBudget:
  enable: false

startupProbe:
  failureThreshold: 30
  initialDelaySeconds: 30
  periodSeconds: 10

livenessProbe:
  tcpSocket:
    port: 9200
  failureThreshold: 3
  initialDelaySeconds: 60
  periodSeconds: 10

readinessProbe:
  tcpSocket:
    port: 9200
  failureThreshold: 3
  initialDelaySeconds: 60
  periodSeconds: 5
