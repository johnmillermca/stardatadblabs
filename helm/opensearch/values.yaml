# =============================================================================
# OpenSearch — single node (opensearch-project/helm-charts 3.7.0)
# Namespace   : prod
# Node        : worker3.local
# Image       : 192.168.1.50:30500/opensearch/opensearch:3.7.0 (private registry)
# Access      : http://192.168.1.53:30920 (NodePort)
#               opensearch-cluster-master.prod.svc.cluster.local:9200 (internal)
# HA          : single node
# Secret      : opensearch-credentials
# PVC         : 50Gi on /home (worker3.local)
# =============================================================================

singleNode: true
replicas: 1

image:
  repository: "192.168.1.50:30500/opensearch/opensearch"
  tag: "3.7.0"
  pullPolicy: IfNotPresent

opensearchJavaOpts: "-Xms1g -Xmx1g"

extraEnvs:
  - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: opensearch-credentials
        key: opensearch-password

config:
  opensearch.yml: |
    cluster.name: opensearch-prod
    network.host: 0.0.0.0
    discovery.type: single-node
    # ── Ranger RBAC ───────────────────────────────────────────────────────────
    # Security plugin enabled — policies synced from Ranger Admin every 30s.
    # plugin type: elasticsearch (OpenSearch uses the elasticsearch service type)
    plugins.security.disabled: false
    plugins.security.ssl.http.enabled: false
    plugins.security.ssl.transport.enabled: false
    plugins.security.ssl.transport.enforce_hostname_verification: false
    plugins.security.allow_default_init_securityindex: true
    plugins.security.authcz.admin_dn:
      - "CN=admin,OU=client,O=client,L=test,C=DE"
    plugins.security.audit.type: internal_opensearch
    # Ranger authorization backend
    plugins.security.authorization.ranger.enabled: true
    plugins.security.authorization.ranger.url: http://ranger-admin.prod.svc.cluster.local:6080
    plugins.security.authorization.ranger.service_name: opensearch
    plugins.security.authorization.ranger.policy_poll_interval_ms: 30000

persistence:
  enabled: true
  size: 50Gi
  storageClass: local-path

service:
  type: NodePort
  nodePort: 30920

resources:
  requests:
    memory: 2Gi
    cpu: 500m
  limits:
    memory: 4Gi
    cpu: "2"

antiAffinity: soft
nodeSelector:
  kubernetes.io/hostname: worker3.local

podDisruptionBudget:
  enable: false

startupProbe:
  failureThreshold: 30
  initialDelaySeconds: 30
  periodSeconds: 10

livenessProbe:
  tcpSocket:
    port: 9200
  failureThreshold: 3
  initialDelaySeconds: 60
  periodSeconds: 10

readinessProbe:
  tcpSocket:
    port: 9200
  failureThreshold: 3
  initialDelaySeconds: 60
  periodSeconds: 5
