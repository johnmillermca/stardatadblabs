apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: star-knowledge-catalog
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/k8s-platform
    targetRevision: HEAD
    path: star-knowledge-catalog/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
