apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: platform
  sources:
    - repoURL: https://openbao.github.io/openbao-helm
      chart: openbao
      targetRevision: "0.28.5"
      helm:
        releaseName: openbao
        valueFiles:
          - $values/helm/openbao/values.yaml
    - repoURL: https://github.com/johnmillermca/stardatadblabs
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  ignoreDifferences:
    # ClusterRoleBindings are cluster-scoped and excluded from the platform project
    # destination list. ArgoCD marks them OutOfSync but cannot manage them — suppress.
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
      name: prod-openbao-agent-injector-binding
      jsonPointers: ["/"]
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
      name: prod-openbao-server-binding
      jsonPointers: ["/"]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true        # Required — avoids StatefulSet immutable field errors
      - RespectIgnoreDifferences=true
