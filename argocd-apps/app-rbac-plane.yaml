---
# ArgoCD Application — RBAC Control Plane
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rbac-plane
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  source:
    repoURL: https://github.com/johnmillermca/stardatadblabs
    targetRevision: main
    path: rbac-plane/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: false      # Never auto-delete the control plane
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
