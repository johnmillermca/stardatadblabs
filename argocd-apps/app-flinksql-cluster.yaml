apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flinksql-cluster
  namespace: argocd
  finalizers: [resources-finalizer.argocd.io]
  annotations:
    argocd.argoproj.io/sync-wave: "5"   # deploy after flink-operator is ready
spec:
  project: platform
  source:
    repoURL: https://github.com/johnmillermca/stardatadblabs
    targetRevision: HEAD
    path: manifests/flink
  destination:
    server: https://kubernetes.default.svc
    namespace: flink
  ignoreDifferences:
    # FlinkDeployment status sub-resources and operator-managed fields
    - group: "flink.apache.org"
      kind: FlinkDeployment
      jqPathExpressions:
        - .status
    # Operator-created ephemeral PVCs for TaskManagers
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /
  syncPolicy:
    automated:
      prune: false       # never prune — PVCs hold state
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
