apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-kafka
  namespace: argocd
  finalizers: [resources-finalizer.argocd.io]
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://github.com/johnmillermca/stardatadblabs
    targetRevision: HEAD
    path: manifests/strimzi
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  # These resources are generated by the Strimzi operator at runtime — they do
  # not exist in the git manifest. ArgoCD marks them PruneSkipped because prune
  # is disabled. ignoreDifferences suppresses the OutOfSync status for them.
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      name: data-strimzi-kafka-combined-0
      jsonPointers:
        - /
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
      name: strimzi-prod-strimzi-kafka-kafka-init
      jsonPointers:
        - /
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
