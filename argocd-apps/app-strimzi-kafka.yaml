apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-kafka
  namespace: argocd
  finalizers: [resources-finalizer.argocd.io]
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://github.com/johnmillermca/stardatadblabs
    targetRevision: HEAD
    path: manifests/strimzi
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  # These resources are generated by the Strimzi operator at runtime — they do
  # not exist in the git manifest and must never be pruned (they hold live data).
  #
  # ignoreDifferences entries WITHOUT a name: filter are type-wide rules — ArgoCD
  # applies them to any resource of that kind, which is what suppresses the
  # requiresPruning / "not present in source" OutOfSync flag.
  # (Entries with name: only suppress field-level diffs, not the presence check.)
  #
  # Resources covered:
  #   PersistentVolumeClaim  data-strimzi-kafka-combined-0   — Strimzi-created Kafka PVC
  #   ClusterRoleBinding     strimzi-prod-*-kafka-init       — Strimzi-created kafka-init CRB
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
      jsonPointers:
        - /
    # aclsAdminApiSupported is not declared in the Strimzi 1.1.0 CRD schema.
    # ArgoCD ServerSideApply rejects it as "field not declared in schema" causing
    # a ComparisonError → Unknown sync status. Suppress the field-level diff here;
    # the field is still written by kubectl replace (field manager: kubectl-replace)
    # and honoured at runtime — we just stop ArgoCD from diffing it.
    - group: "kafka.strimzi.io"
      kind: Kafka
      name: strimzi-kafka
      jqPathExpressions:
        - .spec.entityOperator.userOperator.aclsAdminApiSupported
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
