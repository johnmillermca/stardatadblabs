apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-kafka
  namespace: argocd
  finalizers: [resources-finalizer.argocd.io]
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://github.com/johnmillermca/stardatadblabs
    targetRevision: HEAD
    path: manifests/strimzi
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  # These resources are generated by the Strimzi operator at runtime — they do
  # not exist in the git manifest and must never be pruned (they hold live data).
  #
  # ignoreDifferences entries WITHOUT a name: filter are type-wide rules — ArgoCD
  # applies them to any resource of that kind, which is what suppresses the
  # requiresPruning / "not present in source" OutOfSync flag.
  #
  # Resources covered:
  #   PersistentVolumeClaim  data-strimzi-kafka-{worker5,worker6,worker7}-0
  #   ClusterRoleBinding     strimzi-prod-*-kafka-init
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
      jsonPointers:
        - /
    # aclsAdminApiSupported is not in the Strimzi CRD schema — suppress diff.
    - group: "kafka.strimzi.io"
      kind: Kafka
      name: strimzi-kafka
      jqPathExpressions:
        - .spec.entityOperator.userOperator.aclsAdminApiSupported
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
