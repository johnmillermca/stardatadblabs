# ── Webconsole (nginx proxy on master2 + cloudflared tunnel) ─────────────────
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webconsole
  namespace: argocd
  finalizers: [resources-finalizer.argocd.io]
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://github.com/johnmillermca/stardatadblabs
    targetRevision: HEAD
    path: manifests/webconsole
    directory:
      # iptables-setup is a one-shot bootstrap pod (restartPolicy:Never).
      # Excluding it prevents ArgoCD from re-running it on every sync cycle.
      include: "{cloudflared,webconsole-proxy,webconsole-worker8,webconsole}.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  ignoreDifferences:
    - group: ""
      kind: Pod
      jsonPointers: [/status]
    - group: apps
      kind: DaemonSet
      jsonPointers: [/status]
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
