# ── Strimzi Operator ──────────────────────────────────────────────────────────
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  namespace: argocd
  finalizers: [resources-finalizer.argocd.io]
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
    - repoURL: https://strimzi.io/charts/
      chart: strimzi-kafka-operator
      targetRevision: "1.2.0"
      helm:
        releaseName: strimzi-operator
        valueFiles:
          - $values/helm/strimzi-operator/values.yaml
    - repoURL: https://github.com/johnmillermca/stardatadblabs
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true, Replace=true]

# ── Strimzi Kafka Cluster ─────────────────────────────────────────────────────
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-kafka
  namespace: argocd
  finalizers: [resources-finalizer.argocd.io]
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  source:
    repoURL: https://github.com/johnmillermca/stardatadblabs
    targetRevision: HEAD
    path: manifests/strimzi
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      # prune:false — Strimzi dynamically creates PVCs, ConfigMaps, Secrets, and
      # StrimziPodSets at runtime that are not in git. Enabling prune deletes them
      # on every sync, wiping Kafka data. selfHeal still reconciles declared resources.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

