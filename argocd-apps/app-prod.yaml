# ArgoCD Applications — all prod namespace apps
# Each component deploys into: namespace: prod
# ArgoCD auto-syncs from: https://github.com/johnmillermca/stardatadblabs
# Secrets: stored as plain K8s Opaque secrets in namespace: prod
# ─────────────────────────────────────────────────────────────────────────────

# ── Prod Namespaces manifest ──────────────────────────────────────────────────
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-namespaces
  namespace: argocd
  finalizers: [resources-finalizer.argocd.io]
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: platform
  source:
    repoURL: https://github.com/johnmillermca/stardatadblabs
    targetRevision: HEAD
    path: manifests/namespaces
    directory:
      include: "prod-namespace.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]

