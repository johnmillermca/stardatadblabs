apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flink-operator
  namespace: argocd
  finalizers: [resources-finalizer.argocd.io]
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: platform
  sources:
    - repoURL: https://downloads.apache.org/flink/flink-kubernetes-operator-1.16.1
      chart: flink-kubernetes-operator
      targetRevision: "1.16.1"
      helm:
        valueFiles:
          - $values/helm/flink-operator/values.yaml
    - repoURL: https://github.com/johnmillermca/stardatadblabs
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: flink
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: flink-kubernetes-operator
      namespace: flink
      jsonPointers:
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: flinkdeployments.flink.apache.org
      jqPathExpressions:
        - .status
        - .spec.conversion
        - .spec.names.listKind
        - .spec.versions[].additionalPrinterColumns[].priority
        - .spec.versions[].schema.openAPIV3Schema
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: flinkbluegreendeployments.flink.apache.org
      jqPathExpressions:
        - .status
        - .spec.conversion
        - .spec.names.listKind
        - .spec.versions[].additionalPrinterColumns[].priority
        - .spec.versions[].schema.openAPIV3Schema
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: flinksessionjobs.flink.apache.org
      jqPathExpressions:
        - .status
        - .spec.conversion
        - .spec.names.listKind
        - .spec.versions[].additionalPrinterColumns[].priority
        - .spec.versions[].schema.openAPIV3Schema
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: flinkstatesnapshots.flink.apache.org
      jqPathExpressions:
        - .status
        - .spec.conversion
        - .spec.names.listKind
        - .spec.versions[].additionalPrinterColumns[].priority
        - .spec.versions[].schema.openAPIV3Schema
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
