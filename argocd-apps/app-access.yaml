# =============================================================================
# ArgoCD Applications — StarData access namespace
# Sign-in and sign-up: auth.stardatadb.com (Pocket ID)
# Console:             console.stardatadb.com (oauth2-proxy + SPA)
#
# Sync order (waves):
#   -10  access namespace + default-deny NetworkPolicy
#     0  Databases (zitadel-db on 192.168.1.50, console-db on 192.168.1.51)
#     1  Valkey session store
#     2  Network policies (allow-list)
#     3  Pocket ID OIDC provider (auth.stardatadb.com)
#     4  console-oauth2-proxy + invite-mailer
#     5  stardata-claims + Actions v2 bootstrap job
#     6  audit-forwarder
#     7  console-backend + access-cron
# =============================================================================

# ── access namespace ─────────────────────────────────────────────────────────
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: access-namespace
  namespace: argocd
  finalizers: [resources-finalizer.argocd.io]
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: platform
  source:
    repoURL: https://github.com/johnmillermca/stardatadblabs
    targetRevision: HEAD
    path: manifests/access
    directory:
      include: "namespace.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]

