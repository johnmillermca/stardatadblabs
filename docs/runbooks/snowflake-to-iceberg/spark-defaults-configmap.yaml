# spark-defaults-configmap.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Delivers spark-defaults.conf to spark-master and spark-worker pods.
# Credentials (S3, Polaris) are injected at runtime by bao_spark_init.py.
#
# Key global defaults enforced here:
#   • 256 MB Iceberg target file size (write.target-file-size-bytes)
#   • Polaris REST catalog registered as "polaris"
#   • Snowflake source registered as "snowflake" (namespace = TPCDS_SF10TCL)
#     — namespace intentionally matches source schema name (tpcds_sf10tcl)
#
# Apply:
#   kubectl apply -f spark-defaults-configmap.yaml -n prod
#   kubectl rollout restart deployment spark-master spark-worker -n prod
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-defaults-conf
  namespace: prod
  labels:
    app.kubernetes.io/component: spark
    app.kubernetes.io/managed-by: platform-team
    rbac-managed: "true"
data:
  spark-defaults.conf: |
    # ── Spark master — internal URL (bypasses krb-spark-guard sidecar) ───────
    # In-cluster drivers and workers connect directly to port 17077.
    # External spark-submit uses spark-master-svc:7077 (guard-proxied NodePort).
    spark.master                                    spark://spark-master-internal.prod.svc.cluster.local:17077

    # ── Iceberg extension ─────────────────────────────────────────────────────
    spark.sql.extensions                            org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

    # ── Global Iceberg write defaults (256 MB file size) ─────────────────────
    # These properties are defaults; IcebergTableBuilder enforces them per-table
    # via TBLPROPERTIES so they survive even if spark-defaults is not mounted.
    spark.sql.iceberg.write.format.default          parquet
    spark.sql.iceberg.target-file-size-bytes        268435456

    # ── Polaris REST catalog (catalog name: polaris) ──────────────────────────
    spark.sql.catalog.polaris                       org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.polaris.type                  rest
    spark.sql.catalog.polaris.uri                   http://polaris-rest.prod.svc.cluster.local:8181/api/catalog
    spark.sql.catalog.polaris.warehouse             IcebergCatalog
    spark.sql.catalog.polaris.scope                 PRINCIPAL_ROLE:ALL
    # credential injected at runtime by bao_spark_init.py (secret/platform/polaris)

    # ── Snowflake source catalog (catalog name: snowflake) ─────────────
    # Registered so the copy-job can validate catalog existence at startup.
    # Namespace is set to tpcds_sf10tcl to match the Snowflake schema name.
    # Actual reads use the Snowflake Spark connector, not this catalog entry.
    spark.sql.catalog.snowflake              org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.snowflake.type         hadoop
    spark.sql.catalog.snowflake.warehouse    SNOWFLAKE_SAMPLE_DATA
    spark.sql.catalog.snowflake.default-namespace tpcds_sf10tcl

    # ── S3A defaults (credentials injected at runtime) ────────────────────────
    spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.endpoint                    https://s3.us-east-2.amazonaws.com
    spark.hadoop.fs.s3a.endpoint.region             us-east-2
    spark.hadoop.fs.s3a.path.style.access           true
    spark.hadoop.fs.s3a.connection.ssl.enabled      true

    # ── Parquet / compression defaults ────────────────────────────────────────
    spark.sql.parquet.compression.codec             snappy

    # ── Iceberg JAR (repo-bundled) ────────────────────────────────────────────
    spark.jars                                      /opt/spark/jars/iceberg-spark-runtime-3.5_2.12-1.9.2.jar

    # ── Driver / executor sizing ──────────────────────────────────────────────
    spark.driver.memory                             2g
    spark.executor.memory                           4g
    spark.executor.cores                            2

---
# ─────────────────────────────────────────────────────────────────────────────
# Deployment patches — mount spark-defaults-conf on spark-master and spark-worker
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: prod
spec:
  template:
    spec:
      volumes:
        - name: spark-defaults-conf
          configMap:
            name: spark-defaults-conf
      containers:
        - name: spark-master
          volumeMounts:
            - name: spark-defaults-conf
              mountPath: /opt/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
          env:
            - name: SPARK_USER
              value: "dave"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: prod
spec:
  template:
    spec:
      volumes:
        - name: spark-defaults-conf
          configMap:
            name: spark-defaults-conf
      containers:
        - name: spark-worker
          volumeMounts:
            - name: spark-defaults-conf
              mountPath: /opt/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
          env:
            - name: SPARK_USER
              value: "dave"
