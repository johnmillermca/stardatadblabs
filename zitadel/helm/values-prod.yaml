# =============================================================================
# ZITADEL v4 — Helm chart values (prod)
# ServiceAccount: stardatarbac (not the default "zitadel")
# Chart  : https://charts.zitadel.com  chart: zitadel  version: 9.x (pin latest 9.x)
# Domain : auth.stardatadb.com  (API + OIDC + /ui/v2/login)
# DB     : zitadel-db.access.svc.cluster.local:5432
# Sign-in/sign-up for: www.stardatadb.com console (console.stardatadb.com)
# All ZITADEL pods run on 192.168.1.51 (worker1.local) per deployment split
#
# TLS NOTE: This cluster does NOT use an in-cluster nginx ingress controller.
# Traffic reaches ZITADEL via:
#   Cloudflare tunnel → webconsole-proxy nginx (master2:80)
#     → proxy_pass http://zitadel.access.svc.cluster.local:8080
# The webconsole-proxy terminates TLS via Cloudflare; ZITADEL serves plain HTTP.
# Ingress is therefore disabled here.
# =============================================================================

replicaCount: 3

serviceAccount:
  create: false
  name: stardatarbac

zitadel:
  masterkeySecretName: zitadel-masterkey   # key: masterkey (32 chars, NEVER change)

  configmapConfig:
    ExternalDomain: auth.stardatadb.com
    ExternalPort: 443
    ExternalSecure: true

    # Login v2 Next.js app — ZITADEL proxies /ui/v2/login/* to this URL.
    LoginV2:
      BaseURL: http://zitadel-login.access.svc.cluster.local:3000

    # Self-signed TLS cert for in-cluster HTTPS (console-backend OIDC discovery).
    # Cloudflare terminates public TLS; ZITADEL serves HTTPS internally.
    TLS:
      Enabled: true
      KeyPath: /etc/zitadel/tls/tls.key
      CertPath: /etc/zitadel/tls/tls.crt

    Database:
      Postgres:
        Host: zitadel-db.access.svc.cluster.local
        Port: 5432
        Database: zitadel
        MaxOpenConns: 20
        User:
          Username: zitadel
          SSL:
            Mode: disable
        Admin:
          Username: platform_admin
          SSL:
            Mode: disable

    FirstInstance:
      Org:
        Name: stardatadb
      Human:
        # First Owner — change the password and enrol a passkey at first sign-in
        UserName: owner@stardatadb.com
        Email:
          Address: owner@stardatadb.com
          Verified: true
      DefaultInstance:
        LoginPolicy:
          AllowRegister: true
          ForceMFA: false          # MFA for Owners/Admins enforced by BFF amr check
          AllowUsernamePassword: true
          AllowExternalIdps: false
          PasswordlessType: 2      # passkeys allowed
          IgnoreUnknownUsernames: true   # prevents user enumeration
          PasswordCheckLifetime: 168h    # 7 days — re-ask password after 7 days
          SecondFactorCheckLifetime: 12h # re-ask TOTP/passkey after 12 h idle
          MfaCheckLifetime: 12h
          IdleSessionLifetime: 24h
          SessionMaxAgeHours: 168        # 7 days maximum absolute session age

  # DB passwords injected via secretConfig — chart creates the config-yaml secret.
  secretConfig:
    Database:
      Postgres:
        User:
          Password: "Priya1982"
        Admin:
          Password: "Priya1982"

# Use local registry for all images (Docker Hub / ghcr.io not fully reachable)
imageRegistry: "192.168.1.50:30500"

image:
  repository: 192.168.1.50:30500/zitadel/zitadel
  tag: v4.13.1

tools:
  kubectl:
    image:
      repository: "bitnami/kubectl"
      tag: "latest"
  wait4x:
    image:
      repository: "wait4x/wait4x"
      tag: "3.6"
    # Required: access-quota ResourceQuota enforces explicit cpu/memory on every container
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

# Disable in-cluster ingress — routing is handled by webconsole-proxy nginx
ingress:
  enabled: false

login:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/zitadel/zitadel-login
    tag: v4.13.1
    pullPolicy: IfNotPresent
  # Extra environment variables passed to the Login v2 Next.js container.
  extraEnv:
    - name: ZITADEL_PRIMARY_COLOR
      value: "#3346C4"
    - name: ZITADEL_LOGIN_TITLE
      value: "Sign in"
    - name: ZITADEL_LOGIN_SUBTITLE
      value: "Use your StarData account"
    - name: ZITADEL_MFA_SUBTITLE
      value: "Required for Owners and Admins. Enter the 6-digit code from your authenticator app."
    - name: ZITADEL_ORG_DOMAIN
      value: "stardatadb.com"
    # Internal TLS cert is self-signed; tell Node.js to accept it.
    # Traffic never leaves the cluster on this path.
    - name: NODE_TLS_REJECT_UNAUTHORIZED
      value: "0"
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  tolerations:
    - key: dedicated
      operator: Equal
      value: zitadel
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [worker1.local]

# Tolerate the dedicated=zitadel taint on worker1.local
tolerations:
  - key: dedicated
    operator: Equal
    value: zitadel
    effect: NoSchedule

# Pin all ZITADEL pods to worker1.local (192.168.1.51)
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [worker1.local]
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: zitadel
          topologyKey: kubernetes.io/hostname

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

extraVolumes:
  - name: zitadel-tls
    secret:
      secretName: zitadel-internal-tls

extraVolumeMounts:
  - name: zitadel-tls
    mountPath: /etc/zitadel/tls
    readOnly: true

initJob:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

setupJob:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

pdb:
  enabled: true
  minAvailable: 2

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
