---
# ============================================================
# 05b_doris_warmup_cronjob.yaml
# ============================================================
# Kubernetes CronJob that warms the Doris Iceberg external catalog
# for polaris.lakehouse.events every minute.
#
# RBAC note:
#   The Service Account running this job is mapped to a Doris user
#   that holds CATALOG_WARM_UP + CATALOG_USAGE permissions via the
#   RBAC Control Plane.  Bind the role before deploying:
#
#     rbacctl user create doris-warmup-sa
#     rbacctl user bind   doris-warmup-sa iceberg_engineer --service doris
#     rbacctl sync run    --user doris-warmup-sa --service doris
# ============================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: doris-iceberg-warmup
  namespace: prod
  labels:
    app: doris-iceberg-warmup
    rbac-managed: "true"
spec:
  # Every minute
  schedule: "* * * * *"
  concurrencyPolicy: Forbid          # skip if previous run still active
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: doris-iceberg-warmup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: warmup
              # mysql-client image — small, no JVM overhead
              image: mysql:8.0
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  echo "[$(date -u +%FT%TZ)] Starting Doris Iceberg warm-up..."
                  mysql \
                    --host="${DORIS_FE_HOST}" \
                    --port="${DORIS_FE_PORT}" \
                    --user="${DORIS_USER}" \
                    --password="${DORIS_PASSWORD}" \
                    --connect-timeout=10 \
                    --execute="WARM UP TABLE iceberg_polaris.lakehouse.events WITH SYNC;"
                  echo "[$(date -u +%FT%TZ)] Warm-up complete."
              env:
                - name: DORIS_FE_HOST
                  value: "doris-fe.prod.svc.cluster.local"
                - name: DORIS_FE_PORT
                  value: "9030"
                - name: DORIS_USER
                  value: "doris-warmup-sa"
                - name: DORIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: doris-warmup-secret
                      key: password
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
---
# Secret for the Doris warm-up user password
# Create with:
#   kubectl create secret generic doris-warmup-secret \
#     --namespace prod \
#     --from-literal=password='<doris-warmup-sa-password>'
apiVersion: v1
kind: Secret
metadata:
  name: doris-warmup-secret
  namespace: prod
type: Opaque
stringData:
  password: "changeme"   # replace with real password before applying
