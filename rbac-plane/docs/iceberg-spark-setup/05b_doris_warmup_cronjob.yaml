---
# ============================================================
# 05b_doris_warmup_cronjob.yaml
# ============================================================
# Kubernetes CronJob that refreshes all 5 managed Iceberg external
# catalogs in Doris every minute so Doris picks up new Iceberg
# snapshots promptly.
#
# Catalogs refreshed: polaris, databricks, postgres, oracle, mongodb
#
# Credentials: uses root account via rbac-plane-credentials secret —
#   same as all other Doris admin operations in this cluster.
#
# History:
#   Original (pre-2026-09-09): refreshed 'iceberg_polaris' which no
#   longer exists (renamed to 'iceberg_polaris_rw' and superseded by
#   the 5 managed catalogs). All jobs were failing/timing out.
#   Fixed 2026-09-09: refresh all 5 managed catalogs instead.
# ============================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: doris-iceberg-warmup
  namespace: prod
  labels:
    app: doris-iceberg-warmup
    rbac-managed: "true"
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: doris-iceberg-warmup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: warmup
              image: mariadb:10.11
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  echo "[$(date -u +%FT%TZ)] Refreshing Doris Iceberg catalogs..."
                  mysql \
                    --host=doris-fe.prod.svc.cluster.local \
                    --port=9030 \
                    --user=root \
                    --password="${DORIS_PASSWORD}" \
                    --connect-timeout=10 \
                    --execute="
                      REFRESH CATALOG polaris;
                      REFRESH CATALOG databricks;
                      REFRESH CATALOG postgres;
                      REFRESH CATALOG oracle;
                      REFRESH CATALOG mongodb;
                    "
                  echo "[$(date -u +%FT%TZ)] Catalog refresh complete."
              env:
                - name: DORIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: rbac-plane-credentials
                      key: DORIS_ADMIN_PASSWORD
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
