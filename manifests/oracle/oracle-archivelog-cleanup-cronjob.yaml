# =============================================================================
# oracle-archivelog-cleanup-cronjob.yaml
#
# Kubernetes CronJob that deletes Oracle XE archive log files older than
# 90 minutes from the oracle-xe pod every 30 minutes.
#
# WHY THIS IS NEEDED
# ------------------
# Oracle XE stores archive logs in the container's ephemeral filesystem at
#   /opt/oracle/homes/OraDBHome21cXE/dbs/arch1_*.dbf
# Each file is ~10 MB and one is written per hour of activity.  Without
# automatic cleanup:
#   • Logs accumulate indefinitely → disk pressure on the node
#   • Kubernetes evicts the oracle-xe pod with DiskPressure taint
#   • On restart, the container filesystem is wiped → the archive log files
#     that Debezium's offset points to no longer exist → ORA-01284 →
#     Debezium stuck in an infinite retry loop → CDC pipeline dead
#
# RETENTION / TIMING RELATIONSHIP
# --------------------------------
#   log.mining.archive.log.hours = 1   (connector config)
#   Retention on disk              = 90 min
#   Cleanup runs every             = 30 min
#
# Debezium only looks back 1 hour (60 min) of archive logs.
# We keep 90 minutes on disk, giving a 30-minute safety buffer.
# The cronjob runs every 30 minutes so in the worst case a log is
# 30 min past the 90-min cutoff before it is purged — still within the
# 90-min window.
#
# HOW IT WORKS
# ------------
# The CronJob runs a kubectl exec into the oracle-xe pod every 30 minutes
# and runs:
#   find /opt/oracle/homes/OraDBHome21cXE/dbs/ -name "arch1_*.dbf" -mmin +90 -delete
# This is purely filesystem-level — no Oracle involvement required.
# Oracle's control file retains the metadata entries (DELETED='NO') which
# is harmless; Debezium only cares that the physical file exists when it
# tries to mine it.
#
# SERVICEACCOUNT
# --------------
# Uses the spark-cleanup ServiceAccount which has pods/get, pods/list and
# pods/exec permissions in the prod namespace.
#
# IMAGE
# -----
# 192.168.1.50:30500/bitnami/kubectl:latest — pushed to private registry.
# =============================================================================
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: oracle-archivelog-cleanup
  namespace: prod
  labels:
    app: oracle-archivelog-cleanup
    component: maintenance
  annotations:
    description: "Delete Oracle XE archive logs older than 2h every 30min to prevent disk pressure and ORA-01284"
spec:
  # Every 30 minutes
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Allow up to 5 minutes for the exec to complete
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: oracle-archivelog-cleanup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: spark-cleanup
          containers:
            - name: cleanup
              image: 192.168.1.50:30500/bitnami/kubectl:latest
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  ORA_POD=$(kubectl -n prod get pods -l app=oracle-xe \
                    --field-selector=status.phase=Running \
                    -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)

                  if [ -z "$ORA_POD" ]; then
                    echo "[WARN] No running oracle-xe pod found — skipping cleanup."
                    exit 0
                  fi

                  echo "[INFO] oracle-xe pod: $ORA_POD"

                  # Count files before deletion (>90 min old)
                  BEFORE=$(kubectl -n prod exec "$ORA_POD" -- \
                    bash -c 'find /opt/oracle/homes/OraDBHome21cXE/dbs/ \
                      -name "arch1_*.dbf" -mmin +90 2>/dev/null | wc -l' 2>/dev/null || echo 0)
                  echo "[INFO] Archive logs older than 90min: $BEFORE"

                  if [ "$BEFORE" -eq 0 ]; then
                    echo "[INFO] Nothing to delete."
                    exit 0
                  fi

                  # Delete files older than 90 minutes.
                  # Retention = 90 min, connector log.mining.archive.log.hours = 1 (60 min).
                  # This gives a 30-minute safety buffer between the oldest log Debezium
                  # might need and the oldest log on disk.
                  kubectl -n prod exec "$ORA_POD" -- \
                    bash -c 'find /opt/oracle/homes/OraDBHome21cXE/dbs/ \
                      -name "arch1_*.dbf" -mmin +90 -delete 2>/dev/null; echo "done"'

                  # Count remaining
                  AFTER=$(kubectl -n prod exec "$ORA_POD" -- \
                    bash -c 'ls /opt/oracle/homes/OraDBHome21cXE/dbs/arch1_*.dbf 2>/dev/null | wc -l' \
                    2>/dev/null || echo 0)

                  echo "[INFO] Deleted $BEFORE file(s). Remaining: $AFTER"

                  # Report disk usage
                  kubectl -n prod exec "$ORA_POD" -- \
                    df -h /opt/oracle/homes/OraDBHome21cXE/dbs/ 2>/dev/null || true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
