# =============================================================================
# PostgreSQL 17 — prod namespace  (single-replica — master node only)
# Image  : 192.168.1.50:30500/library/postgres:17
# Access : postgresql.prod.svc.cluster.local:5432  (internal)
#          NodePort 192.168.1.50:30532              (external)
# DBs    : metadata, kestra, sqlmesh_state, ranger, polaris
# Secret : postgresql-credentials  (key: postgres-password)
# =============================================================================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  namespace: prod
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init
  namespace: prod
data:
  01-create-dbs.sql: |
    CREATE DATABASE kestra;
    CREATE DATABASE sqlmesh_state;
    CREATE DATABASE ranger;
    CREATE DATABASE polaris;
  02-create-users.sh: |
    #!/bin/bash
    # Reads service-user passwords from Kubernetes secrets mounted as env vars.
    # The StatefulSet injects KESTRA_DB_PASS, SQLMESH_DB_PASS, RANGER_DB_PASS,
    # POLARIS_DB_PASS from the respective Kubernetes secrets.
    # Falls back to 'changeme' only if the env var is absent (should never happen).
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
      CREATE USER kestra   WITH PASSWORD '${KESTRA_DB_PASS:-changeme}';
      CREATE USER sqlmesh  WITH PASSWORD '${SQLMESH_DB_PASS:-changeme}';
      CREATE USER ranger   WITH PASSWORD '${RANGER_DB_PASS:-changeme}';
      CREATE USER polaris  WITH PASSWORD '${POLARIS_DB_PASS:-changeme}';
      GRANT ALL PRIVILEGES ON DATABASE kestra        TO kestra;
      GRANT ALL PRIVILEGES ON DATABASE sqlmesh_state TO sqlmesh;
      GRANT ALL PRIVILEGES ON DATABASE ranger        TO ranger;
      GRANT ALL PRIVILEGES ON DATABASE polaris       TO polaris;
    EOSQL
  03-ranger-grants.sql: |
    -- Grant full schema ownership to the ranger user so that Ranger's db_setup.py
    -- can CREATE TABLE, SEQUENCE, INDEX, VIEW without permission errors on PostgreSQL 15+.
    \c ranger
    GRANT ALL ON SCHEMA public TO ranger;
    ALTER SCHEMA public OWNER TO ranger;
    -- MySQL-compatibility shim: EclipseLink calls SELECT LAST_INSERT_ID() after
    -- every INSERT to retrieve the generated PK. PostgreSQL has no such function;
    -- we implement it using lastval() which returns the last sequence value used
    -- in the current session (equivalent behaviour for single-statement INSERTs).
    CREATE OR REPLACE FUNCTION last_insert_id()
      RETURNS bigint LANGUAGE plpgsql AS $$
      BEGIN RETURN lastval();
      EXCEPTION WHEN object_not_in_prerequisite_state THEN RETURN 0;
      END; $$;
    CREATE OR REPLACE FUNCTION last_insert_id(val bigint)
      RETURNS bigint LANGUAGE sql AS $$ SELECT val; $$;
    GRANT EXECUTE ON FUNCTION last_insert_id()       TO ranger;
    GRANT EXECUTE ON FUNCTION last_insert_id(bigint) TO ranger;
    -- Same schema-ownership grant for polaris so Polaris can manage its own DDL.
    \c polaris
    GRANT ALL ON SCHEMA public TO polaris;
    ALTER SCHEMA public OWNER TO polaris;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: prod
  labels:
    app: postgresql
spec:
  serviceName: postgresql-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      nodeSelector:
        kubernetes.io/hostname: master.local
      # 60s: allows PostgreSQL to complete its checkpoint and close WAL cleanly.
      # A hard SIGKILL leaves a dirty shutdown requiring crash-recovery on next
      # boot, which can be slow enough to fail the readiness probe.
      terminationGracePeriodSeconds: 60
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: postgresql
          image: 192.168.1.50:30500/library/postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: postgres-password
            - name: POSTGRES_DB
              value: metadata
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # Service-user passwords — read by initdb script 02-create-users.sh.
            # initdb only runs once (on a fresh data directory); on subsequent
            # restarts PostgreSQL skips /docker-entrypoint-initdb.d entirely.
            - name: RANGER_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: ranger-db-credentials
                  key: db-password
            - name: POLARIS_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: polaris-db-credentials
                  key: db-password
            - name: KESTRA_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: kestra-credentials
                  key: db-password
            - name: SQLMESH_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: sqlmesh-credentials
                  key: db-password
          volumeMounts:
            - name: postgresql-storage
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: "2"
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: postgresql-storage
          persistentVolumeClaim:
            claimName: postgresql-data
        - name: init-scripts
          configMap:
            name: postgresql-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-headless
  namespace: prod
spec:
  clusterIP: None
  selector:
    app: postgresql
  ports:
    - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: prod
spec:
  selector:
    app: postgresql
  type: NodePort
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30532
