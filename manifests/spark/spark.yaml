# =============================================================================
# Apache Spark 3.5.1 — 1 master + 3 workers
# Image    : 192.168.1.50:30500/apache/spark:3.5.1
# Access   : http://192.168.1.5x:30707  (Master UI)
#            spark://192.168.1.5x:30777 (RPC)
# Kerberos : krb5.conf mounted from kerberos-integration-config at
#            /etc/krb5.conf.d/cluster.conf on master and all workers.
#            spark-keytab (svc/spark@STARDATADBLABS.LOCAL) mounted at
#            /etc/security/keytabs/spark.service.keytab on master.
#            Toggle: kerberos-integration-config data.kerberos.enabled
#            When enabled=true, add to spark-submit:
#              --conf spark.kerberos.enabled=true
#              --conf spark.kerberos.principal=<user>@STARDATADBLABS.LOCAL
#              --conf spark.kerberos.keytab=/path/to/user.keytab
# =============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master-svc
  namespace: prod
  labels:
    app: spark
    component: master
spec:
  type: NodePort
  selector:
    app: spark
    component: master
  ports:
    - name: rpc
      port: 7077
      targetPort: 7077
      nodePort: 30777
    - name: ui
      port: 8080
      targetPort: 8080
      nodePort: 30707
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master-headless
  namespace: prod
spec:
  clusterIP: None
  selector:
    app: spark
    component: master
  ports:
    - name: rpc
      port: 7077
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: prod
  labels:
    app: spark
    component: master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark
      component: master
  template:
    metadata:
      labels:
        app: spark
        component: master
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  # Restrict to workers that have the spark image cached.
                  # worker4/worker5 are unreachable by SSH and don't have the image.
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - worker1.local
                      - worker2.local
                      - worker3.local
      containers:
        - name: spark-master
          image: 192.168.1.50:30500/apache/spark:3.5.1
          command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
          env:
            - name: SPARK_MASTER_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # ── Kerberos: point JVM JAAS at the cluster krb5.conf ─────────────
            # SPARK_DAEMON_JAVA_OPTS is passed to the master JVM at startup.
            # When kerberos.enabled=true, jobs using GSSAPI will find the KDC.
            - name: SPARK_DAEMON_JAVA_OPTS
              value: "-Djava.security.krb5.conf=/etc/krb5.conf.d/cluster.conf"
          ports:
            - containerPort: 7077
            - containerPort: 8080
          volumeMounts:
            # krb5.conf: included by /etc/krb5.conf via includedir — JVM JAAS
            # uses this to locate kerberos-kdc.prod.svc.cluster.local
            - name: krb5-conf
              mountPath: /etc/krb5.conf.d/cluster.conf
              subPath: krb5.conf
            # spark-keytab: svc/spark@STARDATADBLABS.LOCAL — used by Spark
            # daemons when authenticating to Kerberized data sources (HDFS etc.)
            - name: spark-keytab
              mountPath: /etc/security/keytabs/spark.service.keytab
              subPath: keytab
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 4Gi
              cpu: "2"
      volumes:
        - name: krb5-conf
          configMap:
            name: kerberos-integration-config
            items:
              - key: krb5.conf
                path: krb5.conf
        - name: spark-keytab
          secret:
            secretName: spark-keytab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: prod
  labels:
    app: spark
    component: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spark
      component: worker
  template:
    metadata:
      labels:
        app: spark
        component: worker
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - worker1.local
                      - worker2.local
                      - worker3.local
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: spark
                    component: worker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: spark-worker
          image: 192.168.1.50:30500/apache/spark:3.5.1
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.worker.Worker
            - spark://spark-master-svc.prod.svc.cluster.local:7077
          env:
            - name: SPARK_WORKER_MEMORY
              value: "4g"
            - name: SPARK_WORKER_CORES
              value: "4"
            # ── Kerberos: point JVM JAAS at the cluster krb5.conf ─────────────
            - name: SPARK_DAEMON_JAVA_OPTS
              value: "-Djava.security.krb5.conf=/etc/krb5.conf.d/cluster.conf"
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: krb5-conf
              mountPath: /etc/krb5.conf.d/cluster.conf
              subPath: krb5.conf
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 4Gi
              cpu: "4"
      volumes:
        - name: krb5-conf
          configMap:
            name: kerberos-integration-config
            items:
              - key: krb5.conf
                path: krb5.conf
