# =============================================================================
# Apache Spark 3.5.1 — 1 master + 3 standard workers + 1 large worker
# Image    : 192.168.1.50:30500/spark-gluten-velox:3.5.1-35
# Access   : http://192.168.1.5x:30707  (Master UI — no auth gate)
#            spark://192.168.1.5x:30777 (RPC — via krb-spark-guard)
#
# Worker layout:
#   spark-worker        (replicas=3) — worker2/worker3/worker4 (workload=spark-opensearch)
#   spark-worker-large  (replicas=1) — worker2/worker3/worker4 (workload=spark-opensearch)
#                                      spread across spark-opensearch pool
#
# Pre-requisite: spark-gluten-velox:3.5.1 must be cached on worker5 before
# spark-worker-large is scheduled.  Apply spark-image-pull.yaml first and wait
# for its pod on worker5 to complete, then apply this file.
#
# Kerberos enforcement — krb-spark-guard sidecar:
#   Spark standalone has no auth gate on port 7077. The krb-spark-guard sidecar
#   implements KDC enforcement at the TCP connection level.
#
#   Architecture:
#     spark-submit-krb → POST :7078/auth (guard HTTP API) → KDC keytab check
#                     → X-Krb-Token header → TCP :7077 (guard RPC proxy)
#                                         → :17077 (real Spark master, internal)
#
#   The guard:
#     1. HTTP API (:7078): accepts {username, keytab_b64}, verifies keytab
#        against the KDC (kinit -kt), returns a short-lived token.
#     2. RPC proxy (:7077): expects first line "X-Krb-Token: <token>\n",
#        validates the token, then transparently forwards to Spark :17077.
#
#   The real Spark master listens on :17077 (internal only).
#   The Service exposes :7077 → guard's RPC proxy.
#   Use spark-submit-krb (installed in the guard image) instead of spark-submit.
#
# Kerberos : krb5.conf mounted from kerberos-integration-config at
#            /etc/krb5.conf.d/cluster.conf on master and all workers.
#            spark-keytab (svc/spark@STARDATADBLABS.LOCAL) mounted on master.
# =============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master-svc
  namespace: prod
  labels:
    app: spark
    component: master
spec:
  type: NodePort
  selector:
    app: spark
    component: master
  ports:
    # RPC port → krb-spark-guard proxy (:7077). Guard validates KDC before forwarding.
    - name: rpc
      port: 7077
      targetPort: 7077
      nodePort: 30777
    # Guard HTTP auth API — exposed so spark-submit-krb can call it from outside
    - name: guard-auth
      port: 7078
      targetPort: 7078
      nodePort: 30778
    - name: ui
      port: 8080
      targetPort: 8080
      nodePort: 30707
    # Spark standalone REST submission API — required for write-pushdown (doris-write-proxy)
    - name: rest-api
      port: 6066
      targetPort: 6066
      nodePort: 30606
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master-headless
  namespace: prod
spec:
  clusterIP: None
  selector:
    app: spark
    component: master
  ports:
    # Workers connect directly to the master via headless DNS — through guard
    - name: rpc
      port: 7077
---
# ── Internal service — direct access to Spark master (no guard) ──────────────
# Workers and in-cluster drivers connect here (port 17077) to bypass the
# krb-spark-guard sidecar.  Not exposed via NodePort — cluster-internal only.
apiVersion: v1
kind: Service
metadata:
  name: spark-master-internal
  namespace: prod
  labels:
    app: spark
    component: master
spec:
  type: ClusterIP
  selector:
    app: spark
    component: master
  ports:
    - name: rpc-internal
      port: 17077
      targetPort: 17077
    # REST submission API — in-cluster access for write-proxy and cache-manager
    - name: rest-api
      port: 6066
      targetPort: 6066
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: prod
  labels:
    app: spark
    component: master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark
      component: master
  template:
    metadata:
      labels:
        app: spark
        component: master
    spec:
      serviceAccountName: spark-guardian
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "spark-opensearch"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  # Restrict to workers that have the spark image cached.
                  # worker4/worker5 are unreachable by SSH and don't have the image.
                  - key: workload
                    operator: In
                    values:
                      - spark-opensearch
      containers:
        # ── spark-guardian sidecar ───────────────────────────────────────────
        # Polls localhost:8080/json/ every 15 s.
        # Kill rules: E (over-limit), A (dead driver), B (no executors),
        #             C (starvation), D (idle session).
        # Autoscale: scales spark-worker Deployment 0→3 when jobs arrive,
        #            back to 0 after SCALE_DOWN_IDLE_S of cluster silence.
        - name: spark-guardian
          image: 192.168.1.50:30500/spark-gluten-velox:3.5.1-35
          command: ["python3", "/opt/spark/work-dir/spark-guardian.py"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: SPARK_MASTER_UI
              value: "http://localhost:8080"
            - name: POLL_INTERVAL_S
              value: "15"
            - name: MAX_CORES_PER_APP
              value: "3"
            - name: MAX_MEM_MB_PER_APP
              value: "1024"
            - name: ORPHAN_RUNNING_S
              value: "120"
            - name: ORPHAN_WAITING_S
              value: "120"
            - name: ACTIVITY_CHECK_AFTER_S
              value: "300"
            - name: IDLE_SINCE_S
              value: "300"
            - name: DRY_RUN
              value: "0"
            # ── Worker autoscaling ───────────────────────────────────────────
            - name: AUTOSCALE
              value: "1"
            - name: WORKER_DEPLOYMENT
              value: "spark-worker"
            - name: WORKER_NAMESPACE
              value: "prod"
            - name: WORKER_REPLICAS
              value: "3"
            # Scale workers back to 0 after 2 min of cluster silence
            - name: SCALE_DOWN_IDLE_S
              value: "120"
          resources:
            requests:
              memory: 64Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 100m

        # ── krb-spark-guard sidecar ──────────────────────────────────────────
        # Port 7077: RPC proxy — validates X-Krb-Token before forwarding to :17077
        # Port 7078: HTTP auth API — POST /auth {username,keytab_b64} → token
        # Built from docker/krb-spark-guard/ — see build-and-push.sh.
        - name: krb-spark-guard
          image: 192.168.1.50:30500/krb-spark-guard:1.0.0
          env:
            - name: KDC_REALM
              value: "STARDATADBLABS.LOCAL"
            - name: KRB5_CONFIG
              value: "/etc/krb5.conf.d/cluster.conf"
            - name: SPARK_HOST
              value: "127.0.0.1"
            - name: SPARK_PORT
              value: "17077"
            - name: LISTEN_RPC_PORT
              value: "7077"
            - name: LISTEN_AUTH_PORT
              value: "7078"
            - name: TOKEN_TTL
              value: "300"
            - name: LOG_LEVEL
              value: "INFO"
          ports:
            - name: guard-rpc
              containerPort: 7077
            - name: guard-auth
              containerPort: 7078
          volumeMounts:
            - name: krb5-conf
              mountPath: /etc/krb5.conf.d/cluster.conf
              subPath: krb5.conf
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          readinessProbe:
            tcpSocket:
              port: 7077
            initialDelaySeconds: 5
            periodSeconds: 10

        # ── Spark Master (internal port 17077) ───────────────────────────────
        # Listens on 17077 — NOT exposed by the Service directly.
        # Only the krb-spark-guard sidecar (127.0.0.1:7077) forwards to it.
        - name: spark-master
          image: 192.168.1.50:30500/spark-gluten-velox:3.5.1-35
          command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
          env:
            - name: SPARK_MASTER_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SPARK_DAEMON_JAVA_OPTS
              value: "-Djava.security.krb5.conf=/etc/krb5.conf.d/cluster.conf -Dspark.master.rest.enabled=true -Dspark.master.rest.port=6066"
            # Tell Spark master to bind on port 17077 (guard proxies 7077→17077)
            - name: SPARK_MASTER_PORT
              value: "17077"
            # Enable the Spark standalone REST submission API on port 6066.
            # Required for doris-write-proxy and doris-cache-manager write-pushdown.
            - name: SPARK_MASTER_REST_PORT
              value: "6066"
          ports:
            - containerPort: 17077
            - containerPort: 8080
            - name: rest-api
              containerPort: 6066
          volumeMounts:
            # krb5.conf: included by /etc/krb5.conf via includedir — JVM JAAS
            # uses this to locate kerberos-kdc.prod.svc.cluster.local
            - name: krb5-conf
              mountPath: /etc/krb5.conf.d/cluster.conf
              subPath: krb5.conf
            # spark-keytab: svc/spark@STARDATADBLABS.LOCAL — used by Spark
            # daemons when authenticating to Kerberized data sources (HDFS etc.)
            - name: spark-keytab
              mountPath: /etc/security/keytabs/spark.service.keytab
              subPath: keytab
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 4Gi
              cpu: "2"
      volumes:
        - name: krb5-conf
          configMap:
            name: kerberos-integration-config
            items:
              - key: krb5.conf
                path: krb5.conf
        - name: spark-keytab
          secret:
            secretName: spark-keytab
---
# ── Standard workers — worker2 / worker3 / worker4 (workload=spark-opensearch) ─
# replicas=0  → idle, consumes no resources.
# Scale up to 3 when jobs are needed:
#   kubectl scale deployment/spark-worker -n prod --replicas=3
#
# When active: SPARK_WORKER_MEMORY=900m (fits 1.1Gi container limit with JVM overhead).
# Each executor: spark.executor.memory=450m + overhead=384m = 834m total < 900m.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: prod
  labels:
    app: spark
    component: worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app: spark
      component: worker
  template:
    metadata:
      labels:
        app: spark
        component: worker
    spec:
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "spark-opensearch"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values:
                      - spark-opensearch
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: spark
                    component: worker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: spark-worker
          image: 192.168.1.50:30500/spark-gluten-velox:3.5.1-35
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.worker.Worker
            - spark://spark-master-internal.prod.svc.cluster.local:17077
          env:
            - name: SPARK_WORKER_MEMORY
              value: "900m"
            - name: SPARK_WORKER_CORES
              value: "3"
            # ── Kerberos: point JVM JAAS at the cluster krb5.conf ─────────────
            - name: SPARK_DAEMON_JAVA_OPTS
              value: "-Djava.security.krb5.conf=/etc/krb5.conf.d/cluster.conf"
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: krb5-conf
              mountPath: /etc/krb5.conf.d/cluster.conf
              subPath: krb5.conf
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "3"
              memory: "1100Mi"
      volumes:
        - name: krb5-conf
          configMap:
            name: kerberos-integration-config
            items:
              - key: krb5.conf
                path: krb5.conf
---
# ── Large worker — spark-opensearch pool (worker2/3/4) ────────────────────────
# replicas=0  → idle, consumes no resources.
# Scale up to 1 for heavy single-job workloads:
#   kubectl scale deployment/spark-worker-large -n prod --replicas=1
#
# When active: SPARK_WORKER_MEMORY=900m, max 3 CPU / 1100Mi — same cap as standard
# worker. The "large" distinction is its anti-affinity (it won't co-locate with
# standard workers) so it gets a dedicated node for burst work.
#
# NOTE: nodes worker2/3/4 are 9Gi machines. The old 12g/14Gi config exceeded the
# node size causing OOMKill (exit 137). Fixed to fit within the 9Gi allocatable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker-large
  namespace: prod
  labels:
    app: spark
    component: worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app: spark
      component: worker-large
  template:
    metadata:
      labels:
        app: spark
        component: worker-large
    spec:
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "spark-opensearch"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values:
                      - spark-opensearch
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: spark
                    component: worker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: spark-worker
          image: 192.168.1.50:30500/spark-gluten-velox:3.5.1-35
          imagePullPolicy: Always
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.worker.Worker
            - spark://spark-master-internal.prod.svc.cluster.local:17077
          env:
            - name: SPARK_WORKER_MEMORY
              value: "900m"
            - name: SPARK_WORKER_CORES
              value: "3"
            # ── Kerberos: point JVM JAAS at the cluster krb5.conf ─────────────
            - name: SPARK_DAEMON_JAVA_OPTS
              value: "-Djava.security.krb5.conf=/etc/krb5.conf.d/cluster.conf"
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: krb5-conf
              mountPath: /etc/krb5.conf.d/cluster.conf
              subPath: krb5.conf
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "3"
              memory: "1100Mi"
      volumes:
        - name: krb5-conf
          configMap:
            name: kerberos-integration-config
            items:
              - key: krb5.conf
                path: krb5.conf
