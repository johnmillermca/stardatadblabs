# =============================================================================
# Strimzi-managed Kafka cluster — prod namespace  (single-broker, no HA)
# Namespace   : prod
# Node        : worker4.local (pinned via pod affinity on KafkaNodePool)
# Topology    : 1 combined controller+broker (KRaft) — single replica
# Listeners   :
#   PLAIN  port 9092 — SCRAM-SHA-512 in-cluster
#   EXTERNAL port 9094 → NodePort 30093 — external access
# Bootstrap   : strimzi-kafka-kafka-bootstrap.prod.svc.cluster.local:9092
# Kafka ver   : 4.2.0 (matches installed Strimzi operator)
# PVC         : 50Gi on /home (worker4.local)
# =============================================================================

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 250Gi
    class: local-path
    deleteClaim: false
  resources:
    requests:
      # Request must reflect actual JVM consumption:
      #   Heap:        2Gi  (STRIMZI_DYNAMIC_HEAP_PERCENTAGE=50% of 4Gi limit)
      #   JVM overhead: ~1Gi  (metaspace, thread stacks, JIT code cache, off-heap)
      #   OS + buffers: ~0.5Gi
      # With request=1Gi the node scheduler undersizes the pod; under memory
      # pressure the kernel OOM-kills the admin client thread inside the JVM
      # which causes "describeMetadataQuorum" timeouts → operator stamps
      # NotReady on the Kafka CR every reconcile cycle.
      memory: 3.5Gi
      cpu: 500m
    limits:
      memory: 4Gi
      cpu: "2"
  template:
    # Annotate Strimzi-created PVCs so ArgoCD treats them as unmanaged (IgnoreExtraneous).
    # Without this, ArgoCD prune:true deletes these PVCs on every sync because they
    # don't exist in the git manifests — wiping all Kafka data.
    persistentVolumeClaim:
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - worker4.local
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      # Give KRaft enough time to flush the metadata log cleanly on shutdown.
      # 30s (default) is too short — an unclean stop leaves more log to replay
      # on the next boot, widening the window where the operator races controller
      # election and stamps NotReady on the Kafka CR.
      terminationGracePeriodSeconds: 120

---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: strimzi-kafka
  namespace: prod
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.2.0
    metadataVersion: "4.2-IV1"
    image: 192.168.1.50:30500/strimzi/kafka:latest-kafka-4.2.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
      - name: external
        port: 9094
        type: nodeport
        tls: false
        authentication:
          type: scram-sha-512
        configuration:
          bootstrap:
            nodePort: 30093
    config:
      offsets.topic.replication.factor: "1"
      transaction.state.log.replication.factor: "1"
      transaction.state.log.min.isr: "1"
      default.replication.factor: "1"
      min.insync.replicas: "1"
      auto.create.topics.enable: "true"
  entityOperator:
    topicOperator: {}
    userOperator: {}

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: kafka-app-user
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  authentication:
    type: scram-sha-512

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: debezium-user
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  authentication:
    type: scram-sha-512

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: schema-registry-user
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  authentication:
    type: scram-sha-512

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: debezium-offsets
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: compact

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: debezium-configs
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: compact

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: debezium-statuses
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: compact

---
# _schemas is the internal topic used by Confluent Schema Registry to store
# all registered schemas. It MUST have cleanup.policy=compact — SR refuses to
# start if it finds cleanup.policy=delete (the Kafka auto-create default).
# CR name must be a valid RFC 1123 subdomain, so we use 'schemas-internal' and
# set topicName to the actual Kafka topic name '_schemas'.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: schemas-internal
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  topicName: "_schemas"
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: compact
    min.compaction.lag.ms: "0"
    # Retain schemas forever — never expire them by size or time.
    retention.ms: "-1"
    retention.bytes: "-1"

---
# schema-registry-schemas is kept for backwards compatibility but is no longer
# used by Schema Registry (which always targets _schemas).
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: schema-registry-schemas
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: compact
    min.compaction.lag.ms: "0"
