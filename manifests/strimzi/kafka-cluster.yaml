# =============================================================================
# Strimzi-managed Kafka cluster — prod namespace  (single-broker, no HA)
# Namespace   : prod
# Node        : worker4.local (pinned via pod affinity on KafkaNodePool)
# Topology    : 1 combined controller+broker (KRaft) — single replica
#
# Listeners   :
#   INTERNAL port 9092 — SCRAM-SHA-512, in-cluster only
#             Used exclusively by Strimzi operators (topic/user operator) and
#             internal Ranger plugin polling. NOT exposed to end-users.
#   KRB      port 9093 — GSSAPI/Kerberos, in-cluster
#             THE ONLY USER-FACING LISTENER.
#             Requires a valid Kerberos TGT (kinit / keytab).
#             No KDC principal = no ticket = connection refused at SASL handshake.
#
# NOTE: External SCRAM NodePort (9094/30093) has been REMOVED.
#       Users must authenticate via Kerberos on port 9093.
#       allow.everyone.if.no.acl.found=false — unknown users are hard-denied.
#
# Bootstrap   : strimzi-kafka-kafka-bootstrap.prod.svc.cluster.local:9092 (operators)
#               strimzi-kafka-kafka-bootstrap.prod.svc.cluster.local:9093 (users/GSSAPI)
# Kafka ver   : 4.2.0 (matches installed Strimzi operator)
# PVC         : 250Gi on /home (worker4.local) — reclaimPolicy: Retain
#               PV: pvc-69ed15cb-feae-4d77-9f1f-362778687016
#               hostPath: /home/local-path-provisioner/
#                 pvc-69ed15cb-feae-4d77-9f1f-362778687016_prod_data-strimzi-kafka-combined-0
# Ranger      : Image latest-kafka-4.2.0-ranger includes ranger-kafka-plugin JARs.
#               ConfigMap kafka-ranger-config mounts security+audit XMLs into
#               /mnt/ranger-conf/ via KafkaNodePool template.pod.volumes +
#               template.kafkaContainer.volumeMounts (KafkaNodePool propagates
#               volumes correctly; Kafka CR template.pod.volumes does NOT).
#               CLASSPATH=/mnt/ranger-conf adds XMLs to the JVM classpath.
#               Authorizer: spec.kafka.authorization.type=custom +
#                 authorizerClass=RangerKafkaAuthorizer (NOT config{} — Strimzi
#                 strips authorizer.class.name from config silently).
#               allow.everyone.if.no.acl.found=false — hard deny for unknown users.
#               KRaft mode — no ZooKeeper. zookeeper.connect in Ranger service
#               config is a schema-required dummy value, ignored at runtime.
#               Plugin connects via bootstrap:9092 + SASL_PLAINTEXT/SCRAM.
# Kerberos    : GSSAPI listener (port 9093) — active, KDC-enforced.
#               Principal: svc/kafka@STARDATADBLABS.LOCAL (secret: kafka-keytab)
#               Ranger sees stripped username (alice, not alice@STARDATADBLABS.LOCAL)
#               because sasl.kerberos.principal.to.local.rules: DEFAULT strips realm.
#               Inter-broker protocol: SCRAM-SHA-512 on port 9092 (overrides Strimzi
#               auto-detection which would otherwise set GSSAPI and crash the broker).
# =============================================================================

---
# ── Kafka GSSAPI JAAS configuration (kerberos.enabled=true) ────────────────
# Kafka requires a server-side JAAS file with a 'KafkaServer' stanza when any
# listener uses GSSAPI. The KRB listener config supplies the client-facing JAAS
# via listenerConfig, but the JVM still requires java.security.auth.login.config
# to point at a file containing a KafkaServer entry.
# This ConfigMap is mounted at /mnt/kafka-jaas/jaas.conf.
# The KAFKA_OPTS env var must include:
#   -Djava.security.auth.login.config=/mnt/kafka-jaas/jaas.conf
#   -Djava.security.krb5.conf=/mnt/krb5-conf/cluster.conf
# Principal: svc/kafka@STARDATADBLABS.LOCAL, keytab: /mnt/kafka-keytab/keytab
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-gssapi-jaas
  namespace: prod
  labels:
    argocd.argoproj.io/instance: strimzi-kafka
data:
  jaas.conf: |
    KafkaServer {
      com.sun.security.auth.module.Krb5LoginModule required
      useKeyTab=true
      storeKey=true
      keyTab="/mnt/kafka-keytab/keytab"
      principal="svc/kafka@STARDATADBLABS.LOCAL"
      isInitiator=false;
    };

    KafkaClient {
      com.sun.security.auth.module.Krb5LoginModule required
      useKeyTab=true
      storeKey=true
      keyTab="/mnt/kafka-keytab/keytab"
      principal="svc/kafka@STARDATADBLABS.LOCAL";
    };
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-ranger-config
  namespace: prod
data:
  core-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!--
      Hadoop Configuration loaded by RangerBasePlugin via ClassLoader.getResource().
      Sets NullGroupsMapping so Hadoop UGI returns empty groups for any principal
      without shelling out to 'id' — silences the flood of:
        WARN ShellBasedUnixGroupsMapping: unable to return groups for user ...
      NullGroupsMapping exists in hadoop-common-3.3.6 (StaticMapping does not).
    -->
    <configuration>
      <!--
        Use simple (non-Kerberos) auth so UserGroupInformation.getLoginUser()
        succeeds without a keytab. Without this, MiscUtil.getUGILoginUser()
        attempts a Kerberos login, fails, and the PolicyRefresher background
        thread corrupts the policy engine with a null result → all denied.
      -->
      <property>
        <name>hadoop.security.authentication</name>
        <value>simple</value>
      </property>
      <property>
        <name>hadoop.security.authorization</name>
        <value>false</value>
      </property>
      <property>
        <name>hadoop.security.group.mapping</name>
        <value>org.apache.hadoop.security.NullGroupsMapping</value>
      </property>
    </configuration>
  ranger-kafka-security.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property>
        <name>ranger.plugin.kafka.policy.source.impl</name>
        <value>org.apache.ranger.admin.client.RangerAdminRESTClient</value>
      </property>
      <property>
        <name>ranger.plugin.kafka.service.name</name>
        <value>kafka</value>
      </property>
      <property>
        <name>ranger.plugin.kafka.policy.rest.url</name>
        <value>http://ranger-admin.prod.svc.cluster.local:6080</value>
      </property>
      <property>
        <name>ranger.plugin.kafka.policy.pollIntervalMs</name>
        <value>30000</value>
      </property>
      <property>
        <name>ranger.plugin.kafka.policy.cache.dir</name>
        <value>/tmp/ranger-kafka-cache</value>
      </property>
      <!--
        Credentials used by the Ranger plugin to authenticate against Ranger Admin
        when downloading policies. Must match the username configured in the Ranger
        kafka service (policy.download.auth.users = kafka-app-user).
      -->
      <property>
        <name>ranger.plugin.kafka.policy.rest.supports.policy.deltas</name>
        <value>false</value>
      </property>
      <property>
        <name>ranger.plugin.kafka.policy.rest.client.username</name>
        <value>kafka-app-user</value>
      </property>
      <property>
        <name>ranger.plugin.kafka.policy.rest.client.password</name>
        <value>mJnehIiUo9zzg4qTPVK8LmLeuC0yNM2T</value>
      </property>
    </configuration>
  ranger-kafka-audit.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property>
        <name>xasecure.audit.is.enabled</name>
        <value>true</value>
      </property>
      <property>
        <name>xasecure.audit.db.is.enabled</name>
        <value>false</value>
      </property>
      <property>
        <name>xasecure.audit.solr.is.enabled</name>
        <value>false</value>
      </property>
    </configuration>

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 250Gi
    class: local-path
    deleteClaim: false
  resources:
    requests:
      # Request must reflect actual JVM consumption:
      #   Heap:        2Gi  (STRIMZI_DYNAMIC_HEAP_PERCENTAGE=50% of 4Gi limit)
      #   JVM overhead: ~1Gi  (metaspace, thread stacks, JIT code cache, off-heap)
      #   OS + buffers: ~0.5Gi
      # With request=1Gi the node scheduler undersizes the pod; under memory
      # pressure the kernel OOM-kills the admin client thread inside the JVM
      # which causes "describeMetadataQuorum" timeouts → operator stamps
      # NotReady on the Kafka CR every reconcile cycle.
      memory: 3.5Gi
      cpu: 500m
    limits:
      memory: 4Gi
      cpu: "2"
  template:
    # Annotate Strimzi-created PVCs so ArgoCD treats them as unmanaged (IgnoreExtraneous).
    # Without this, ArgoCD prune:true deletes these PVCs on every sync because they
    # don't exist in the git manifests — wiping all Kafka data.
    persistentVolumeClaim:
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
    # NOTE: clusterRoleBinding is NOT a valid field in KafkaNodePool spec.template
    # (not declared in the CRD schema). Having it here causes ArgoCD ServerSideApply
    # to throw "field not declared in schema" → ComparisonError → Unknown sync status.
    # The kafka-init CRB is instead ignored via ignoreDifferences in app-strimzi-kafka.yaml.
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - worker4.local
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      # Give KRaft enough time to flush the metadata log cleanly on shutdown.
      # 30s (default) is too short — an unclean stop leaves more log to replay
      # on the next boot, widening the window where the operator races controller
      # election and stamps NotReady on the Kafka CR.
      terminationGracePeriodSeconds: 120
      # ── Ranger config XMLs ────────────────────────────────────────────────
      # template.pod.volumes in KafkaNodePool propagates to the StrimziPodSet
      # pod spec correctly (unlike Kafka CR template.pod.volumes which does not).
      # Strimzi only allows mountPaths under /mnt (enforced by operator).
      volumes:
        - name: ranger-config
          configMap:
            name: kafka-ranger-config
        # ── krb5.conf — always present ─────────────────────────────────────
        - name: krb5-conf
          configMap:
            name: kerberos-integration-config
            items:
              - key: krb5.conf
                path: krb5.conf
        # ── Kerberos volumes (active) ──────────────────────────────────────
        - name: kafka-keytab
          secret:
            secretName: kafka-keytab
        - name: kafka-jaas
          configMap:
            name: kafka-gssapi-jaas
    kafkaContainer:
      env:
        # CLASSPATH is the seed variable read by kafka-run-class.sh; all
        # internal lib dirs are appended to it. Setting it here puts
        # /mnt/ranger-conf on the JVM classpath so RangerConfiguration can
        # resolve ranger-kafka-security.xml and ranger-kafka-audit.xml via
        # ClassLoader.getResource() — which is how RangerPluginConfig loads
        # its config files.
        # NOTE: KAFKA_CLASSPATH (the previous name) is not read by any script
        # in the Strimzi/Kafka image — it was a no-op.
        - name: CLASSPATH
          value: /mnt/ranger-conf
        # Ranger's MiscUtil.getUGILoginUser() calls UnixLoginModule which reads
        # System.getProperty("user.name"). The broker runs as UID 1000 with no
        # /etc/passwd entry, so user.name is null → NullPointerException in
        # UnixPrincipal → "Error getting UGI" on every PolicyRefresher cycle →
        # eventually corrupts the policy engine. Setting user.name explicitly
        # gives UnixLoginModule a valid non-null name to construct the principal.
        # JAAS config is required so the JVM can find the KafkaServer entry
        # for GSSAPI. Without this flag the broker crashes with:
        #   "Could not find a 'KafkaServer' entry in the JAAS configuration"
        - name: KAFKA_OPTS
          value: >-
            -Duser.name=kafka
            -Djava.security.krb5.conf=/mnt/krb5-conf/cluster.conf
            -Djava.security.auth.login.config=/mnt/kafka-jaas/jaas.conf
      volumeMounts:
        - name: ranger-config
          mountPath: /mnt/ranger-conf
        # krb5.conf — always mounted (harmless when Kerberos disabled)
        - name: krb5-conf
          mountPath: /mnt/krb5-conf/cluster.conf
          subPath: krb5.conf
        # ── Kerberos keytab + JAAS mounts (active) ─────────────────────────
        - name: kafka-keytab
          mountPath: /mnt/kafka-keytab
        - name: kafka-jaas
          mountPath: /mnt/kafka-jaas

---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: strimzi-kafka
  namespace: prod
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.2.0
    metadataVersion: "4.2-IV1"
    image: 192.168.1.50:30500/strimzi/kafka:latest-kafka-4.2.0-ranger-v6
    listeners:
      # ── Internal SCRAM listener — operators + Ranger plugin ONLY ─────────
      # Strimzi topic/user operators and the Ranger plugin use this listener.
      # Users MUST NOT connect here. KDC enforcement is on port 9093 (krb).
      - name: plain
        port: 9092
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
      # ── Kerberos GSSAPI listener — USER-FACING, KDC-enforced ─────────────
      # This is the ONLY listener users connect to. A valid Kerberos TGT is
      # required. No KDC principal → kinit fails → no ticket → SASL rejected.
      # Inter-broker protocol is overridden to SCRAM-SHA-512 (see config below)
      # so adding this GSSAPI listener does NOT break broker-to-broker comms.
      # Client config:
      #   security.protocol=SASL_PLAINTEXT
      #   sasl.mechanism=GSSAPI
      #   sasl.kerberos.service.name=svc
      #   bootstrap.servers=strimzi-kafka-kafka-bootstrap.prod.svc.cluster.local:9093
      - name: krb
        port: 9093
        type: internal
        tls: false
        authentication:
          type: custom
          sasl: true
          listenerConfig:
            sasl.enabled.mechanisms: GSSAPI
            sasl.kerberos.service.name: svc
            listener.name.krb.gssapi.sasl.jaas.config: >-
              com.sun.security.auth.module.Krb5LoginModule required
              useKeyTab=true
              storeKey=true
              keyTab="/mnt/kafka-keytab/keytab"
              principal="svc/kafka@STARDATADBLABS.LOCAL"
              isInitiator=false;
            sasl.kerberos.principal.to.local.rules: DEFAULT
    # ── Ranger Kafka Authorizer ───────────────────────────────────────────────
    # type=custom + authorizerClass is the correct approach for any third-party
    # authorizer (Ranger, OPA, etc.). Setting authorizer.class.name in config{}
    # is silently stripped by the operator.
    # supportsAdminApi=true: required for Ranger — routes all admin calls through
    # the authorizer normally. Without it the Topic Operator times out.
    # allow.everyone.if.no.acl.found=false: HARD DENY for unknown users.
    # A user with a valid KDC principal+ticket authenticates fine but still needs
    # an explicit Ranger Allow policy. Without it they are denied.
    authorization:
      type: custom
      authorizerClass: org.apache.ranger.authorization.kafka.authorizer.RangerKafkaAuthorizer
      supportsAdminApi: true
    config:
      allow.everyone.if.no.acl.found: "false"
      # ── Inter-broker protocol override — CRITICAL for GSSAPI listener ────
      # When Strimzi detects any GSSAPI listener it auto-sets inter-broker
      # protocol to GSSAPI, which breaks broker comms (no inter-broker keytab
      # for GSSAPI). Explicitly setting SCRAM-SHA-512 here overrides that
      # auto-detection and keeps inter-broker traffic on the plain:9092 SCRAM
      # listener. This is the fix for the previous crash:
      #   "sasl.mechanism.inter.broker.protocol=GSSAPI but no KafkaServer entry"
      sasl.mechanism.inter.broker.protocol: SCRAM-SHA-512
      inter.broker.listener.name: plain
      offsets.topic.replication.factor: "1"
      transaction.state.log.replication.factor: "1"
      transaction.state.log.min.isr: "1"
      default.replication.factor: "1"
      min.insync.replicas: "1"
      # Disable auto-create: the Strimzi topic operator manages all topics
      # declaratively via KafkaTopic CRs. auto.create.topics.enable=true causes
      # races where Kafka creates a topic with default settings before the operator
      # can apply the KafkaTopic spec (wrong retention, partitions, compaction etc).
      auto.create.topics.enable: "false"
      # ── Durability: flush to disk before OS page-cache writeback ─────────────
      # Flush every 10 000 messages OR every 1 000ms — whichever comes first.
      # Default (flush only on page-cache eviction) means up to ~5s of data is
      # unsynced to disk on a hard power failure. These values cap that window.
      log.flush.interval.messages: "10000"
      log.flush.interval.ms: "1000"
      # ── Log retention ─────────────────────────────────────────────────────────
      # Keep log segments for 7 days (default). Check interval reduced to 1 min
      # so compacted topics reclaim space promptly after restart.
      log.retention.hours: "168"
      log.retention.check.interval.ms: "60000"
  entityOperator:
    topicOperator:
      # Resources for the topic-operator JVM.
      # Default 512Mi limit causes OOM when reconciling many topics on startup
      # (8 restarts observed — all exit code 1 / OOM). Bump to 1Gi.
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 1Gi
          cpu: 500m
      # Allow up to 3 min for Kafka bootstrap to be ready before declaring
      # the operator unhealthy. On reboot, Kafka KRaft leader election can
      # take 60–90 s; without a startupProbe the liveness probe fires first
      # and restarts the operator — causing the 8 crash-loops seen in prod.
      startupProbe:
        initialDelaySeconds: 30
        timeoutSeconds: 10
        periodSeconds: 15
        failureThreshold: 12   # 30 + 12×15 = 210s max wait for Kafka ready
      livenessProbe:
        initialDelaySeconds: 0
        timeoutSeconds: 10
        periodSeconds: 30
        failureThreshold: 3
      readinessProbe:
        initialDelaySeconds: 0
        timeoutSeconds: 10
        periodSeconds: 30
        failureThreshold: 3
    userOperator:
      # NOTE: startupProbe is NOT in the userOperator CRD schema (only topicOperator
      # supports it). terminationGracePeriodSeconds is controlled by the entityOperator
      # Deployment — no spec.template on the Kafka CR (not in CRD schema either).
      #
      # secretPrefix is not needed — KafkaUser secrets are named after the user.
      # reconciliationIntervalSeconds default 120s is fine.
      #
      # aclsAdminApiSupported=false: Ranger does not implement the Kafka ACL store
      # API (acls(), createAcls(), deleteAcls() all throw UnsupportedOperationException).
      # Setting this false stops the User Operator from calling DESCRIBE_ACLS /
      # CREATE_ACLS, eliminating the AclCache failed to update errors and the
      # KafkaUser NotReady condition. SCRAM credential management is unaffected —
      # it uses the ALTER_USER_SCRAM_CREDENTIALS API, not ACLs.
      aclsAdminApiSupported: false
      resources:
        requests:
          memory: 128Mi
          cpu: 50m
        limits:
          memory: 512Mi
          cpu: 250m
      livenessProbe:
        initialDelaySeconds: 60
        timeoutSeconds: 10
        periodSeconds: 30
        failureThreshold: 3
      readinessProbe:
        initialDelaySeconds: 60
        timeoutSeconds: 10
        periodSeconds: 30
        failureThreshold: 3

