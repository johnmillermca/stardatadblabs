# =============================================================================
# Strimzi-managed Kafka cluster — prod namespace  (single-broker, no HA)
# Namespace   : prod
# Node        : worker4.local (pinned via pod affinity on KafkaNodePool)
# Topology    : 1 combined controller+broker (KRaft) — single replica
#
# Listeners   :
#   INTERNAL port 9092 — SCRAM-SHA-512, in-cluster only
#             Used exclusively by Strimzi operators (topic/user operator).
#             NOT exposed to end-users.
#   KRB      port 9093 — GSSAPI/Kerberos, in-cluster
#             THE ONLY USER-FACING LISTENER.
#             Requires a valid Kerberos TGT (kinit / keytab).
#             No KDC principal = no ticket = connection refused at SASL handshake.
#
# NOTE: External SCRAM NodePort (9094/30093) has been REMOVED.
#       Users must authenticate via Kerberos on port 9093.
#
# Bootstrap   : strimzi-kafka-kafka-bootstrap.prod.svc.cluster.local:9092 (operators)
#               strimzi-kafka-kafka-bootstrap.prod.svc.cluster.local:9093 (users/GSSAPI)
# Kafka ver   : 4.2.0 (matches installed Strimzi operator)
# PVC         : 250Gi on /home (worker4.local) — reclaimPolicy: Retain
#               PV: pvc-69ed15cb-feae-4d77-9f1f-362778687016
#               hostPath: /home/local-path-provisioner/
#                 pvc-69ed15cb-feae-4d77-9f1f-362778687016_prod_data-strimzi-kafka-combined-0
# Kerberos    : GSSAPI listener (port 9093) — active, KDC-enforced.
#               Principal: svc/kafka@STARDATADBLABS.LOCAL (secret: kafka-keytab)
#               Stripped username (alice, not alice@STARDATADBLABS.LOCAL)
#               because sasl.kerberos.principal.to.local.rules: DEFAULT strips realm.
#               Inter-broker protocol: SCRAM-SHA-512 on port 9092 (overrides Strimzi
#               auto-detection which would otherwise set GSSAPI and crash the broker).
# =============================================================================

---
# ── Kafka GSSAPI JAAS configuration (kerberos.enabled=true) ────────────────
# Kafka requires a server-side JAAS file with a 'KafkaServer' stanza when any
# listener uses GSSAPI. The KRB listener config supplies the client-facing JAAS
# via listenerConfig, but the JVM still requires java.security.auth.login.config
# to point at a file containing a KafkaServer entry.
# This ConfigMap is mounted at /mnt/kafka-jaas/jaas.conf.
# The KAFKA_OPTS env var must include:
#   -Djava.security.auth.login.config=/mnt/kafka-jaas/jaas.conf
#   -Djava.security.krb5.conf=/mnt/krb5-conf/cluster.conf
# Principal: svc/kafka@STARDATADBLABS.LOCAL, keytab: /mnt/kafka-keytab/keytab
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-gssapi-jaas
  namespace: prod
  labels:
    argocd.argoproj.io/instance: strimzi-kafka
data:
  jaas.conf: |
    KafkaServer {
      com.sun.security.auth.module.Krb5LoginModule required
      useKeyTab=true
      storeKey=true
      keyTab="/mnt/kafka-keytab/keytab"
      principal="svc/kafka@STARDATADBLABS.LOCAL"
      isInitiator=false;
    };

    KafkaClient {
      com.sun.security.auth.module.Krb5LoginModule required
      useKeyTab=true
      storeKey=true
      keyTab="/mnt/kafka-keytab/keytab"
      principal="svc/kafka@STARDATADBLABS.LOCAL";
    };
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 250Gi
    class: local-path
    deleteClaim: false
  resources:
    requests:
      # Request must reflect actual JVM consumption:
      #   Heap:        2Gi  (STRIMZI_DYNAMIC_HEAP_PERCENTAGE=50% of 4Gi limit)
      #   JVM overhead: ~1Gi  (metaspace, thread stacks, JIT code cache, off-heap)
      #   OS + buffers: ~0.5Gi
      # With request=1Gi the node scheduler undersizes the pod; under memory
      # pressure the kernel OOM-kills the admin client thread inside the JVM
      # which causes "describeMetadataQuorum" timeouts → operator stamps
      # NotReady on the Kafka CR every reconcile cycle.
      memory: 3.5Gi
      cpu: 500m
    limits:
      memory: 4Gi
      cpu: "2"
  template:
    # Annotate Strimzi-created PVCs so ArgoCD treats them as unmanaged (IgnoreExtraneous).
    # Without this, ArgoCD prune:true deletes these PVCs on every sync because they
    # don't exist in the git manifests — wiping all Kafka data.
    persistentVolumeClaim:
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
    # NOTE: clusterRoleBinding is NOT a valid field in KafkaNodePool spec.template
    # (not declared in the CRD schema). Having it here causes ArgoCD ServerSideApply
    # to throw "field not declared in schema" → ComparisonError → Unknown sync status.
    # The kafka-init CRB is instead ignored via ignoreDifferences in app-strimzi-kafka.yaml.
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - worker4.local
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      # Give KRaft enough time to flush the metadata log cleanly on shutdown.
      # 30s (default) is too short — an unclean stop leaves more log to replay
      # on the next boot, widening the window where the operator races controller
      # election and stamps NotReady on the Kafka CR.
      terminationGracePeriodSeconds: 120
      volumes:
        # ── krb5.conf — always present ─────────────────────────────────────
        - name: krb5-conf
          configMap:
            name: kerberos-integration-config
            items:
              - key: krb5.conf
                path: krb5.conf
        # ── Kerberos volumes (active) ──────────────────────────────────────
        - name: kafka-keytab
          secret:
            secretName: kafka-keytab
        - name: kafka-jaas
          configMap:
            name: kafka-gssapi-jaas
    kafkaContainer:
      env:
        # JAAS config is required so the JVM can find the KafkaServer entry
        # for GSSAPI. Without this flag the broker crashes with:
        #   "Could not find a 'KafkaServer' entry in the JAAS configuration"
        - name: KAFKA_OPTS
          value: >-
            -Djava.security.krb5.conf=/mnt/krb5-conf/cluster.conf
            -Djava.security.auth.login.config=/mnt/kafka-jaas/jaas.conf
      volumeMounts:
        # krb5.conf — always mounted (harmless when Kerberos disabled)
        - name: krb5-conf
          mountPath: /mnt/krb5-conf/cluster.conf
          subPath: krb5.conf
        # ── Kerberos keytab + JAAS mounts (active) ─────────────────────────
        - name: kafka-keytab
          mountPath: /mnt/kafka-keytab
        - name: kafka-jaas
          mountPath: /mnt/kafka-jaas

---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: strimzi-kafka
  namespace: prod
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.2.0
    metadataVersion: "4.2-IV1"
    image: 192.168.1.50:30500/strimzi/kafka:latest-kafka-4.2.0
    listeners:
      # ── Internal SCRAM listener — operators ONLY ──────────────────────────
      # Strimzi topic/user operators use this listener.
      # Users MUST NOT connect here. KDC enforcement is on port 9093 (krb).
      - name: plain
        port: 9092
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
      # ── Kerberos GSSAPI listener — USER-FACING, KDC-enforced ─────────────
      # This is the ONLY listener users connect to. A valid Kerberos TGT is
      # required. No KDC principal → kinit fails → no ticket → SASL rejected.
      # Inter-broker protocol is overridden to SCRAM-SHA-512 (see config below)
      # so adding this GSSAPI listener does NOT break broker-to-broker comms.
      # Client config:
      #   security.protocol=SASL_PLAINTEXT
      #   sasl.mechanism=GSSAPI
      #   sasl.kerberos.service.name=svc
      #   bootstrap.servers=strimzi-kafka-kafka-bootstrap.prod.svc.cluster.local:9093
      - name: krb
        port: 9093
        type: internal
        tls: false
        authentication:
          type: custom
          sasl: true
          listenerConfig:
            sasl.enabled.mechanisms: GSSAPI
            sasl.kerberos.service.name: svc
            listener.name.krb.gssapi.sasl.jaas.config: >-
              com.sun.security.auth.module.Krb5LoginModule required
              useKeyTab=true
              storeKey=true
              keyTab="/mnt/kafka-keytab/keytab"
              principal="svc/kafka@STARDATADBLABS.LOCAL"
              isInitiator=false;
            sasl.kerberos.principal.to.local.rules: DEFAULT
    config:
      allow.everyone.if.no.acl.found: "true"
      # ── Inter-broker protocol override — CRITICAL for GSSAPI listener ────
      # When Strimzi detects any GSSAPI listener it auto-sets inter-broker
      # protocol to GSSAPI, which breaks broker comms (no inter-broker keytab
      # for GSSAPI). Explicitly setting SCRAM-SHA-512 here overrides that
      # auto-detection and keeps inter-broker traffic on the plain:9092 SCRAM
      # listener. This is the fix for the previous crash:
      #   "sasl.mechanism.inter.broker.protocol=GSSAPI but no KafkaServer entry"
      sasl.mechanism.inter.broker.protocol: SCRAM-SHA-512
      inter.broker.listener.name: plain
      offsets.topic.replication.factor: "1"
      transaction.state.log.replication.factor: "1"
      transaction.state.log.min.isr: "1"
      default.replication.factor: "1"
      min.insync.replicas: "1"
      # Disable auto-create: the Strimzi topic operator manages all topics
      # declaratively via KafkaTopic CRs. auto.create.topics.enable=true causes
      # races where Kafka creates a topic with default settings before the operator
      # can apply the KafkaTopic spec (wrong retention, partitions, compaction etc).
      auto.create.topics.enable: "false"
      # ── Durability: flush to disk before OS page-cache writeback ─────────────
      # Flush every 10 000 messages OR every 1 000ms — whichever comes first.
      # Default (flush only on page-cache eviction) means up to ~5s of data is
      # unsynced to disk on a hard power failure. These values cap that window.
      log.flush.interval.messages: "10000"
      log.flush.interval.ms: "1000"
      # ── Log retention ─────────────────────────────────────────────────────────
      # Keep log segments for 7 days (default). Check interval reduced to 1 min
      # so compacted topics reclaim space promptly after restart.
      log.retention.hours: "168"
      log.retention.check.interval.ms: "60000"
  entityOperator:
    topicOperator:
      # Resources for the topic-operator JVM.
      # Default 512Mi limit causes OOM when reconciling many topics on startup
      # (8 restarts observed — all exit code 1 / OOM). Bump to 1Gi.
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 1Gi
          cpu: 500m
      # Allow up to 3 min for Kafka bootstrap to be ready before declaring
      # the operator unhealthy. On reboot, Kafka KRaft leader election can
      # take 60–90 s; without a startupProbe the liveness probe fires first
      # and restarts the operator — causing the 8 crash-loops seen in prod.
      startupProbe:
        initialDelaySeconds: 30
        timeoutSeconds: 10
        periodSeconds: 15
        failureThreshold: 12   # 30 + 12×15 = 210s max wait for Kafka ready
      livenessProbe:
        initialDelaySeconds: 0
        timeoutSeconds: 10
        periodSeconds: 30
        failureThreshold: 3
      readinessProbe:
        initialDelaySeconds: 0
        timeoutSeconds: 10
        periodSeconds: 30
        failureThreshold: 3
    userOperator:
      # NOTE: startupProbe is NOT in the userOperator CRD schema (only topicOperator
      # supports it). terminationGracePeriodSeconds is controlled by the entityOperator
      # Deployment — no spec.template on the Kafka CR (not in CRD schema either).
      #
      # secretPrefix is not needed — KafkaUser secrets are named after the user.
      # reconciliationIntervalSeconds default 120s is fine.
      #
      # aclsAdminApiSupported=false: stops the User Operator from calling
      # DESCRIBE_ACLS / CREATE_ACLS, eliminating AclCache errors.
      # SCRAM credential management is unaffected — it uses the
      # ALTER_USER_SCRAM_CREDENTIALS API, not ACLs.
      aclsAdminApiSupported: false
      resources:
        requests:
          memory: 128Mi
          cpu: 50m
        limits:
          memory: 512Mi
          cpu: 250m
      livenessProbe:
        initialDelaySeconds: 60
        timeoutSeconds: 10
        periodSeconds: 30
        failureThreshold: 3
      readinessProbe:
        initialDelaySeconds: 60
        timeoutSeconds: 10
        periodSeconds: 30
        failureThreshold: 3

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: kafka-app-user
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  authentication:
    type: scram-sha-512

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: debezium-user
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  authentication:
    type: scram-sha-512

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: schema-registry-user
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  authentication:
    type: scram-sha-512

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: debezium-offsets
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: compact

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: debezium-configs
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: compact

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: debezium-statuses
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: compact

---
# _schemas is the internal topic used by Confluent Schema Registry to store
# all registered schemas. It MUST have cleanup.policy=compact — SR refuses to
# start if it finds cleanup.policy=delete (the Kafka auto-create default).
# CR name must be a valid RFC 1123 subdomain, so we use 'schemas-internal' and
# set topicName to the actual Kafka topic name '_schemas'.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: schemas-internal
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  topicName: "_schemas"
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: compact
    min.compaction.lag.ms: "0"
    # Retain schemas forever — never expire them by size or time.
    retention.ms: "-1"
    retention.bytes: "-1"

---
# schema-registry-schemas is kept for backwards compatibility but is no longer
# used by Schema Registry (which always targets _schemas).
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: schema-registry-schemas
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: compact
    min.compaction.lag.ms: "0"
