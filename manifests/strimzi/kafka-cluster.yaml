# ── Kafka cluster ────────────────────────────────────────────────────────────
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: strimzi-kafka
  namespace: prod
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.1
    metadataVersion: "4.3-IV0"
    image: 192.168.1.50:30500/strimzi/kafka:1.2.0-kafka-4.3.1
    listeners:
      # ── Internal SCRAM listener ────────────────────────────────────────────
      - name: plain
        port: 9092
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
    readinessProbe:
      initialDelaySeconds: 120
      timeoutSeconds: 10
      periodSeconds: 20
      failureThreshold: 3
    livenessProbe:
      initialDelaySeconds: 120
      timeoutSeconds: 10
      periodSeconds: 30
      failureThreshold: 5
    config:
      # ── Authentication / ACL ──────────────────────────────────────────────
      allow.everyone.if.no.acl.found: "true"
      sasl.mechanism.inter.broker.protocol: SCRAM-SHA-512
      inter.broker.listener.name: plain

      # ── Replication (RF=3) ────────────────────────────────────────────────
      offsets.topic.replication.factor: "3"
      transaction.state.log.replication.factor: "3"
      transaction.state.log.min.isr: "2"
      default.replication.factor: "3"
      min.insync.replicas: "2"

      # ── Topic auto-creation ───────────────────────────────────────────────
      auto.create.topics.enable: "true"
      # Default partitions per auto-created topic: 1 per broker = 3 total.
      # Gives immediate parallelism for document ingest consumers.
      num.partitions: "3"

      # ── Document processing: message size ────────────────────────────────
      # Allow up to 20 MB per message to handle large document payloads
      # (PDFs, Office files, large JSON blobs).
      message.max.bytes: "20971520"           # 20 MiB
      replica.fetch.max.bytes: "20971520"     # must match message.max.bytes
      fetch.message.max.bytes: "20971520"

      # ── Compression ───────────────────────────────────────────────────────
      # lz4: best balance of CPU and throughput for document/binary payloads.
      compression.type: lz4

      # ── Network threads & I/O threads ────────────────────────────────────
      # 3 network threads per broker handles concurrent document producers/
      # consumers without thread exhaustion.
      num.network.threads: "6"
      num.io.threads: "8"
      num.replica.fetchers: "2"

      # ── Socket send/receive buffers ───────────────────────────────────────
      socket.send.buffer.bytes: "1048576"     # 1 MiB (default 100 KiB)
      socket.receive.buffer.bytes: "1048576"  # 1 MiB
      socket.request.max.bytes: "20971520"    # 20 MiB matches message size

      # ── Durability ────────────────────────────────────────────────────────
      log.flush.interval.messages: "10000"
      log.flush.interval.ms: "1000"

      # ── Log retention ─────────────────────────────────────────────────────
      log.retention.hours: "168"              # 7 days
      log.retention.check.interval.ms: "60000"
      # Segment size: 512 MiB keeps segment count manageable for large
      # document topics while allowing timely cleanup on short-retention topics.
      log.segment.bytes: "536870912"          # 512 MiB

      # ── Log compaction (for CDC / document-state changelog topics) ────────
      log.cleaner.enable: "true"
      log.cleaner.threads: "2"
      log.cleaner.min.compaction.lag.ms: "0"
      log.cleaner.max.compaction.lag.ms: "3600000"  # max 1 h behind
      log.cleaner.min.cleanable.ratio: "0.5"

      # ── Consumer group rebalance ──────────────────────────────────────────
      # Delay rebalance by 3 s so short-lived restarts don't trigger full
      # partition reassignment across document-processing consumer groups.
      group.initial.rebalance.delay.ms: "3000"
      # Extend session timeout to tolerate slow document OCR/ML workers.
      group.max.session.timeout.ms: "300000"  # 5 min

      # ── KRaft quorum timeouts ─────────────────────────────────────────────
      controller.quorum.election.timeout.ms: "10000"
      controller.quorum.fetch.timeout.ms: "10000"

  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 1Gi
          cpu: 500m
      startupProbe:
        initialDelaySeconds: 30
        timeoutSeconds: 10
        periodSeconds: 15
        failureThreshold: 12   # 30 + 12×15 = 210 s max wait
      livenessProbe:
        initialDelaySeconds: 0
        timeoutSeconds: 10
        periodSeconds: 30
        failureThreshold: 3
      readinessProbe:
        initialDelaySeconds: 0
        timeoutSeconds: 10
        periodSeconds: 30
        failureThreshold: 3
    userOperator:
      aclsAdminApiSupported: false
      resources:
        requests:
          memory: 128Mi
          cpu: 50m
        limits:
          memory: 512Mi
          cpu: 250m
      livenessProbe:
        initialDelaySeconds: 60
        timeoutSeconds: 10
        periodSeconds: 30
        failureThreshold: 3
      readinessProbe:
        initialDelaySeconds: 60
        timeoutSeconds: 10
        periodSeconds: 30
        failureThreshold: 3

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: kafka-app-user
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  authentication:
    type: scram-sha-512

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: schema-registry-user
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  authentication:
    type: scram-sha-512
