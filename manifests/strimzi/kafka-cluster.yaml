# =============================================================================
# Strimzi-managed Kafka cluster — prod namespace  (3-broker HA, RF=3)
# Namespace   : prod
# Nodes       : worker5.local / worker6.local / worker7.local
# Topology    : 3 KafkaNodePools — one combined controller+broker per worker
#               (KRaft, no ZooKeeper)
#
# Listeners   :
#   INTERNAL port 9092 — SCRAM-SHA-512, in-cluster only
#
# Bootstrap   : strimzi-kafka-kafka-bootstrap.prod.svc.cluster.local:9092
# Kafka ver   : 4.3.1 (Strimzi 1.2.0 latest supported)
# Replication : default.replication.factor=3, min.insync.replicas=2
# Document processing tuning:
#   - Large message support (max 20 MB)
#   - Compression: lz4 for throughput
#   - Increased socket buffers and network threads
#   - Aggressive log compaction for CDC/changelog topics
# =============================================================================

# ── KafkaNodePool: worker5 ──────────────────────────────────────────────────
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: worker5
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 250Gi
    class: local-path
    deleteClaim: false
  resources:
    requests:
      memory: 3.5Gi
      cpu: 500m
    limits:
      memory: 4Gi
      cpu: "2"
  template:
    persistentVolumeClaim:
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
    pod:
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "kafka"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - worker5.local
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  strimzi.io/cluster: strimzi-kafka
                  strimzi.io/component-type: kafka
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      terminationGracePeriodSeconds: 120

