# =============================================================================
# ZITADEL Database — PostgreSQL 17
# Host   : 192.168.1.50 (master.local) — database creation ONLY lives here
# Access : zitadel-db.access.svc.cluster.local:5432  (internal ClusterIP)
#          NodePort 192.168.1.50:30550               (external / init job)
# DB     : zitadel
# Users  : zitadel_admin (init job schema), zitadel (app user)
# Secret : zitadel-db-passwords  (keys: admin-password, app-password)
#          zitadel-masterkey      (key:  masterkey — 32 random chars, NEVER change)
# Note   : Per design, only the database creation runs on 192.168.1.50.
#          All other access workloads run on 192.168.1.51 (worker nodes).
# =============================================================================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zitadel-db-data
  namespace: access
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-db-init
  namespace: access
data:
  01-create-zitadel.sql: |
    -- Create the ZITADEL database and both users.
    -- zitadel_admin is used by the ZITADEL init and setup jobs (schema migrations).
    -- zitadel is the application user for day-to-day ZITADEL operations.
    CREATE DATABASE zitadel;
    CREATE USER zitadel_admin WITH PASSWORD :'ADMIN_PASS' SUPERUSER;
    CREATE USER zitadel       WITH PASSWORD :'APP_PASS';
    GRANT ALL PRIVILEGES ON DATABASE zitadel TO zitadel_admin;
    GRANT ALL PRIVILEGES ON DATABASE zitadel TO zitadel;
  02-schema-grants.sh: |
    #!/bin/bash
    set -e
    PGPASSWORD="${POSTGRES_PASSWORD}" psql -v ON_ERROR_STOP=1 \
      -v ADMIN_PASS="${ZITADEL_ADMIN_PASS:-changeme}" \
      -v APP_PASS="${ZITADEL_APP_PASS:-changeme}" \
      --username "$POSTGRES_USER" -f /docker-entrypoint-initdb.d/01-create-zitadel.sql
    PGPASSWORD="${ZITADEL_ADMIN_PASS:-changeme}" psql --username zitadel_admin \
      -d zitadel <<-EOSQL
        GRANT ALL ON SCHEMA public TO zitadel;
    EOSQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zitadel-db
  namespace: access
  labels:
    app: zitadel-db
spec:
  serviceName: zitadel-db-headless
  replicas: 1
  selector:
    matchLabels:
      app: zitadel-db
  template:
    metadata:
      labels:
        app: zitadel-db
    spec:
      # Database creation on 192.168.1.50 (master.local) as required
      nodeSelector:
        kubernetes.io/hostname: master.local
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: workload
          operator: Equal
          value: master
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: 192.168.1.50:30500/library/postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-db-passwords
                  key: postgres-password
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: ZITADEL_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: zitadel-db-passwords
                  key: admin-password
            - name: ZITADEL_APP_PASS
              valueFrom:
                secretKeyRef:
                  name: zitadel-db-passwords
                  key: app-password
          volumeMounts:
            - name: zitadel-db-storage
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: "1"
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: zitadel-db-storage
          persistentVolumeClaim:
            claimName: zitadel-db-data
        - name: init-scripts
          configMap:
            name: zitadel-db-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel-db-headless
  namespace: access
spec:
  clusterIP: None
  selector:
    app: zitadel-db
  ports:
    - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel-db
  namespace: access
  labels:
    app: zitadel-db
spec:
  selector:
    app: zitadel-db
  type: NodePort
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30550
