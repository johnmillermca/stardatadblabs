# =============================================================================
# Network policies — access namespace allow-list
# Combined with the default-deny-all in namespace.yaml, only these exact
# paths are open:
#   ingress-nginx  → ZITADEL (443/h2c)
#   ZITADEL pods   → stardata-claims (8080)
#   ZITADEL pods   → audit-forwarder (8080)
#   console-backend → ZITADEL (443)
#   console-backend → console-db (5432)
#   console-backend → valkey (6379)
#   console-backend → kafka (9093)   [audit writes]
#   audit-forwarder → kafka (9093)
#   access-cron     → console-db (5432)
#   access-cron     → ZITADEL (443)
#   DNS (all pods   → kube-dns 53)
# =============================================================================

# ── DNS egress for every pod in the namespace ─────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: access
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

# ── ZITADEL: allow ingress from nginx ingress controller ──────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zitadel-from-ingress
  namespace: access
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zitadel
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
        - port: 8443
  egress:
    # ZITADEL → claims service
    - to:
        - podSelector:
            matchLabels:
              app: stardata-claims
      ports:
        - port: 8080
    # ZITADEL → audit-forwarder
    - to:
        - podSelector:
            matchLabels:
              app: audit-forwarder
      ports:
        - port: 8080
    # ZITADEL → its own database
    - to:
        - podSelector:
            matchLabels:
              app: zitadel-db
      ports:
        - port: 5432
    # ZITADEL DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

# ── console-backend: ingress from nginx, egress to ZITADEL + DB + Valkey + Kafka
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: console-backend-policy
  namespace: access
spec:
  podSelector:
    matchLabels:
      app: console-backend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8090
  egress:
    # → ZITADEL API
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zitadel
      ports:
        - port: 8080
    # → console-db
    - to:
        - podSelector:
            matchLabels:
              app: console-db
      ports:
        - port: 5432
    # → Valkey sessions
    - to:
        - podSelector:
            matchLabels:
              app: valkey
      ports:
        - port: 6379
    # → Kafka (audit topic)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prod
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - port: 9093

# ── audit-forwarder: ingress from ZITADEL only, egress to Kafka ───────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-forwarder-policy
  namespace: access
spec:
  podSelector:
    matchLabels:
      app: audit-forwarder
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zitadel
      ports:
        - port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prod
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - port: 9093

# ── Valkey: ingress from console-backend only ─────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-from-backend-only
  namespace: access
spec:
  podSelector:
    matchLabels:
      app: valkey
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: console-backend
        - podSelector:
            matchLabels:
              app: access-cron
      ports:
        - port: 6379

# ── access-cron: egress to console-db + ZITADEL + SMTP ───────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: access-cron-egress
  namespace: access
spec:
  podSelector:
    matchLabels:
      app: access-cron
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: console-db
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zitadel
      ports:
        - port: 8080
    # SMTP relay lives in prod namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prod
      ports:
        - port: 587
