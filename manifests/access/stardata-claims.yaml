# =============================================================================
# stardata-claims — Actions v2 target service
# Namespace : access
# Nodes     : worker1.local (192.168.1.51)
# Replicas  : 2  (PDB minAvailable: 1)
# Network   : only ZITADEL pods may call it (NetworkPolicy)
# Secret    : claims-target-key  (key: signingKey — from ZITADEL target creation)
# ConfigMap : claims-config      (key: ZITADEL_PROJECT_ID)
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stardata-claims
  namespace: access
  labels:
    app: stardata-claims
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stardata-claims
  template:
    metadata:
      labels:
        app: stardata-claims
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker1.local
      tolerations:
        - key: dedicated
          operator: Equal
          value: zitadel
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: claims
          image: 192.168.1.50:30500/stardatadb/stardata-claims:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: claims-target-key
                  key: signingKey
            - name: ZITADEL_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: claims-config
                  key: project_id
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: stardata-claims
  namespace: access
  labels:
    app: stardata-claims
spec:
  type: ClusterIP
  selector:
    app: stardata-claims
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# Only ZITADEL pods may call the claims service — all other ingress is blocked
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claims-from-zitadel-only
  namespace: access
spec:
  podSelector:
    matchLabels:
      app: stardata-claims
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zitadel
      ports:
        - port: 8080
  egress: []   # pure function — no outbound calls needed
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stardata-claims-pdb
  namespace: access
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: stardata-claims
---
# Populated after Step 2 Terraform; project_id comes from zitadel_project.platform.id output
apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-config
  namespace: access
data:
  project_id: "REPLACE_WITH_ZITADEL_PROJECT_ID"
