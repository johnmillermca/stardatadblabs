# =============================================================================
# console-backend — BFF access routes
# Handles: OIDC sign-in flow, /api/me, /api/access/* (all 12 screen APIs)
# Namespace : access   (deployed alongside ZITADEL; frontend is prod namespace)
# Nodes     : worker1.local (192.168.1.51)
# Replicas  : 3
# Sign-in   : www.stardatadb.com → auth.stardatadb.com (ZITADEL Login v2)
# Console   : console.stardatadb.com  (served by the existing frontend; BFF is its backend)
# Secrets (never in Git):
#   console-oidc          — keys: client_id, client_secret  (from Terraform output)
#   console-db-credentials — keys: app-password
#   valkey-credentials    — keys: password
#   console-backend-key   — key: key.json  (console-backend machine user JWT profile)
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-backend
  namespace: access
  labels:
    app: console-backend
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: console-backend
  template:
    metadata:
      labels:
        app: console-backend
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker1.local
      tolerations:
        - key: dedicated
          operator: Equal
          value: zitadel
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console-backend
          image: 192.168.1.50:30500/stardatadb/console-backend:1.0.5
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
          env:
            # ── OIDC ──────────────────────────────────────────────────────────
            - name: ZITADEL_DOMAIN
              value: "https://auth.stardatadb.com"
            - name: ZITADEL_INTERNAL_URL
              value: "http://zitadel.access.svc.cluster.local:8080"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: console-oidc
                  key: client_id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: console-oidc
                  key: client_secret
            - name: OIDC_REDIRECT_URI
              value: "https://console.stardatadb.com/auth/callback"
            - name: OIDC_POST_LOGOUT_URI
              value: "https://console.stardatadb.com/"
            # Project ID — required for the scope urn:zitadel:iam:org:project:id:<id>:aud
            - name: ZITADEL_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: claims-config
                  key: project_id
            # ── Session ───────────────────────────────────────────────────────
            - name: VALKEY_ADDR
              value: "valkey.access.svc.cluster.local:6379"
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-credentials
                  key: password
            - name: SESSION_IDLE_TTL
              value: "86400"        # 24 hours in seconds
            - name: SESSION_MAX_TTL
              value: "604800"       # 7 days in seconds
            # ── Console DB ────────────────────────────────────────────────────
            - name: CONSOLE_DB_DSN
              value: "postgres://console_app:$(CONSOLE_DB_PASS)@console-db.access.svc.cluster.local:5432/console?sslmode=require"
            - name: CONSOLE_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: console-db-credentials
                  key: app-password
            # ── Machine user key (for ZITADEL API calls) ─────────────────────
            - name: BACKEND_KEY_FILE
              value: /run/secrets/console-backend-key/key.json
            # ── Kafka audit ───────────────────────────────────────────────────
            - name: KAFKA_BROKERS
              value: "kafka-bootstrap.prod.svc.cluster.local:9093"
            - name: KAFKA_AUDIT_TOPIC
              value: "platform.audit"
            # ── Cookie / security ─────────────────────────────────────────────
            - name: COOKIE_DOMAIN
              value: "console.stardatadb.com"
            - name: ALLOWED_EMAIL_DOMAIN
              value: "stardatadb.com"
            - name: ENVIRONMENT
              value: "prod"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: console-backend-key
              mountPath: /run/secrets/console-backend-key
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: console-backend-key
          secret:
            secretName: console-backend-key
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: console-backend
  namespace: access
  labels:
    app: console-backend
spec:
  type: ClusterIP
  selector:
    app: console-backend
  ports:
    - name: http
      port: 80
      targetPort: 8090
---
# Ingress for the BFF: handles /auth/* and /api/* on console.stardatadb.com
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console-backend
  namespace: access
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Rate-limit sign-in and access API at the ingress
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/limit-rps: "30"
spec:
  ingressClassName: nginx
  tls:
    - secretName: console-tls
      hosts: [console.stardatadb.com]
  rules:
    - host: console.stardatadb.com
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: console-backend
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: console-backend
                port:
                  name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: console-backend-pdb
  namespace: access
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: console-backend
