# =============================================================================
# stardata-oauth2-proxy — OIDC gate for stardata.stardatadb.com
# Reuses the same console-oidc secret (same client_id, client_secret,
# cookie_secret) and cookie-domain=.stardatadb.com so that a session already
# established at console.stardatadb.com is accepted here with zero re-auth.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stardata-oauth2-proxy
  namespace: access
  labels:
    app: stardata-oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stardata-oauth2-proxy
  template:
    metadata:
      labels:
        app: stardata-oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: 192.168.1.50:30500/oauth2-proxy:v7.8.2
          imagePullPolicy: Always
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://auth.stardatadb.com
            - --skip-oidc-discovery=true
            - --insecure-oidc-skip-issuer-verification=true
            - --insecure-oidc-allow-unverified-email=true
            - --login-url=https://auth.stardatadb.com/authorize
            - --redeem-url=http://pocket-id.access.svc.cluster.local:80/api/oidc/token
            - --profile-url=http://pocket-id.access.svc.cluster.local:80/api/oidc/userinfo
            - --oidc-jwks-url=http://pocket-id.access.svc.cluster.local:80/.well-known/jwks.json
            - --redirect-url=https://stardata.stardatadb.com/oauth2/callback
            - --upstream=http://stardata-spa.access.svc.cluster.local:80
            - --http-address=0.0.0.0:4180
            - --cookie-secure=true
            - --cookie-domain=.stardatadb.com
            - --cookie-samesite=lax
            - --cookie-expire=24h
            - --session-store-type=cookie
            - --skip-provider-button=true
            - --email-domain=*
            - --scope=openid profile email
            - --pass-authorization-header=true
            - --pass-user-headers=true
            - --set-xauthrequest=true
            - --reverse-proxy=true
            - --silence-ping-logging=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: console-oidc
                  key: client_id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: console-oidc
                  key: client_secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: console-oidc
                  key: cookie_secret
          ports:
            - containerPort: 4180
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: stardata-oauth2-proxy
  namespace: access
  labels:
    app: stardata-oauth2-proxy
spec:
  type: ClusterIP
  selector:
    app: stardata-oauth2-proxy
  ports:
    - name: http
      port: 80
      targetPort: 4180
