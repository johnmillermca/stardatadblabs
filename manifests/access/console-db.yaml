# =============================================================================
# Console Database — PostgreSQL 16
# Host   : 192.168.1.51 (worker1.local) — all non-database workloads live here
# Access : console-db.access.svc.cluster.local:5432  (internal ClusterIP)
#          NodePort 192.168.1.51:30551               (external)
# DB     : console
# Tables : approval, app_identity, invite  (managed by console-backend migrations)
# Secret : console-db-credentials  (keys: postgres-password, app-password)
# =============================================================================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: console-db-data
  namespace: access
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: console-db-init
  namespace: access
data:
  01-create-console.sql: |
    CREATE DATABASE console;
    CREATE USER console_app WITH PASSWORD :'APP_PASS';
    GRANT ALL PRIVILEGES ON DATABASE console TO console_app;
  02-schema.sh: |
    #!/bin/bash
    set -e
    PGPASSWORD="${POSTGRES_PASSWORD}" psql -v ON_ERROR_STOP=1 \
      -v APP_PASS="${CONSOLE_APP_PASS:-changeme}" \
      --username "$POSTGRES_USER" -f /docker-entrypoint-initdb.d/01-create-console.sql
    PGPASSWORD="${CONSOLE_APP_PASS:-changeme}" psql --username console_app -d console <<-EOSQL
      CREATE TABLE IF NOT EXISTS approval (
        id            text PRIMARY KEY,
        action        text NOT NULL,
        target_user   text NOT NULL,
        payload       jsonb NOT NULL,
        reason        text,
        requested_by  text NOT NULL,
        requested_at  timestamptz NOT NULL DEFAULT now(),
        expires_at    timestamptz NOT NULL,
        state         text NOT NULL DEFAULT 'pending',
        decided_by    text,
        decided_at    timestamptz,
        CHECK (decided_by IS NULL OR decided_by <> requested_by)
      );

      CREATE TABLE IF NOT EXISTS app_identity (
        user_id          text PRIMARY KEY,
        name             text UNIQUE NOT NULL,
        owner_user_id    text NOT NULL,
        credential_type  text NOT NULL,
        expires_at       timestamptz,
        rotation_due     timestamptz,
        created_at       timestamptz NOT NULL DEFAULT now()
      );

      CREATE TABLE IF NOT EXISTS invite (
        user_id     text PRIMARY KEY,
        email       text NOT NULL,
        invited_by  text NOT NULL,
        levels      jsonb NOT NULL,
        sent_at     timestamptz NOT NULL DEFAULT now(),
        accepted_at timestamptz
      );

      CREATE INDEX IF NOT EXISTS approval_state_idx    ON approval (state, requested_at);
      CREATE INDEX IF NOT EXISTS approval_expires_idx  ON approval (expires_at) WHERE state = 'pending';
      CREATE INDEX IF NOT EXISTS app_identity_exp_idx  ON app_identity (expires_at);
    EOSQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: console-db
  namespace: access
  labels:
    app: console-db
spec:
  serviceName: console-db-headless
  replicas: 1
  selector:
    matchLabels:
      app: console-db
  template:
    metadata:
      labels:
        app: console-db
    spec:
      # All non-database workloads run on 192.168.1.51 (worker1.local)
      nodeSelector:
        kubernetes.io/hostname: worker1.local
      tolerations:
        - key: dedicated
          operator: Equal
          value: zitadel
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: 192.168.1.50:30500/library/postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: console-db-credentials
                  key: postgres-password
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: CONSOLE_APP_PASS
              valueFrom:
                secretKeyRef:
                  name: console-db-credentials
                  key: app-password
          volumeMounts:
            - name: console-db-storage
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: "500m"
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: console-db-storage
          persistentVolumeClaim:
            claimName: console-db-data
        - name: init-scripts
          configMap:
            name: console-db-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: console-db-headless
  namespace: access
spec:
  clusterIP: None
  selector:
    app: console-db
  ports:
    - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: console-db
  namespace: access
  labels:
    app: console-db
spec:
  selector:
    app: console-db
  type: NodePort
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30551
