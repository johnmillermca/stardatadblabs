# =============================================================================
# spa-router — internal nginx that routes authenticated requests to the correct
# SPA backend based on the Host header.
#
# oauth2-proxy (single shared instance) proxies ALL authenticated traffic here.
# spa-router then forwards to console-spa or stardata-spa.
#
# This eliminates per-app oauth2-proxy instances and the re-auth problem they
# cause: one cookie, one proxy, one session for all *.stardatadb.com apps.
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spa-router-conf
  namespace: access
data:
  default.conf: |
    resolver 10.96.0.10 valid=30s ipv6=off;

    # console.stardatadb.com → console-spa
    server {
        listen 80;
        server_name console.stardatadb.com;
        location / {
            set $upstream "console-spa.access.svc.cluster.local";
            proxy_pass       http://$upstream:80;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma        "no-cache" always;
            add_header Expires       "0" always;
        }
        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # stardata.stardatadb.com → stardata-spa
    server {
        listen 80;
        server_name stardata.stardatadb.com;
        location / {
            set $upstream "stardata-spa.access.svc.cluster.local";
            proxy_pass       http://$upstream:80;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma        "no-cache" always;
            add_header Expires       "0" always;
        }
        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spa-router
  namespace: access
  labels:
    app: spa-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spa-router
  template:
    metadata:
      labels:
        app: spa-router
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker1.local
      tolerations:
        - key: node-role.kubernetes.io/worker
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: "20m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "32Mi"
      volumes:
        - name: conf
          configMap:
            name: spa-router-conf
---
apiVersion: v1
kind: Service
metadata:
  name: spa-router
  namespace: access
  labels:
    app: spa-router
spec:
  type: ClusterIP
  selector:
    app: spa-router
  ports:
    - name: http
      port: 80
      targetPort: 80
