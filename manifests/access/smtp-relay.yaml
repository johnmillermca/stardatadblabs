# =============================================================================
# smtp-relay — msmtpd SMTP relay for outbound Gmail
#
# Runs on worker1.local (192.168.1.51) which has WiFi internet access.
# Accepts unauthenticated SMTP connections on port 2525 (cluster-internal only)
# and relays to smtp.gmail.com:587 using STARTTLS + app password.
#
# Replaces the host-level msmtpd that was manually configured on master2.local
# (192.168.1.62) which has no internet access.
#
# Consumers:
#   pocket-id    → SMTP_HOST=smtp-relay.access.svc.cluster.local  SMTP_PORT=2525
#   invite-mailer → SMTP_HOST=smtp-relay.access.svc.cluster.local SMTP_PORT=2525
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp-relay
  namespace: access
  labels:
    app: smtp-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smtp-relay
  template:
    metadata:
      labels:
        app: smtp-relay
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker1.local
      tolerations:
        - operator: Exists
      securityContext:
        runAsNonRoot: false   # msmtpd needs root to bind + read config
      containers:
        - name: smtp-relay
          # msmtp image has msmtp + msmtpd pre-installed, no apk needed
          image: crazymax/msmtpd:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 2500
          env:
            - name: MSMTPD_LISTENADDR
              value: "0.0.0.0"
            - name: MSMTPD_PORT
              value: "2500"
            - name: MSMTPD_ARGS
              value: "--read-envelope-from -t"
            - name: SMTP_HOST
              value: "smtp.gmail.com"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_TLS
              value: "on"
            - name: SMTP_STARTTLS
              value: "on"
            - name: SMTP_AUTH
              value: "on"
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: gmail-smtp-credentials
                  key: username
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: gmail-smtp-credentials
                  key: username
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gmail-smtp-credentials
                  key: password
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            tcpSocket:
              port: 2500
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 2500
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: smtp-relay
  namespace: access
  labels:
    app: smtp-relay
spec:
  type: ClusterIP
  selector:
    app: smtp-relay
  ports:
    - name: smtp
      port: 2525
      targetPort: 2500
