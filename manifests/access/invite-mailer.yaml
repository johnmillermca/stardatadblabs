# =============================================================================
# invite-mailer — sends StarData invite emails via Gmail SMTP
# Sender : johnmillermca@gmail.com (App Password in gmail-smtp-credentials)
# To     : any address provided in the POST /send-invite body
#
# Runs as TWO pods:
#   1. Deployment on worker1.local — for console-backend in-cluster calls
#   2. hostNetwork Pod on worker8.local — so webconsole-worker8 nginx can reach
#      it at 127.0.0.1:8025 (same pattern as webconsole-worker8 itself)
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invite-mailer
  namespace: access
  labels:
    app: invite-mailer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invite-mailer
  template:
    metadata:
      labels:
        app: invite-mailer
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker1.local
      tolerations:
        - key: dedicated
          operator: Equal
          value: zitadel
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: invite-mailer
          image: 192.168.1.50:30500/stardatadb/invite-mailer:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8025
          env:
            - name: GMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: gmail-smtp-credentials
                  key: username
            - name: GMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: gmail-smtp-credentials
                  key: password
            - name: FROM_NAME
              value: "StarData Platform"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8025
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8025
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
# hostNetwork sidecar on worker8 — nginx at localhost:8025
apiVersion: v1
kind: Pod
metadata:
  name: invite-mailer-worker8
  namespace: access
  labels:
    app: invite-mailer-worker8
spec:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  nodeSelector:
    kubernetes.io/hostname: worker8.local
  restartPolicy: Always
  containers:
    - name: invite-mailer
      image: 192.168.1.50:30500/stardatadb/invite-mailer:1.0.0
      imagePullPolicy: Always
      ports:
        - containerPort: 8025
          hostPort: 8025
          protocol: TCP
      env:
        - name: GMAIL_USER
          valueFrom:
            secretKeyRef:
              name: gmail-smtp-credentials
              key: username
        - name: GMAIL_PASS
          valueFrom:
            secretKeyRef:
              name: gmail-smtp-credentials
              key: password
        - name: FROM_NAME
          value: "StarData Platform"
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8025
        initialDelaySeconds: 5
        periodSeconds: 10
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: invite-mailer
  namespace: access
  labels:
    app: invite-mailer
spec:
  type: NodePort
  selector:
    app: invite-mailer
  ports:
    - name: http
      port: 80
      targetPort: 8025
      nodePort: 30825   # reachable at 192.168.1.51:30825 from any node
---
# invite-mailer NetworkPolicy
# webconsole-worker8 runs hostNetwork on worker8.local (192.168.1.58) — its traffic
# arrives from the node IP, which means we must allow from ipBlock OR open ingress
# to all sources on port 8025. We scope it to the cluster node CIDR.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: invite-mailer-policy
  namespace: access
spec:
  podSelector:
    matchLabels:
      app: invite-mailer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # console-backend (in-cluster pod)
    - from:
        - podSelector:
            matchLabels:
              app: console-backend
      ports:
        - port: 8025
    # webconsole-worker8 uses hostNetwork — traffic arrives from node IP 192.168.1.58
    - from:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - port: 8025
    # Any pod in access namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: access
      ports:
        - port: 8025
  egress:
    # Gmail SMTP
    - ports:
        - port: 587
          protocol: TCP
        - port: 465
          protocol: TCP
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
