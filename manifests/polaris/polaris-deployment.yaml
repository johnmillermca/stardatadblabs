# =============================================================================
# Apache Polaris — ConfigMap + Deployment + Service
# Namespace : prod
# Node      : master.local (pinned — freeing worker capacity)
# Access    : http://192.168.1.50:30181 (Iceberg REST catalog API)
# Depends on: PostgreSQL prod.postgresql:5432, db: polaris
# Image     : 192.168.1.50:30500/apache-polaris:1.6.0
# Secrets   : polaris-db-credentials        (seeded by 12-seed-openbao-secrets.sh)
#             polaris-bootstrap-credentials  (seeded by 12-seed-openbao-secrets.sh)
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: polaris-config
  namespace: prod
data:
  application.properties: |
    server.port=8181
    polaris.persistence.type=relational-jdbc
    quarkus.datasource.jdbc.url=jdbc:postgresql://postgresql.prod.svc.cluster.local:5432/polaris
    quarkus.datasource.username=${POLARIS_DB_USER}
    quarkus.datasource.password=${POLARIS_DB_PASS}
    polaris.realm-context.require-header=false
    polaris.features.ALLOW_WILDCARD_LOCATION=true
    polaris.features.INITIALIZE_DEFAULT_CATALOG_FILEIO_FOR_WRITES=true
    # Disable STS vended-credential delegation — watsonx-s3-connector is an IAM
    # user (not a role) so sts:AssumeRole is not valid. Spark supplies its own
    # S3 credentials via spark.sql.catalog.*.s3.* properties instead.
    polaris.features.ALLOW_EXTERNAL_CATALOG_CREDENTIAL_VENDING=false
    # Inject static AWS credentials so Polaris S3FileIO can validate locations
    # and write metadata directly without requiring an IAM role assumption.
    aws.accessKeyId=${AWS_ACCESS_KEY_ID}
    aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY}
    aws.region=us-east-2
    logging.level.org.apache.polaris=INFO
    management.endpoints.web.exposure.include=health,info,metrics
    management.endpoint.health.show-details=always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris
  namespace: prod
  labels:
    app: polaris
spec:
  replicas: 1
  selector:
    matchLabels:
      app: polaris
  template:
    metadata:
      labels:
        app: polaris
    spec:
      nodeSelector:
        kubernetes.io/hostname: master.local
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: polaris
          image: 192.168.1.50:30500/apache-polaris:1.6.0-r2
          imagePullPolicy: IfNotPresent
          ports:
            - name: rest
              containerPort: 8181
          env:
            - name: POLARIS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: polaris-db-credentials
                  key: db-user
            - name: POLARIS_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: polaris-db-credentials
                  key: db-password
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: platform-s3-credentials
                  key: access_key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-s3-credentials
                  key: secret_key
            - name: AWS_REGION
              value: us-east-2
            - name: AWS_DEFAULT_REGION
              value: us-east-2
          volumeMounts:
            - name: polaris-config
              mountPath: /home/polaris/application.properties
              subPath: application.properties
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: "1"
          readinessProbe:
            tcpSocket:
              port: 8181
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8181
            initialDelaySeconds: 60
            periodSeconds: 15
      volumes:
        - name: polaris-config
          configMap:
            name: polaris-config
---
apiVersion: v1
kind: Service
metadata:
  name: polaris-rest
  namespace: prod
spec:
  selector:
    app: polaris
  type: NodePort
  ports:
    - name: rest
      port: 8181
      targetPort: 8181
      nodePort: 30181
