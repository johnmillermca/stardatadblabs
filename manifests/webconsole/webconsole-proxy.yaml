---
# ConfigMap — Nginx reverse proxy that forwards port 80 → worker8:30081
apiVersion: v1
kind: ConfigMap
metadata:
  name: webconsole-proxy-conf
  namespace: prod
data:
  default.conf: |
    server {
        listen 80;
        server_name www.stardatadb.com stardatadb.com _;

        location / {
            proxy_pass http://192.168.1.58:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
---
# Pod — hostNetwork on master2 (192.168.1.62), binds port 80 directly on the node
apiVersion: v1
kind: Pod
metadata:
  name: webconsole-proxy
  namespace: prod
  labels:
    app: webconsole-proxy
spec:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  nodeSelector:
    kubernetes.io/hostname: master2.local
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  restartPolicy: Always
  containers:
    - name: nginx
      image: 192.168.1.50:30500/webconsole:latest
      imagePullPolicy: Always
      ports:
        - containerPort: 80
          hostPort: 80
          protocol: TCP
      volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "200m"
          memory: "64Mi"
      readinessProbe:
        httpGet:
          path: /healthz
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /healthz
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 20
  volumes:
    - name: nginx-conf
      configMap:
        name: webconsole-proxy-conf
