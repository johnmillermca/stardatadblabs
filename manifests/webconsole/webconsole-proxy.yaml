---
# ConfigMap — Nginx reverse proxy that forwards port 80 → worker8:30081
apiVersion: v1
kind: ConfigMap
metadata:
  name: webconsole-proxy-conf
  namespace: prod
data:
  default.conf: |
    server {
        listen 80;
        server_name www.stardatadb.com stardatadb.com _;

        location / {
            # Forward to webconsole-worker8 via its NodePort (30081) on worker8.
            # Port 30081 is open through the node firewall; direct port 80 is not.
            proxy_pass http://192.168.1.58:30081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            # Tell Cloudflare never to cache HTML responses
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma        "no-cache" always;
            add_header Expires       "0" always;
        }

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # ── console.stardatadb.com ────────────────────────────────────────────────────
    # /auth/* and /api/* go to the BFF (console-backend in namespace access).
    # Everything else (/) is the console SPA on worker8.
    server {
        listen 80;
        server_name console.stardatadb.com;

        location ~* ^/(auth|api)(/|$) {
            proxy_pass http://console-backend.access.svc.cluster.local:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://192.168.1.58:30081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma        "no-cache" always;
            add_header Expires       "0" always;
        }

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # ── Health check server on port 8081 ────────────────────────────────────────
    # The iptables OUTPUT rule on master2 redirects local port 80 → 30081, which
    # means liveness probes to http://localhost:80/healthz are redirected away and
    # fail. This dedicated health port bypasses that redirect entirely.
    server {
        listen 8081;
        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
---
# Pod — hostNetwork on master2 (192.168.1.62), binds port 80 directly on the node
apiVersion: v1
kind: Pod
metadata:
  name: webconsole-proxy
  namespace: prod
  labels:
    app: webconsole-proxy
spec:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  nodeSelector:
    kubernetes.io/hostname: master2.local
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  restartPolicy: Always
  containers:
    - name: nginx
      image: 192.168.1.50:30500/webconsole:latest
      imagePullPolicy: Always
      ports:
        - containerPort: 80
          hostPort: 80
          protocol: TCP
      volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "200m"
          memory: "64Mi"
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8081
        initialDelaySeconds: 5
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8081
        initialDelaySeconds: 10
        periodSeconds: 20
  volumes:
    - name: nginx-conf
      configMap:
        name: webconsole-proxy-conf
