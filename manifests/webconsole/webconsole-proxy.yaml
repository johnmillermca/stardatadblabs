---
# ConfigMap — Nginx reverse proxy that forwards port 80 → worker8:30081
apiVersion: v1
kind: ConfigMap
metadata:
  name: webconsole-proxy-conf
  namespace: prod
data:
  default.conf: |
    # Use kube-dns for dynamic upstream resolution (required for hostNetwork pods).
    # Without this nginx resolves upstreams once at startup and caches them forever;
    # any pod rollout causes 502/503 until nginx is manually reloaded.
    resolver 10.96.0.10 valid=10s ipv6=off;

    server {
        listen 80;
        server_name www.stardatadb.com stardatadb.com _;

        location / {
            # Forward to webconsole-worker8 via its NodePort (30081) on worker8.
            # Port 30081 is open through the node firewall; direct port 80 is not.
            proxy_pass http://192.168.1.58:30081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            # Tell Cloudflare never to cache HTML responses
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma        "no-cache" always;
            add_header Expires       "0" always;
        }

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # ── auth.stardatadb.com ───────────────────────────────────────────────────────
    # /ui/v2/login/* → Login v2 Next.js service
    # everything else → ZITADEL API / OIDC
    server {
        listen 80;
        server_name auth.stardatadb.com;

        location /ui/v2/ {
            set $zitadel_login "zitadel-login.access.svc.cluster.local";
            proxy_pass http://$zitadel_login:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location / {
            set $zitadel_https "zitadel-https.access.svc.cluster.local";
            proxy_pass https://$zitadel_https;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            # Required for ZITADEL gRPC/h2c traffic
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "";
        }

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # ── console.stardatadb.com ────────────────────────────────────────────────────
    # /auth/* and /api/* go to the BFF (console-backend in namespace access).
    # Everything else (/) is the console SPA on worker8.
    server {
        listen 80;
        server_name console.stardatadb.com;

        location ~* ^/(auth|api)(/|$) {
            set $console_backend "console-backend.access.svc.cluster.local";
            proxy_pass http://$console_backend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://192.168.1.58:30081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma        "no-cache" always;
            add_header Expires       "0" always;
        }

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # ── Health check server on port 8081 ────────────────────────────────────────
    # The iptables OUTPUT rule on master2 redirects local port 80 → 30081, which
    # means liveness probes to http://localhost:80/healthz are redirected away and
    # fail. This dedicated health port bypasses that redirect entirely.
    server {
        listen 8081;
        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
---
# DaemonSet — hostNetwork on master2 (192.168.1.62), binds port 80 directly on the node.
# Using a DaemonSet (not a bare Pod) ensures kubelet recreates it automatically after
# a node reboot — bare Pods with restartPolicy:Always are not rescheduled on boot.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: webconsole-proxy
  namespace: prod
  labels:
    app: webconsole-proxy
spec:
  selector:
    matchLabels:
      app: webconsole-proxy
  template:
    metadata:
      labels:
        app: webconsole-proxy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: master2.local
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 10
      containers:
        - name: nginx
          image: 192.168.1.50:30500/webconsole:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              hostPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: nginx-conf
          configMap:
            name: webconsole-proxy-conf
