---
# webconsole-proxy — nginx DaemonSet on master2 (hostNetwork, port 80)
# Routes two domains:
#   auth.stardatadb.com      → Pocket ID (access namespace)
#   console.stardatadb.com   → oauth2-proxy → console-spa (access namespace)
#
# www.stardatadb.com is served directly from S3 via Cloudflare DNS (no tunnel).
# Cloudflare sits in front and terminates TLS; traffic arrives here on HTTP.
apiVersion: v1
kind: ConfigMap
metadata:
  name: webconsole-proxy-conf
  namespace: prod
data:
  default.conf: |
    # kube-dns resolver — needed for variable-based proxy_pass to cluster services.
    resolver 10.96.0.10 valid=30s ipv6=off;

    # ── auth.stardatadb.com → Pocket ID ───────────────────────────────────────
    # Use a variable for proxy_pass so nginx does NOT resolve the upstream at
    # startup. Without this, nginx refuses to start if pocket-id is temporarily
    # down (e.g. during a node restart), taking www and all other domains with it.
    # kube-dns (10.96.0.10) resolves cluster-local names, so this is safe.
    server {
        listen 80;
        server_name auth.stardatadb.com;

        location / {
            set $pocket_id "pocket-id.access.svc.cluster.local";
            proxy_pass         http://$pocket_id:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_buffering    off;
        }

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # ── console.stardatadb.com → oauth2-proxy (OIDC gate) → console-spa ──────
    # All traffic passes through oauth2-proxy which enforces Pocket ID login.
    # Unauthenticated requests are redirected to auth.stardatadb.com.
    # Variable-based proxy_pass prevents startup failure when oauth2-proxy is
    # temporarily unavailable (same pattern as pocket-id above).
    server {
        listen 80;
        server_name console.stardatadb.com;

        # oauth2-proxy callback and internal paths
        location /oauth2/ {
            set $oauth2_proxy "console-oauth2-proxy.access.svc.cluster.local";
            proxy_pass         http://$oauth2_proxy:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_buffering    off;
        }

        # All other traffic: gate through oauth2-proxy
        location / {
            set $oauth2_proxy "console-oauth2-proxy.access.svc.cluster.local";
            proxy_pass         http://$oauth2_proxy:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_buffering    off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma        "no-cache" always;
            add_header Expires       "0" always;
        }

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # ── Health probe port (bypasses iptables redirect on master2) ────────────
    server {
        listen 8081;
        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: webconsole-proxy
  namespace: prod
  labels:
    app: webconsole-proxy
spec:
  selector:
    matchLabels:
      app: webconsole-proxy
  template:
    metadata:
      labels:
        app: webconsole-proxy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: master2.local
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 10
      containers:
        - name: nginx
          image: 192.168.1.50:30500/webconsole:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              hostPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: nginx-conf
          configMap:
            name: webconsole-proxy-conf
