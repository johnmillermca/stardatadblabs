---
# webconsole-proxy — nginx DaemonSet on master2 (hostNetwork, port 80)
# Routes three domains:
#   www.stardatadb.com       → S3 static website
#   auth.stardatadb.com      → Pocket ID on worker1
#   console.stardatadb.com   → static console.html on worker1
#
# Cloudflare sits in front and terminates TLS; traffic arrives here on HTTP.
apiVersion: v1
kind: ConfigMap
metadata:
  name: webconsole-proxy-conf
  namespace: prod
data:
  default.conf: |
    resolver 10.96.0.10 valid=10s ipv6=off;

    # ── www.stardatadb.com → S3 static website ────────────────────────────────
    server {
        listen 80;
        server_name www.stardatadb.com stardatadb.com _;

        location / {
            set $s3 "stardatadb-web.s3-website.us-east-2.amazonaws.com";
            proxy_pass       http://$s3;
            proxy_set_header Host $s3;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma        "no-cache" always;
            add_header Expires       "0" always;
        }

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # ── auth.stardatadb.com → Pocket ID ───────────────────────────────────────
    server {
        listen 80;
        server_name auth.stardatadb.com;

        location / {
            set $pocket_id "pocket-id.access.svc.cluster.local";
            proxy_pass         http://$pocket_id:1411;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_buffering    off;
        }

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # ── console.stardatadb.com → static console.html on worker1 ──────────────
    server {
        listen 80;
        server_name console.stardatadb.com;

        location / {
            set $console "console-spa.access.svc.cluster.local";
            proxy_pass         http://$console:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma        "no-cache" always;
            add_header Expires       "0" always;
        }

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # ── Health probe port (bypasses iptables redirect on master2) ────────────
    server {
        listen 8081;
        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: webconsole-proxy
  namespace: prod
  labels:
    app: webconsole-proxy
spec:
  selector:
    matchLabels:
      app: webconsole-proxy
  template:
    metadata:
      labels:
        app: webconsole-proxy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: master2.local
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 10
      containers:
        - name: nginx
          image: 192.168.1.50:30500/webconsole:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              hostPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: nginx-conf
          configMap:
            name: webconsole-proxy-conf
