---
# webconsole-proxy — nginx DaemonSet on master2 (hostNetwork, port 80)
# Routes three domains:
#   www.stardatadb.com       → S3 static website
#   auth.stardatadb.com      → Pocket ID on worker1
#   console.stardatadb.com   → static console.html on worker1
#
# Cloudflare sits in front and terminates TLS; traffic arrives here on HTTP.
apiVersion: v1
kind: ConfigMap
metadata:
  name: webconsole-proxy-conf
  namespace: prod
data:
  default.conf: |
    # resolver only needed for external upstream (S3). Internal k8s services use
    # static proxy_pass so nginx resolves them at startup via the system resolver,
    # avoiding per-request DNS lookups that can time out on external upstream queries.
    resolver 10.96.0.10 valid=30s ipv6=off;

    # ── www.stardatadb.com → S3 static website ────────────────────────────────
    server {
        listen 80;
        server_name www.stardatadb.com stardatadb.com _;

        location / {
            set $s3 "stardatadb-web.s3-website.us-east-2.amazonaws.com";
            proxy_pass       http://$s3;
            proxy_set_header Host $s3;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma        "no-cache" always;
            add_header Expires       "0" always;
        }

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # ── auth.stardatadb.com → Pocket ID ───────────────────────────────────────
    # Static proxy_pass: nginx resolves at startup via kube-dns (reliable for
    # internal cluster names) — no per-request DNS needed.
    server {
        listen 80;
        server_name auth.stardatadb.com;

        location / {
            proxy_pass         http://pocket-id.access.svc.cluster.local:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_buffering    off;
        }

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # ── console.stardatadb.com → oauth2-proxy (OIDC gate) → console-spa ──────
    # All traffic passes through oauth2-proxy which enforces Pocket ID login.
    # Unauthenticated requests are redirected to auth.stardatadb.com.
    server {
        listen 80;
        server_name console.stardatadb.com;

        # oauth2-proxy callback and internal paths
        location /oauth2/ {
            proxy_pass         http://console-oauth2-proxy.access.svc.cluster.local:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_buffering    off;
        }

        # All other traffic: gate through oauth2-proxy
        location / {
            proxy_pass         http://console-oauth2-proxy.access.svc.cluster.local:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_buffering    off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma        "no-cache" always;
            add_header Expires       "0" always;
        }

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # ── Health probe port (bypasses iptables redirect on master2) ────────────
    server {
        listen 8081;
        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: webconsole-proxy
  namespace: prod
  labels:
    app: webconsole-proxy
spec:
  selector:
    matchLabels:
      app: webconsole-proxy
  template:
    metadata:
      labels:
        app: webconsole-proxy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: master2.local
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 10
      containers:
        - name: nginx
          image: 192.168.1.50:30500/webconsole:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              hostPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: nginx-conf
          configMap:
            name: webconsole-proxy-conf
