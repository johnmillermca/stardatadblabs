---
apiVersion: v1
kind: Pod
metadata:
  name: iptables-setup
  namespace: prod
spec:
  hostNetwork: true
  hostPID: true
  nodeSelector:
    kubernetes.io/hostname: master2.local
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  restartPolicy: Never
  containers:
    - name: iptables
      image: registry.k8s.io/kube-proxy:v1.31.14
      imagePullPolicy: IfNotPresent
      securityContext:
        privileged: true
      command:
        - /bin/sh
        - -c
        - |
          # Remove the old port-80→30081 redirect rules if still present.
          # These were added when webconsole-proxy did not exist. Now that the
          # proxy pod binds port 80 directly on master2, these redirects break
          # cloudflared's ability to reach the proxy at 192.168.1.62:80.
          iptables -t nat -D PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 30081 2>/dev/null \
            && echo "PREROUTING redirect removed" || echo "PREROUTING redirect not present (ok)"
          iptables -t nat -D OUTPUT -p tcp --dport 80 -j REDIRECT --to-port 30081 2>/dev/null \
            && echo "OUTPUT redirect removed" || echo "OUTPUT redirect not present (ok)"
          echo "Current nat PREROUTING:"
          iptables -t nat -L PREROUTING -n --line-numbers
          sleep 5
