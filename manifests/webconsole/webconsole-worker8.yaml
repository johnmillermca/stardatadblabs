---
# ConfigMap — Nginx config served directly on worker8 port 80
apiVersion: v1
kind: ConfigMap
metadata:
  name: webconsole-worker8-conf
  namespace: prod
data:
  default.conf: |
    server {
        listen 80;
        server_name www.stardatadb.com stardatadb.com _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        gzip on;
        gzip_types text/html text/css application/javascript;
    }
---
# Pod — hostNetwork on worker8, binds port 80 directly on 192.168.1.58
apiVersion: v1
kind: Pod
metadata:
  name: webconsole-worker8
  namespace: prod
  labels:
    app: webconsole-worker8
spec:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  nodeSelector:
    kubernetes.io/hostname: worker8.local
  restartPolicy: Always
  containers:
    - name: nginx
      image: 192.168.1.50:30500/webconsole:latest
      imagePullPolicy: Always
      ports:
        - containerPort: 80
          hostPort: 80
          protocol: TCP
      volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "200m"
          memory: "64Mi"
  volumes:
    - name: nginx-conf
      configMap:
        name: webconsole-worker8-conf
