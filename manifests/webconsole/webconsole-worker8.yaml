---
# ConfigMap — Nginx config served directly on worker8 port 80
apiVersion: v1
kind: ConfigMap
metadata:
  name: webconsole-worker8-conf
  namespace: prod
data:
  default.conf: |
    server {
        listen 80;
        server_name www.stardatadb.com stardatadb.com _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Redirect old console.html to stargraph.html for backwards compat
        location = /console.html {
            return 301 /stargraph.html;
        }

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Prevent browser caching of HTML so redeployments take effect immediately
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma        "no-cache" always;
            add_header Expires       "0" always;
            try_files $uri $uri/ /index.html;
        }

        # ── SQL Proxy — forward /api/iceberg/* to stargraph-sql-proxy ──────────
        location /api/iceberg/ {
            proxy_pass         http://stargraph-sql-proxy.prod.svc.cluster.local:8680/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            add_header         Access-Control-Allow-Origin  * always;
            add_header         Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header         Access-Control-Allow-Headers "Content-Type" always;
            if ($request_method = OPTIONS) { return 204; }
        }

        # ── Invite mailer — forward /api/invite to invite-mailer-worker8 ───────
        # invite-mailer-worker8 pod is hostNetwork on worker8 port 8025 (same node)
        location /api/invite {
            proxy_pass         http://127.0.0.1:8025/send-invite;
            proxy_http_version 1.1;
            proxy_set_header   Host      $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            add_header         Access-Control-Allow-Origin  "https://www.stardatadb.com" always;
            add_header         Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header         Access-Control-Allow-Headers "Content-Type" always;
            if ($request_method = OPTIONS) { return 204; }
        }

        gzip on;
        gzip_types text/html text/css application/javascript application/json;
    }
---
# Pod — hostNetwork on worker8, binds port 80 directly on 192.168.1.58
apiVersion: v1
kind: Pod
metadata:
  name: webconsole-worker8
  namespace: prod
  labels:
    app: webconsole-worker8
spec:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  nodeSelector:
    kubernetes.io/hostname: worker8.local
  restartPolicy: Always
  containers:
    - name: nginx
      image: 192.168.1.50:30500/webconsole:latest
      imagePullPolicy: Always
      ports:
        - containerPort: 80
          hostPort: 80
          protocol: TCP
      volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "200m"
          memory: "64Mi"
  volumes:
    - name: nginx-conf
      configMap:
        name: webconsole-worker8-conf
