---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: prod
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # Pinned to worker1.local — tunnel endpoint node (192.168.1.51).
      nodeSelector:
        kubernetes.io/hostname: worker1.local
      tolerations:
        - key: node-role.kubernetes.io/worker
          operator: Exists
          effect: NoSchedule
        - key: dedicated
          operator: Equal
          value: stardata
          effect: NoSchedule
      # Give cloudflared time to drain active tunnel connections on shutdown
      # instead of being SIGKILL'd (exit 137) by the default 30s timeout.
      terminationGracePeriodSeconds: 30
      containers:
        - name: cloudflared
          image: 192.168.1.50:30500/cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token
                  key: token
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "1Gi"
          # Prevent traffic being sent before the tunnel is established
          readinessProbe:
            httpGet:
              path: /ready
              port: 20241
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: 20241
            initialDelaySeconds: 10
            periodSeconds: 20
