<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>StarData Console</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  background:#0f1117;color:#e8eaf0;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
}
.card{
  background:#16181f;border:1px solid #2a2d38;border-radius:14px;
  padding:48px 40px;width:100%;max-width:420px;text-align:center;
}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:32px}
.logo-text{font-size:24px;font-weight:800;color:#e8eaf0;letter-spacing:-.02em}
.title{font-size:20px;font-weight:700;margin-bottom:10px}
.sub{font-size:14px;color:#6b7280;line-height:1.6;margin-bottom:32px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:11px 28px;border-radius:7px;font-size:14px;font-weight:600;
  background:#3346C4;color:#fff;text-decoration:none;border:none;cursor:pointer;
  transition:background .12s;
}
.btn:hover{background:#4458e0}
.signout{display:block;margin-top:16px;font-size:13px;color:#6b7280;text-decoration:none}
.signout:hover{color:#e8eaf0}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="22" fill="#1e1440" stroke="#a78bfa" stroke-width="1.5"/>
      <ellipse cx="24" cy="17" rx="7.5" ry="2.8" fill="#3346C4" stroke="#a5b4fc" stroke-width="1.4"/>
      <rect x="16.5" y="17" width="15" height="10" fill="#2a3baa" stroke="#a5b4fc" stroke-width="1.4"/>
      <ellipse cx="24" cy="27" rx="7.5" ry="2.8" fill="#3346C4" stroke="#a5b4fc" stroke-width="1.4"/>
      <line x1="17" y1="22" x2="31" y2="22" stroke="#a5b4fc" stroke-width="1" opacity=".6"/>
      <path d="M8 30 Q13 40 24 41 Q35 40 40 30 Z" fill="rgba(51,70,196,.3)"/>
      <g transform="translate(34,12)">
        <path d="M0,-5 L1.2,-1.2 L5,0 L1.2,1.2 L0,5 L-1.2,1.2 L-5,0 L-1.2,-1.2Z" fill="#e0e7ff"/>
      </g>
    </svg>
    <span class="logo-text">StarData</span>
  </div>

  <div class="title">Welcome to StarData Console</div>
  <div class="sub">You are signed in. The console is coming soon.</div>

  <a href="https://auth.stardatadb.com/logout" class="btn">Sign out</a>
  <a href="https://www.stardatadb.com" class="signout">Back to home</a>
</div>
</body>
</html>
