# Strimzi KafkaNodePool — combined controller+broker (KRaft)
# IMPORTANT: This PV is created by the local-path provisioner when the
# KafkaNodePool first binds its PVC. It is recorded here so that after a
# full cluster rebuild the PV can be recreated with the same name, claimRef,
# and hostPath — allowing the existing PVC to rebind to its data rather than
# getting stuck in Released state.
