# =============================================================================
# Storage — local-path StorageClass + provisioner path config
# reclaimPolicy: Retain  — data is NEVER deleted when a PVC is removed
# All application PVCs should use storageClassName: local-path
# =============================================================================

# StorageClass with Retain policy — ensures no PV is auto-deleted on PVC removal
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
# Patch the local-path-provisioner ConfigMap to use /home on every node
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: local-path-storage
data:
  config.json: |
    {
      "nodePathMap": [
        {
          "node": "master.local",
          "paths": ["/home/local-path-provisioner"]
        },
        {
          "node": "worker1.local",
          "paths": ["/home/local-path-provisioner"]
        },
        {
          "node": "worker2.local",
          "paths": ["/home/local-path-provisioner"]
        },
        {
          "node": "worker3.local",
          "paths": ["/home/local-path-provisioner"]
        },
        {
          "node": "worker4.local",
          "paths": ["/home/local-path-provisioner"]
        },
        {
          "node": "worker5.local",
          "paths": ["/home/local-path-provisioner"]
        }
      ]
    }
  helperPod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
      - name: helper-pod
        image: busybox
        imagePullPolicy: IfNotPresent
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
