# =============================================================================
# starpump-incremental.yaml
#
# Replaces three CronJobs with a single long-running Deployment.
# starpump-scheduler.py (baked into the image) loops every INTERVAL_S seconds
# and runs starpump.py sequentially for each source: postgres → oracle → mongodb.
#
# To change interval or source config: edit the ConfigMap below and the
# scheduler picks it up on the next cycle — no pod restart needed.
#
# To run only one source:
#   kubectl set env deployment/starpump-incremental SOURCES=postgres -n prod
#
# To trigger an immediate run (interrupt the sleep):
#   kubectl rollout restart deployment/starpump-incremental -n prod
# =============================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: starpump-incremental-config
  namespace: prod
  labels:
    app: starpump
    pipeline.type: incremental
data:
  # ── Scheduler ──────────────────────────────────────────────────────────────
  INTERVAL_S:   "900"         # 15 min between end-of-cycle and start-of-next
  SOURCES:      "postgres,oracle,mongodb"

  # ── Common starpump settings ───────────────────────────────────────────────
  BATCH_SIZE:          "100000"
  MAX_THREADS:         "4"
  MODE:                "incremental"
  DDL_DRIFT_DETECT:    "1"
  DRY_RUN:             "0"
  MAX_TABLE_SIZE_GB:   "0"
  ADDR:                "http://openbao.prod.svc.cluster.local:8200"

  # ── Executor sizing — 1 executor × 3 cores on 1 worker ────────────────────
  # spark.cores.max=3 + executor.cores=3 → job stays on a single worker node.
  # 450m heap + 384m overhead = 834m < 900m SPARK_WORKER_MEMORY ✓
  SPARK_EXECUTOR_MEMORY: "450m"
  SPARK_EXECUTOR_CORES:  "3"
  SPARK_CORES_MAX:       "3"
  DISABLE_GLUTEN:        "1"

  # ── Per-source config (scheduler reads PG_*, ORA_*, MGO_* prefixes) ────────
  PG_DATABASE:        "cache_testing"
  PG_SCHEMAS:         "public"
  PG_ICEBERG_CATALOG: "postgres"
  PG_INCLUDE_TABLES:  "customers,products,product_reviews,orders"

  ORA_DATABASE:        "XEPDB1"
  ORA_SCHEMAS:         "CACHE_TESTING"
  ORA_ICEBERG_CATALOG: "oracle"
  ORA_INCLUDE_TABLES:  "customers"

  MGO_DATABASE:        "cache_testing"
  MGO_SCHEMAS:         "cache_testing"
  MGO_ICEBERG_CATALOG: "mongodb"
  MGO_INCLUDE_TABLES:  "customers,products"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starpump-incremental
  namespace: prod
  labels:
    app: starpump
    pipeline.type: incremental
spec:
  replicas: 1
  selector:
    matchLabels:
      app: starpump
      pipeline.type: incremental
  template:
    metadata:
      labels:
        app: starpump
        pipeline.type: incremental
    spec:
      restartPolicy: Always
      serviceAccountName: spark-service-account
      containers:
        - name: starpump-scheduler
          image: 192.168.1.50:30500/spark-gluten-velox:3.5.1-34
          imagePullPolicy: Always
          command: ["python3", "/opt/spark/work-dir/starpump-scheduler.py"]
          env:
            - name: USER
              value: dave
            - name: SPARK_USER
              value: dave
            # Scheduler control
            - name: INTERVAL_S
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: INTERVAL_S
            - name: SOURCES
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: SOURCES
            # Common starpump env
            - name: MODE
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: MODE
            - name: BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: BATCH_SIZE
            - name: MAX_THREADS
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: MAX_THREADS
            - name: DDL_DRIFT_DETECT
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: DDL_DRIFT_DETECT
            - name: DRY_RUN
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: DRY_RUN
            - name: MAX_TABLE_SIZE_GB
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: MAX_TABLE_SIZE_GB
            - name: ADDR
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: ADDR
            # Executor sizing
            - name: SPARK_EXECUTOR_MEMORY
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: SPARK_EXECUTOR_MEMORY
            - name: SPARK_EXECUTOR_CORES
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: SPARK_EXECUTOR_CORES
            - name: SPARK_CORES_MAX
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: SPARK_CORES_MAX
            - name: DISABLE_GLUTEN
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: DISABLE_GLUTEN
            # Per-source overrides (scheduler reads PG_*, ORA_*, MGO_* prefixes)
            - name: PG_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: PG_DATABASE
            - name: PG_SCHEMAS
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: PG_SCHEMAS
            - name: PG_ICEBERG_CATALOG
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: PG_ICEBERG_CATALOG
            - name: PG_INCLUDE_TABLES
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: PG_INCLUDE_TABLES
            - name: ORA_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: ORA_DATABASE
            - name: ORA_SCHEMAS
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: ORA_SCHEMAS
            - name: ORA_ICEBERG_CATALOG
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: ORA_ICEBERG_CATALOG
            - name: ORA_INCLUDE_TABLES
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: ORA_INCLUDE_TABLES
            - name: MGO_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: MGO_DATABASE
            - name: MGO_SCHEMAS
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: MGO_SCHEMAS
            - name: MGO_ICEBERG_CATALOG
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: MGO_ICEBERG_CATALOG
            - name: MGO_INCLUDE_TABLES
              valueFrom:
                configMapKeyRef:
                  name: starpump-incremental-config
                  key: MGO_INCLUDE_TABLES
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
