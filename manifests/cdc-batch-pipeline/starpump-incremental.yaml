# =============================================================================
# starpump-incremental.yaml
#
# Kubernetes CronJob + ConfigMap for scheduled Starpump incremental loads.
#
# Schedule: every 15 minutes for all three CDC sources (Fivetran-style).
# Mode: incremental — reads only rows newer than the last pipeline_watermarks
#       timestamp, updates the watermark after each successful run.
#
# The CronJobs reference the spark-master pod via the internal Spark master URL.
# Credentials come from OpenBao — no secrets are stored in Kubernetes.
#
# Image: uses the existing spark-gluten-velox image which already contains
#        starpump.py, bao_spark_init.py, spark_iceberg_utils.py and all JARs.
# =============================================================================

# ── ConfigMap: Starpump incremental job config ───────────────────────────────

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: starpump-incremental-config
  namespace: prod
  labels:
    app: starpump
    pipeline.type: incremental
data:
  # Common settings (overridden per-source by env vars in the CronJob spec)
  BATCH_SIZE:          "100000"
  MAX_THREADS:         "4"      # 4 threads on a 1-executor cluster: each thread runs driver-side
                                # JDBC reads then hands off to the single executor for writes.
                                # 8 threads caused contention on the shared SparkSession lock.
  MODE:                "incremental"
  DDL_DRIFT_DETECT:    "1"
  DRY_RUN:             "0"
  MAX_TABLE_SIZE_GB:   "0"      # no size filter for incremental — only new rows are fetched
  ADDR:                "http://openbao.prod.svc.cluster.local:8200"

  # ── Executor sizing — matched to 800m SPARK_WORKER_MEMORY ─────────────────
  # heap 400m + overhead max(384m, 60m) = 784m total < 800m worker capacity.
  # bao_spark_init.spark_conf() reads these env vars directly.
  SPARK_EXECUTOR_MEMORY: "450m"
  SPARK_EXECUTOR_CORES:  "1"
  DISABLE_GLUTEN:        "1"    # Gluten/Velox requires ≥4 Gi worker; disabled on 800m cluster.

  # PostgreSQL incremental config
  pg-SCHEMAS:          "public"
  pg-DATABASE:         "cache_testing"
  pg-ICEBERG_CATALOG:  "postgres"
  pg-INCLUDE_TABLES:   "customers,products,product_reviews,orders"

  # Oracle incremental config
  ora-SCHEMAS:         "CACHE_TESTING"
  ora-DATABASE:        "XEPDB1"
  ora-ICEBERG_CATALOG: "oracle"
  ora-INCLUDE_TABLES:  "customers"

  # MongoDB incremental config
  mgo-SCHEMAS:         "cache_testing"
  mgo-DATABASE:        "cache_testing"
  mgo-ICEBERG_CATALOG: "mongodb"
  mgo-INCLUDE_TABLES:  "customers,products"

---
# ── CronJob: PostgreSQL incremental load ─────────────────────────────────────

apiVersion: batch/v1
kind: CronJob
metadata:
  name: starpump-incremental-postgres
  namespace: prod
  labels:
    app: starpump
    pipeline.source: postgres
    pipeline.type: incremental
spec:
  schedule: "*/15 * * * *"     # every 15 minutes
  concurrencyPolicy: Forbid    # skip if previous run still active
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120 # allow 2 min late start before skipping
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800 # 30 min: incremental load of 4 tables with watermark queries
      template:
        metadata:
          labels:
            app: starpump
            pipeline.source: postgres
        spec:
          restartPolicy: Never
          serviceAccountName: spark-service-account
          containers:
            - name: starpump
              image: 192.168.1.50:30500/spark-gluten-velox:3.5.1-32
              imagePullPolicy: Always
              command:
                - /bin/bash
                - -c
                - |
                  cd /opt/spark/work-dir && \
                  SPARK_USER=dave \
                  python3 starpump.py postgres \
                    --mode incremental
              env:
                - name: USER
                  value: dave
                - name: SPARK_USER
                  value: dave
                - name: MODE
                  value: incremental
                - name: DDL_DRIFT_DETECT
                  value: "1"
                - name: BATCH_SIZE
                  value: "100000"
                - name: MAX_THREADS
                  value: "4"
                - name: MAX_TABLE_SIZE_GB
                  value: "0"
                - name: SPARK_EXECUTOR_MEMORY
                  valueFrom:
                    configMapKeyRef:
                      name: starpump-incremental-config
                      key: SPARK_EXECUTOR_MEMORY
                - name: SPARK_EXECUTOR_CORES
                  valueFrom:
                    configMapKeyRef:
                      name: starpump-incremental-config
                      key: SPARK_EXECUTOR_CORES
                - name: DISABLE_GLUTEN
                  valueFrom:
                    configMapKeyRef:
                      name: starpump-incremental-config
                      key: DISABLE_GLUTEN
                - name: INCLUDE_TABLES
                  valueFrom:
                    configMapKeyRef:
                      name: starpump-incremental-config
                      key: pg-INCLUDE_TABLES
                - name: DATABASE
                  valueFrom:
                    configMapKeyRef:
                      name: starpump-incremental-config
                      key: pg-DATABASE
                - name: SCHEMAS
                  valueFrom:
                    configMapKeyRef:
                      name: starpump-incremental-config
                      key: pg-SCHEMAS
                - name: ICEBERG_CATALOG
                  valueFrom:
                    configMapKeyRef:
                      name: starpump-incremental-config
                      key: pg-ICEBERG_CATALOG
                - name: ADDR
                  valueFrom:
                    configMapKeyRef:
                      name: starpump-incremental-config
                      key: ADDR
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "250m"
                limits:
                  memory: "1Gi"
                  cpu: "1"

