# ── Oracle CDC topics ────────────────────────────────────────────────────────
# Topics are always lowercase thanks to LowerCaseTopicNamingStrategy on the
# oracle-cache-testing-cdc connector.  To replicate a new Oracle table:
#   1. Add its name to CDC_TABLES in register_oracle_cache_testing_connector.sh
#   2. Add a KafkaTopic block here following the same pattern below
#   3. Re-run the registration script (it deletes and re-creates the connector)

# NOTE: topicNames below use uppercase CACHE_TESTING because the connector
# currently runs with SchemaTopicNamingStrategy (Oracle data-dictionary casing).
# Once register_oracle_cache_testing_connector.sh is re-run with
# LowerCaseTopicNamingStrategy these will become oracle.cache_testing.<table>
# and the topicName values here should be updated to match at that time.

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: oracle-cache-testing-customers
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
    pipeline.source: oracle
    pipeline.database: cache_testing
spec:
  topicName: "oracle.CACHE_TESTING.CUSTOMERS"
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: delete
    retention.ms: "604800000"      # 7 days
    retention.bytes: "-1"
    compression.type: lz4

---
