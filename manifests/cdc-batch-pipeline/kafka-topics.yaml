# ── Oracle CDC topics ────────────────────────────────────────────────────────
# Topics use Oracle data-dictionary casing (uppercase) via Debezium's default
# SchemaTopicNamingStrategy.  To replicate a new Oracle table:
#   1. Add its name to CDC_TABLES in register_oracle_cache_testing_connector.sh
#   2. Add a KafkaTopic block here following the same pattern below
#   3. Re-run the registration script (it deletes and re-creates the connector)

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: oracle-cache-testing-customers
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
    pipeline.source: oracle
    pipeline.database: cache_testing
spec:
  topicName: "oracle.CACHE_TESTING.CUSTOMERS"
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: delete
    retention.ms: "604800000"      # 7 days
    retention.bytes: "-1"
    compression.type: lz4

