# =============================================================================
# kafka-topics.yaml
#
# KafkaTopic CRDs for the CDC + batch pipeline.
# All topics are managed by the Strimzi topic operator (auto.create.topics=false).
#
# Topic naming: {source}.{schema}.{table}  e.g. postgres.cache_testing.customers
#
# ── Oracle topic naming note ──────────────────────────────────────────────────
# Oracle stores all identifiers in uppercase in its data dictionary.
# Debezium's default SchemaTopicNamingStrategy preserves Oracle's casing, so
# Oracle topics use uppercase schema and table names:
#   oracle.CACHE_TESTING.CUSTOMERS, oracle.CACHE_TESTING.ORDERS, etc.
# table.include.list values must also be uppercase (Oracle data-dictionary requirement).
#
# Namespaces:
#   postgres.cache_testing.*   — PostgreSQL cache_testing DB tables
#   oracle.CACHE_TESTING.*     — Oracle XEPDB1.CACHE_TESTING tables (uppercase)
#   mongodb.cache_testing.*    — MongoDB cache_testing collections
#
# Schema-change topics (one per connector — DDL events from Debezium):
#   schema-changes.postgres             — postgres-cache-testing-cdc
#   schema-changes.oracle-cache-testing — oracle-cache-testing-cdc
#   schema-changes.mongodb              — mongodb-cache-testing-cdc
#
# IMPORTANT: schema history topics MUST use cleanup.policy=delete + retention.ms=-1.
#   Debezium KafkaSchemaHistory writes records without a message key.
#   Kafka log compaction requires every message to have a key and will reject
#   keyless messages with InvalidRecordException, crashing the connector task.
#   These topics must NEVER be given a finite retention — Debezium replays the
#   full schema history on every connector restart.  Truncating them causes an
#   immediate, unrecoverable connector failure.
#
# ── Per-tier retention design (safe — no accessibility impact) ────────────────
#
# Tier 1 — Raw Debezium CDC topics  (cleanup: delete, retention: 7 days)
#   e.g. postgres.cache_testing.customers
#   7 days gives a safe replay window for connector pause/restart.  Reducing
#   below this risks losing unflushed events if a connector is offline >N days.
#   tableflow flushes to Iceberg within FLUSH_INTERVAL (10 s); Iceberg is the
#   durable store.  The 7-day window is a safety buffer, NOT the primary store.
#
# Tier 2 — _sd topics  (cleanup: compact,delete, retention: 7 days, segment: 1 day)
#   e.g. postgres.cache_testing.customers_sd
#   compact+delete preserves the latest row per PK key regardless of retention.
#   The 7-day window covers replay for a tableflow pod restart.
#
# Tier 3 — _hist topics  (cleanup: delete, retention: 30 days, segment: 1 day)
#   e.g. postgres.cache_testing.customers_hist
#   Append-only audit log.  30 days intentional — reducing would destroy history
#   that has not yet been queried via ksqlDB or replayed to Iceberg.
#
# Tier 4 — _TBL materialised table backing topics  (cleanup: delete, retention: 2 days)
#   e.g. POSTGRES_CACHE_TESTING_CUSTOMERS_TBL  (ksqlDB RocksDB CSAS output)
#   Purpose: ksqlDB pull queries for the compare-table use-case.
#   RETENTION_MS=172800000 (2 days) + SEGMENT_MS=86400000 (1 day).
#   SEGMENT_MS is mandatory — without it the default 7-day segment roll prevents
#   Kafka from freeing segments even after retention.ms expires.
#   Safety guarantee: no Debezium connector and no tableflow consumer holds a
#   Kafka offset on _TBL topics.  ksqlDB materialises the table state in RocksDB
#   continuously; the backing topic is only used for RocksDB state restoration
#   after a ksqlDB restart.  2-day retention fully covers any ksqlDB pod restart
#   scenario and causes zero data loss or pipeline interruption.
#   These topics are auto-created by ksqlDB CSAS and are NOT declared here as
#   KafkaTopic CRs — their config is set via the ksqlDB WITH clause.
#
# Tier 5 — Schema-history topics  (cleanup: delete, retention: infinite)
#   MUST NOT be changed.  See note above.
#
# Partitions: 3 per data topic (parallelism for Spark Structured Streaming)
# Replicas: 1 (single-broker cluster)
# =============================================================================

# ── Schema-change topics (delete policy — Debezium requirement) ─────────────

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: schema-changes-postgres
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
    pipeline.source: postgres
    pipeline.type: schema-changes
spec:
  topicName: "schema-changes.postgres"
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: delete
    retention.ms: "-1"
    retention.bytes: "-1"

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: schema-changes-oracle-cache-testing
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
    pipeline.source: oracle
    pipeline.database: cache_testing
    pipeline.type: schema-changes
spec:
  topicName: "schema-changes.oracle-cache-testing"
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: delete
    retention.ms: "-1"
    retention.bytes: "-1"

---
apiVersion: kafka.strimzi.io/v1
