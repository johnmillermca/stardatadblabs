# =============================================================================
# TableFlow derived topics — _sd (soft-delete) and _hist (history tracking)
# =============================================================================
#
# _sd  topics: compact+delete, 7 day retention
#   ksqlDB CSAS streams partition by PK_ID — Kafka compaction keeps latest
#   row per key, so the topic always reflects current soft-delete state.
#
# _hist topics: delete only, 30 day retention
#   Append-only — every CDC event is a new message.  No compaction.
#
# These topics are auto-created by ksqlDB when the CSAS stream is first
# created.  These CRs reconcile the topic config to enforce the correct
# cleanup policy and retention.
# =============================================================================

