# =============================================================================
# kafka-topics.yaml
#
# KafkaTopic CRDs for the CDC + batch pipeline.
# All topics are managed by the Strimzi topic operator (auto.create.topics=false).
#
# Topic naming: {source}.{schema}.{table}  e.g. postgres.cache_testing.customers
#
# Namespaces:
#   postgres.cache_testing.*  — PostgreSQL cache_testing DB tables
#   oracle.tpcds.*            — Oracle XEPDB1.TPCDS tables
#   mongodb.cache_testing.*   — MongoDB cache_testing collections
#
# Schema-change topics (one per source — DDL events from Debezium):
#   schema-changes.postgres
#   schema-changes.oracle
#   schema-changes.mongodb
#
# Partitions: 3 per data topic (parallelism for Spark Structured Streaming)
# Replicas: 1 (single-broker cluster)
# Retention: 7 days (168 hours) — matches Kafka cluster default
# Cleanup policy: delete (CDC topics are not compacted — order matters)
# =============================================================================

# ── Schema-change topics (compacted — DDL history must be preserved) ────────

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: schema-changes-postgres
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
    pipeline.source: postgres
    pipeline.type: schema-changes
spec:
  topicName: "schema-changes.postgres"
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: compact
    retention.ms: "-1"
    retention.bytes: "-1"
    min.compaction.lag.ms: "0"

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: schema-changes-oracle
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
    pipeline.source: oracle
    pipeline.type: schema-changes
spec:
  topicName: "schema-changes.oracle"
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: compact
    retention.ms: "-1"
    retention.bytes: "-1"
    min.compaction.lag.ms: "0"

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: schema-changes-mongodb
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
    pipeline.source: mongodb
    pipeline.type: schema-changes
spec:
  topicName: "schema-changes.mongodb"
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: compact
    retention.ms: "-1"
    retention.bytes: "-1"
    min.compaction.lag.ms: "0"

# ── PostgreSQL CDC topics ────────────────────────────────────────────────────

---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: postgres-cache-testing-customers
  namespace: prod
  labels:
    strimzi.io/cluster: strimzi-kafka
    pipeline.source: postgres
    pipeline.database: cache_testing
spec:
  topicName: "postgres.cache_testing.customers"
  partitions: 3
  replicas: 1
  config:
    cleanup.policy: delete
    retention.ms: "604800000"      # 7 days
    retention.bytes: "-1"
    compression.type: lz4
    message.format.version: "3.0-IV1"

