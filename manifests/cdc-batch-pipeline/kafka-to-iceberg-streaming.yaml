# =============================================================================
# kafka-to-iceberg-streaming.yaml
#
# Kubernetes Deployment + ConfigMap for the Kafka→Iceberg CDC streaming consumer.
#
# Three write modes are supported, one Deployment per mode:
#
#   kafka-to-iceberg-standard         — SCD Type 0, MERGE + hard delete
#   kafka-to-iceberg-soft-delete      — MERGE upsert, soft-delete flag on DELETE
#   kafka-to-iceberg-history-tracking — append-only, full row history
#
# Only ONE Deployment should be active at a time (they all consume from the same
# Kafka topics).  Use kubectl scale to enable/disable:
#
#   kubectl scale deployment kafka-to-iceberg-standard -n prod --replicas=1
#   kubectl scale deployment kafka-to-iceberg-soft-delete -n prod --replicas=0
#   kubectl scale deployment kafka-to-iceberg-history-tracking -n prod --replicas=0
#
# Script delivery
# ───────────────
# 05_kafka_to_iceberg_streaming.py is NOT baked into the spark-gluten-velox
# image.  It is delivered via the kafka-to-iceberg-script ConfigMap and
# mounted into every pod at /opt/spark/work-dir/05_kafka_to_iceberg_streaming.py
# (overlaying the image filesystem at that path).
# To update the script: kubectl create configmap kafka-to-iceberg-script
#   --from-file=... --dry-run=client -o yaml | kubectl apply -f -
# Running pods pick up the new version on their next restart.
#
# Auto-restart
# ─────────────
# Kubernetes restartPolicy (built into Deployment): Always.
# The Python script runs an infinite internal retry loop (MAX_RESTART_ATTEMPTS=0).
# A liveness probe on HEALTH_PORT (8080) detects when all Spark streaming queries
# are dead and the process is stuck in a backoff spiral — Kubernetes kills and
# restarts the pod after failureThreshold * periodSeconds (default: 3 × 30s = 90s).
#
# Namespaces: prod
# =============================================================================

# ── ConfigMap: shared streaming config ───────────────────────────────────────

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-to-iceberg-config
  namespace: prod
  labels:
    app: kafka-to-iceberg
    pipeline.type: streaming
data:
  SPARK_USER:              "dave"
  TRIGGER_INTERVAL:        "2 seconds"
  MAX_OFFSETS_PER_TRIGGER: "50000"
  MAX_RESTART_ATTEMPTS:    "0"
  HEALTH_PORT:             "8080"
  RESTART_BACKOFF_BASE_S:  "5"
  RESTART_BACKOFF_MAX_S:   "120"
  DRY_RUN:                 "0"
  ADDR:                    "http://openbao.prod.svc.cluster.local:8200"
  # Peak-hour performance tuning
  # MERGE_PARALLELISM: shuffle partitions for MERGE ops (1-1000 row CDC batches stay at 4;
  # raise to 16-32 only for bulk-load catch-up scenarios)
  MERGE_PARALLELISM:            "4"
  # COALESCE_BEFORE_MERGE: 1 is optimal for low-row-count CDC batches (avoids shuffle overhead)
  COALESCE_BEFORE_MERGE:        "1"
  # ADAPTIVE_COALESCE_TARGET: AQE target bytes per post-shuffle partition (64 MB)
  ADAPTIVE_COALESCE_TARGET:     "67108864"
  # EXECUTOR_INSTANCES / EXECUTOR_CORES / EXECUTOR_MEMORY / EXECUTOR_OFFHEAP:
  # Keep at 1x1 core for normal CDC streaming — micro-batches are tiny (1-1000 rows).
  EXECUTOR_INSTANCES:           "1"
  EXECUTOR_CORES:               "1"
  EXECUTOR_MEMORY:              "2g"
  EXECUTOR_OFFHEAP:             "512m"
  # MAX_EXECUTORS: ceiling for dynamic allocation burst (default 3).
  # At idle = 0 executors; normal CDC = 1; sustained backlog >60s = up to 3.
  MAX_EXECUTORS:                "3"
  # BURST_BACKLOG_TIMEOUT_S: seconds of sustained task backlog before adding a
  # 2nd (then 3rd) executor. Default 60 — waits 1 minute before bursting.
  BURST_BACKLOG_TIMEOUT_S:      "60"
  # TRANSFORM_PIPELINE: comma-separated StarTransform steps applied before write-mode handler.
  # Available: deduplicate, add_processing_time, add_op_label, add_source_tag, mask_pii
  # Leave empty ("") to disable all transforms (default).
  TRANSFORM_PIPELINE:           ""
  # PII_COLUMNS: comma-separated column names to SHA-256 hash when mask_pii is active.
  PII_COLUMNS:                  "email,phone,phone_number,ssn,credit_card"
  # TARGET_NAMESPACE: when set, overrides the Iceberg namespace derived from the Kafka topic
  # for ALL sources (postgres + oracle + mongodb) so every table lands in one namespace.
  # Leave empty "" — each topic routes to its own namespace (cache_testing/tpcds).
  # E2E testing only: set to "e2e_testing" so all three databases write into e2e_testing.
  #   postgres.cache_testing.customers → postgres.e2e_testing.customers
  #   oracle.cache_testing.CUSTOMERS   → oracle.e2e_testing.customers
  #   mongodb.cache_testing.customers  → mongodb.e2e_testing.customers
  TARGET_NAMESPACE:             ""

# ── ConfigMap: streaming script (managed by ArgoCD) ──────────────────────────

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-to-iceberg-script
  namespace: prod
  labels:
    app: kafka-to-iceberg
    pipeline.type: streaming
data:
  05_kafka_to_iceberg_streaming.py: |
    #!/usr/bin/env python3
    """
    05_kafka_to_iceberg_streaming.py
    ================================
    Spark Structured Streaming consumer — Debezium CDC → Iceberg via Polaris REST.
    
    Three write modes, configurable per-run via the WRITE_MODE environment variable:
    
      standard         SCD Type 0 — MERGE INTO Iceberg by PK.
                       INSERT/UPDATE (op c/u/r) → upsert (match update + insert new).
                       DELETE        (op d)     → hard delete the matched row.
    
      soft_delete      MERGE upsert for INSERT/UPDATE.
                       DELETE event  → set is_deleted=true, deleted_at=<now()>.
                       Row is never physically removed.
    
      history_tracking Always INSERT into Iceberg — never UPDATE or DELETE.
                       Every CDC event appended with:
                         _change_type  (INSERT/UPDATE/DELETE)
                         _change_ts    (wall-clock at pipeline processing time)
                         before_*      columns (before image from source DB for UPDATE/DELETE)
                         after_*       columns (after  image from source DB for INSERT/UPDATE)
                       Full row-level before/after history preserved.
    
    Source → topic → Iceberg target mapping
    ----------------------------------------
      postgres  : postgres.cache_testing.*  → postgres.cache_testing.<table>
      oracle    : oracle.tpcds.*            → oracle.tpcds.<table>
                  oracle.cache_testing.*    → oracle.cache_testing.<table>
      mongodb   : mongodb.cache_testing.*   → mongodb.cache_testing.<table>
    
    star_transform integration
    --------------------------
    A TRANSFORM_PIPELINE env-var (comma-separated step names) allows optional
    StarTransform steps to run on every micro-batch before the write-mode handler:
    
      TRANSFORM_PIPELINE=deduplicate,add_processing_time,mask_pii
    
    Available built-in pipeline step names (see TRANSFORM_REGISTRY below):
      deduplicate          — last-write-wins dedup per PK within the batch
      add_processing_time  — inject proc_time TIMESTAMP
      add_op_label         — inject human-readable op_label (INSERT/UPDATE/DELETE)
      add_source_tag       — inject source_system STRING
      mask_pii             — SHA-256 hash columns listed in PII_COLUMNS env-var
    
    For custom transformations call StarTransform functions directly inside a
    custom foreachBatch hook and pass it via the CUSTOM_TRANSFORM_MODULE env-var.
    
    Performance (peak-hour) tuning
    -------------------------------
    • MAX_OFFSETS_PER_TRIGGER   — cap Kafka offsets per micro-batch (back-pressure)
    • TRIGGER_INTERVAL          — micro-batch window (default 2 seconds)
    • MERGE_PARALLELISM         — spark.sql.shuffle.partitions for MERGE operations
    • COALESCE_BEFORE_MERGE     — coalesce batch partitions before MERGE (reduces
                                  small-file write amplification under high load)
    • ADAPTIVE_COALESCE_TARGET  — target bytes per post-shuffle partition (AQE)
    
    Snap columns
    ------------
    • snap_id        BIGINT    — globally unique per row: (batch_id * 10_000_000) + monotonically_increasing_id()
                                 batch_id is the Spark Structured Streaming micro-batch counter (monotonically
                                 increasing per streaming query lifetime), ensuring uniqueness even when a batch
                                 contains only 1 row (where monotonically_increasing_id alone repeats).
    • snap_timestamp TIMESTAMP — current_timestamp() at write time (same for all rows in batch)
    Both are injected per write-mode handler, not by IcebergTableBuilder.write_append(),
    so MERGE operations (standard/soft_delete) can include them in SET clauses.
    
    Iceberg partitioning (applied at table creation)
    -------------------------------------------------
      hours(snap_timestamp)   — hourly partition for time-range pruning
      bucket(16, <pk_col>)    — 16 hash buckets within each hour for data distribution
    
    Checkpoints
    -----------
      s3://xdatatoiceberg1/checkpoints/streaming/<source>/<write_mode>
    
    Auto-restart
    ------------
    • Kubernetes restartPolicy: Always (pod-level).
    • Internal exponential-backoff retry loop (MAX_RESTART_ATTEMPTS=0 → infinite;
      set to a positive integer to cap retries for debugging).
    • Per-batch restart: after each committed micro-batch the streaming query is
      stopped and immediately restarted from checkpoint — fresh Spark context per batch.
    • HTTP health server on HEALTH_PORT (default 8080): GET / returns 200 OK when
      all streaming queries are active, 503 when they are all dead (used by the
      Kubernetes livenessProbe).
    
    Credentials
    -----------
    All from OpenBao via BaoSparkInit — never hardcoded.
    
    Usage
    -----
      SPARK_USER=dave WRITE_MODE=standard python3 05_kafka_to_iceberg_streaming.py
      SPARK_USER=dave WRITE_MODE=soft_delete SOURCE=postgres \\
          python3 05_kafka_to_iceberg_streaming.py
      SPARK_USER=dave WRITE_MODE=history_tracking \\
          TRANSFORM_PIPELINE=deduplicate,add_processing_time \\
          python3 05_kafka_to_iceberg_streaming.py
      DRY_RUN=1 SPARK_USER=dave python3 05_kafka_to_iceberg_streaming.py
    """
    
    from __future__ import annotations
    
    import http.server
    import json
    import logging
    import os
    import sys
    import threading
    import time
    from typing import Any
    
    from pyspark.sql import DataFrame, SparkSession
    from pyspark.sql import functions as F
    from pyspark.sql.functions import (
        col, current_timestamp, from_json, lit,
        monotonically_increasing_id, udf,
    )
    from pyspark.sql.streaming import StreamingQuery
    from pyspark.sql.types import (
        BooleanType, DoubleType, LongType, StringType, StructField, StructType, TimestampType,
    )
    
    from bao_spark_init import BaoSparkInit
    from spark_iceberg_utils import IcebergTableBuilder
    from star_transform import StarTransform as ST
    from importlib import import_module as _imod
    
    # ── Logging ───────────────────────────────────────────────────────────────────
    logging.basicConfig(
        level=logging.INFO,
        format="%(asctime)s [%(levelname)s] %(name)s – %(message)s",
        datefmt="%Y-%m-%dT%H:%M:%S",
    )
    logger = logging.getLogger("kafka-to-iceberg")
    
    # ── Write modes ───────────────────────────────────────────────────────────────
    _WRITE_MODE_STANDARD         = "standard"
    _WRITE_MODE_SOFT_DELETE      = "soft_delete"
    _WRITE_MODE_HISTORY_TRACKING = "history_tracking"
    _VALID_WRITE_MODES = (
        _WRITE_MODE_STANDARD,
        _WRITE_MODE_SOFT_DELETE,
        _WRITE_MODE_HISTORY_TRACKING,
    )
    
    # ── Config ────────────────────────────────────────────────────────────────────
    SPARK_USER  = os.environ.get("SPARK_USER", "dave")
    DRY_RUN     = os.environ.get("DRY_RUN", "0") == "1"
    WRITE_MODE  = os.environ.get("WRITE_MODE", _WRITE_MODE_STANDARD).lower()
    _SOURCE_FILTER = os.environ.get("SOURCE", "").lower()
    
    # Optional namespace override — when set, ALL topics from ALL sources are written
    # into this Iceberg namespace instead of the namespace derived from the Kafka topic.
    # Use-case: E2E testing — set TARGET_NAMESPACE=e2e_testing so that
    #   postgres.cache_testing.customers  → postgres.e2e_testing.customers
    #   oracle.cache_testing.CUSTOMERS    → oracle.e2e_testing.customers
    #   mongodb.cache_testing.customers   → mongodb.e2e_testing.customers
    # Leave empty ("") in production so each topic routes to its own namespace.
    _TARGET_NAMESPACE = os.environ.get("TARGET_NAMESPACE", "").strip()
    
    # Auto-restart loop config
    # 0 = infinite retries (default — Kubernetes is the only termination gate).
    # Set to a positive integer to cap retries during debugging.
    MAX_RESTART_ATTEMPTS   = int(os.environ.get("MAX_RESTART_ATTEMPTS", "0"))
    RESTART_BACKOFF_BASE_S = float(os.environ.get("RESTART_BACKOFF_BASE_S", "5"))
    RESTART_BACKOFF_MAX_S  = float(os.environ.get("RESTART_BACKOFF_MAX_S", "120"))
    
    # HTTP health server port — serves liveness probe endpoint GET /
    HEALTH_PORT = int(os.environ.get("HEALTH_PORT", "8080"))
    
    KAFKA_BOOTSTRAP = "strimzi-kafka-kafka-bootstrap.prod.svc.cluster.local:9092"
    SR_URL          = "http://schema-registry.prod.svc.cluster.local:8081"
    S3_BUCKET       = "xdatatoiceberg1"
    
    # Streaming micro-batch trigger interval.
    TRIGGER_INTERVAL = os.environ.get("TRIGGER_INTERVAL", "2 seconds")
    
    # Back-pressure: max Kafka offsets consumed per trigger.
    MAX_OFFSETS_PER_TRIGGER = int(os.environ.get("MAX_OFFSETS_PER_TRIGGER", "50000"))
    
    # Peak-hour performance tuning
    # Number of shuffle partitions used during MERGE operations.
    # CDC batches are small (1–1000 rows); keep low to avoid task scheduling overhead.
    # Raise to 16–32 only for bulk-load catch-up scenarios.
    MERGE_PARALLELISM = int(os.environ.get("MERGE_PARALLELISM", "4"))
    
    # Coalesce batch DataFrame partitions before MERGE.
    # 1 is optimal for low-row-count CDC batches — avoids shuffle overhead.
    COALESCE_BEFORE_MERGE = int(os.environ.get("COALESCE_BEFORE_MERGE", "1"))
    
    # AQE adaptive coalesce target bytes per post-shuffle partition (64 MB default).
    ADAPTIVE_COALESCE_TARGET = os.environ.get("ADAPTIVE_COALESCE_TARGET", "67108864")
    
    # Executor sizing — keep small so the streaming job does not starve other Spark
    # jobs on the cluster.  CDC micro-batches are tiny (1–1000 rows); a single
    # executor with 1 core is plenty.  Raise via env vars for bulk-load catch-up.
    EXECUTOR_INSTANCES = int(os.environ.get("EXECUTOR_INSTANCES", "1"))
    EXECUTOR_CORES     = int(os.environ.get("EXECUTOR_CORES",     "1"))
    EXECUTOR_MEMORY    = os.environ.get("EXECUTOR_MEMORY",        "2g")
    EXECUTOR_OFFHEAP   = os.environ.get("EXECUTOR_OFFHEAP",       "512m")
    
    # Maximum executors the dynamic allocator may scale up to under sustained load.
    # Default 3: baseline = 1 executor (1 core); burst = up to 3 executors (3 cores)
    # after BURST_BACKLOG_TIMEOUT_S seconds of sustained task backlog.
    # Set to 1 to disable burst (hard cap at 1 core always).
    MAX_EXECUTORS = int(os.environ.get("MAX_EXECUTORS", "3"))
    
    # How long (seconds) the scheduler backlog must be sustained before the dynamic
    # allocator requests an additional executor (2nd and beyond).
    # Default 60: a job must be backlogged for 60 s before getting an extra core,
    # so short CDC micro-batches never consume more than 1 core unnecessarily.
    BURST_BACKLOG_TIMEOUT_S = int(os.environ.get("BURST_BACKLOG_TIMEOUT_S", "60"))
    
    # ── StarTransform pipeline config ─────────────────────────────────────────────
    # Comma-separated list of built-in transform step names to apply before
    # each write-mode handler.  Example: "deduplicate,add_processing_time"
    _TRANSFORM_PIPELINE_ENV = os.environ.get("TRANSFORM_PIPELINE", "").strip()
    _TRANSFORM_STEPS = [s.strip() for s in _TRANSFORM_PIPELINE_ENV.split(",") if s.strip()]
    
    # PII columns to hash when the "mask_pii" step is in TRANSFORM_PIPELINE.
    _PII_COLUMNS = [
        c.strip()
        for c in os.environ.get("PII_COLUMNS", "email,phone,phone_number,ssn,credit_card").split(",")
        if c.strip()
    ]
    
    
    # ── Per-table schema cache ────────────────────────────────────────────────────
    # Keyed by (source_key, table_name) → StructType.
    # Schema inference via spark.read.json(rdd) costs ~2 s per batch because it
    # launches a full Spark job to sample the JSON.  After the first inference the
    # schema is stable for the lifetime of the pipeline, so cache and reuse it.
    _SCHEMA_CACHE:     dict[tuple[str, str], "StructType"] = {}  # raw inferred (for from_json)
    _DDL_SCHEMA_CACHE: dict[tuple[str, str], "StructType"] = {}  # type-normalised (for CREATE TABLE DDL)
    
    # ── Validate write mode ───────────────────────────────────────────────────────
    if WRITE_MODE not in _VALID_WRITE_MODES:
        print(
            f"ERROR: WRITE_MODE={WRITE_MODE!r} is not valid. "
            f"Choose: {', '.join(_VALID_WRITE_MODES)}",
            file=sys.stderr,
        )
        sys.exit(1)
    
    
    # ── Source descriptor ─────────────────────────────────────────────────────────
    
    class _StreamingSource:
        """Describes a single CDC source for the streaming pipeline."""
        def __init__(
            self,
            source_key:    str,
            topic_pattern: str,
            catalog:       str,
            namespace:     str,
            pk_col:        str,
            s3_prefix:     str,
        ) -> None:
            self.source_key    = source_key
            self.topic_pattern = topic_pattern
            self.catalog       = catalog
            self.namespace     = namespace
            self.pk_col        = pk_col
            self.s3_prefix     = s3_prefix
            self.checkpoint    = (
                f"s3://{S3_BUCKET}/checkpoints/streaming/{source_key}/{WRITE_MODE}"
            )
    
    
    _ALL_SOURCES: list[_StreamingSource] = [
        _StreamingSource(
            source_key    = "postgres",
            topic_pattern = "postgres\\.cache_testing\\..*",
            catalog       = "postgres",
            namespace     = "cache_testing",
            pk_col        = "id",
            s3_prefix     = "iceberg/pg_lakehouse",
        ),
        _StreamingSource(
            source_key    = "oracle",
            topic_pattern = "oracle\\.(tpcds|cache_testing|TPCDS|CACHE_TESTING)\\..*",
            catalog       = "oracle",
            namespace     = "tpcds",
            pk_col        = "CUSTOMER_ID",
            s3_prefix     = "iceberg/ora_lakehouse",
        ),
        _StreamingSource(
            source_key    = "mongodb",
            topic_pattern = "mongodb\\.cache_testing\\..*",
            catalog       = "mongodb",
            namespace     = "cache_testing",
            pk_col        = "_id",
            s3_prefix     = "iceberg/mgo_lakehouse",
        ),
    ]
    
    if _SOURCE_FILTER:
        _ALL_SOURCES = [s for s in _ALL_SOURCES if s.source_key == _SOURCE_FILTER]
        if not _ALL_SOURCES:
            print(
                f"ERROR: SOURCE={_SOURCE_FILTER!r} not known. "
                "Choose: postgres, oracle, mongodb",
                file=sys.stderr,
            )
            sys.exit(1)
    
    
    # ── Debezium envelope schema ───────────────────────────────────────────────────
    # Debezium envelope: { before, after, op, source, ts_ms }
    # before and after arrive as JSON strings (nested JSON-in-Avro pattern).
    
    _DEBEZIUM_ENVELOPE_SCHEMA = StructType([
        StructField("before",  StringType(), True),   # JSON: before image (UPDATE/DELETE)
        StructField("after",   StringType(), True),   # JSON: after  image (INSERT/UPDATE)
        StructField("op",      StringType(), True),   # c=create, u=update, d=delete, r=read
        StructField("source",  StringType(), True),   # JSON: source metadata
        StructField("ts_ms",   LongType(),   True),   # source-side event timestamp millis
    ])
    
    
    # ── Schema Registry Avro helper ───────────────────────────────────────────────
    
    # ── Executor-level Schema Registry cache ─────────────────────────────────────
    # These dicts live in the executor Python process and survive across UDF calls
    # within the same executor.  They are NOT shared across executors (each executor
    # process has its own copy), but they eliminate the per-row HTTP round-trip to
    # the Schema Registry and the per-row Avro schema parse.
    #
    # _SR_CLIENT_CACHE  : { sr_url -> SchemaRegistryClient }  — one client per SR URL
    # _SR_SCHEMA_CACHE  : { schema_id -> avro.schema.Schema } — parsed schema objects
    # _SR_READER_CACHE  : { schema_id -> avro.io.DatumReader } — pre-built readers
    #
    # Cache is populated lazily on first access per schema_id.  A CDC pipeline with
    # 22 topics will typically see 22–44 distinct schema IDs (key + value per topic);
    # the cache converges within the first micro-batch and stays warm for the
    # lifetime of the executor.
    _SR_CLIENT_CACHE: dict = {}
    _SR_SCHEMA_CACHE: dict = {}
    _SR_READER_CACHE: dict = {}
    
    
    def _build_avro_deserialize_udf(_sr_url: str) -> Any:
        """
        Build a Python UDF that deserialises a Confluent Avro-encoded byte array
        (5-byte magic header: 0x00 + 4-byte schema ID + avro payload) to a JSON string.
        Falls back to UTF-8 decode if the magic byte is absent (plain JSON mode).
    
        Efficiency design
        -----------------
        • SchemaRegistryClient is created ONCE per executor process and reused across
          all UDF invocations (stored in _SR_CLIENT_CACHE keyed by SR URL).
        • Parsed avro.schema.Schema objects are cached by schema_id (_SR_SCHEMA_CACHE).
        • avro.io.DatumReader objects are cached by schema_id (_SR_READER_CACHE).
        • A BytesIO + BinaryDecoder is the only object created per row — unavoidable
          because the payload bytes differ per message.
        • Module-level imports (io, struct, avro.*) are resolved once at UDF build
          time, not inside the closure body.
    
        Cache lifetime: executor process lifetime (survives across micro-batches on
        the same executor; reset only on executor restart or pod restart).
        """
        import io as _io
        import struct as _struct
    
        # Resolve avro modules once at UDF build time (not per row)
        try:
            import avro.io as _aio
            import avro.schema as _aschema
            _avro_available = True
        except ImportError:
            _avro_available = False
    
        def avro_to_json(topic: str, raw_bytes: bytes) -> str | None:
            if raw_bytes is None:
                return None
            try:
                if len(raw_bytes) < 5 or raw_bytes[0] != 0:
                    # Not Confluent wire format — plain UTF-8 JSON
                    return raw_bytes.decode("utf-8", errors="replace")
    
                if not _avro_available:
                    # avro library not present — decode as UTF-8 best-effort
                    return raw_bytes[5:].decode("utf-8", errors="replace")
    
                schema_id = _struct.unpack(">I", raw_bytes[1:5])[0]
    
                # ── Executor-level SR client (created once per executor) ──────────
                if _sr_url not in _SR_CLIENT_CACHE:
                    from confluent_kafka.schema_registry import SchemaRegistryClient
                    _SR_CLIENT_CACHE[_sr_url] = SchemaRegistryClient({"url": _sr_url})
                sr = _SR_CLIENT_CACHE[_sr_url]
    
                # ── Executor-level DatumReader (created once per schema_id) ───────
                if schema_id not in _SR_READER_CACHE:
                    registered  = sr.get_schema(schema_id)          # one HTTP GET per new schema
                    schema_def  = _aschema.parse(registered.schema_str)
                    _SR_SCHEMA_CACHE[schema_id] = schema_def
                    _SR_READER_CACHE[schema_id] = _aio.DatumReader(schema_def)
    
                reader  = _SR_READER_CACHE[schema_id]
                decoder = _aio.BinaryDecoder(_io.BytesIO(raw_bytes[5:]))  # per-row (payload differs)
                record  = reader.read(decoder)
                return json.dumps(record)
    
            except Exception as exc:
                logger.warning("avro_to_json failed (schema_id=%s): %s",
                               _struct.unpack(">I", raw_bytes[1:5])[0] if len(raw_bytes) >= 5 else "?",
                               exc)
                return None
    
        return udf(avro_to_json, StringType())
    
    
    # ── Table routing ─────────────────────────────────────────────────────────────
    
    def _topic_to_table(topic: str, source: _StreamingSource) -> str:
        """
        Derive the Iceberg table name from a Kafka topic name.
        e.g. "postgres.cache_testing.customers" → "customers"
             "oracle.tpcds.CALL_CENTER"         → "call_center"
        """
        import re
        # Strip the source prefix (e.g. "oracle.(tpcds|cache_testing).")
        # Use a simple split: take the last segment and lowercase it.
        parts = topic.split(".")
        return parts[-1].lower() if parts else ""
    
    
    def _topic_to_namespace(topic: str, source: _StreamingSource) -> str:
        """
        Derive the Iceberg namespace from a Kafka topic name.
    
        When TARGET_NAMESPACE is set (e.g. "e2e_testing"), that value is returned
        unconditionally for every topic and every source — all three databases
        (postgres, oracle, mongodb) write into the same target namespace:
            postgres.cache_testing.customers  → postgres.e2e_testing.customers
            oracle.cache_testing.CUSTOMERS    → oracle.e2e_testing.customers
            mongodb.cache_testing.customers   → mongodb.e2e_testing.customers
    
        When TARGET_NAMESPACE is empty the namespace is derived from the topic:
            e.g. "oracle.tpcds.INCOME_BAND"           → "tpcds"
                 "oracle.cache_testing.ORDERS"        → "cache_testing"
                 "postgres.cache_testing.orders"      → "cache_testing"
        """
        if _TARGET_NAMESPACE:
            return _TARGET_NAMESPACE
        parts = topic.split(".")
        # parts[0]=prefix (oracle/postgres/mongodb), parts[1]=namespace, parts[2]=table
        return parts[1].lower() if len(parts) >= 3 else source.namespace
    
    
    # ── StarTransform built-in pipeline registry ──────────────────────────────────
    
    def _build_transform_pipeline(
        source_key: str,
        pk_col:     str,
    ) -> list[tuple[Any, dict]]:
        """
        Build the list of (fn, kwargs) steps from TRANSFORM_STEPS env config.
        Called once per source at stream startup.
        """
        registry: dict[str, tuple[Any, dict]] = {
            "deduplicate":         (ST.deduplicate,         {"pk": pk_col, "order_col": "kafka_ts"}),
            "add_processing_time": (ST.add_processing_time, {}),
            "add_op_label":        (ST.add_op_label,        {}),
            "add_source_tag":      (ST.add_source_tag,      {"source_system": source_key}),
            "mask_pii":            (ST.mask_columns,        {"columns": _PII_COLUMNS}),
        }
        steps = []
        for step_name in _TRANSFORM_STEPS:
            if step_name in registry:
                steps.append(registry[step_name])
            else:
                logger.warning(
                    "[%s] Unknown TRANSFORM_PIPELINE step %r — skipped. "
                    "Available: %s",
                    source_key, step_name, list(registry.keys()),
                )
        if steps:
            logger.info(
                "[%s] StarTransform pipeline: %s",
                source_key, [s for s in _TRANSFORM_STEPS if s in registry],
            )
        return steps
    
    
    # ── Write-mode handlers ────────────────────────────────────────────────────────
    
    def _apply_standard(
        spark:        SparkSession,
        payload_df:   DataFrame,
        fqn_backtick: str,
        pk_col:       str,
        source_key:   str,
        table_name:   str,
        batch_id:     int,
    ) -> None:
        """
        SCD Type 0 — MERGE INTO Iceberg by PK.
    
        INSERT/UPDATE/snapshot (op c/u/r):
          MERGE MATCHED     → UPDATE all CDC columns (snap_id/snap_timestamp untouched —
                              excluded from SET so existing audit values are preserved)
          MERGE NOT MATCHED → INSERT CDC columns + fresh snap_id/snap_timestamp
    
        DELETE (op d):
          MERGE MATCHED → DELETE row from Iceberg (hard delete)
    
        snap_id / snap_timestamp injection strategy
        -------------------------------------------
        We call .withColumn() on the source DataFrame, then immediately materialise
        it with .cache() + .count() BEFORE createOrReplaceGlobalTempView().
    
        Why materialise?
          Spark's Iceberg MERGE planner (ReplaceData path) walks the FULL logical
          plan of the USING source — including the plan of any global temp view it
          references.  If monotonically_increasing_id() or current_timestamp() are
          still present as unevaluated expressions anywhere in that plan tree, Spark
          raises INVALID_NON_DETERMINISTIC_EXPRESSIONS even though those expressions
          are in the source, not the join condition.
    
          .cache() + .count() forces Spark to execute the DataFrame and store the
          result as an InMemoryRelation.  The global temp view then points to that
          static relation — the MERGE planner sees no live non-deterministic
          functions and proceeds normally.
    
          The cached DataFrame is unpersisted immediately after the MERGE to avoid
          memory pressure between batches.
    
        snap_id / snap_timestamp are excluded from the MATCHED SET clause so an
        UPDATE never overwrites the audit values stamped at INSERT time.
        """
        spark.conf.set("spark.sql.shuffle.partitions", str(MERGE_PARALLELISM))
    
        _SNAP_COLS = {"snap_id", "snap_timestamp"}
    
        inserts = payload_df.filter(col("_op").isin("c", "u", "r")).drop("_op", "kafka_ts")
        deletes = payload_df.filter(col("_op") == "d").drop("_op", "kafka_ts")
    
        if not inserts.isEmpty():
            raw_df = (
                inserts
                .coalesce(COALESCE_BEFORE_MERGE)
                .withColumn("snap_id",        (lit(batch_id).cast(LongType()) * lit(10_000_000).cast(LongType())
                                               + monotonically_increasing_id().cast(LongType())))
                .withColumn("snap_timestamp", current_timestamp())
            )
            # Fully break streaming lineage before registering the global temp view.
            #
            # Problem: createOrReplaceGlobalTempView() registers the *logical plan*
            # of the DataFrame, not its data.  When the source DataFrame still carries
            # the streaming LogicalRDD in its lineage (even after .cache()+.count()),
            # Spark's Iceberg MERGE planner (ReplaceData path) traverses that full
            # plan tree and flags monotonically_increasing_id() / current_timestamp()
            # as INVALID_NON_DETERMINISTIC_EXPRESSIONS.
            #
            # Fix: .collect() pulls the rows to the driver, then spark.createDataFrame()
            # builds a brand-new static DataFrame backed by a LocalRelation — completely
            # detached from the streaming LogicalRDD.  The MERGE planner sees only a
            # plain local table with no live expressions in its lineage.
            rows      = raw_df.collect()
            final_df  = spark.createDataFrame(rows, raw_df.schema)
            row_count = len(rows)
            tmp_view  = f"__cdc_upsert_{source_key}_{table_name}_{batch_id}"
            final_df.createOrReplaceGlobalTempView(tmp_view)
            # Exclude snap columns from SET — preserve the values written at INSERT time.
            set_clause = ", ".join(
                f"t.`{f.name}` = s.`{f.name}`"
                for f in final_df.schema.fields
                if f.name not in _SNAP_COLS
            )
            col_list = ", ".join(f"`{f.name}`" for f in final_df.schema.fields)
            val_list  = ", ".join(f"s.`{f.name}`" for f in final_df.schema.fields)
            spark.sql(f"""
                MERGE INTO {fqn_backtick} AS t
                USING global_temp.{tmp_view} AS s
                ON t.`{pk_col}` = s.`{pk_col}`
                WHEN MATCHED THEN UPDATE SET {set_clause}
                WHEN NOT MATCHED THEN INSERT ({col_list}) VALUES ({val_list})
            """)
            logger.info(
                "[%s/%s][standard] batch=%d upsert rows=%d",
                source_key, table_name, batch_id, row_count,
            )
    
        if not deletes.isEmpty():
            del_view = f"__cdc_delete_{source_key}_{table_name}_{batch_id}"
            deletes.select(pk_col).coalesce(1).createOrReplaceGlobalTempView(del_view)
            spark.sql(f"""
                MERGE INTO {fqn_backtick} AS t
                USING global_temp.{del_view} AS s
                ON t.`{pk_col}` = s.`{pk_col}`
                WHEN MATCHED THEN DELETE
            """)
            logger.info(
                "[%s/%s][standard] batch=%d hard-delete rows=%d",
                source_key, table_name, batch_id, deletes.count(),
            )
    
    
    def _apply_soft_delete(
        spark:        SparkSession,
        payload_df:   DataFrame,
        fqn_backtick: str,
        pk_col:       str,
        source_key:   str,
        table_name:   str,
        batch_id:     int,
    ) -> None:
        """
        SCD soft-delete — MERGE upsert for INSERT/UPDATE; flag-only for DELETE.
    
        INSERT/UPDATE/snapshot (op c/u/r):
          MERGE MATCHED     → UPDATE CDC columns + is_deleted=false, deleted_at=NULL
                              (snap_id/snap_timestamp excluded from SET — preserved)
          MERGE NOT MATCHED → INSERT CDC columns + is_deleted=false, deleted_at=NULL
                              + fresh snap_id/snap_timestamp
    
        DELETE (op d):
          MERGE MATCHED → UPDATE SET is_deleted=true, deleted_at=<now>
          Row is never physically removed from Iceberg.
    
        Same .cache()/.count() materialisation strategy as _apply_standard —
        see that function's docstring for the full rationale.
        """
        spark.conf.set("spark.sql.shuffle.partitions", str(MERGE_PARALLELISM))
    
        _SNAP_COLS = {"snap_id", "snap_timestamp"}
    
        inserts = payload_df.filter(col("_op").isin("c", "u", "r")).drop("_op", "kafka_ts")
        deletes = payload_df.filter(col("_op") == "d").drop("_op", "kafka_ts")
    
        if not inserts.isEmpty():
            raw_df = (
                inserts
                .coalesce(COALESCE_BEFORE_MERGE)
                .withColumn("snap_id",        (lit(batch_id).cast(LongType()) * lit(10_000_000).cast(LongType())
                                               + monotonically_increasing_id().cast(LongType())))
                .withColumn("snap_timestamp", current_timestamp())
                .withColumn("is_deleted", lit(False).cast(BooleanType()))
                .withColumn("deleted_at", lit(None).cast(TimestampType()))
            )
            # Same streaming-lineage break as _apply_standard — see that docstring.
            rows      = raw_df.collect()
            final_df  = spark.createDataFrame(rows, raw_df.schema)
            row_count = len(rows)
            tmp_view  = f"__cdc_upsert_{source_key}_{table_name}_{batch_id}"
            final_df.createOrReplaceGlobalTempView(tmp_view)
            # Exclude snap columns from SET — preserve the values written at INSERT time.
            set_clause = ", ".join(
                f"t.`{f.name}` = s.`{f.name}`"
                for f in final_df.schema.fields
                if f.name not in _SNAP_COLS
            )
            col_list = ", ".join(f"`{f.name}`" for f in final_df.schema.fields)
            val_list  = ", ".join(f"s.`{f.name}`" for f in final_df.schema.fields)
            spark.sql(f"""
                MERGE INTO {fqn_backtick} AS t
                USING global_temp.{tmp_view} AS s
                ON t.`{pk_col}` = s.`{pk_col}`
                WHEN MATCHED THEN UPDATE SET {set_clause}
                WHEN NOT MATCHED THEN INSERT ({col_list}) VALUES ({val_list})
            """)
            logger.info(
                "[%s/%s][soft_delete] batch=%d upsert rows=%d",
                source_key, table_name, batch_id, row_count,
            )
    
        if not deletes.isEmpty():
            del_view = f"__cdc_softdel_{source_key}_{table_name}_{batch_id}"
            soft_del_df = (
                deletes.select(pk_col)
                .coalesce(1)
                .withColumn("is_deleted", lit(True).cast(BooleanType()))
                .withColumn("deleted_at", current_timestamp())
            )
            soft_del_df.createOrReplaceGlobalTempView(del_view)
            spark.sql(f"""
                MERGE INTO {fqn_backtick} AS t
                USING global_temp.{del_view} AS s
                ON t.`{pk_col}` = s.`{pk_col}`
                WHEN MATCHED THEN UPDATE SET
                    t.is_deleted = s.is_deleted,
                    t.deleted_at = s.deleted_at
            """)
            logger.info(
                "[%s/%s][soft_delete] batch=%d soft-delete rows=%d",
                source_key, table_name, batch_id, deletes.count(),
            )
    
    
    def _apply_history_tracking(
        spark:        SparkSession,
        payload_df:   DataFrame,
        fqn_backtick: str,
        fqn_plain:    str,
        pk_col:       str,
        source_key:   str,
        table_name:   str,
        batch_id:     int,
        before_schema: Any,
        after_schema:  Any,
        row_schema:    Any = None,
    ) -> None:
        """
        Append-only history tracking — every CDC event is a new Iceberg row.
    
        Columns written on every row:
          _change_type    STRING     — INSERT / UPDATE / DELETE
          _change_ts      TIMESTAMP  — pipeline processing time
          after_<col>     typed      — row state after  the change (NULL for DELETE)
          before_<col>    typed      — row state before the change (NULL for INSERT)
          snap_id         BIGINT     — unique row id within batch
          snap_timestamp  TIMESTAMP  — write-time wall clock
    
        Schema stability guarantee
        --------------------------
        Every batch always produces the full column set regardless of which op
        types (INSERT / UPDATE / DELETE) are present:
    
        • after_* NULLed for DELETE batches  (no "after" image in Debezium envelope)
        • before_* NULLed for INSERT batches (no "before" image in Debezium envelope)
    
        Both image column sets are backfilled from row_schema (the inferred source
        schema cached on the first batch).  This ensures the DataFrame schema is
        identical on every call so writeTo().append() never encounters a column
        mismatch regardless of batch composition.
    
        Table-creation strategy
        -----------------------
        writeTo().append() requires the table to exist.  On the first batch we
        build a CREATE TABLE DDL directly from the full final_df schema (which
        already contains both after_* and before_* columns) so the table is
        created once with the complete stable schema.  No mergeSchema surprises.
        """
        _PY_TO_ICEBERG = {
            "LongType":      "BIGINT",
            "IntegerType":   "INT",
            "StringType":    "STRING",
            "DoubleType":    "DOUBLE",
            "FloatType":     "FLOAT",
            "BooleanType":   "BOOLEAN",
            "TimestampType": "TIMESTAMP",
            "DateType":      "DATE",
        }
    
        # ── 1. Map op codes to human-readable change types ────────────────────────
        typed_df = payload_df.withColumn(
            "_change_type",
            F.when(col("_op") == "c", lit("INSERT"))
             .when(col("_op") == "u", lit("UPDATE"))
             .when(col("_op") == "d", lit("DELETE"))
             .when(col("_op") == "r", lit("INSERT"))
             .otherwise(lit("UNKNOWN")),
        ).withColumn(
            "_change_ts",
            current_timestamp(),
        )
    
        # ── 2. Expand "before" image (UPDATE / DELETE rows only) ─────────────────
        result_df = typed_df
        if before_schema is not None and "before" in typed_df.columns:
            parsed_before = from_json(col("before"), before_schema)
            for field in before_schema.fields:
                result_df = result_df.withColumn(
                    f"before_{field.name}", parsed_before[field.name]
                )
        if "before" in result_df.columns:
            result_df = result_df.drop("before")
    
        # ── 3. Expand "after" image (INSERT / UPDATE rows only) ──────────────────
        if after_schema is not None and "after" in result_df.columns:
            parsed_after = from_json(col("after"), after_schema)
            for field in after_schema.fields:
                result_df = result_df.withColumn(
                    f"after_{field.name}", parsed_after[field.name]
                )
        if "after" in result_df.columns:
            result_df = result_df.drop("after")
    
        # ── 4. Backfill missing image columns with typed NULLs ───────────────────
        # after_* absent on DELETE batches; before_* absent on INSERT batches.
        # Both must be present on every batch so the schema never drifts between
        # calls — writeTo().append() fails if the DataFrame is missing any column
        # that already exists in the Iceberg table.
        if row_schema is not None:
            for field in row_schema.fields:
                for prefix in ("after_", "before_"):
                    img_col = f"{prefix}{field.name}"
                    if img_col not in result_df.columns:
                        result_df = result_df.withColumn(
                            img_col, lit(None).cast(field.dataType)
                        )
    
        # ── 5. Drop internal envelope columns ────────────────────────────────────
        _ENVELOPE_COLS = {"_op", "kafka_ts", "ts_ms"}
        result_df = result_df.drop(*[c for c in _ENVELOPE_COLS if c in result_df.columns])
    
        # ── 6. Break streaming lineage (identical pattern to _apply_standard) ─────
        # .collect() pulls rows to driver; spark.createDataFrame() builds a fresh
        # LocalRelation with zero lineage to the streaming source.
        # snap_id / snap_timestamp are then added to this static DataFrame so
        # monotonically_increasing_id() and current_timestamp() are evaluated
        # against a plain LocalRelation — no INVALID_NON_DETERMINISTIC_EXPRESSIONS.
        rows      = result_df.coalesce(COALESCE_BEFORE_MERGE).collect()
        final_df  = (
            spark.createDataFrame(rows, result_df.schema)
            .withColumn("snap_id",        (lit(batch_id).cast(LongType()) * lit(10_000_000).cast(LongType())
                                           + monotonically_increasing_id().cast(LongType())))
            .withColumn("snap_timestamp", current_timestamp())
        )
        row_count = len(rows)
    
        # ── 7. Lazy table creation ────────────────────────────────────────────────
        # writeTo().append() requires the table to already exist.
        # Create it once using the full final_df schema — which already contains
        # both after_* and before_* columns — so no mergeSchema surprises later.
        if not spark.catalog.tableExists(fqn_plain):
            col_defs = ", ".join(
                f"`{f.name}` {_PY_TO_ICEBERG.get(type(f.dataType).__name__, 'STRING')}"
                for f in final_df.schema.fields
            )
            spark.sql(f"""
                CREATE TABLE IF NOT EXISTS {fqn_backtick} (
                    {col_defs}
                )
                USING iceberg
                PARTITIONED BY (hours(snap_timestamp))
                TBLPROPERTIES (
                    'pipeline.write-mode' = 'history_tracking',
                    'pipeline.source'     = '{source_key}'
                )
            """)
            logger.info(
                "[%s/%s][history_tracking] Created Iceberg table (mode=history_tracking).",
                source_key, table_name,
            )
    
        # ── 8. Write ──────────────────────────────────────────────────────────────
        # Collect again after snap col injection so write_df is a clean LocalRelation
        # with the evaluated snap_id / snap_timestamp values baked in — same
        # two-collect pattern used by _apply_standard and _apply_soft_delete.
        write_rows = final_df.collect()
        write_df   = spark.createDataFrame(write_rows, final_df.schema)
        (
            write_df
            .writeTo(fqn_plain)
            .option("mergeSchema", "true")
            .append()
        )
        logger.info(
            "[%s/%s][history_tracking] batch=%d appended rows=%d",
            source_key, table_name, batch_id, row_count,
        )
    
    
    # ── Micro-batch writer ────────────────────────────────────────────────────────
    
    def _write_micro_batch(
        spark:        SparkSession,
        builder:      IcebergTableBuilder,
        source:       _StreamingSource,
        write_mode:   str,
        transform_steps: list[tuple[Any, dict]],
    ) -> Any:
        """
        Return a foreachBatch function for the given source and write mode.
    
        For each micro-batch:
          1. Route rows by topic.
          2. Decode Debezium envelope (before / after / op / ts_ms).
          3. Apply optional StarTransform pipeline steps.
          4. Auto-create Iceberg table if it does not exist (schema cached after first batch).
          5. Apply write-mode handler (standard / soft_delete / history_tracking).
        """
        def _foreach_batch(batch_df: DataFrame, batch_id: int) -> None:
            if batch_df.isEmpty():
                return
    
            if DRY_RUN:
                logger.info(
                    "[%s] DRY_RUN batch=%d rows=%d — skipping write.",
                    source.source_key, batch_id, batch_df.count(),
                )
                return
    
            # Route by topic — one DataFrame per Kafka topic (= one Iceberg table)
            topic_map = ST.route_by_topic(batch_df)
            if not topic_map:
                return
    
            written_tables: list[str] = []
    
            for topic, topic_df in topic_map.items():
                table_name = _topic_to_table(topic, source)
                namespace  = _topic_to_namespace(topic, source)
                if not table_name:
                    continue
    
                # ── Decode Debezium envelope ──────────────────────────────────────
                env_df = topic_df.select(
                    from_json(col("value_json"), _DEBEZIUM_ENVELOPE_SCHEMA).alias("env"),
                    col("topic"),
                    col("timestamp").alias("kafka_ts"),
                ).filter(col("env").isNotNull())
    
                # Carry both before and after through the pipeline:
                # history_tracking uses both; standard/soft_delete only need "after"
                # (for INSERT/UPDATE) and pk from "before" (for DELETE).
                full_envelope_df = env_df.select(
                    col("env.before").alias("before"),
                    col("env.after").alias("after"),
                    col("env.op").alias("_op"),
                    col("env.ts_ms").alias("ts_ms"),
                    col("kafka_ts"),
                ).filter(col("_op").isNotNull())
    
                # For standard / soft_delete: the working payload is "after" for
                # INSERT/UPDATE and "before" for DELETE (pk lookup only).
                payload_df = full_envelope_df.select(
                    F.when(
                        col("_op").isin("c", "u", "r"),
                        col("after"),
                    ).when(
                        col("_op") == "d",
                        col("before"),
                    ).alias("payload_json"),
                    col("_op"),
                    col("kafka_ts"),
                ).filter(col("payload_json").isNotNull())
    
                if payload_df.isEmpty():
                    continue
    
                # ── Infer schema from batch (cached per table) ────────────────────
                cache_key = (source.source_key, table_name)
                inferred_schema = _SCHEMA_CACHE.get(cache_key)
                if inferred_schema is None:
                    try:
                        inferred_schema = spark.read.json(
                            payload_df.select("payload_json").rdd.map(lambda r: r[0])
                        ).schema
                        _SCHEMA_CACHE[cache_key] = inferred_schema
                        logger.info(
                            "[%s/%s] Schema inferred and cached (%d fields).",
                            source.source_key, table_name, len(inferred_schema.fields),
                        )
                    except Exception as exc:
                        logger.warning(
                            "[%s/%s] Schema inference failed: %s — skipping.",
                            source.source_key, table_name, exc,
                        )
                        continue
    
                # ── Parse payload JSON → typed DataFrame ──────────────────────────
                try:
                    row_df = payload_df.select(
                        from_json(col("payload_json"), inferred_schema).alias("data"),
                        col("_op"),
                        col("kafka_ts"),
                    ).select("data.*", "_op", "kafka_ts")
                except Exception as exc:
                    logger.warning(
                        "[%s/%s] JSON parse failed: %s", source.source_key, table_name, exc,
                    )
                    continue
    
                # ── Oracle type normalisation ─────────────────────────────────────
                # Debezium Oracle LogMiner JSON quirks (confirmed from live traffic):
                #
                #   TIMESTAMP(n) cols → epoch milliseconds as int   (LongType)
                #   NUMBER(p,0) cols  → emitted as float JSON        (DoubleType)
                #
                # We fix both before writing to Iceberg:
                #   1. LongType cols matching _AT/_TIME/_TS/_DATE suffixes
                #      → divide by 1_000 (ms→s) and cast to TimestampType
                #   2. DoubleType cols NOT matching timestamp suffixes
                #      → cast to LongType (restores integer primary/foreign keys)
                #
                # The schema cache is updated so subsequent batches and
                # table-creation DDL both use the corrected types.
                if source.source_key == "oracle":
                    _TS_SUFFIXES = ("_at", "_AT", "_time", "_TIME", "_ts", "_TS",
                                    "_date", "_DATE")
                    # Snapshot raw fields BEFORE any mutations.
                    # IMPORTANT: _SCHEMA_CACHE stores RAW types (LongType/DoubleType) so
                    # from_json on subsequent batches always infers numeric types correctly.
                    # _DDL_SCHEMA_CACHE stores the corrected types for CREATE TABLE DDL only.
                    _orig_fields = row_df.schema.fields[:]
                    _ddl_fields  = list(inferred_schema.fields)  # start from raw schema
                    for _f in _orig_fields:
                        if isinstance(_f.dataType, LongType) and any(
                            _f.name.endswith(s) for s in _TS_SUFFIXES
                        ):
                            # epoch milliseconds (LongType int) → TimestampType
                            row_df = row_df.withColumn(
                                _f.name,
                                (col(_f.name) / lit(1_000)).cast(TimestampType()),
                            )
                            _ddl_fields = [
                                StructField(_cf.name, TimestampType(), _cf.nullable)
                                if _cf.name == _f.name else _cf
                                for _cf in _ddl_fields
                            ]
                        elif isinstance(_f.dataType, DoubleType) and not any(
                            _f.name.endswith(s) for s in _TS_SUFFIXES
                        ):
                            # NUMBER(p,0) arrives as JSON float → restore as LongType
                            row_df = row_df.withColumn(
                                _f.name,
                                col(_f.name).cast(LongType()),
                            )
                            _ddl_fields = [
                                StructField(_cf.name, LongType(), _cf.nullable)
                                if _cf.name == _f.name else _cf
                                for _cf in _ddl_fields
                            ]
                    _DDL_SCHEMA_CACHE[cache_key] = StructType(_ddl_fields)

                # ── Apply StarTransform pipeline steps ────────────────────────────
                if transform_steps:
                    try:
                        row_df = ST.apply_pipeline(row_df, transform_steps)
                    except Exception as exc:
                        logger.error(
                            "[%s/%s] StarTransform pipeline failed: %s",
                            source.source_key, table_name, exc,
                        )
                        continue
    
                # ── PK column name (case-insensitive) ─────────────────────────────
                pk_col_actual = source.pk_col
                for f in inferred_schema.fields:
                    if f.name.lower() == source.pk_col.lower():
                        pk_col_actual = f.name
                        break
    
                # ── Build write-mode-specific extra schema fields ─────────────────
                # snap_id / snap_timestamp are intentionally omitted here — they are
                # injected by IcebergTableBuilder.create_table() via _inject_snap_cols()
                # automatically.  Including them in extra_fields would duplicate them.
                extra_fields: list[StructField] = []
                if write_mode == _WRITE_MODE_SOFT_DELETE:
                    extra_fields = [
                        StructField("is_deleted", BooleanType(),  True),
                        StructField("deleted_at", TimestampType(), True),
                    ]
                elif write_mode == _WRITE_MODE_HISTORY_TRACKING:
                    extra_fields = [
                        StructField("_change_type", StringType(),    True),
                        StructField("_change_ts",   TimestampType(), True),
                    ]
                    # before_* and after_* columns are added via mergeSchema=true
                    # at append time — not declared at table creation (schema evolves).
    
                # Use the schema from the cache — it may have been updated by the
                # Oracle type-normalisation block above (timestamp/float fixes).
                # For oracle: use the DDL cache (corrected types for TIMESTAMP/BIGINT).
                # For other sources: fall back to the raw inferred schema.
                _schema_for_ddl = (
                    _DDL_SCHEMA_CACHE.get(cache_key)
                    or _SCHEMA_CACHE.get(cache_key)
                    or inferred_schema
                )
                full_schema = StructType(_schema_for_ddl.fields + extra_fields)
    
                # ── Auto-create Iceberg table if needed ───────────────────────────
                fqn_backtick = f"`{source.catalog}`.`{namespace}`.`{table_name}`"
                fqn_plain    = f"{source.catalog}.{namespace}.{table_name}"
    
                # Each write mode writes into its own dedicated Iceberg table so
                # standard, soft_delete and history_tracking never share a target:
                #
                #   standard         → <table>          (SCD Type 0, hard deletes)
                #   soft_delete      → <table>_sd        (is_deleted flag, row never removed)
                #   history_tracking → <table>_hist      (append-only full history)
                #
                # Compute the effective_table name BEFORE the existence check so we
                # always check and write to the correct table, never to the base table
                # created by a different write mode.
                if write_mode == _WRITE_MODE_HISTORY_TRACKING:
                    effective_table = f"{table_name}_hist"
                elif write_mode == _WRITE_MODE_SOFT_DELETE:
                    effective_table = f"{table_name}_sd"
                else:
                    effective_table = table_name
    
                # history_tracking uses writeTo().option("mergeSchema","true").append()
                # which auto-creates the table on first write with the exact DataFrame
                # schema — including before_* / after_* / _change_type / _change_ts /
                # snap_id / snap_timestamp.  Pre-creating the table here would produce
                # a schema mismatch (base cols only vs. full envelope cols) so we skip
                # create_table() for this mode entirely and let Iceberg handle it.
                effective_fqn_bt = f"`{source.catalog}`.`{namespace}`.`{effective_table}`"
                effective_fqn_pl = f"{source.catalog}.{namespace}.{effective_table}"
                fqn_backtick = effective_fqn_bt
                fqn_plain    = effective_fqn_pl
                table_name   = effective_table
    
                if write_mode != _WRITE_MODE_HISTORY_TRACKING:
                    table_exists = builder.table_exists(source.catalog, namespace, effective_table)
                    if not table_exists:
                        pk_col_exists = any(
                            f.name.lower() == source.pk_col.lower()
                            for f in inferred_schema.fields
                        )
                        pk_for_bucket = pk_col_actual if pk_col_exists else "snap_id"
                        effective_loc = (
                            f"s3://{S3_BUCKET}/{source.s3_prefix}"
                            f"/{namespace}/{effective_table}"
                        )
                        try:
                            builder.create_table(
                                catalog        = source.catalog,
                                namespace      = namespace,
                                table          = effective_table,
                                schema         = full_schema,
                                partition_spec = [
                                    IcebergTableBuilder.hours("snap_timestamp"),
                                    IcebergTableBuilder.bucket(pk_for_bucket, 16),
                                ],
                                location       = effective_loc,
                                extra_properties={
                                    "pipeline.write-mode": write_mode,
                                    "pipeline.source":     source.source_key,
                                },
                            )
                            logger.info(
                                "[%s/%s] Created Iceberg table (mode=%s).",
                                source.source_key, effective_table, write_mode,
                            )
                        except Exception as create_exc:
                            logger.warning(
                                "[%s/%s] Table creation failed (may already exist): %s",
                                source.source_key, effective_table, create_exc,
                            )
    
                # ── Apply write mode ──────────────────────────────────────────────
                try:
                    if write_mode == _WRITE_MODE_STANDARD:
                        _apply_standard(
                            spark, row_df, fqn_backtick,
                            pk_col_actual, source.source_key, table_name, batch_id,
                        )
                    elif write_mode == _WRITE_MODE_SOFT_DELETE:
                        _apply_soft_delete(
                            spark, row_df, fqn_backtick,
                            pk_col_actual, source.source_key, table_name, batch_id,
                        )
                    elif write_mode == _WRITE_MODE_HISTORY_TRACKING:
                        # For history_tracking we pass the full envelope rows
                        # (before + after) from the envelope DataFrame.
                        envelope_rows = full_envelope_df.filter(
                            F.col("_op").isin("c", "u", "d", "r")
                        )
                        # Enrich envelope rows with typed before/after schemas
                        try:
                            after_schema = spark.read.json(
                                envelope_rows
                                .filter(col("after").isNotNull())
                                .select("after")
                                .rdd.map(lambda r: r[0])
                            ).schema if not envelope_rows.filter(col("after").isNotNull()).isEmpty() else None
                        except Exception:
                            after_schema = None
    
                        try:
                            before_schema = spark.read.json(
                                envelope_rows
                                .filter(col("before").isNotNull())
                                .select("before")
                                .rdd.map(lambda r: r[0])
                            ).schema if not envelope_rows.filter(col("before").isNotNull()).isEmpty() else None
                        except Exception:
                            before_schema = None
    
                        _apply_history_tracking(
                            spark, envelope_rows, fqn_backtick, fqn_plain,
                            pk_col_actual, source.source_key, table_name, batch_id,
                            before_schema=before_schema,
                            after_schema=after_schema,
                            row_schema=inferred_schema,
                        )
    
                    written_tables.append(fqn_backtick)
                except Exception as write_exc:
                    logger.error(
                        "[%s/%s] Write failed (mode=%s): %s",
                        source.source_key, table_name, write_mode, write_exc,
                        exc_info=True,
                    )
    
            if written_tables:
                logger.info(
                    "[%s] batch=%d — %d table(s) written.",
                    source.source_key, batch_id, len(written_tables),
                )
    
        return _foreach_batch
    
    
    # ── Stream builder ────────────────────────────────────────────────────────────
    
    def _start_source_stream(
        spark:        SparkSession,
        builder:      IcebergTableBuilder,
        source:       _StreamingSource,
        bao:          BaoSparkInit,
        write_mode:   str,
    ) -> StreamingQuery:
        """
        Build and start the Structured Streaming query for a single CDC source.
    
        Pipeline:
          Kafka (JSON) → flatten Debezium envelope →
          optional StarTransform steps → write-mode handler → Iceberg.
        """
        kafka_secret = bao.kafka_creds()
        kafka_user   = kafka_secret.get("debezium_user",     "debezium-user")
        kafka_pass   = kafka_secret.get("debezium_password", "")
    
        jaas_cfg = (
            "org.apache.kafka.common.security.scram.ScramLoginModule required "
            f"username=\"{kafka_user}\" password=\"{kafka_pass}\";"
        )
    
        kafka_options = {
            "kafka.bootstrap.servers":        KAFKA_BOOTSTRAP,
            "kafka.security.protocol":        "SASL_PLAINTEXT",
            "kafka.sasl.mechanism":           "SCRAM-SHA-512",
            "kafka.sasl.jaas.config":         jaas_cfg,
            "subscribePattern":               source.topic_pattern,
            "startingOffsets":                "latest",
            "maxOffsetsPerTrigger":           str(MAX_OFFSETS_PER_TRIGGER),
            "failOnDataLoss":                 "false",
            # Consumer throughput tuning for peak-hour workloads
            "kafka.fetch.min.bytes":          "131072",    # 128 KB min fetch (reduced round-trips)
            "kafka.fetch.wait.max.ms":        "500",       # max wait for min bytes
            "kafka.max.poll.records":         "2000",      # records per poll (up from 500)
            "kafka.max.partition.fetch.bytes": "2097152",  # 2 MB per partition per fetch
            "kafka.receive.buffer.bytes":     "1048576",   # 1 MB socket receive buffer
        }
    
        raw_stream = (
            spark.readStream
            .format("kafka")
            .options(**kafka_options)
            .load()
        )
    
        # Avro deserialisation UDF
        try:
            from confluent_kafka.schema_registry import SchemaRegistryClient  # noqa: F401
            avro_udf = _build_avro_deserialize_udf(SR_URL)
        except ImportError:
            logger.warning(
                "[%s] confluent-kafka not available; treating Kafka values as plain JSON.",
                source.source_key,
            )
            avro_udf = udf(
                lambda topic, b: b.decode("utf-8", errors="replace") if b else None,
                StringType(),
            )
    
        decoded_stream = raw_stream.withColumn(
            "value_json",
            avro_udf(col("topic").cast(StringType()), col("value")),
        )
    
        # Build the StarTransform pipeline for this source
        transform_steps = _build_transform_pipeline(source.source_key, source.pk_col)
    
        query = (
            decoded_stream
            .writeStream
            .queryName(f"cdc-{source.source_key}-{write_mode}")
            .foreachBatch(
                _write_micro_batch(
                    spark, builder, source, write_mode, transform_steps
                )
            )
            .trigger(processingTime=TRIGGER_INTERVAL)
            .option("checkpointLocation", source.checkpoint)
            .start()
        )
    
        logger.info(
            "[%s] Streaming query started | mode=%s | pattern=%s | checkpoint=%s",
            source.source_key, write_mode, source.topic_pattern, source.checkpoint,
        )
        return query
    
    
    # ── Spark session factory ─────────────────────────────────────────────────────
    
    def _build_spark(bao: BaoSparkInit) -> SparkSession:
        conf = bao.spark_conf(app_name=f"kafka-to-iceberg-{WRITE_MODE}")
        # spark-sql-kafka and its kafka-clients dependency are baked into the image
        # at /opt/spark/jars/ (copied in Dockerfile).  Using spark.jars.packages would
        # trigger a Maven/Ivy download at session start, which (a) requires outbound
        # internet from the driver pod, (b) only lands the jar on the driver's local
        # /root/.ivy2/ — executors on worker nodes never receive it, so every micro-batch
        # that touches a Kafka DataSource fails with ClassNotFoundException.
        # spark.jars is not needed here because /opt/spark/jars/ is already on the
        # default classpath for both driver and all executor JVMs on this cluster.
    
        # ── Core cap ─────────────────────────────────────────────────────────────────
        # spark.cores.max is the static registration ceiling for this application in
        # Spark standalone mode.  It is fixed at session start and cannot change at
        # runtime — it is NOT the live core consumption figure.
        #
        # We set it to MAX_EXECUTORS × EXECUTOR_CORES (default 3 × 1 = 3) so the
        # dynamic allocator has room to burst up to 3 cores when sustained load
        # demands it, while the executor count at idle drops to 0 (see below).
        conf.set("spark.cores.max",          str(MAX_EXECUTORS * EXECUTOR_CORES))
        conf.set("spark.executor.instances", str(EXECUTOR_INSTANCES))
        conf.set("spark.executor.cores",     str(EXECUTOR_CORES))
    
        # ── Graduated dynamic allocation ─────────────────────────────────────────────
        #
        # Goal: 0 cores consumed at idle, exactly 1 core during normal CDC processing,
        # up to 3 cores if the job is backlogged for > BURST_BACKLOG_TIMEOUT_S (60 s).
        #
        # spark.cores.max is a static ceiling (immutable after session start).
        # The dynamic allocator is what controls the ACTUAL live executor count.
        #
        # minExecutors = 0
        #   Scale all the way to zero.  After executorIdleTimeout (30 s) of no tasks
        #   the executor process is removed from the worker — 0 CPU used at the OS
        #   level.  The app stays registered on the master (necessary for the
        #   streaming query to remain alive) but holds no live resources.
        #
        # maxExecutors = MAX_EXECUTORS (default 3)
        #   Hard ceiling on scale-up.  Normal CDC micro-batches need only 1 executor.
        #   The allocator will not add a 2nd executor unless the task backlog persists
        #   beyond sustainedSchedulerBacklogTimeout (see below).
        #
        # executorIdleTimeout = 30s
        #   Kill an executor that has had no tasks for 30 s.  Short enough to free
        #   the core quickly during quiet periods; long enough not to thrash on the
        #   2-second trigger interval.
        #
        # schedulerBacklogTimeout = 1s
        #   Request the FIRST executor within 1 s of tasks queuing up.  This keeps
        #   CDC latency low — when a Kafka message arrives after an idle period, the
        #   executor is back in ~1 s.
        #
        # sustainedSchedulerBacklogTimeout = BURST_BACKLOG_TIMEOUT_S (default 60s)
        #   Only request a 2nd (and 3rd) executor if the backlog has been sustained
        #   for 60 consecutive seconds.  This is the "wait 1 minute before bursting"
        #   rule.  A short spike that clears in < 60 s stays on 1 core.  A heavy
        #   batch load that persists for > 60 s gets a 2nd core; if still backlogged
        #   after another 60 s it gets a 3rd, up to maxExecutors.
        #
        # shuffleTracking.enabled = true
        #   Required for Structured Streaming + dynamic allocation in Spark 3.x.
        #   Allows the allocator to safely remove executors that previously served
        #   shuffle reads without losing shuffle data.
        #
        # Behaviour summary
        # ──────────────────────────────────────────────────────────────────────────
        #   State                       Executors   Cores on worker
        #   ─────────────────────────── ─────────── ───────────────
        #   Idle (no Kafka events)      0 (after 30s)    0
        #   Active CDC micro-batch      1                1
        #   Backlog < 60 s              1                1   (no burst yet)
        #   Backlog 60–119 s            2                2
        #   Backlog ≥ 120 s             3 (max)          3
        #   Backlog clears              scales back to 1, then 0 after 30 s idle
        # ──────────────────────────────────────────────────────────────────────────
        conf.set("spark.dynamicAllocation.enabled",                          "true")
        conf.set("spark.dynamicAllocation.minExecutors",                     "0")
        conf.set("spark.dynamicAllocation.maxExecutors",                     str(MAX_EXECUTORS))
        conf.set("spark.dynamicAllocation.executorIdleTimeout",              "30s")
        conf.set("spark.dynamicAllocation.schedulerBacklogTimeout",          "1s")
        conf.set("spark.dynamicAllocation.sustainedSchedulerBacklogTimeout", f"{BURST_BACKLOG_TIMEOUT_S}s")
        conf.set("spark.dynamicAllocation.shuffleTracking.enabled",          "true")
    
        # Peak-hour AQE tuning
        conf.set("spark.executor.memory",    EXECUTOR_MEMORY)
        conf.set("spark.memory.offHeap.size", EXECUTOR_OFFHEAP)
        conf.set("spark.sql.adaptive.enabled",                               "true")
        conf.set("spark.sql.adaptive.coalescePartitions.enabled",            "true")
        conf.set("spark.sql.adaptive.coalescePartitions.minPartitionSize",   "33554432")   # 32 MB
        conf.set("spark.sql.adaptive.advisoryPartitionSizeInBytes",          ADAPTIVE_COALESCE_TARGET)
        conf.set("spark.sql.adaptive.skewJoin.enabled",                      "true")
        conf.set("spark.sql.shuffle.partitions",                             str(MERGE_PARALLELISM))
        # Iceberg write performance
        conf.set("spark.sql.iceberg.write.fanout.enabled",                   "true")
        conf.set("spark.sql.iceberg.merge.cardinality-check.enabled",        "false")
        # spark-defaults.conf in the spark-gluten-velox image sets KryoSerializer
        # cluster-wide (needed for Gluten/Velox + JDBC batch jobs).  The Kafka
        # DataSourceV2 (DataSourceRDDPartition) uses Java serialisation internally;
        # Kryo cannot deserialise its List$SerializationProxy → Seq and crashes every
        # micro-batch with a ClassCastException.  Override back to JavaSerializer here
        # so only this streaming session is unaffected; Gluten/JDBC jobs keep Kryo.
        conf.set("spark.serializer",
                 "org.apache.spark.serializer.JavaSerializer")
    
        spark = SparkSession.builder.config(conf=conf).getOrCreate()
        spark.sparkContext.setLogLevel("WARN")
        return spark
    
    
    # ── Main: streaming loop with auto-restart ────────────────────────────────────
    
    def _start_all_queries(
        spark:   SparkSession,
        builder: IcebergTableBuilder,
        bao:     BaoSparkInit,
    ) -> list[StreamingQuery]:
        """Start one continuous streaming query per CDC source."""
        queries: list[StreamingQuery] = []
        for src in _ALL_SOURCES:
            try:
                q = _start_source_stream(spark, builder, src, bao, WRITE_MODE)
                queries.append(q)
            except Exception as exc:
                logger.error(
                    "[%s] Failed to start stream: %s", src.source_key, exc, exc_info=True,
                )
        return queries
    
    
    def _run_once(bao: BaoSparkInit) -> None:
        """
        Initialise Spark, start all streaming queries, and block until a query
        dies unexpectedly (triggering an outer retry) or the process is interrupted.
    
        Queries run continuously — no per-batch restart.  Spark Structured Streaming
        commits the offset checkpoint atomically after each successful foreachBatch,
        so restart-on-failure is safe: the next _run_once call resumes from exactly
        the last committed offset.
        """
        spark = _build_spark(bao)
    
        try:
            cb = _imod("00_catalog_bootstrap")
            cb.bootstrap_all_catalogs(spark, bao, fail_fast=False)
        except Exception as exc:
            logger.warning("[bootstrap] Pre-flight warning: %s", exc)
    
        builder = IcebergTableBuilder(spark, running_user=SPARK_USER)
    
        for src in _ALL_SOURCES:
            try:
                builder.ensure_namespace(src.catalog, src.namespace)
            except Exception as exc:
                logger.warning("[%s] Could not ensure namespace: %s", src.source_key, exc)
    
        if _TARGET_NAMESPACE:
            logger.info(
                "TARGET_NAMESPACE=%r — ensuring override namespace in all active catalogs.",
                _TARGET_NAMESPACE,
            )
            for src in _ALL_SOURCES:
                try:
                    builder.ensure_namespace(src.catalog, _TARGET_NAMESPACE)
                    logger.info("[%s] Namespace '%s' ready.", src.source_key, _TARGET_NAMESPACE)
                except Exception as exc:
                    logger.warning(
                        "[%s] Could not ensure namespace %r: %s",
                        src.source_key, _TARGET_NAMESPACE, exc,
                    )
    
        queries = _start_all_queries(spark, builder, bao)
        if not queries:
            spark.stop()
            raise RuntimeError("No streaming queries started.")
    
        logger.info(
            "All %d streaming queries active (mode=%s, trigger=%s, "
            "merge_parallelism=%d, coalesce=%d).",
            len(queries), WRITE_MODE, TRIGGER_INTERVAL,
            MERGE_PARALLELISM, COALESCE_BEFORE_MERGE,
        )
    
        try:
            while True:
                time.sleep(1)
                # If any query dies unexpectedly, surface the error so the outer
                # retry loop in main() can restart the entire Spark session cleanly.
                for q in list(queries):
                    if not q.isActive:
                        raise RuntimeError(
                            f"Streaming query '{q.name}' terminated unexpectedly."
                        )
        except KeyboardInterrupt:
            logger.info("Interrupted — stopping all queries.")
            for q in queries:
                try:
                    q.stop()
                except Exception:
                    pass
            raise
        finally:
            try:
                spark.stop()
            except Exception:
                pass
    
    
    # ── HTTP health server ─────────────────────────────────────────────────────────
    # _HEALTH_STATE is set by main() — True when at least one streaming query is
    # active (or the process is still starting up), False only when _run_once()
    # exits without active queries and we are between retry backoffs.
    # The Kubernetes livenessProbe hits GET / on HEALTH_PORT:
    #   200 OK  → process is alive and queries are running (or starting)
    #   503     → all queries are dead and the backoff retry is sleeping
    _HEALTH_STATE: dict = {"healthy": True}
    
    
    class _HealthHandler(http.server.BaseHTTPRequestHandler):
        """Minimal HTTP handler — returns 200 or 503 based on _HEALTH_STATE."""
    
        def do_GET(self) -> None:  # noqa: N802
            if _HEALTH_STATE["healthy"]:
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"OK\n")
            else:
                self.send_response(503)
                self.end_headers()
                self.wfile.write(b"UNHEALTHY\n")
    
        def log_message(self, fmt: str, *args: object) -> None:  # noqa: N802
            # Suppress default request logging — it floods the pod log.
            pass
    
    
    def _start_health_server() -> None:
        """Start the HTTP health server in a daemon thread."""
        server = http.server.HTTPServer(("0.0.0.0", HEALTH_PORT), _HealthHandler)
        t = threading.Thread(target=server.serve_forever, name="health-server", daemon=True)
        t.start()
        logger.info("Health server listening on port %d", HEALTH_PORT)
    
    
    def main() -> None:
        os.environ["SPARK_USER"] = SPARK_USER
    
        logger.info(
            "=== Kafka→Iceberg | user=%s | mode=%s | sources=%s | "
            "transform=%s | dry_run=%s | trigger=%s | max_offsets=%d "
            "| executors=0→1 core (burst up to %d after %ds backlog) "
            "| mem=%s off-heap=%s | max_restart_attempts=%s ===",
            SPARK_USER, WRITE_MODE,
            [s.source_key for s in _ALL_SOURCES],
            _TRANSFORM_STEPS or "none",
            DRY_RUN, TRIGGER_INTERVAL, MAX_OFFSETS_PER_TRIGGER,
            MAX_EXECUTORS, BURST_BACKLOG_TIMEOUT_S,
            EXECUTOR_MEMORY, EXECUTOR_OFFHEAP,
            MAX_RESTART_ATTEMPTS if MAX_RESTART_ATTEMPTS > 0 else "∞",
        )
    
        _start_health_server()
    
        bao = BaoSparkInit()
        attempt = 0
        # MAX_RESTART_ATTEMPTS == 0  → infinite retry loop (never gives up).
        # MAX_RESTART_ATTEMPTS  > 0  → cap at that many attempts then sys.exit(1)
        #                              so Kubernetes restartPolicy=Always triggers.
        while True:
            _HEALTH_STATE["healthy"] = True
            try:
                _run_once(bao)
                break
            except KeyboardInterrupt:
                logger.info("Streaming job stopped by user.")
                sys.exit(0)
            except Exception as exc:
                attempt += 1
                if MAX_RESTART_ATTEMPTS > 0 and attempt >= MAX_RESTART_ATTEMPTS:
                    logger.error(
                        "Streaming job failed after %d attempt(s). Giving up: %s",
                        attempt, exc,
                    )
                    _HEALTH_STATE["healthy"] = False
                    sys.exit(1)
                backoff = min(
                    RESTART_BACKOFF_BASE_S * (2 ** min(attempt - 1, 10)),
                    RESTART_BACKOFF_MAX_S,
                )
                cap_info = (
                    f"{attempt}/{MAX_RESTART_ATTEMPTS}"
                    if MAX_RESTART_ATTEMPTS > 0
                    else f"{attempt}/∞"
                )
                logger.warning(
                    "Streaming job failed (attempt %s): %s — retrying in %.0f s …",
                    cap_info, exc, backoff,
                )
                # Mark unhealthy during backoff sleep so liveness probe fires if
                # the pod is stuck in a backoff spiral longer than failureThreshold
                # * periodSeconds (configured in the Kubernetes deployment).
                _HEALTH_STATE["healthy"] = False
                time.sleep(backoff)
    
    
    if __name__ == "__main__":
        main()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: star-transform-script
  namespace: prod
  labels:
    app: kafka-to-iceberg
    pipeline.type: streaming
data:
  star_transform.py: |
    """
    star_transform.py
    =================
    Kafka-side transformation library for the CDC → Iceberg pipeline.

    Provides Flink-like composable transformation functions that operate on
    Spark Structured Streaming DataFrames (micro-batch foreachBatch context).
    Call these functions inside the foreachBatch handler in
    05_kafka_to_iceberg_streaming.py — or from any Spark Structured Streaming
    job — before the data is written to Iceberg.

    Design
    ------
    Every function takes a Spark DataFrame and returns a transformed DataFrame.
    Functions are pure (no side-effects on Iceberg), composable, and chainable:

        from star_transform import StarTransform as ST

        result = (
            ST.filter_op(df, ops=["c", "u"])
            .transform(ST.deduplicate(pk="id"))
            .transform(ST.add_processing_time())
            .transform(ST.mask_columns(["email", "phone"]))
            .transform(ST.enrich_from_broadcast(dim_df, join_col="product_id"))
        )

    Functions
    ---------
      filter_op              — keep only specific Debezium op codes (c/u/d/r)
      deduplicate            — keep last event per PK within a micro-batch
      add_processing_time    — inject proc_time TIMESTAMP column (wall-clock)
      rename_columns         — rename a dict of {old: new} columns
      cast_columns           — cast a dict of {col: spark_type} columns
      drop_columns           — drop a list of column names
      mask_columns           — SHA-256 hash sensitive columns (PII masking)
      add_source_tag         — inject source_system STRING column
      add_op_label           — inject human-readable op_label (INSERT/UPDATE/DELETE)
      flatten_json_col       — expand a JSON string column into top-level columns
      enrich_from_broadcast  — left join a streaming batch against a broadcast dim
      aggregate_counts       — count events by (pk_col, op) within the batch
      pivot_before_after     — side-by-side before/after columns from Debezium envelope
      filter_columns         — keep only listed columns (projection)
      null_coalesce          — coalesce(col, default_value) for nullable columns
      route_by_topic         — split a multi-topic DataFrame into a dict keyed by topic
      apply_pipeline         — chain a list of (fn, kwargs) tuples sequentially

      ── Aggregate functions (batch-level summaries → separate Iceberg tables) ──
      windowed_aggregate     — group-by + multi-agg (sum/avg/min/max/count) over any columns
      rolling_sum            — cumulative sum of a numeric column, ordered by order_col
      rolling_avg            — cumulative average of a numeric column, ordered by order_col
      count_distinct_per_key — count distinct values of value_col per group_col
      top_n_per_group        — keep top-N rows per group by a rank column
      event_rate             — events-per-second throughput metric for the current batch

      ── Multi-topic join functions (cross-topic enrichment → Iceberg) ──
      stream_join            — inner/left join two batches on a shared key column
      temporal_join          — join two batches keeping closest-in-time match per key
      multi_topic_union      — UNION ALL multiple DataFrames with a source_topic tag
      join_and_tag_source    — join + add topic-name columns for full provenance

    These functions are intentionally stateless within the batch.  For
    cross-batch state (e.g. windowed aggregations), use Spark's native
    stateful streaming operators (mapGroupsWithState / flatMapGroupsWithState).

    Usage example in foreachBatch
    ------------------------------
        def my_batch_writer(batch_df: DataFrame, batch_id: int) -> None:
            from star_transform import StarTransform as ST

            # 1. Keep only inserts and updates
            df = ST.filter_op(batch_df, ops=["c", "u"])

            # 2. Deduplicate by id (last event wins within the batch)
            df = df.transform(ST.deduplicate("id"))

            # 3. Mask PII
            df = df.transform(ST.mask_columns(["email", "phone_number"]))

            # 4. Enrich with product dimension
            df = df.transform(ST.enrich_from_broadcast(product_dim, "product_id"))

            # 5. Write to Iceberg
            df.writeTo("catalog.ns.table").append()
    """

    from __future__ import annotations

    import hashlib
    import logging
    from typing import Any

    from pyspark.sql import DataFrame, SparkSession
    from pyspark.sql import functions as F
    from pyspark.sql.types import StringType, TimestampType

    logger = logging.getLogger(__name__)


    # ─────────────────────────────────────────────────────────────────────────────
    class StarTransform:
        """
        Flink-like composable transformation functions for Spark micro-batch DataFrames.

        All methods are @staticmethod — instantiation is never required.
        Use StarTransform as ST for brevity.
        """

        # ── Op filtering ──────────────────────────────────────────────────────────

        @staticmethod
        def filter_op(df: DataFrame, ops: list[str]) -> DataFrame:
            """
            Keep only rows whose Debezium _op code is in *ops*.

            Debezium op codes:
              c = create (INSERT)
              u = update (UPDATE)
              d = delete (DELETE)
              r = read   (snapshot)

            Example:
                df = ST.filter_op(df, ops=["c", "u"])   # inserts + updates only
                df = ST.filter_op(df, ops=["d"])         # deletes only
            """
            return df.filter(F.col("_op").isin(ops))

        # ── Deduplication ─────────────────────────────────────────────────────────

        @staticmethod
        def deduplicate(pk: str, order_col: str = "kafka_ts") -> Any:
            """
            Return a DataFrame.transform-compatible function that keeps the last
            event per primary-key value within a micro-batch.

            When multiple CDC events for the same PK arrive in one micro-batch
            (e.g. INSERT then immediately UPDATE), only the last event (by
            *order_col*, default kafka_ts) is kept — "last-write-wins".

            Example:
                df = df.transform(ST.deduplicate("id"))
                df = df.transform(ST.deduplicate("_id", order_col="ts_ms"))
            """
            from pyspark.sql import Window

            def _dedup(df: DataFrame) -> DataFrame:
                w = (
                    Window
                    .partitionBy(F.col(pk))
                    .orderBy(F.col(order_col).desc())
                )
                return (
                    df
                    .withColumn("__row_num", F.row_number().over(w))
                    .filter(F.col("__row_num") == 1)
                    .drop("__row_num")
                )
            return _dedup

        # ── Timestamp injection ───────────────────────────────────────────────────

        @staticmethod
        def add_processing_time(col_name: str = "proc_time") -> Any:
            """
            Inject a *col_name* TIMESTAMP column set to current wall-clock time.

            Different from snap_timestamp (which is injected at Iceberg write time).
            proc_time marks when the Kafka record was processed by this pipeline.

            Example:
                df = df.transform(ST.add_processing_time())
                df = df.transform(ST.add_processing_time("pipeline_ts"))
            """
            def _add(df: DataFrame) -> DataFrame:
                return df.withColumn(col_name, F.current_timestamp())
            return _add

        # ── Column rename ─────────────────────────────────────────────────────────

        @staticmethod
        def rename_columns(mapping: dict[str, str]) -> Any:
            """
            Rename columns according to *mapping* = {old_name: new_name}.

            Example:
                df = df.transform(ST.rename_columns({"cust_id": "customer_id"}))
            """
            def _rename(df: DataFrame) -> DataFrame:
                for old, new in mapping.items():
                    if old in df.columns:
                        df = df.withColumnRenamed(old, new)
                    else:
                        logger.warning("rename_columns: column %r not found — skipped.", old)
                return df
            return _rename

        # ── Type casting ──────────────────────────────────────────────────────────

        @staticmethod
        def cast_columns(casts: dict[str, Any]) -> Any:
            """
            Cast columns to the given Spark SQL type strings or DataType objects.

            Example:
                from pyspark.sql.types import DoubleType
                df = df.transform(ST.cast_columns({
                    "price": "double",
                    "quantity": "int",
                    "event_ts": TimestampType(),
                }))
            """
            def _cast(df: DataFrame) -> DataFrame:
                for col_name, dtype in casts.items():
                    if col_name in df.columns:
                        df = df.withColumn(col_name, F.col(col_name).cast(dtype))
                    else:
                        logger.warning("cast_columns: column %r not found — skipped.", col_name)
                return df
            return _cast

        # ── Column drop ───────────────────────────────────────────────────────────

        @staticmethod
        def drop_columns(columns: list[str]) -> Any:
            """
            Drop *columns* from the DataFrame (silently skips missing columns).

            Example:
                df = df.transform(ST.drop_columns(["__internal", "debug_field"]))
            """
            def _drop(df: DataFrame) -> DataFrame:
                existing = [c for c in columns if c in df.columns]
                return df.drop(*existing) if existing else df
            return _drop

        # ── PII masking ───────────────────────────────────────────────────────────

        @staticmethod
        def mask_columns(columns: list[str], algorithm: str = "sha256") -> Any:
            """
            Replace sensitive column values with a deterministic hash.

            The value is converted to a UTF-8 string then hashed with *algorithm*
            (default sha256). NULL values remain NULL.

            Use this for PII fields (email, phone, SSN, etc.) before writing to
            Iceberg so the lakehouse never stores raw PII.

            Example:
                df = df.transform(ST.mask_columns(["email", "phone_number", "ssn"]))
            """
            if algorithm not in ("sha256", "md5", "sha1"):
                raise ValueError(f"Unsupported mask algorithm: {algorithm!r}")

            spark_fn = {
                "sha256": F.sha2,
                "md5":    lambda c, _: F.md5(c),
                "sha1":   lambda c, _: F.sha1(c),
            }[algorithm]

            def _mask(df: DataFrame) -> DataFrame:
                for col_name in columns:
                    if col_name in df.columns:
                        if algorithm == "sha256":
                            df = df.withColumn(
                                col_name,
                                F.when(
                                    F.col(col_name).isNotNull(),
                                    spark_fn(F.col(col_name).cast(StringType()), 256),
                                )
                            )
                        else:
                            df = df.withColumn(
                                col_name,
                                F.when(
                                    F.col(col_name).isNotNull(),
                                    spark_fn(F.col(col_name).cast(StringType()), None),
                                )
                            )
                    else:
                        logger.warning("mask_columns: column %r not found — skipped.", col_name)
                return df
            return _mask

        # ── Source tagging ────────────────────────────────────────────────────────

        @staticmethod
        def add_source_tag(source_system: str, col_name: str = "source_system") -> Any:
            """
            Inject a STRING column *col_name* with the literal value *source_system*.

            Useful when merging streams from multiple sources into one Iceberg table.

            Example:
                df = df.transform(ST.add_source_tag("oracle_tpcds"))
            """
            def _tag(df: DataFrame) -> DataFrame:
                return df.withColumn(col_name, F.lit(source_system))
            return _tag

        # ── Human-readable op label ───────────────────────────────────────────────

        @staticmethod
        def add_op_label(op_col: str = "_op", label_col: str = "op_label") -> Any:
            """
            Add a human-readable *label_col* STRING derived from Debezium *op_col*.

            Mapping: c → INSERT, u → UPDATE, d → DELETE, r → INSERT (snapshot).

            Example:
                df = df.transform(ST.add_op_label())
                # result has new column: op_label in (INSERT, UPDATE, DELETE)
            """
            def _label(df: DataFrame) -> DataFrame:
                return df.withColumn(
                    label_col,
                    F.when(F.col(op_col) == "c", F.lit("INSERT"))
                     .when(F.col(op_col) == "u", F.lit("UPDATE"))
                     .when(F.col(op_col) == "d", F.lit("DELETE"))
                     .when(F.col(op_col) == "r", F.lit("INSERT"))
                     .otherwise(F.lit("UNKNOWN")),
                )
            return _label

        # ── JSON column flattening ────────────────────────────────────────────────

        @staticmethod
        def flatten_json_col(json_col: str, schema: Any, prefix: str = "") -> Any:
            """
            Parse a JSON string column *json_col* using *schema* (StructType) and
            expand its fields as top-level columns, optionally prefixed with *prefix*.

            The original *json_col* is dropped after expansion.

            Example:
                from pyspark.sql.types import StructType, StructField, StringType, LongType
                addr_schema = StructType([
                    StructField("street", StringType()),
                    StructField("city",   StringType()),
                    StructField("zip",    StringType()),
                ])
                df = df.transform(ST.flatten_json_col("address_json", addr_schema, "addr_"))
                # Result has columns: addr_street, addr_city, addr_zip
            """
            from pyspark.sql.functions import from_json

            def _flatten(df: DataFrame) -> DataFrame:
                parsed = df.withColumn("__parsed", from_json(F.col(json_col), schema))
                for field in schema.fields:
                    out_col = f"{prefix}{field.name}" if prefix else field.name
                    parsed = parsed.withColumn(out_col, F.col(f"__parsed.{field.name}"))
                return parsed.drop("__parsed", json_col)
            return _flatten

        # ── Broadcast dimension enrich ────────────────────────────────────────────

        @staticmethod
        def enrich_from_broadcast(
            dim_df:      DataFrame,
            join_col:    str,
            select_cols: list[str] | None = None,
            how:         str = "left",
        ) -> Any:
            """
            Left-join the streaming batch against a static dimension DataFrame
            *dim_df* (broadcast hint applied automatically).

            *join_col*    — column present in both DataFrames to join on.
            *select_cols* — columns to bring in from *dim_df* (default: all).
            *how*         — join type (default: left).

            The dim DataFrame is broadcast so no shuffle is triggered — safe for
            large streaming batches with small-to-medium dimension tables.

            Example:
                product_dim = spark.table("polaris.dims.products")
                df = df.transform(
                    ST.enrich_from_broadcast(product_dim, "product_id",
                                             select_cols=["category", "brand"])
                )
            """
            dim_broadcast = F.broadcast(dim_df)
            if select_cols:
                dim_broadcast = dim_broadcast.select([join_col] + select_cols)

            def _enrich(df: DataFrame) -> DataFrame:
                # Avoid column name collision: prefix dim columns with "dim_" if needed
                existing = set(df.columns)
                dim_cols = [c for c in dim_broadcast.columns if c != join_col]
                rename_map = {c: f"dim_{c}" for c in dim_cols if c in existing}
                bdim = dim_broadcast
                for old, new in rename_map.items():
                    bdim = bdim.withColumnRenamed(old, new)
                return df.join(bdim, on=join_col, how=how)
            return _enrich

        # ── Batch aggregate counts ────────────────────────────────────────────────

        @staticmethod
        def aggregate_counts(
            pk_col: str,
            op_col: str = "_op",
            out_col: str = "event_count",
        ) -> Any:
            """
            Count events per (pk_col, op_col) within the micro-batch.

            Returns a summary DataFrame — not suitable for direct Iceberg write
            of the original rows.  Use this for audit/metrics side-writes.

            Example:
                counts_df = ST.aggregate_counts("id")(batch_df)
                counts_df.writeTo("catalog.audit.event_counts").append()
            """
            def _agg(df: DataFrame) -> DataFrame:
                return (
                    df
                    .groupBy(F.col(pk_col), F.col(op_col))
                    .agg(F.count("*").alias(out_col))
                )
            return _agg

        # ── Before/After side-by-side pivot ───────────────────────────────────────

        @staticmethod
        def pivot_before_after(
            before_col: str = "before",
            after_col:  str = "after",
            schema:     Any = None,
        ) -> Any:
            """
            Parse the raw Debezium *before* and *after* JSON string columns and
            expand them side-by-side as before_<field> and after_<field> columns.

            *schema* must be a StructType matching both before and after payloads.
            If schema is None the columns are left as JSON strings.

            Primarily used in history_tracking mode to preserve the full before
            image alongside the after image for UPDATE events.

            Example:
                df = df.transform(ST.pivot_before_after(schema=my_schema))
                # Columns: before_id, before_name, after_id, after_name, ...
            """
            from pyspark.sql.functions import from_json

            def _pivot(df: DataFrame) -> DataFrame:
                if schema is None:
                    return df  # caller handles raw JSON strings
                before_parsed = from_json(F.col(before_col), schema)
                after_parsed  = from_json(F.col(after_col),  schema)
                result = df
                for field in schema.fields:
                    result = result.withColumn(
                        f"before_{field.name}", before_parsed[field.name]
                    ).withColumn(
                        f"after_{field.name}", after_parsed[field.name]
                    )
                return result.drop(before_col, after_col)
            return _pivot

        # ── Column projection ─────────────────────────────────────────────────────

        @staticmethod
        def filter_columns(keep: list[str]) -> Any:
            """
            Keep only *keep* columns, dropping everything else.

            Example:
                df = df.transform(ST.filter_columns(["id", "name", "email", "_op"]))
            """
            def _proj(df: DataFrame) -> DataFrame:
                existing = [c for c in keep if c in df.columns]
                missing  = [c for c in keep if c not in df.columns]
                if missing:
                    logger.warning("filter_columns: missing columns %s — skipped.", missing)
                return df.select(existing)
            return _proj

        # ── Null coalescing ───────────────────────────────────────────────────────

        @staticmethod
        def null_coalesce(defaults: dict[str, Any]) -> Any:
            """
            For each column in *defaults*, replace NULL with the given literal value.

            Example:
                df = df.transform(ST.null_coalesce({
                    "status": "UNKNOWN",
                    "score":  0,
                    "active": False,
                }))
            """
            def _coalesce(df: DataFrame) -> DataFrame:
                for col_name, default in defaults.items():
                    if col_name in df.columns:
                        df = df.withColumn(
                            col_name,
                            F.coalesce(F.col(col_name), F.lit(default)),
                        )
                    else:
                        logger.warning("null_coalesce: column %r not found — skipped.", col_name)
                return df
            return _coalesce

        # ── Topic routing ─────────────────────────────────────────────────────────

        @staticmethod
        def route_by_topic(df: DataFrame) -> dict[str, DataFrame]:
            """
            Split a multi-topic DataFrame into a dict of {topic_name: DataFrame}.

            Collects the distinct topic names in the batch (one small action),
            then filters the DataFrame per topic without additional Kafka reads.

            Example:
                topic_dfs = ST.route_by_topic(batch_df)
                for topic, tdf in topic_dfs.items():
                    process_table(topic, tdf)
            """
            try:
                topics = [r[0] for r in df.select("topic").distinct().collect()]
            except Exception as exc:
                logger.warning("route_by_topic: could not collect topics: %s", exc)
                return {}
            return {t: df.filter(F.col("topic") == t) for t in topics}

        # ── Pipeline composition ──────────────────────────────────────────────────

        @staticmethod
        def apply_pipeline(
            df: DataFrame,
            steps: list[tuple[Any, dict]],
        ) -> DataFrame:
            """
            Apply a sequence of transformation steps to *df*.

            *steps* is a list of (transform_fn, kwargs) tuples where:
              - transform_fn is a StarTransform static method that returns a
                DataFrame.transform-compatible callable when called with **kwargs
              - kwargs is the dict of arguments to pass to the method

            Example:
                result = ST.apply_pipeline(batch_df, [
                    (ST.filter_op,          {"ops": ["c", "u"]}),
                    (ST.deduplicate,        {"pk": "id"}),
                    (ST.mask_columns,       {"columns": ["email"]}),
                    (ST.add_processing_time, {}),
                    (ST.add_source_tag,     {"source_system": "oracle_tpcds"}),
                ])
            """
            for fn, kwargs in steps:
                try:
                    # Methods like filter_op take df directly; others return a transform fn
                    result = fn(df, **kwargs)
                    if isinstance(result, DataFrame):
                        df = result
                    elif callable(result):
                        df = df.transform(result)
                    else:
                        logger.warning("apply_pipeline: step %r returned unexpected type.", fn)
                except Exception as exc:
                    logger.error("apply_pipeline: step %r failed: %s", fn, exc, exc_info=True)
                    raise
            return df


        # =========================================================================
        # ── AGGREGATE FUNCTIONS ───────────────────────────────────────────────────
        # =========================================================================

        # ── General windowed / grouped aggregation ────────────────────────────────

        @staticmethod
        def windowed_aggregate(
            group_cols: list[str],
            agg_specs: list[tuple[str, str, str]],
            batch_ts_col: str = "proc_batch_ts",
        ) -> Any:
            """
            Group-by *group_cols* and compute multiple aggregations in one pass.

            *agg_specs* is a list of (column, function, alias) triples.
            Supported functions: ``sum``, ``avg``, ``min``, ``max``, ``count``,
            ``count_distinct``, ``first``, ``last``, ``stddev``, ``variance``.

            A ``proc_batch_ts`` TIMESTAMP column (wall-clock) is added so every
            summary row carries the batch time — essential for time-series queries
            against the Iceberg aggregate table.

            Returns a **summary** DataFrame — write it to a separate Iceberg table,
            not to the original events table.

            Example::

                agg_df = ST.windowed_aggregate(
                    ["country", "_op"],
                    [("total_amount", "sum", "total_revenue"),
                     ("id",           "count", "event_count"),
                     ("total_amount", "avg",   "avg_order_value")],
                )(batch_df)
                agg_df.writeTo("postgres.e2e_testing.orders_agg_summary").append()
            """
            _FN_MAP = {
                "sum":            lambda c: F.sum(c),
                "avg":            lambda c: F.avg(c),
                "min":            lambda c: F.min(c),
                "max":            lambda c: F.max(c),
                "count":          lambda c: F.count(c),
                "count_distinct": lambda c: F.countDistinct(c),
                "first":          lambda c: F.first(c, ignorenulls=True),
                "last":           lambda c: F.last(c, ignorenulls=True),
                "stddev":         lambda c: F.stddev(c),
                "variance":       lambda c: F.variance(c),
            }

            def _agg(df: DataFrame) -> DataFrame:
                exprs = []
                for src_col, fn_name, alias in agg_specs:
                    fn_name_lower = fn_name.lower()
                    if fn_name_lower not in _FN_MAP:
                        raise ValueError(
                            f"windowed_aggregate: unsupported function {fn_name!r}. "
                            f"Choose from {sorted(_FN_MAP)}."
                        )
                    if src_col not in df.columns:
                        logger.warning(
                            "windowed_aggregate: column %r not found — skipped.", src_col
                        )
                        continue
                    exprs.append(_FN_MAP[fn_name_lower](F.col(src_col)).alias(alias))
                if not exprs:
                    return df
                return (
                    df.groupBy([F.col(c) for c in group_cols])
                      .agg(*exprs)
                      .withColumn(batch_ts_col, F.current_timestamp())
                )
            return _agg

        # ── Rolling (cumulative) sum ───────────────────────────────────────────────

        @staticmethod
        def rolling_sum(
            value_col: str,
            order_col: str = "kafka_ts",
            partition_cols: list[str] | None = None,
            out_col: str | None = None,
        ) -> Any:
            """
            Add a cumulative **sum** of *value_col* ordered by *order_col* using a
            window that spans all preceding rows up to and including the current
            one (``ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW``).

            *partition_cols* — optional list of columns to partition the window by
            (e.g. ``["customer_id"]`` for a per-customer running total).
            *out_col* — name of the new column (default: ``<value_col>_rolling_sum``).

            Example::

                df = df.transform(
                    ST.rolling_sum("total_amount", "kafka_ts", ["customer_id"])
                )
                # new column: total_amount_rolling_sum
            """
            from pyspark.sql import Window

            output = out_col or f"{value_col}_rolling_sum"

            def _rsum(df: DataFrame) -> DataFrame:
                spec = Window.orderBy(F.col(order_col)).rowsBetween(
                    Window.unboundedPreceding, Window.currentRow
                )
                if partition_cols:
                    spec = spec.partitionBy([F.col(c) for c in partition_cols])
                return df.withColumn(output, F.sum(F.col(value_col)).over(spec))
            return _rsum

        # ── Rolling (cumulative) average ──────────────────────────────────────────

        @staticmethod
        def rolling_avg(
            value_col: str,
            order_col: str = "kafka_ts",
            partition_cols: list[str] | None = None,
            out_col: str | None = None,
        ) -> Any:
            """
            Add a cumulative **average** of *value_col* ordered by *order_col*.

            Uses the same unbounded-preceding window as :py:meth:`rolling_sum`.
            *partition_cols* and *out_col* behave identically.

            Example::

                df = df.transform(
                    ST.rolling_avg("total_amount", "kafka_ts", ["customer_id"])
                )
                # new column: total_amount_rolling_avg
            """
            from pyspark.sql import Window

            output = out_col or f"{value_col}_rolling_avg"

            def _ravg(df: DataFrame) -> DataFrame:
                spec = Window.orderBy(F.col(order_col)).rowsBetween(
                    Window.unboundedPreceding, Window.currentRow
                )
                if partition_cols:
                    spec = spec.partitionBy([F.col(c) for c in partition_cols])
                return df.withColumn(output, F.avg(F.col(value_col)).over(spec))
            return _ravg

        # ── Count distinct values per group key ───────────────────────────────────

        @staticmethod
        def count_distinct_per_key(
            group_col: str,
            value_col: str,
            out_col: str | None = None,
            batch_ts_col: str = "proc_batch_ts",
        ) -> Any:
            """
            For each distinct value of *group_col*, count the number of **distinct**
            values of *value_col* within the micro-batch.

            Returns a **summary** DataFrame with columns:
            ``(group_col, out_col, proc_batch_ts)``.

            Write the result to a dedicated audit/metrics Iceberg table.

            Example::

                distinct_df = ST.count_distinct_per_key("country", "id")(batch_df)
                # columns: country, id_distinct_count, proc_batch_ts
                distinct_df.writeTo("postgres.e2e_testing.customers_country_stats").append()
            """
            output = out_col or f"{value_col}_distinct_count"

            def _cdpk(df: DataFrame) -> DataFrame:
                return (
                    df.groupBy(F.col(group_col))
                      .agg(F.countDistinct(F.col(value_col)).alias(output))
                      .withColumn(batch_ts_col, F.current_timestamp())
                )
            return _cdpk

        # ── Top-N rows per group ───────────────────────────────────────────────────

        @staticmethod
        def top_n_per_group(
            group_col: str,
            rank_col: str,
            n: int = 5,
            ascending: bool = False,
        ) -> Any:
            """
            Within each value of *group_col*, keep the top *n* rows ranked by
            *rank_col* (descending by default — set ``ascending=True`` for bottom-N).

            Uses a window ``row_number()`` so ties are broken deterministically by
            Spark's row ordering rather than discarding rows arbitrarily.

            Useful for "top 5 highest-value orders per country" type queries.

            Example::

                df = df.transform(ST.top_n_per_group("country", "total_amount", n=3))
                # result contains at most 3 rows per country (highest total_amount)
            """
            from pyspark.sql import Window

            def _top_n(df: DataFrame) -> DataFrame:
                order_expr = (
                    F.col(rank_col).asc() if ascending else F.col(rank_col).desc()
                )
                w = Window.partitionBy(F.col(group_col)).orderBy(order_expr)
                return (
                    df.withColumn("__rn", F.row_number().over(w))
                      .filter(F.col("__rn") <= n)
                      .drop("__rn")
                )
            return _top_n

        # ── Event-rate metric ─────────────────────────────────────────────────────

        @staticmethod
        def event_rate(
            ts_col: str = "kafka_ts",
            out_col: str = "events_per_second",
            batch_ts_col: str = "proc_batch_ts",
        ) -> Any:
            """
            Compute the overall **events-per-second** throughput for the current
            micro-batch from the timestamps in *ts_col*.

            The result is a single-row summary DataFrame with columns:
            ``(event_count, batch_duration_seconds, events_per_second, min_ts,
            max_ts, proc_batch_ts)``.

            Intended for side-writes to a monitoring/metrics Iceberg table.

            Example::

                rate_df = ST.event_rate("kafka_ts")(batch_df)
                rate_df.writeTo("postgres.e2e_testing.pipeline_event_rate").append()
            """
            def _rate(df: DataFrame) -> DataFrame:
                agg_df = df.agg(
                    F.count("*").alias("event_count"),
                    F.min(F.col(ts_col)).alias("min_ts"),
                    F.max(F.col(ts_col)).alias("max_ts"),
                )
                # batch_duration_seconds = (max_ts – min_ts) in seconds; guard div/0
                return (
                    agg_df
                    .withColumn(
                        "batch_duration_seconds",
                        F.greatest(
                            (
                                F.col("max_ts").cast("double")
                                - F.col("min_ts").cast("double")
                            ),
                            F.lit(1.0),
                        ),
                    )
                    .withColumn(
                        out_col,
                        F.col("event_count") / F.col("batch_duration_seconds"),
                    )
                    .withColumn(batch_ts_col, F.current_timestamp())
                )
            return _rate

        # =========================================================================
        # ── MULTI-TOPIC JOIN FUNCTIONS ────────────────────────────────────────────
        # =========================================================================

        # ── Direct batch-to-batch join ────────────────────────────────────────────

        @staticmethod
        def stream_join(
            right_df: DataFrame,
            join_col: str | list[str],
            how: str = "inner",
            left_prefix: str = "",
            right_prefix: str = "right_",
        ) -> Any:
            """
            Join the current micro-batch DataFrame against *right_df* (another
            Kafka topic batch or any DataFrame) on *join_col*.

            Column name collisions (excluding *join_col* itself) are resolved by
            prefixing the right side's columns with *right_prefix* (default
            ``'right_'``).  Set *left_prefix* to also prefix the left side.

            Both DataFrames must have been routed from their respective Kafka topics
            using :py:meth:`route_by_topic` before calling this function.

            *how* supports the full Spark join-type vocabulary: ``inner``,
            ``left``, ``right``, ``outer``, ``left_semi``, ``left_anti``.

            Example::

                topic_dfs = ST.route_by_topic(batch_df)
                orders_df  = topic_dfs.get("postgres.public.orders", spark.createDataFrame([], orders_schema))
                products_df = topic_dfs.get("postgres.public.products", spark.createDataFrame([], products_schema))

                joined = ST.stream_join(products_df, "product_id", how="left")(orders_df)
                joined.writeTo("postgres.e2e_testing.orders_products_joined").append()
            """
            join_keys = [join_col] if isinstance(join_col, str) else list(join_col)

            def _join(left: DataFrame) -> DataFrame:
                # Determine overlapping non-key columns
                left_non_key  = [c for c in left.columns     if c not in join_keys]
                right_non_key = [c for c in right_df.columns if c not in join_keys]
                overlap = set(left_non_key) & set(right_non_key)

                # Build renamed right DataFrame
                right_renamed = right_df
                for col_name in overlap:
                    right_renamed = right_renamed.withColumnRenamed(
                        col_name, f"{right_prefix}{col_name}"
                    )
                # Optionally prefix left side
                left_renamed = left
                if left_prefix:
                    for col_name in overlap:
                        left_renamed = left_renamed.withColumnRenamed(
                            col_name, f"{left_prefix}{col_name}"
                        )

                return left_renamed.join(right_renamed, on=join_keys, how=how)
            return _join

        # ── Temporal (nearest-in-time) join ───────────────────────────────────────

        @staticmethod
        def temporal_join(
            right_df: DataFrame,
            key_col: str,
            left_ts_col: str  = "kafka_ts",
            right_ts_col: str = "kafka_ts",
            tolerance_ms: int | None = None,
            right_prefix: str = "right_",
        ) -> Any:
            """
            For each row in the left batch, find the **closest-in-time** matching
            row in *right_df* sharing the same *key_col* value.

            Steps:
            1. Cross-join-free: broadcast *right_df* and join on *key_col*.
            2. Compute absolute timestamp delta ``|left_ts – right_ts|`` in ms.
            3. If *tolerance_ms* is set, drop matches whose delta exceeds it.
            4. Keep only the closest right-side match per left row (min delta wins).

            This is the micro-batch equivalent of a Flink event-time temporal join —
            it does **not** maintain cross-batch state; use it for same-batch
            enrichment where both sides arrive in the same micro-batch.

            Overlapping non-key, non-ts columns in *right_df* are prefixed with
            *right_prefix*.

            Example::

                enriched = ST.temporal_join(
                    right_df=payments_df,
                    key_col="order_id",
                    left_ts_col="kafka_ts",
                    right_ts_col="kafka_ts",
                    tolerance_ms=5000,
                )(orders_df)
                enriched.writeTo("postgres.e2e_testing.orders_payments_temporal").append()
            """
            from pyspark.sql import Window

            def _temporal(left: DataFrame) -> DataFrame:
                # Resolve column collisions on the right side
                right_renamed = right_df
                overlap = (
                    set(right_df.columns)
                    - {key_col, right_ts_col}
                ) & set(left.columns)
                for col_name in overlap:
                    right_renamed = right_renamed.withColumnRenamed(
                        col_name, f"{right_prefix}{col_name}"
                    )
                # Rename right ts col to avoid ambiguity
                right_ts_alias = f"__right_{right_ts_col}"
                right_renamed = right_renamed.withColumnRenamed(right_ts_col, right_ts_alias)

                joined = left.join(F.broadcast(right_renamed), on=key_col, how="left")

                # Compute delta in milliseconds (timestamps stored as LongType ms)
                joined = joined.withColumn(
                    "__ts_delta_ms",
                    F.abs(
                        F.col(left_ts_col).cast("long")
                        - F.col(right_ts_alias).cast("long")
                    ),
                )

                if tolerance_ms is not None:
                    joined = joined.filter(
                        F.col("__ts_delta_ms").isNull()
                        | (F.col("__ts_delta_ms") <= tolerance_ms)
                    )

                # Keep only the single closest right-side match per left row
                # Use a synthetic row identity to partition over
                w = (
                    Window
                    .partitionBy(F.col(key_col), F.col(left_ts_col))
                    .orderBy(F.col("__ts_delta_ms").asc_nulls_last())
                )
                return (
                    joined
                    .withColumn("__closest_rn", F.row_number().over(w))
                    .filter(F.col("__closest_rn") == 1)
                    .drop("__closest_rn", "__ts_delta_ms", right_ts_alias)
                )
            return _temporal

        # ── UNION ALL multiple topic DataFrames ───────────────────────────────────

        @staticmethod
        def multi_topic_union(
            topic_dfs: dict[str, DataFrame],
            tag_col: str = "source_topic",
            harmonise_schema: bool = True,
        ) -> DataFrame:
            """
            UNION ALL multiple DataFrames (typically from :py:meth:`route_by_topic`)
            into a single DataFrame and inject a *tag_col* STRING column carrying
            the original topic name.

            When *harmonise_schema* is ``True`` (default), missing columns are
            added as ``NULL`` casts so all DataFrames share the same schema before
            the union — required when topics have slightly different column sets.

            Pass the result directly to an Iceberg ``append()`` write to build a
            unified multi-source events table.

            Example::

                topic_dfs = ST.route_by_topic(batch_df)
                unified = ST.multi_topic_union(topic_dfs)
                unified.writeTo("postgres.e2e_testing.all_topics_union").append()
            """
            if not topic_dfs:
                raise ValueError("multi_topic_union: topic_dfs dict is empty.")

            tagged: list[DataFrame] = []
            for topic_name, tdf in topic_dfs.items():
                tagged.append(tdf.withColumn(tag_col, F.lit(topic_name)))

            if not harmonise_schema:
                result = tagged[0]
                for tdf in tagged[1:]:
                    result = result.unionByName(tdf, allowMissingColumns=True)
                return result

            # Collect the full superset of column names (preserving first-seen order)
            all_cols: list[str] = []
            seen: set[str] = set()
            for tdf in tagged:
                for c in tdf.columns:
                    if c not in seen:
                        all_cols.append(c)
                        seen.add(c)

            harmonised: list[DataFrame] = []
            for tdf in tagged:
                missing = [c for c in all_cols if c not in tdf.columns]
                for c in missing:
                    tdf = tdf.withColumn(c, F.lit(None).cast(StringType()))
                harmonised.append(tdf.select(all_cols))

            result = harmonised[0]
            for tdf in harmonised[1:]:
                result = result.union(tdf)
            return result

        # ── Join two topic batches and tag both sides with provenance ─────────────

        @staticmethod
        def join_and_tag_source(
            right_df: DataFrame,
            join_col: str | list[str],
            left_topic: str,
            right_topic: str,
            how: str = "inner",
            right_prefix: str = "right_",
        ) -> Any:
            """
            Join two topic DataFrames on *join_col* and add ``left_topic`` and
            ``right_topic`` STRING columns that carry the names of the originating
            Kafka topics for full data-lineage provenance in the Iceberg table.

            This is a thin wrapper around :py:meth:`stream_join` that adds the
            provenance columns after the join.

            Example::

                result = ST.join_and_tag_source(
                    right_df=inventory_df,
                    join_col="product_id",
                    left_topic="postgres.public.orders",
                    right_topic="postgres.public.inventory",
                    how="left",
                )(orders_df)
                result.writeTo("postgres.e2e_testing.orders_inventory_joined").append()
            """
            _join_fn = StarTransform.stream_join(
                right_df, join_col, how=how, right_prefix=right_prefix
            )

            def _tag_join(df: DataFrame) -> DataFrame:
                joined = _join_fn(df)
                return (
                    joined
                    .withColumn("left_topic",  F.lit(left_topic))
                    .withColumn("right_topic", F.lit(right_topic))
                )
            return _tag_join


    # ─────────────────────────────────────────────────────────────────────────────
    # Convenience alias
    # ─────────────────────────────────────────────────────────────────────────────
    ST = StarTransform



# =============================================================================
# Per-source Deployments (3 sources × 3 write modes = 9 Deployments)
#
# Each Deployment is pinned to exactly ONE source via SOURCE=<postgres|oracle|mongodb>
# and ONE write mode via WRITE_MODE=<standard|soft_delete|history_tracking>.
#
# This replaces the previous 3 multi-source Deployments where a crashing
# connector (e.g. MongoDB change-stream error) could starve other sources.
# Now each pipeline is fully isolated — a MongoDB failure has zero impact on
# the postgres or oracle pipelines.
#
# Default active replicas:
#   kafka-to-iceberg-postgres-standard  → 1  (production pipeline)
#   all others                          → 0  (scale up as needed)
#
# HEALTH_PORT assignments (all unique to allow co-scheduling on same node):
#   postgres : standard=8081  soft_delete=8082  history_tracking=8083
#   oracle   : standard=8084  soft_delete=8085  history_tracking=8086
#   mongodb  : standard=8087  soft_delete=8088  history_tracking=8089
#
# Checkpoint paths are already source+write-mode keyed in the script:
#   s3://xdatatoiceberg1/checkpoints/streaming/<source>/<write_mode>
# =============================================================================

# ── Deployment template macro (env block is identical across all 9) ──────────
# Each Deployment below follows this structure:
#   metadata.name : kafka-to-iceberg-<source>-<write-mode-dashes>
#   labels        : pipeline.source + pipeline.write-mode
#   env SOURCE    : pinned to the source (postgres/oracle/mongodb)
#   env WRITE_MODE: pinned to the write mode
#   env HEALTH_PORT: unique per deployment (not from ConfigMap — inline value)
#   resources     : same as before (4Gi/2cpu req, 8Gi/4cpu limit)

# ─────────────────────────────────────────────────────────────────────────────
# POSTGRES PIPELINES
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-to-iceberg-postgres-standard
  namespace: prod
  labels:
    app: kafka-to-iceberg
    pipeline.source: postgres
    pipeline.write-mode: standard
    pipeline.type: streaming
  annotations:
    pipeline.auto-restart: "Deployment restartPolicy=Always + internal retry loop"
    pipeline.write-mode-desc: "PostgreSQL → Kafka → Iceberg | SCD Type 0 — MERGE upsert + hard delete"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-to-iceberg
      pipeline.source: postgres
      pipeline.write-mode: standard
  template:
    metadata:
      labels:
        app: kafka-to-iceberg
        pipeline.source: postgres
        pipeline.write-mode: standard
    spec:
      restartPolicy: Always
      serviceAccountName: spark-cleanup
      terminationGracePeriodSeconds: 90
      containers:
        - name: kafka-to-iceberg
          image: 192.168.1.50:30500/spark-gluten-velox:3.5.1-14
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              cd /opt/spark/work-dir && \
              exec python3 05_kafka_to_iceberg_streaming.py
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          env:
            - name: USER
              value: dave
            - name: SPARK_USER
              value: dave
            - name: SOURCE
              value: postgres
            - name: WRITE_MODE
              value: standard
            - name: HEALTH_PORT
              value: "8081"
            - name: TRIGGER_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: TRIGGER_INTERVAL
            - name: MAX_OFFSETS_PER_TRIGGER
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: MAX_OFFSETS_PER_TRIGGER
            - name: MAX_RESTART_ATTEMPTS
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: MAX_RESTART_ATTEMPTS
            - name: RESTART_BACKOFF_BASE_S
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: RESTART_BACKOFF_BASE_S
            - name: RESTART_BACKOFF_MAX_S
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: RESTART_BACKOFF_MAX_S
            - name: DRY_RUN
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: DRY_RUN
            - name: ADDR
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: ADDR
            - name: MERGE_PARALLELISM
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: MERGE_PARALLELISM
            - name: COALESCE_BEFORE_MERGE
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: COALESCE_BEFORE_MERGE
            - name: ADAPTIVE_COALESCE_TARGET
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: ADAPTIVE_COALESCE_TARGET
            - name: TRANSFORM_PIPELINE
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: TRANSFORM_PIPELINE
            - name: PII_COLUMNS
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: PII_COLUMNS
            - name: TARGET_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: TARGET_NAMESPACE
            - name: EXECUTOR_INSTANCES
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: EXECUTOR_INSTANCES
            - name: EXECUTOR_CORES
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: EXECUTOR_CORES
            - name: EXECUTOR_MEMORY
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: EXECUTOR_MEMORY
            - name: EXECUTOR_OFFHEAP
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: EXECUTOR_OFFHEAP
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"
          volumeMounts:
            - name: streaming-script
              mountPath: /opt/spark/work-dir/05_kafka_to_iceberg_streaming.py
              subPath: 05_kafka_to_iceberg_streaming.py
              readOnly: true
            - name: star-transform-script
              mountPath: /opt/spark/work-dir/star_transform.py
              subPath: star_transform.py
              readOnly: true
      volumes:
        - name: streaming-script
          configMap:
            name: kafka-to-iceberg-script
        - name: star-transform-script
          configMap:
            name: star-transform-script

