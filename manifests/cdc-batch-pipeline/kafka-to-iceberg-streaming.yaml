    pipeline.write-mode: standard
    pipeline.type: streaming
  annotations:
    pipeline.auto-restart: "Deployment restartPolicy=Always + internal retry loop"
    pipeline.write-mode-desc: "PostgreSQL → Kafka → Iceberg | SCD Type 0 — MERGE upsert + hard delete"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-to-iceberg
      pipeline.source: postgres
      pipeline.write-mode: standard
  template:
    metadata:
