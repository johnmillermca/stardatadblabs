        - name: TARGET_NAMESPACE
          valueFrom:
            configMapKeyRef:
              key: TARGET_NAMESPACE
              name: kafka-to-iceberg-config
        - name: EXECUTOR_INSTANCES
          valueFrom:
            configMapKeyRef:
              key: EXECUTOR_INSTANCES
              name: kafka-to-iceberg-config
        - name: EXECUTOR_CORES
          valueFrom:
            configMapKeyRef:
              key: EXECUTOR_CORES
              name: kafka-to-iceberg-config
        - name: EXECUTOR_MEMORY
          valueFrom:
            configMapKeyRef:
              key: EXECUTOR_MEMORY
              name: kafka-to-iceberg-config
        - name: EXECUTOR_OFFHEAP
          valueFrom:
            configMapKeyRef:
              key: EXECUTOR_OFFHEAP
              name: kafka-to-iceberg-config
        - name: JAVA_TOOL_OPTIONS
          valueFrom:
            configMapKeyRef:
              key: JAVA_TOOL_OPTIONS
              name: kafka-to-iceberg-config
        image: 192.168.1.50:30500/spark-gluten-velox:3.5.1-26
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: health
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        name: kafka-to-iceberg
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: '1'
            memory: 2Gi
      restartPolicy: Always
      serviceAccountName: spark-cleanup
      terminationGracePeriodSeconds: 90
