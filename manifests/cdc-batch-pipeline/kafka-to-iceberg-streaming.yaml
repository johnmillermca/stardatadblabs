              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: RESTART_BACKOFF_MAX_S
            - name: DRY_RUN
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: DRY_RUN
            - name: ADDR
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: ADDR
            - name: MERGE_PARALLELISM
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: MERGE_PARALLELISM
            - name: COALESCE_BEFORE_MERGE
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: COALESCE_BEFORE_MERGE
            - name: ADAPTIVE_COALESCE_TARGET
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: ADAPTIVE_COALESCE_TARGET
            - name: TRANSFORM_PIPELINE
