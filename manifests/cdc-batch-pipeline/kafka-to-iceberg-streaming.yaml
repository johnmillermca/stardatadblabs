apiVersion: v1
kind: ConfigMap
metadata:
  name: schema-evolution-handler-script
  namespace: prod
  labels:
    app: schema-evolution-handler
    pipeline.type: ddl-handler
data: {}
# NOTE: 04_schema_evolution_handler.py is baked into the Docker image as of
# 3.5.1-18 (COPY in Dockerfile step 36). This ConfigMap is retained for
# compatibility but its data is intentionally empty — the image provides the
# script. The volume mount below is also removed.

---
# ─────────────────────────────────────────────────────────────────────────────
# RETIRED — schema-evolution-handler (replicas: 0)
#
# This Deployment ran 04_schema_evolution_handler.py, which watched the
# schema-changes.* Kafka topics and auto-applied ALTER TABLE to Iceberg
# when Debezium published a DDL event.
#
# It has been retired from the Kafka→Iceberg CDC pipeline because automatic
# schema evolution was replaced with operator-gated DDL apply:
#   1. When a batch contains columns not in Iceberg, 05_kafka_to_iceberg_streaming.py
#      now logs a CRITICAL error with the exact ddl_apply.py command and stops
#      replication for that table (no silent column drop).
#   2. The operator reads the CRITICAL log (or runs ddl_extract.py) to get
#      the ready-to-run ddl_apply.py command and applies it manually.
#
# NOTE: 04_schema_evolution_handler.py is intentionally left in the Docker image
#       and is NOT removed from the Dockerfile. starpump.py is a separate pipeline
#       that may use schema evolution independently — this Deployment retirement
#       only affects the Kafka→Iceberg streaming path.
#
# To re-enable: change replicas back to 1 and apply.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    pipeline.description: "RETIRED — see comment above. Previously watched schema-changes.* Kafka topics and auto-applied ALTER TABLE to Iceberg. Replaced by operator-gated ddl_apply.py workflow. See scripts/ddl_extract.py and docs/runbooks/runbook-30-cdc-e2e-testing.md Section 7."
  labels:
    app: schema-evolution-handler
    pipeline.type: ddl-handler
    pipeline.status: retired
  name: schema-evolution-handler
  namespace: prod
spec:
  replicas: 0
  selector:
    matchLabels:
      app: schema-evolution-handler
  template:
    metadata:
      labels:
        app: schema-evolution-handler
        pipeline.type: ddl-handler
    spec:
      containers:
      - command:
        - /bin/bash
        - -c
        - 'cd /opt/spark/work-dir && \

          exec python3 04_schema_evolution_handler.py

          '
        env:
        - name: USER
          value: dave
        - name: SPARK_USER
          value: dave
        - name: SOURCE
          value: ''
        - name: DRY_RUN
          value: '0'
        - name: ADDR
          valueFrom:
            configMapKeyRef:
              key: ADDR
              name: kafka-to-iceberg-config
        image: 192.168.1.50:30500/spark-gluten-velox:3.5.1-18
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - pgrep
            - -f
            - 04_schema_evolution_handler.py
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        name: schema-evolution-handler
        ports:
        - containerPort: 8090
          name: health
          protocol: TCP
        resources:
          limits:
            cpu: '1'
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
      restartPolicy: Always
      serviceAccountName: spark-cleanup
      terminationGracePeriodSeconds: 30