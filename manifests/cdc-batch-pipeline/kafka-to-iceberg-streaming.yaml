# =============================================================================
# kafka-to-iceberg-streaming.yaml
#
# !! SUPERSEDED by Kafka-native TableFlow (manifests/tableflow/tableflow.yaml) !!
#
# The 3 Spark Structured Streaming deployments (standard, soft-delete,
# history-tracking) have been scaled to replicas=0.  They are retained here
# for reference and rollback only.
#
# Replacement architecture:
#   Debezium → ksqlDB (_sd / _hist derived topics) → tableflow Python pods
#   → PyIceberg → Polaris REST → Iceberg on S3
#
# To re-enable Spark streaming (rollback): set replicas back to 1 and scale
# the 3 dedicated streaming Spark workers back up.
#
# Spark batch workers (spark-worker-streaming-worker2/3/4) are also scaled to 0
# since the tableflow pods now own those nodes.
# =============================================================================

# ── ConfigMap: shared streaming config ───────────────────────────────────────
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-to-iceberg-config
  namespace: prod
  labels:
    app: kafka-to-iceberg
    pipeline.type: streaming
data:
  SPARK_USER:              "dave"
  TRIGGER_INTERVAL:        "2 seconds"
  MAX_OFFSETS_PER_TRIGGER: "50000"
  MAX_RESTART_ATTEMPTS:    "0"
  HEALTH_PORT:             "8080"
  RESTART_BACKOFF_BASE_S:  "5"
  RESTART_BACKOFF_MAX_S:   "120"
  DRY_RUN:                 "0"
  ADDR:                    "http://openbao.prod.svc.cluster.local:8200"
  MERGE_PARALLELISM:            "4"
  COALESCE_BEFORE_MERGE:        "1"
  ADAPTIVE_COALESCE_TARGET:     "67108864"
  # ── Executor sizing — 1 core + 2 GB per streaming app ───────────────────────
  # Each app is pinned to its own worker node (worker2/3/4).  The worker
  # advertises 2g memory so the one executor on it can claim the full 2 GB.
  # Dynamic allocation (minExecutors=0) releases the core when idle.
  # spark.cores.max=1 enforces the per-app limit at the Spark master level.
  EXECUTOR_INSTANCES:           "1"
  EXECUTOR_CORES:               "1"
  EXECUTOR_MEMORY:              "2g"
  EXECUTOR_OFFHEAP:             "0"
  MAX_EXECUTORS:                "1"
  BURST_BACKLOG_TIMEOUT_S:      "60"
  TARGET_NAMESPACE:             ""
  JAVA_TOOL_OPTIONS: >-
    -Dsun.net.inetaddr.ttl=30
    -Dsun.net.inetaddr.negative.ttl=5
    -Dnetworkaddress.cache.ttl=30
    -Dnetworkaddress.cache.negative.ttl=5

# ── ConfigMap: streaming script (retained for compatibility) ──────────────────
---
apiVersion: v1
data: {}
kind: ConfigMap
metadata:
  annotations:
    pipeline.note: Script baked into image as of 3.5.1-18. This ConfigMap is retained for compatibility but its data is empty.
  labels:
    app: kafka-to-iceberg
    pipeline.type: streaming
  name: kafka-to-iceberg-script
  namespace: prod

# =============================================================================
# STREAMING WORKERS — one per node, each advertising 2g / 1 core.
# Never scaled to 0.  Each node hosts exactly one streaming app.
# =============================================================================

# ── worker2: standard ─────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker-streaming-worker2
  namespace: prod
  labels:
    app: spark
    component: worker-streaming
spec:
  replicas: 0
  selector:
    matchLabels:
      app: spark
      component: worker-streaming
      worker-node: worker2
  template:
    metadata:
      labels:
        app: spark
        component: worker-streaming
        worker-node: worker2
    spec:
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "spark-opensearch"
          effect: "NoSchedule"
      nodeSelector:
        kubernetes.io/hostname: worker2.local
      containers:
        - name: spark-worker
          image: 192.168.1.50:30500/spark-gluten-velox:3.5.1-35
          imagePullPolicy: Always
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.worker.Worker
            - spark://spark-master-internal.prod.svc.cluster.local:17077
          env:
            - name: SPARK_WORKER_MEMORY
              value: "2g"
            - name: SPARK_WORKER_CORES
              value: "1"
            - name: SPARK_DAEMON_JAVA_OPTS
              value: "-Djava.security.krb5.conf=/etc/krb5.conf.d/cluster.conf"
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: krb5-conf
              mountPath: /etc/krb5.conf.d/cluster.conf
              subPath: krb5.conf
          resources:
            requests:
              cpu: "10m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "3500Mi"
      volumes:
        - name: krb5-conf
          configMap:
            name: kerberos-integration-config
            items:
              - key: krb5.conf
                path: krb5.conf

