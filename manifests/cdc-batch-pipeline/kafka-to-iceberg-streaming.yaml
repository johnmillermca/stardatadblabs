apiVersion: v1
kind: ConfigMap
metadata:
  name: schema-evolution-handler-script
  namespace: prod
  labels:
    app: schema-evolution-handler
    pipeline.type: ddl-handler
data: {}
# NOTE: 04_schema_evolution_handler.py is baked into the Docker image as of
# 3.5.1-18 (COPY in Dockerfile step 36). This ConfigMap is retained for
# compatibility but its data is intentionally empty — the image provides the
# script. The volume mount below is also removed.

---
# ─────────────────────────────────────────────────────────────────────────────
# schema-evolution-handler
#
# Runs 04_schema_evolution_handler.py — watches schema-changes.* Kafka topics
# and auto-applies ALTER TABLE to Iceberg when Debezium publishes a DDL event.
# Also used by starpump.py for its own schema evolution path.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: schema-evolution-handler
    pipeline.type: ddl-handler
  name: schema-evolution-handler
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schema-evolution-handler
  template:
    metadata:
      labels:
        app: schema-evolution-handler
        pipeline.type: ddl-handler
    spec:
      containers:
      - command:
        - /bin/bash
        - -c
        - 'cd /opt/spark/work-dir && \

          exec python3 04_schema_evolution_handler.py

          '
        env:
        - name: USER
          value: dave
        - name: SPARK_USER
          value: dave
        - name: SOURCE
          value: ''
        - name: DRY_RUN
          value: '0'
        - name: ADDR
          valueFrom:
            configMapKeyRef:
              key: ADDR
              name: kafka-to-iceberg-config
        image: 192.168.1.50:30500/spark-gluten-velox:3.5.1-26
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - pgrep
            - -f
            - 04_schema_evolution_handler.py
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        name: schema-evolution-handler
        ports:
        - containerPort: 8090
          name: health
          protocol: TCP
        resources:
          limits:
            cpu: '1'
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
      restartPolicy: Always
      serviceAccountName: spark-cleanup
      terminationGracePeriodSeconds: 30