# =============================================================================
# STREAMING DEPLOYMENTS — 3 write modes, each pinned to its own worker node.
#   standard         → worker2.local  (spark-worker-streaming-worker2)
#   soft-delete      → worker3.local  (spark-worker-streaming-worker3)
#   history-tracking → worker4.local  (spark-worker-streaming-worker4)
# Each app: 1 core, 2g executor, dynamic allocation (drops to 0 when idle).
# =============================================================================

# ── standard: SCD Type 0 — MERGE upsert + hard delete ────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-to-iceberg-standard
  namespace: prod
  labels:
    app: kafka-to-iceberg
    pipeline.type: streaming
    pipeline.write-mode: standard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-to-iceberg
      pipeline.write-mode: standard
  template:
    metadata:
      labels:
        app: kafka-to-iceberg
        pipeline.write-mode: standard
    spec:
      restartPolicy: Always
      serviceAccountName: spark-cleanup
      terminationGracePeriodSeconds: 90
      nodeSelector:
        kubernetes.io/hostname: worker2.local
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "spark-opensearch"
          effect: "NoSchedule"
      containers:
        - name: kafka-to-iceberg
          image: 192.168.1.50:30500/spark-gluten-velox:3.5.1-35
          imagePullPolicy: Always
          command: ["python3", "/opt/spark/work-dir/05_kafka_to_iceberg_streaming.py"]
          env:
            - name: USER
              value: dave
            - name: SPARK_USER
              value: dave
            - name: WRITE_MODE
              value: standard
            # No SOURCE — runs all sources (postgres + oracle + mongodb) in one app
            - name: DISABLE_GLUTEN
              value: "1"
            - name: HEALTH_PORT
              value: "8081"
            - name: TRIGGER_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: TRIGGER_INTERVAL
            - name: MAX_OFFSETS_PER_TRIGGER
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: MAX_OFFSETS_PER_TRIGGER
            - name: MAX_RESTART_ATTEMPTS
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: MAX_RESTART_ATTEMPTS
            - name: RESTART_BACKOFF_BASE_S
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: RESTART_BACKOFF_BASE_S
            - name: RESTART_BACKOFF_MAX_S
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: RESTART_BACKOFF_MAX_S
            - name: DRY_RUN
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: DRY_RUN
            - name: ADDR
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: ADDR
            - name: MERGE_PARALLELISM
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: MERGE_PARALLELISM
            - name: COALESCE_BEFORE_MERGE
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: COALESCE_BEFORE_MERGE
            - name: ADAPTIVE_COALESCE_TARGET
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: ADAPTIVE_COALESCE_TARGET
            - name: TARGET_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: TARGET_NAMESPACE
            - name: EXECUTOR_INSTANCES
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: EXECUTOR_INSTANCES
            - name: EXECUTOR_CORES
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: EXECUTOR_CORES
            - name: EXECUTOR_MEMORY
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: EXECUTOR_MEMORY
            - name: EXECUTOR_OFFHEAP
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: EXECUTOR_OFFHEAP
            - name: MAX_EXECUTORS
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: MAX_EXECUTORS
            - name: BURST_BACKLOG_TIMEOUT_S
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: BURST_BACKLOG_TIMEOUT_S
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: JAVA_TOOL_OPTIONS
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2500Mi"
              cpu: "1"

