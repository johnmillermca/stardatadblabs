# =============================================================================
# kafka-to-iceberg-streaming.yaml
#
# Kubernetes Deployment + ConfigMap for the Kafka→Iceberg CDC streaming consumer.
#
# Three write modes are supported, one Deployment per mode:
#
#   kafka-to-iceberg-standard         — SCD Type 0, MERGE + hard delete
#   kafka-to-iceberg-soft-delete      — MERGE upsert, soft-delete flag on DELETE
#   kafka-to-iceberg-history-tracking — append-only, full row history
#
# Only ONE Deployment should be active at a time (they all consume from the same
# Kafka topics).  Use kubectl scale to enable/disable:
#
#   kubectl scale deployment kafka-to-iceberg-standard -n prod --replicas=1
#   kubectl scale deployment kafka-to-iceberg-soft-delete -n prod --replicas=0
#   kubectl scale deployment kafka-to-iceberg-history-tracking -n prod --replicas=0
#
# Script delivery
# ───────────────
# 05_kafka_to_iceberg_streaming.py is NOT baked into the spark-gluten-velox
# image.  As of 3.5.1-18, the script is baked directly into the Docker image.
# mounted into every pod at /opt/spark/work-dir/05_kafka_to_iceberg_streaming.py
# (overlaying the image filesystem at that path).
# To update the script: modify scripts/05_kafka_to_iceberg_streaming.py and
#   --from-file=... --dry-run=client -o yaml | kubectl apply -f -
# Running pods pick up the new version on their next restart.
#
# Auto-restart
# ─────────────
# Kubernetes restartPolicy (built into Deployment): Always.
# The Python script runs an infinite internal retry loop (MAX_RESTART_ATTEMPTS=0).
# A liveness probe on HEALTH_PORT (8080) detects when all Spark streaming queries
# are dead and the process is stuck in a backoff spiral — Kubernetes kills and
# restarts the pod after failureThreshold * periodSeconds (default: 3 × 30s = 90s).
#
# Namespaces: prod
# =============================================================================

# ── ConfigMap: shared streaming config ───────────────────────────────────────

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-to-iceberg-config
  namespace: prod
  labels:
    app: kafka-to-iceberg
    pipeline.type: streaming
data:
  SPARK_USER:              "dave"
  TRIGGER_INTERVAL:        "2 seconds"
  MAX_OFFSETS_PER_TRIGGER: "50000"
  MAX_RESTART_ATTEMPTS:    "0"
  HEALTH_PORT:             "8080"
  RESTART_BACKOFF_BASE_S:  "5"
  RESTART_BACKOFF_MAX_S:   "120"
  DRY_RUN:                 "0"
  ADDR:                    "http://openbao.prod.svc.cluster.local:8200"
  # Peak-hour performance tuning
  # MERGE_PARALLELISM: shuffle partitions for MERGE ops (1-1000 row CDC batches stay at 4;
  # raise to 16-32 only for bulk-load catch-up scenarios)
  MERGE_PARALLELISM:            "4"
  # COALESCE_BEFORE_MERGE: 1 is optimal for low-row-count CDC batches (avoids shuffle overhead)
  COALESCE_BEFORE_MERGE:        "1"
  # ADAPTIVE_COALESCE_TARGET: AQE target bytes per post-shuffle partition (64 MB)
  ADAPTIVE_COALESCE_TARGET:     "67108864"
  # EXECUTOR_INSTANCES / EXECUTOR_CORES / EXECUTOR_MEMORY / EXECUTOR_OFFHEAP:
  # Keep at 1x1 core for normal CDC streaming — micro-batches are tiny (1-1000 rows).
  EXECUTOR_INSTANCES:           "1"
  EXECUTOR_CORES:               "1"
  EXECUTOR_MEMORY:              "2g"
  # 1500m matches the Gluten/Velox off-heap requirement set by bao_spark_init.
  # The streaming script guards against overwriting this with a lower value when
  # Gluten is active — raise above 1500m only if Velox needs more headroom.
  EXECUTOR_OFFHEAP:             "1500m"
  # MAX_EXECUTORS: ceiling for dynamic allocation burst (default 3).
  # At idle = 0 executors; normal CDC = 1; sustained backlog >60s = up to 3.
  MAX_EXECUTORS:                "3"
  # BURST_BACKLOG_TIMEOUT_S: seconds of sustained task backlog before adding a
  # 2nd (then 3rd) executor. Default 60 — waits 1 minute before bursting.
  BURST_BACKLOG_TIMEOUT_S:      "60"
  # TARGET_NAMESPACE: when set, overrides the Iceberg namespace derived from the Kafka topic
  # for ALL sources (postgres + oracle + mongodb) so every table lands in one namespace.
  # Leave empty "" — each topic routes to its own namespace (cache_testing/tpcds).
  # E2E testing only: set to "e2e_testing" so all three databases write into e2e_testing.
  #   postgres.cache_testing.customers → postgres.e2e_testing.customers
  #   oracle.cache_testing.CUSTOMERS   → oracle.e2e_testing.customers
  #   mongodb.cache_testing.customers  → mongodb.e2e_testing.customers
  TARGET_NAMESPACE:             ""
  # JVM DNS caching fix — prevents Java from caching DNS failures/successes forever.
  # Without this, if the Kafka broker DNS is unresolvable at JVM startup (e.g. during
  # rolling restarts or broker pod churn), Java permanently caches the failure for the
  # lifetime of the JVM and never retries — even though Python/OS DNS resolves fine.
  # networkaddress.cache.ttl=30        → re-resolve successful lookups every 30s
  # networkaddress.cache.negative.ttl=5 → retry failed lookups after 5s (not forever)
  JAVA_TOOL_OPTIONS: >-
    -Dsun.net.inetaddr.ttl=30
    -Dsun.net.inetaddr.negative.ttl=5
    -Dnetworkaddress.cache.ttl=30
    -Dnetworkaddress.cache.negative.ttl=5

# ── ConfigMap: streaming script (managed by ArgoCD) ──────────────────────────

