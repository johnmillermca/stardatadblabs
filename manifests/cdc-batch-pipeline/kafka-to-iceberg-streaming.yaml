# =============================================================================
# schema-evolution-handler — ConfigMap + Deployment
#
# Watches schema-changes.postgres / schema-changes.oracle-cache-testing /
# schema-changes.mongodb Kafka topics and applies ALTER TABLE DDL to Iceberg
# whenever Debezium publishes a DDL event.
#
# Dual-layer DDL defence:
#   Layer 1 (this pod)  — reactive: fires when Debezium emits a DDL event on
#                         the schema-changes.* topic (Kafka-side handler).
#   Layer 2 (streaming) — proactive: each streaming pod checks DESCRIBE TABLE
#                         vs batch schema before every MERGE and self-heals any
#                         missing columns inline (schema-cache invalidation guard).
#
# Script delivery: 04_schema_evolution_handler.py is NOT baked into the image.
#   It is delivered via the schema-evolution-handler-script ConfigMap and mounted
#   at /opt/spark/work-dir/04_schema_evolution_handler.py — same pattern as the
#   streaming script ConfigMap (kafka-to-iceberg-script).
#   Update via: kubectl create configmap schema-evolution-handler-script \
#     --from-file=04_schema_evolution_handler.py=docker/spark-gluten-velox/scripts/04_schema_evolution_handler.py \
#     -n prod --dry-run=client -o yaml | kubectl apply -f -
# =============================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: schema-evolution-handler-script
  namespace: prod
  labels:
    app: schema-evolution-handler
    pipeline.type: ddl-handler
binaryData: {}
data: {}
# NOTE: This ConfigMap is populated from the file on disk by kubectl/ArgoCD.
# The actual content of 04_schema_evolution_handler.py is managed outside this
# YAML because inlining 546 lines of Python inside YAML causes merge conflicts.
# On initial cluster setup (or after image rebuild), run:
#   kubectl create configmap schema-evolution-handler-script \
#     --from-file=04_schema_evolution_handler.py=\
#       docker/spark-gluten-velox/scripts/04_schema_evolution_handler.py \
#     -n prod --dry-run=client -o yaml | kubectl apply -f -

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-evolution-handler
  namespace: prod
  labels:
    app: schema-evolution-handler
    pipeline.type: ddl-handler
  annotations:
    pipeline.description: >-
      Watches schema-changes.postgres / schema-changes.oracle-cache-testing /
      schema-changes.mongodb Kafka topics. On each Debezium DDL event, fetches
      the new Avro schema from Schema Registry, diffs against the previous
      version, and applies ALTER TABLE to the target Iceberg table.
      Runs as user dave (can_admin_catalog=true, can_write_iceberg=true).
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schema-evolution-handler
  template:
    metadata:
      labels:
        app: schema-evolution-handler
        pipeline.type: ddl-handler
    spec:
      restartPolicy: Always
      serviceAccountName: spark-cleanup
      terminationGracePeriodSeconds: 30
      containers:
        - name: schema-evolution-handler
          image: 192.168.1.50:30500/spark-gluten-velox:3.5.1-15
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              cd /opt/spark/work-dir && \
              exec python3 04_schema_evolution_handler.py
          ports:
            - name: health
              containerPort: 8090
              protocol: TCP
          # Liveness: the handler runs an infinite Kafka consumer loop.
          # No HTTP health server — use process-existence check via exec probe.
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - 04_schema_evolution_handler.py
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          env:
            - name: USER
              value: dave
            - name: SPARK_USER
              value: dave
            # SOURCE: leave unset → all three sources (postgres + oracle + mongodb).
            # Set to "postgres", "oracle", or "mongodb" to restrict to one source.
            - name: SOURCE
              value: ""
            - name: DRY_RUN
              value: "0"
            - name: ADDR
              valueFrom:
                configMapKeyRef:
                  name: kafka-to-iceberg-config
                  key: ADDR
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
          volumeMounts:
            - name: evolution-handler-script
              mountPath: /opt/spark/work-dir/04_schema_evolution_handler.py
              subPath: 04_schema_evolution_handler.py
              readOnly: true
      volumes:
        - name: evolution-handler-script
          configMap:
            name: schema-evolution-handler-script
