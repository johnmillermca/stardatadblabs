# =============================================================================
# Apache Ranger — ConfigMap + PVC + Deployment + Service
# Namespace : prod
# Node      : master.local (pinned — freeing worker capacity)
# Access    : http://192.168.1.50:30680 (Admin UI / port 6080)
# Depends on: PostgreSQL databases.postgresql:5432, db: ranger
# Image     : 192.168.1.50:30500/apache-ranger:2.7.0
# Secret    : ranger-db-credentials (seeded by 12-seed-openbao-secrets.sh)
# PVC       : 5Gi on /home (master.local)
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ranger-install-config
  namespace: prod
data:
  install.properties: |
    DB_FLAVOR=POSTGRES
    SQL_CONNECTOR_JAR=/usr/share/java/postgresql.jar
    db_root_user=postgres
    db_host=postgresql.prod.svc.cluster.local
    db_port=5432
    db_name=ranger
    db_user=${RANGER_DB_USER}
    db_password=${RANGER_DB_PASS}
    db_root_password=${RANGER_DB_ROOT_PASS}
    rangerAdmin_password=${RANGER_ADMIN_PASSWORD}
    rangerTagsync_password=${RANGER_TAGSYNC_PASSWORD}
    rangerUsersync_password=${RANGER_USERSYNC_PASSWORD}
    keyadmin_password=${RANGER_KEYADMIN_PASSWORD}
    POLICY_MGR_URL=http://ranger-admin.prod.svc.cluster.local:6080
    XAAUDIT.HDFS.ENABLE=false
    XAAUDIT.SOLR.ENABLE=false
    XAAUDIT.ELASTICSEARCH.ENABLE=false
    unix_user=ranger
    unix_group=ranger
    hadoop_conf=/etc/hadoop/conf
    mysql_core_file=db/mysql/xa_core_db.sql
    oracle_core_file=db/oracle/xa_core_db_oracle.sql
    postgres_core_file=db/postgres/xa_core_db_postgres.sql
    sqlserver_core_file=db/sqlserver/xa_core_db_sqlserver.sql
    sqlanywhere_core_file=db/sqlanywhere/xa_core_db_sqlanywhere.sql

  ranger-admin-site-perf-patch.xml: |
    <!--
    Performance-critical Ranger Admin settings for TB-scale concurrent loads.

    Design: Ranger plugins cache all policies locally and evaluate them IN-PROCESS
    (no network call per query). The Admin server is only contacted every
    ranger.plugin.policy.pollIntervalMs (30 000 ms) to refresh the cache.
    These settings ensure the Admin can serve many simultaneous plugin poll
    requests without exhausting its DB connection pool or JVM heap.
    -->
    <configuration>
      <!-- DB connection pool: enough for all plugin services polling in parallel.
           8 services × 2 connections each = 16; add 4 for UI/API headroom. -->
      <property>
        <name>ranger.jpa.jdbc.maxpoolsize</name>
        <value>20</value>
      </property>
      <property>
        <name>ranger.jpa.jdbc.minpoolsize</name>
        <value>5</value>
      </property>
      <!-- Keep idle connections alive to avoid reconnect overhead mid-load. -->
      <property>
        <name>ranger.jpa.jdbc.maxidletime</name>
        <value>600</value>
      </property>
      <!-- Async audit: audit writes never block the policy-decision path.
           Audit events are queued in memory and flushed to the DB in a
           background thread — zero latency added to data queries. -->
      <property>
        <name>ranger.async.audit.worker.pool.size</name>
        <value>4</value>
      </property>
      <property>
        <name>ranger.async.audit.queue.size</name>
        <value>10000</value>
      </property>
      <!-- Policy download pagination: large policy sets are served in pages
           to avoid single mega-responses that stall Tomcat request threads. -->
      <property>
        <name>ranger.policyengine.trie.prefilter.enabled</name>
        <value>true</value>
      </property>
      <!-- JVM: prefer G1GC for large heap, reduces stop-the-world pauses
           during peak policy cache reload storms. Set in JAVA_OPTS below. -->
    </configuration>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ranger-data
  namespace: prod
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranger-admin
  namespace: prod
  labels:
    app: ranger-admin
spec:
  replicas: 1
  # Recreate is required: RWO PVC can only be mounted by one pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ranger-admin
  template:
    metadata:
      labels:
        app: ranger-admin
    spec:
      nodeSelector:
        kubernetes.io/hostname: master.local
      # 60s: allows Ranger/Tomcat to flush audit logs and close DB connections cleanly.
      terminationGracePeriodSeconds: 60
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: ranger-admin
          image: 192.168.1.50:30500/apache-ranger:2.7.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              ADMIN_HOME=$(ls -d /opt/ranger/ranger-*-admin | head -1)
              CLASSES=${ADMIN_HOME}/ews/webapp/WEB-INF/classes
              CONF=${CLASSES}/conf

              # Create required dirs
              mkdir -p ${ADMIN_HOME}/ews/logs
              mkdir -p ${CONF}

              # Copy conf.dist -> conf on first run.
              # MUST happen before the XML patch below so that ranger-admin-site.xml exists.
              if [ -d "${CONF}.dist" ]; then
                cp -rn ${CONF}.dist/. ${CONF}/
              fi

              # EmbeddedServerUtil always loads core-site.xml from classpath (conf/).
              # It does not exist in the Ranger distribution — create a minimal one.
              if [ ! -f "${CONF}/core-site.xml" ]; then
                printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<configuration>' '</configuration>' > ${CONF}/core-site.xml
              fi

              # PostgreSQL JDBC driver must be in WEB-INF/lib/ for the Tomcat webapp classloader.
              WEBAPP_LIB=${ADMIN_HOME}/ews/webapp/WEB-INF/lib
              if [ ! -f "${WEBAPP_LIB}/postgresql.jar" ]; then
                cp /usr/share/java/postgresql.jar ${WEBAPP_LIB}/postgresql.jar
              fi

              # Patch ranger-admin-site.xml with PostgreSQL JDBC settings.
              # Uses upsert logic: updates existing keys and INSERTS missing ones
              # (e.g. ranger.jpa.jdbc.dialect is absent from the stock distribution XML).
              # This block runs AFTER conf.dist is copied so ${SITE} is guaranteed to exist.
              SITE=${CONF}/ranger-admin-site.xml
              DB_URL="jdbc:postgresql://${RANGER_DB_HOST:-postgresql.prod.svc.cluster.local}:${RANGER_DB_PORT:-5432}/${RANGER_DB_NAME:-ranger}"
              python3 - <<PYEOF
              import xml.etree.ElementTree as ET
              tree = ET.parse('${SITE}')
              root = tree.getroot()
              patches = {
                'ranger.jpa.jdbc.driver':    'org.postgresql.Driver',
                'ranger.jpa.jdbc.url':       '${DB_URL}',
                'ranger.jpa.jdbc.user':      '${RANGER_DB_USER}',
                'ranger.jpa.jdbc.password':  '${RANGER_DB_PASS}',
                'ranger.jpa.jdbc.dialect':   'org.eclipse.persistence.platform.database.PostgreSQLPlatform',
                'ranger.jpa.showsql':        'false',
                # Performance: DB connection pool sizing for TB-scale plugin polling
                'ranger.jpa.jdbc.maxpoolsize':  '20',
                'ranger.jpa.jdbc.minpoolsize':  '5',
                'ranger.jpa.jdbc.maxidletime':  '600',
                # Async audit: audit writes queue in memory, never block policy decisions
                'ranger.async.audit.worker.pool.size': '4',
                'ranger.async.audit.queue.size':       '10000',
                # Trie prefilter: fast policy evaluation using prefix tree
                'ranger.policyengine.trie.prefilter.enabled': 'true',
                # ── Kerberos SPNEGO for Ranger Admin UI ──────────────────────
                # Enables negotiate/SPNEGO so browsers and curl can authenticate
                # using Kerberos tickets. Uses svc/ranger principal from KDC.
                # ── Kerberos SPNEGO for Ranger Admin UI ──────────────────────────
                # ranger-spnego-keytab is mounted (HTTP/ranger-admin@REALM).
                # To disable: set to 'false' and restart ranger-admin.
                'ranger.spnego.kerberos.enabled':      'true',
                'ranger.spnego.kerberos.principal':    'HTTP/ranger-admin.prod.svc.cluster.local@STARDATADBLABS.LOCAL',
                'ranger.spnego.kerberos.keytab':       '/etc/security/keytabs/ranger.service.keytab',
                'ranger.krb.browser-useragents.regex': 'Mozilla,Opera,Chrome',
              }
              existing = {p.find('name').text: p for p in root.findall('property') if p.find('name') is not None}
              for k, v in patches.items():
                  if k in existing:
                      val = existing[k].find('value')
                      if val is not None: val.text = v
                  else:
                      prop = ET.SubElement(root, 'property')
                      ET.SubElement(prop, 'name').text  = k
                      ET.SubElement(prop, 'value').text = v
              tree.write('${SITE}', xml_declaration=True, encoding='UTF-8')
              PYEOF

              # Spring loads classpath:ranger-admin-site.xml (root of WEB-INF/classes/)
              # so symlink conf/ XMLs to classes/ root.
              ln -sf ${CONF}/ranger-admin-site.xml          ${CLASSES}/ranger-admin-site.xml
              ln -sf ${CONF}/ranger-admin-default-site.xml  ${CLASSES}/ranger-admin-default-site.xml
              ln -sf ${CONF}/security-applicationContext.xml ${CLASSES}/security-applicationContext.xml

              # db_setup.py runs on first boot (no .setup_done marker).
              # On subsequent restarts it is skipped — all schema/patches are already in PG.
              if [ ! -f "/opt/ranger/data/.setup_done" ]; then
                echo "[init] First boot — running db_setup.py..."
                cd ${ADMIN_HOME}
                cp /opt/ranger/install.properties ${ADMIN_HOME}/install.properties
                python3 db_setup.py || true
                touch /opt/ranger/data/.setup_done
                echo "[init] db_setup.py complete."
              fi

              # ── Performance: set JAVA_OPTS for G1GC + large heap before Tomcat starts.
              # G1GC reduces stop-the-world pause time on the 4Gi heap vs. default
              # ParallelGC, which is critical when 8 plugins simultaneously poll for
              # policy updates while a TB-scale load is running.
              export JAVA_OPTS="-Xms1g -Xmx3500m \
                -XX:+UseG1GC \
                -XX:G1HeapRegionSize=16m \
                -XX:MaxGCPauseMillis=200 \
                -XX:+ParallelRefProcEnabled \
                -Djava.security.egd=file:/dev/./urandom"
              export RANGER_ADMIN_JAVA_OPTS="${JAVA_OPTS}"

              ${ADMIN_HOME}/ews/ranger-admin-services.sh start
              # Block: tail the Tomcat log so the container stays alive.
              # Wait up to 30s for the log file to appear before falling back to sleep.
              LOG_WAIT=0
              while [ ! -f ${ADMIN_HOME}/ews/logs/ranger-admin-*.log ] && [ $LOG_WAIT -lt 30 ]; do
                sleep 1; LOG_WAIT=$((LOG_WAIT+1))
              done
              exec tail -f ${ADMIN_HOME}/ews/logs/ranger-admin-*.log 2>/dev/null || exec sleep infinity
          ports:
            - name: http
              containerPort: 6080
          env:
            - name: RANGER_DB_USER
              valueFrom:
                secretKeyRef:
                  name: ranger-db-credentials
                  key: db-user
            - name: RANGER_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: ranger-db-credentials
                  key: db-password
            - name: RANGER_DB_ROOT_PASS
              valueFrom:
                secretKeyRef:
                  name: ranger-db-credentials
                  key: db-root-password
            - name: RANGER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ranger-db-credentials
                  key: admin-password
            - name: RANGER_TAGSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ranger-db-credentials
                  key: tagsync-password
            - name: RANGER_USERSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ranger-db-credentials
                  key: usersync-password
            - name: RANGER_KEYADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ranger-db-credentials
                  key: keyadmin-password
          volumeMounts:
            - name: ranger-config
              mountPath: /opt/ranger/install.properties
              subPath: install.properties
            - name: ranger-data
              mountPath: /opt/ranger/data
            - name: ranger-spnego-keytab
              mountPath: /etc/security/keytabs/ranger.service.keytab
              subPath: ranger.service.keytab
          resources:
            requests:
              # Ranger Admin (Tomcat + EclipseLink JPA) needs at least 1.5Gi
              # under normal load. 512Mi causes GC pressure during policy sync
              # storms when many plugins poll simultaneously at TB-load time.
              memory: 1.5Gi
              cpu: 500m
            limits:
              # 4Gi headroom ensures policy cache (all services × all policies)
              # fits in heap without triggering GC during concurrent plugin polls.
              memory: 4Gi
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /
              port: 6080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
      volumes:
        - name: ranger-config
          configMap:
            name: ranger-install-config
        - name: ranger-data
          persistentVolumeClaim:
            claimName: ranger-data
        - name: ranger-spnego-keytab
          secret:
            secretName: ranger-spnego-keytab
---
apiVersion: v1
kind: Service
metadata:
  name: ranger-admin
  namespace: prod
spec:
  selector:
    app: ranger-admin
  type: NodePort
  ports:
    - name: http
      port: 6080
      targetPort: 6080
      nodePort: 30680
