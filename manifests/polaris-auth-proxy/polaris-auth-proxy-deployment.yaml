# =============================================================================
# Polaris Auth Proxy — Deployment + Service
# Namespace : prod
#
# Auto-refreshing OAuth2 token injector for Apache Polaris REST catalog.
#   :8282  — stargraph-writer principal  (read + write)
#   :8283  — stargraph-reader principal  (read-only)
#
# Credentials: injected from polaris-stargraph-credentials Kubernetes Secret.
# No OpenBao / Vault dependency.
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris-auth-proxy
  namespace: prod
  labels:
    app: polaris-auth-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: polaris-auth-proxy
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: polaris-auth-proxy
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: polaris-auth-proxy
          image: 192.168.1.50:30500/polaris-auth-proxy:1.0.0
          imagePullPolicy: Always
          command: ["python", "/app/polaris_auth_proxy.py"]
          env:
            - name: POLARIS_URL
              value: "http://polaris-rest.prod.svc.cluster.local:8181"
            - name: TOKEN_REFRESH_BUFFER_S
              value: "300"
            - name: PORT_WRITER
              value: "8282"
            - name: PORT_READER
              value: "8283"
            # Credentials from polaris-stargraph-credentials Kubernetes Secret
            - name: POLARIS_READER_ID
              valueFrom:
                secretKeyRef:
                  name: polaris-stargraph-credentials
                  key: reader_id
            - name: POLARIS_READER_SECRET
              valueFrom:
                secretKeyRef:
                  name: polaris-stargraph-credentials
                  key: reader_secret
            - name: POLARIS_WRITER_ID
              valueFrom:
                secretKeyRef:
                  name: polaris-stargraph-credentials
                  key: writer_id
            - name: POLARIS_WRITER_SECRET
              valueFrom:
                secretKeyRef:
                  name: polaris-stargraph-credentials
                  key: writer_secret
          ports:
            - name: writer
              containerPort: 8282
            - name: reader
              containerPort: 8283
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          readinessProbe:
            tcpSocket:
              port: 8283
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8283
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
