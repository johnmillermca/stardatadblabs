# =============================================================================
# Deployment: debezium-connect-postgres
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium-connect-postgres
  namespace: prod
  labels:
    app: debezium-connect-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: debezium-connect-postgres
  template:
    metadata:
      labels:
        app: debezium-connect-postgres
    spec:
      serviceAccountName: default
      nodeSelector:
        kubernetes.io/hostname: worker2.local
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: fetch-secrets
          image: python:3.11-slim
          command: [python3, /scripts/fetch-secrets.py]
          env:
            - name: BAO_ADDR
              value: "http://openbao.prod.svc.cluster.local:8200"
            - name: BAO_ROLE
              value: "platform-secrets-read"
            - name: OUT_FILE
              value: "/vault-env/creds.sh"
          volumeMounts:
            - name: vault-env
              mountPath: /vault-env
            - name: fetch-secrets-script
              mountPath: /scripts
      containers:
        - name: debezium-connect
          image: 192.168.1.50:30500/debezium/connect:2.7.4-lc1
          imagePullPolicy: Always
          command:
            - bash
            - -c
            - |
              source /vault-env/creds.sh
              exec /docker-entrypoint.sh start
          ports:
            - name: rest-api
              containerPort: 8083
          env:
            - name: BOOTSTRAP_SERVERS
              value: "strimzi-kafka-kafka-bootstrap.prod.svc.cluster.local:9092"
            - name: GROUP_ID
              value: "debezium-pg-cluster"
            - name: CONNECT_SECURITY_PROTOCOL
              value: "SASL_PLAINTEXT"
            - name: CONNECT_SASL_MECHANISM
              value: "SCRAM-SHA-512"
            - name: CONNECT_PRODUCER_SECURITY_PROTOCOL
              value: "SASL_PLAINTEXT"
            - name: CONNECT_PRODUCER_SASL_MECHANISM
              value: "SCRAM-SHA-512"
            - name: CONNECT_CONSUMER_SECURITY_PROTOCOL
              value: "SASL_PLAINTEXT"
            - name: CONNECT_CONSUMER_SASL_MECHANISM
              value: "SCRAM-SHA-512"
            - name: CONFIG_STORAGE_TOPIC
              value: "debezium-pg-configs"
            - name: OFFSET_STORAGE_TOPIC
              value: "debezium-pg-offsets"
            - name: STATUS_STORAGE_TOPIC
              value: "debezium-pg-statuses"
            - name: KEY_CONVERTER
              value: "io.confluent.connect.avro.AvroConverter"
            - name: CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL
              value: "http://schema-registry.prod.svc.cluster.local:8081"
            - name: VALUE_CONVERTER
              value: "io.confluent.connect.avro.AvroConverter"
            - name: CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL
              value: "http://schema-registry.prod.svc.cluster.local:8081"
            - name: CONNECT_CONFIG_PROVIDERS
              value: "env"
            - name: CONNECT_CONFIG_PROVIDERS_ENV_CLASS
              value: "org.apache.kafka.common.config.provider.EnvVarConfigProvider"
          volumeMounts:
            - name: debezium-data-postgres
              mountPath: /kafka/data
            - name: vault-env
              mountPath: /vault-env
              readOnly: true

          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /connectors
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /connectors
              port: 8083
            initialDelaySeconds: 90
            periodSeconds: 20
      volumes:
        - name: debezium-data-postgres
          persistentVolumeClaim:
            claimName: debezium-data-postgres
        - name: vault-env
          emptyDir: {}
        - name: fetch-secrets-script
          configMap:
            name: debezium-fetch-secrets-script

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: debezium-data-postgres
  namespace: prod
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: debezium-connect-postgres
  namespace: prod
spec:
  selector:
    app: debezium-connect-postgres
  type: NodePort
  ports:
    - name: rest-api
      port: 8083
      targetPort: 8083
      nodePort: 30083

