# =============================================================================
# ConfigMap: fetch-secrets init script (shared by all 3 Connect deployments)
#
# Runs as an init container on every pod start.
# Authenticates to OpenBao via K8s Service Account JWT, reads all credentials,
# and writes /vault-env/creds.sh — sourced by the main container before
# the Debezium entrypoint starts.
#
# File permissions: 0o644 so the Debezium container user (non-root) can read it.
#
# This means passwords are ALWAYS current from OpenBao — no K8s Secret copy,
# no manual sync, no stale credentials after rotation.
#
# ARCHITECTURE: 3 isolated Connect workers — one per source.
#   debezium-connect-postgres  (GROUP_ID=debezium-pg-cluster,   port 8083, nodePort 30083)
#   debezium-connect-oracle    (GROUP_ID=debezium-ora-cluster,  port 8084, nodePort 30084)
#   debezium-connect-mongodb   (GROUP_ID=debezium-mgo-cluster,  port 8085, nodePort 30085)
#
# Benefit: an Oracle archived-log crash cannot affect the PostgreSQL or MongoDB
# workers — each worker is fully isolated with its own Kafka storage topics,
# offset tracking, and process boundary.
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium-fetch-secrets-script
  namespace: prod
data:
  fetch-secrets.py: |
    #!/usr/bin/env python3
    """
    Init container: fetch credentials from OpenBao and write /vault-env/creds.sh.
    Sourced by the Debezium container before entrypoint — exports:
      CONNECT_SASL_JAAS_CONFIG
      CONNECT_PRODUCER_SASL_JAAS_CONFIG
      CONNECT_CONSUMER_SASL_JAAS_CONFIG
      PG_PASSWORD, ORACLE_PASSWORD, MONGO_PASSWORD

    Permissions: 0o644 so the non-root Debezium container user can source it.
    """
    import os, json, urllib.request, urllib.error, sys

    BAO_ADDR   = os.environ["BAO_ADDR"]
    BAO_ROLE   = os.environ["BAO_ROLE"]
    AUTH_PATH  = os.environ.get("BAO_AUTH_PATH", "auth/kubernetes/login")
    JWT_PATH   = os.environ.get("K8S_JWT_PATH", "/var/run/secrets/kubernetes.io/serviceaccount/token")
    OUT_FILE   = os.environ.get("OUT_FILE", "/vault-env/creds.sh")

    def bao_post(path, payload):
        req = urllib.request.Request(
            f"{BAO_ADDR}/v1/{path}",
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json"},
        )
        with urllib.request.urlopen(req, timeout=10) as r:
            return json.loads(r.read())

    def bao_get(token, path):
        req = urllib.request.Request(
            f"{BAO_ADDR}/v1/{path}",
            headers={"X-Vault-Token": token},
        )
        with urllib.request.urlopen(req, timeout=10) as r:
            return json.loads(r.read())["data"]["data"]

    jwt   = open(JWT_PATH).read().strip()
    token = bao_post(AUTH_PATH, {"role": BAO_ROLE, "jwt": jwt})["auth"]["client_token"]

    kafka  = bao_get(token, "secret/data/platform/kafka")
    pg     = bao_get(token, "secret/data/platform/postgres")
    oracle = bao_get(token, "secret/data/platform/oracle")
    mongo  = bao_get(token, "secret/data/platform/mongodb")

    dbu  = kafka["debezium_user"]
    dbp  = kafka["debezium_password"]
    jaas = f'org.apache.kafka.common.security.scram.ScramLoginModule required username="{dbu}" password="{dbp}";'

    lines = [
        "#!/bin/bash",
        f"export CONNECT_SASL_JAAS_CONFIG='{jaas}'",
        f"export CONNECT_PRODUCER_SASL_JAAS_CONFIG='{jaas}'",
        f"export CONNECT_CONSUMER_SASL_JAAS_CONFIG='{jaas}'",
        f"export PG_PASSWORD='{pg['password']}'",
        f"export ORACLE_APP_PASSWORD='{oracle['app_password']}'",
        f"export ORACLE_CDC_PASSWORD='{oracle['cdc_password']}'",
        f"export MONGO_PASSWORD='{mongo['password']}'",
    ]

    with open(OUT_FILE, "w") as f:
        f.write("\n".join(lines) + "\n")
    os.chmod(OUT_FILE, 0o644)
    print(f"Wrote {OUT_FILE} (permissions 0o644)", flush=True)

# =============================================================================
# Shared connect-distributed base config — included by each worker's ConfigMap
# (each worker overrides group.id and storage topics via env vars)
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium-connect-config-postgres
  namespace: prod
data:
  connect-distributed.properties: |
    bootstrap.servers=strimzi-kafka-kafka-bootstrap.prod.svc.cluster.local:9092
    group.id=debezium-pg-cluster

    security.protocol=SASL_PLAINTEXT
    sasl.mechanism=SCRAM-SHA-512
    sasl.jaas.config=placeholder

    producer.security.protocol=SASL_PLAINTEXT
    producer.sasl.mechanism=SCRAM-SHA-512
    producer.sasl.jaas.config=placeholder

    consumer.security.protocol=SASL_PLAINTEXT
    consumer.sasl.mechanism=SCRAM-SHA-512
    consumer.sasl.jaas.config=placeholder

    config.providers=env
    config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider

    config.storage.topic=debezium-pg-configs
    config.storage.replication.factor=1
    offset.storage.topic=debezium-pg-offsets
    offset.storage.replication.factor=1
    status.storage.topic=debezium-pg-statuses
    status.storage.replication.factor=1

    rest.host.name=0.0.0.0
    rest.port=8083

    key.converter=io.confluent.connect.avro.AvroConverter
    key.converter.schema.registry.url=http://schema-registry.prod.svc.cluster.local:8081
    value.converter=io.confluent.connect.avro.AvroConverter
    value.converter.schema.registry.url=http://schema-registry.prod.svc.cluster.local:8081

    plugin.path=/kafka/connect
---
