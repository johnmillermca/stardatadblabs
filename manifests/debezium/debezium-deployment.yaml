# =============================================================================
# ConfigMap: fetch-secrets init script
#
# Runs as an init container on every pod start.
# Authenticates to OpenBao via K8s Service Account JWT, reads all credentials,
# and writes /vault-env/creds.sh — sourced by the main container before
# the Debezium entrypoint starts.
#
# File permissions: 0o644 so the Debezium container user (non-root) can read it.
#
# This means passwords are ALWAYS current from OpenBao — no K8s Secret copy,
# no manual sync, no stale credentials after rotation.
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium-fetch-secrets-script
  namespace: prod
data:
  fetch-secrets.py: |
    #!/usr/bin/env python3
    """
    Init container: fetch credentials from OpenBao and write /vault-env/creds.sh.
    Sourced by the Debezium container before entrypoint — exports:
      CONNECT_SASL_JAAS_CONFIG
      CONNECT_PRODUCER_SASL_JAAS_CONFIG
      CONNECT_CONSUMER_SASL_JAAS_CONFIG
      PG_PASSWORD, ORACLE_PASSWORD, MONGO_PASSWORD

    Permissions: 0o644 so the non-root Debezium container user can source it.
    """
    import os, json, urllib.request, urllib.error, sys

    BAO_ADDR   = os.environ["BAO_ADDR"]
    BAO_ROLE   = os.environ["BAO_ROLE"]
    AUTH_PATH  = os.environ.get("BAO_AUTH_PATH", "auth/kubernetes/login")
    JWT_PATH   = os.environ.get("K8S_JWT_PATH", "/var/run/secrets/kubernetes.io/serviceaccount/token")
    OUT_FILE   = os.environ.get("OUT_FILE", "/vault-env/creds.sh")

    def bao_post(path, payload):
        req = urllib.request.Request(
            f"{BAO_ADDR}/v1/{path}",
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json"},
        )
        with urllib.request.urlopen(req, timeout=10) as r:
            return json.loads(r.read())

    def bao_get(token, path):
        req = urllib.request.Request(
            f"{BAO_ADDR}/v1/{path}",
            headers={"X-Vault-Token": token},
        )
        with urllib.request.urlopen(req, timeout=10) as r:
            return json.loads(r.read())["data"]["data"]

    # 1. Authenticate via K8s SA JWT
    jwt = open(JWT_PATH).read().strip()
    auth = bao_post(AUTH_PATH, {"role": BAO_ROLE, "jwt": jwt})
    token = auth["auth"]["client_token"]
    print("[fetch-secrets] OpenBao auth OK")

    # 2. Read all needed secrets
    kafka   = bao_get(token, "secret/data/platform/kafka")
    pg      = bao_get(token, "secret/data/platform/postgres")
    oracle  = bao_get(token, "secret/data/platform/oracle")
    mongodb = bao_get(token, "secret/data/platform/mongodb")

    kafka_user = kafka.get("debezium_user", "debezium-user")
    kafka_pass = kafka["debezium_password"]
    jaas = (
        f'org.apache.kafka.common.security.scram.ScramLoginModule required '
        f'username="{kafka_user}" password="{kafka_pass}";'
    )

    pg_pass     = pg.get("password", pg.get("pass", ""))
    oracle_pass = oracle.get("password", oracle.get("pass", ""))
    mongo_pass  = mongodb.get("password", mongodb.get("pass", ""))

    # 3. Write shell exports — sourced by the main container wrapper before entrypoint.
    #    The Debezium entrypoint converts CONNECT_* env vars to properties via sed,
    #    which handles the JAAS string correctly.
    #    Permissions 0o644 — Debezium runs as non-root (uid 1000) and must be able to read.
    lines = [
        "#!/bin/sh",
        "# Auto-generated by fetch-secrets init container — DO NOT EDIT",
        f"export CONNECT_SASL_JAAS_CONFIG='{jaas}'",
        f"export CONNECT_PRODUCER_SASL_JAAS_CONFIG='{jaas}'",
        f"export CONNECT_CONSUMER_SASL_JAAS_CONFIG='{jaas}'",
        f"export PG_PASSWORD='{pg_pass}'",
        f"export ORACLE_PASSWORD='{oracle_pass}'",
        f"export MONGO_PASSWORD='{mongo_pass}'",
    ]
    os.makedirs(os.path.dirname(OUT_FILE), exist_ok=True)
    with open(OUT_FILE, "w") as f:
        f.write("\n".join(lines) + "\n")
    os.chmod(OUT_FILE, 0o644)
    print(f"[fetch-secrets] Wrote {OUT_FILE} — kafka_user={kafka_user}, pg/oracle/mongo passwords set")


# =============================================================================
# Debezium Kafka Connect — ConfigMap + Deployment + Service
# Namespace : prod
# Node      : worker2.local (co-located with Kafka)
# Access    : http://192.168.1.54:30083 (REST API)
# Connects to: Kafka at strimzi-kafka-kafka-bootstrap.prod.svc.cluster.local:9092
# CDC sources: PostgreSQL (pgoutput), MongoDB, Oracle (LogMiner)
# Image     : 192.168.1.50:30500/debezium/connect:2.7.4-lc1
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium-connect-config
  namespace: prod
data:
  connect-distributed.properties: |
    bootstrap.servers=strimzi-kafka-kafka-bootstrap.prod.svc.cluster.local:9092
    group.id=debezium-connect-cluster

    security.protocol=SASL_PLAINTEXT
    sasl.mechanism=SCRAM-SHA-512
    sasl.jaas.config=placeholder

    producer.security.protocol=SASL_PLAINTEXT
    producer.sasl.mechanism=SCRAM-SHA-512
    producer.sasl.jaas.config=placeholder

    consumer.security.protocol=SASL_PLAINTEXT
    consumer.sasl.mechanism=SCRAM-SHA-512
    consumer.sasl.jaas.config=placeholder

    # ── EnvVar config provider ──────────────────────────────────────────────────
    # Connector JSON can use ${env:VAR_NAME} to resolve values at runtime from
    # environment variables (injected from K8s secrets).  This means the JAAS
    # config in connector configs is NEVER hardcoded — it always comes from the
    # CONNECT_PRODUCER_SASL_JAAS_CONFIG env var set by creds.sh.
    config.providers=env
    config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider

    # Internal Kafka Connect storage topics (single broker = replication.factor 1)
    config.storage.topic=debezium-configs
    config.storage.replication.factor=1
    offset.storage.topic=debezium-offsets
    offset.storage.replication.factor=1
    status.storage.topic=debezium-statuses
    status.storage.replication.factor=1

    # REST API
    rest.host.name=0.0.0.0
    rest.port=8083

    # Converters — Avro via Confluent Schema Registry
    key.converter=io.confluent.connect.avro.AvroConverter
    key.converter.schema.registry.url=http://schema-registry.prod.svc.cluster.local:8081
    value.converter=io.confluent.connect.avro.AvroConverter
    value.converter.schema.registry.url=http://schema-registry.prod.svc.cluster.local:8081

    # Plugin path — Debezium connector JARs are bundled in the image
    plugin.path=/kafka/connect
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium-connect
  namespace: prod
  labels:
    app: debezium-connect
spec:
  replicas: 1
  # Recreate is required: RWO PVC can only be mounted by one pod at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: debezium-connect
  template:
    metadata:
      labels:
        app: debezium-connect
    spec:
      serviceAccountName: default   # bound to platform-secrets-read OpenBao K8s auth role
      nodeSelector:
        kubernetes.io/hostname: worker2.local
      terminationGracePeriodSeconds: 60

      # ── Init container: fetch all credentials from OpenBao at startup ─────────
      # Writes /vault-env/creds.sh (permissions 0o644) which the main container
      # sources before exec'ing the entrypoint.  Every pod restart = fresh passwords.
      # No K8s Secret copy needed — OpenBao is the only source of truth.
      initContainers:
        - name: fetch-secrets
          image: python:3.11-slim
          command:
            - python3
            - /scripts/fetch-secrets.py
          env:
            - name: BAO_ADDR
              value: "http://openbao.prod.svc.cluster.local:8200"
            - name: BAO_ROLE
              value: "platform-secrets-read"
            - name: BAO_AUTH_PATH
              value: "auth/kubernetes/login"
            - name: K8S_JWT_PATH
              value: "/var/run/secrets/kubernetes.io/serviceaccount/token"
            - name: OUT_FILE
              value: "/vault-env/creds.sh"
          volumeMounts:
            - name: vault-env
              mountPath: /vault-env
            - name: fetch-secrets-script
              mountPath: /scripts

      containers:
        - name: debezium-connect
          image: 192.168.1.50:30500/debezium/connect:2.7.4-lc1
          imagePullPolicy: Always
          # Source creds.sh before the entrypoint — this exports CONNECT_SASL_JAAS_CONFIG,
          # CONNECT_PRODUCER_SASL_JAAS_CONFIG, CONNECT_CONSUMER_SASL_JAAS_CONFIG which the
          # Debezium entrypoint's CONNECT_* -> properties loop replaces the placeholder values with.
          command:
            - bash
            - -c
            - |
              source /vault-env/creds.sh
              exec /docker-entrypoint.sh start
          ports:
            - name: rest-api
              containerPort: 8083
          env:
            # Static config — no secrets here
            - name: BOOTSTRAP_SERVERS
              value: "strimzi-kafka-kafka-bootstrap.prod.svc.cluster.local:9092"
            - name: GROUP_ID
              value: "debezium-connect-cluster"
            - name: CONNECT_SECURITY_PROTOCOL
              value: "SASL_PLAINTEXT"
            - name: CONNECT_SASL_MECHANISM
              value: "SCRAM-SHA-512"
            - name: CONNECT_PRODUCER_SECURITY_PROTOCOL
              value: "SASL_PLAINTEXT"
            - name: CONNECT_PRODUCER_SASL_MECHANISM
              value: "SCRAM-SHA-512"
            - name: CONNECT_CONSUMER_SECURITY_PROTOCOL
              value: "SASL_PLAINTEXT"
            - name: CONNECT_CONSUMER_SASL_MECHANISM
              value: "SCRAM-SHA-512"
            - name: CONFIG_STORAGE_TOPIC
              value: "debezium-configs"
            - name: OFFSET_STORAGE_TOPIC
              value: "debezium-offsets"
            - name: STATUS_STORAGE_TOPIC
              value: "debezium-statuses"
            - name: KEY_CONVERTER
              value: "io.confluent.connect.avro.AvroConverter"
            - name: CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL
              value: "http://schema-registry.prod.svc.cluster.local:8081"
            - name: VALUE_CONVERTER
              value: "io.confluent.connect.avro.AvroConverter"
            - name: CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL
              value: "http://schema-registry.prod.svc.cluster.local:8081"
            # EnvVar config provider — connector JSON uses ${env:CONNECT_PRODUCER_SASL_JAAS_CONFIG}
            - name: CONNECT_CONFIG_PROVIDERS
              value: "env"
            - name: CONNECT_CONFIG_PROVIDERS_ENV_CLASS
              value: "org.apache.kafka.common.config.provider.EnvVarConfigProvider"
          volumeMounts:
            - name: debezium-data
              mountPath: /kafka/data
            - name: vault-env
              mountPath: /vault-env
              readOnly: true
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /connectors
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /connectors
              port: 8083
            initialDelaySeconds: 90
            periodSeconds: 20

      volumes:
        - name: debezium-data
          persistentVolumeClaim:
            claimName: debezium-data
        - name: vault-env
          emptyDir: {}
        - name: fetch-secrets-script
          configMap:
            name: debezium-fetch-secrets-script
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: debezium-data
  namespace: prod
  labels:
    app: debezium-connect
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: debezium-connect
  namespace: prod
spec:
  selector:
    app: debezium-connect
  type: NodePort
  ports:
    - name: rest-api
      port: 8083
      targetPort: 8083
      nodePort: 30083
