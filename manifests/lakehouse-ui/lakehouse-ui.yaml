---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lakehouse-ui
  namespace: prod
---
# ClusterRole — read deployments, pods, logs; manage configmaps
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lakehouse-ui
  namespace: prod
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get","list","patch","update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get","list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create","get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get","list","create","update","patch","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lakehouse-ui
  namespace: prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lakehouse-ui
subjects:
  - kind: ServiceAccount
    name: lakehouse-ui
    namespace: prod
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakehouse-ui
  namespace: prod
  labels:
    app: lakehouse-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lakehouse-ui
  template:
    metadata:
      labels:
        app: lakehouse-ui
    spec:
      nodeSelector:
        workload: general
      serviceAccountName: lakehouse-ui
      containers:
        - name: lakehouse-ui
          image: 192.168.1.50:30500/lakehouse-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: K8S_NAMESPACE
              value: "prod"
            - name: DEBEZIUM_POSTGRES_URL
              value: "http://debezium-connect-postgres.prod.svc.cluster.local:8083"
            - name: DEBEZIUM_ORACLE_URL
              value: "http://debezium-connect-oracle.prod.svc.cluster.local:8083"
            - name: DEBEZIUM_MONGODB_URL
              value: "http://debezium-connect-mongodb.prod.svc.cluster.local:8083"
            - name: KAFKA_BOOTSTRAP
              value: "strimzi-kafka-kafka-bootstrap.prod.svc.cluster.local:9092"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
# Service — NodePort 30900
apiVersion: v1
kind: Service
metadata:
  name: lakehouse-ui
  namespace: prod
  labels:
    app: lakehouse-ui
spec:
  type: NodePort
  selector:
    app: lakehouse-ui
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30900
