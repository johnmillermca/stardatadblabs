# =============================================================================
# snowflake-credentials — Kubernetes Secret
# Namespace : prod
# Keys      : password  — Snowflake login password for testsnowflake
#
# Apply once before running 10_create_snowflake_catalog.sql:
#   kubectl apply -f manifests/stardata/setup/snowflake-credentials-secret.yaml
#
# To rotate: edit the password value below and re-apply.  Then re-create the
# catalog so Stardata picks up the new credential:
#   export SNOWFLAKE_PASS=<new-password>
#   envsubst < manifests/stardata/setup/10_create_snowflake_catalog.sql \
#     | mysql -h 192.168.1.50 -P 30090 -u root -p"${STARDATA_PASS}"
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: snowflake-credentials
  namespace: prod
  labels:
    app: stardata
    component: external-catalog
type: Opaque
stringData:
  password: "Softlayeribm123!"
