# =============================================================================
# snowflake-jwt-key — RSA private key for Snowflake key-pair (JWT) authentication
# Namespace : prod
#
# Public key registered in Snowflake via:
#   ALTER USER testsnowflake SET RSA_PUBLIC_KEY='<public key body>';
#
# Private key is mounted into every FE pod at /snowflake-jwt/rsa_key.p8
# and referenced in the JDBC URL:
#   authenticator=snowflake_jwt&private_key_file=/snowflake-jwt/rsa_key.p8
#
# To regenerate: see docs/runbooks/runbook-35-stardata-doris-upgrade.md
# =============================================================================

apiVersion: v1
data:
  rsa_key.p8: 
kind: Secret
metadata:
  annotations:
  name: snowflake-jwt-key
  namespace: prod
type: Opaque
