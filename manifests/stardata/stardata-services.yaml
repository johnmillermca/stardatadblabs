# =============================================================================
# Apache Stardata Services
# Namespace : prod
# FE NodePort: http://192.168.1.50:30030 (HTTP)
#              jdbc://192.168.1.50:32530  (MySQL — query port)
#
# Note: Kerberos guard sidecar (krb-stardata-guard / targetPort 19030) has been
# removed from the cluster. MySQL traffic now routes directly to Doris FE :9030.
# =============================================================================
---
# External NodePort for FE — HTTP WebUI (8030) and MySQL query (9030)
apiVersion: v1
kind: Service
metadata:
  name: stardata-fe
  namespace: prod
spec:
  selector:
    app: stardata-fe
  type: NodePort
  ports:
    - name: http
      port: 8030
      targetPort: 8030
      nodePort: 30030
    - name: query
      port: 9030
      targetPort: 9030
      nodePort: 32530
    - name: edit-log
      port: 9010
      targetPort: 9010
      nodePort: 31364
    - name: rpc
      port: 9020
      targetPort: 9020
      nodePort: 31111
---
# Headless service for stable FE DNS (required for enable_fqdn_mode=true)
apiVersion: v1
kind: Service
metadata:
  name: stardata-fe-headless
  namespace: prod
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: stardata-fe
  ports:
    - name: edit-log
      port: 9010
    - name: rpc
      port: 9020
---
# Internal ClusterIP for BE — not exposed externally
apiVersion: v1
kind: Service
metadata:
  name: stardata-be
  namespace: prod
spec:
  selector:
    app: stardata-be
  type: ClusterIP
  ports:
    - name: be-port
      port: 9060
    - name: webserver
      port: 8040
    - name: heartbeat
      port: 9050
    - name: brpc
      port: 8060
