# =============================================================================
# Apache Stardata Services
# Namespace : prod
# FE NodePort: http://192.168.1.50:30030 (HTTP)  jdbc://192.168.1.50:30090 (MySQL)
#
# Kerberos enforcement:
#   MySQL port 9030 → targetPort 19030 (krb-stardata-guard sidecar).
#   The guard validates the KDC principal before proxying to Stardata :9030.
#   Clients connecting on port 30090 / 9030 go through the guard.
#   Direct access to Stardata port 9030 is blocked at the Service level —
#   only the guard (127.0.0.1:9030 inside the pod) can reach Stardata directly.
# =============================================================================
---
# External NodePort for FE — HTTP WebUI (8030) and MySQL via guard (9030→19030)
apiVersion: v1
kind: Service
metadata:
  name: stardata-fe
  namespace: prod
spec:
  selector:
    app: stardata-fe
  type: NodePort
  ports:
    - name: http
      port: 8030
      targetPort: 8030
      nodePort: 30030
    # query port not exposed externally — all MySQL traffic enters via
    # stardata-write-proxy NodePort 30090 → stardata-fe ClusterIP:9030 → guard.
    - name: query
      port: 9030
      targetPort: 19030
    - name: edit-log
      port: 9010
      targetPort: 9010
    - name: rpc
      port: 9020
      targetPort: 9020
---
# Headless service for stable FE DNS (required for enable_fqdn_mode=true)
apiVersion: v1
kind: Service
metadata:
  name: stardata-fe-headless
  namespace: prod
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: stardata-fe
  ports:
    - name: edit-log
      port: 9010
    - name: rpc
      port: 9020
---
# Internal ClusterIP for BE — not exposed externally
apiVersion: v1
kind: Service
metadata:
  name: stardata-be
  namespace: prod
spec:
  selector:
    app: stardata-be
  type: ClusterIP
  ports:
    - name: be-port
      port: 9060
    - name: webserver
      port: 8040
    - name: heartbeat
      port: 9050
    - name: brpc
      port: 8060
