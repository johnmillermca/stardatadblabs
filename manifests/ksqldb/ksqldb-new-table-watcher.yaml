# =============================================================================
# ksqldb-new-table-watcher.yaml
# ==============================
# CronJob that runs every 5 minutes and auto-provisions ksqlDB streams and
# materialised tables for any new table that Debezium has started capturing —
# across ANY database / connector registered on ANY of the three Connect workers.
#
# ── What it creates (standard mode only) ─────────────────────────────────────
#   For every raw Debezium topic  <prefix>.<table>  not yet backed by a stream:
#     1. Source stream  — <PREFIX_UPPER>_<TABLE>
#          reads the raw Debezium topic as opaque PAYLOAD STRING
#     2. Materialised table — <PREFIX_UPPER>_<TABLE>_TBL
#          RocksDB CSAS; 2-day Kafka retention; queryable via pull queries
#
# ── Dynamic discovery — no hardcoding ─────────────────────────────────────────
#   The watcher queries each Kafka Connect worker for its connector list,
#   reads the `topic.prefix` from each connector config, then matches that
#   prefix against all live Kafka topics.
#   Adding a new database/connector in the future requires zero changes here —
#   the watcher picks it up automatically on its next run.
#
# ── Topic filtering ───────────────────────────────────────────────────────────
#   A topic is treated as a "raw CDC topic" when:
#     - It starts with a known connector prefix
#     - It does NOT end with _sd, _hist, _TBL, _SD, _HIST
#     - It is not an internal / schema-change topic (__, _confluent, schema-changes)
#
# ── Idempotency ───────────────────────────────────────────────────────────────
#   CREATE STREAM/TABLE IF NOT EXISTS — safe to re-run at any time.
#   HTTP 400 "already exists" is treated as success.
#
# ── After provisioning ────────────────────────────────────────────────────────
#   tableflow pods detect the new materialised-table backing topics on their
#   next TOPIC_REFRESH_INTERVAL poll (default 60 s) and subscribe automatically.
#   Iceberg table creation happens on first message via ensure_table() in
#   tableflow.py — no additional step needed.
#
# Run manually (one-shot):
#   kubectl create job -n prod ksqldb-watcher-manual \
#     --from=cronjob/ksqldb-new-table-watcher
# =============================================================================
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ksqldb-new-table-watcher
  namespace: prod
  labels:
    app: ksqldb-new-table-watcher
    pipeline.type: tableflow
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: ksqldb-new-table-watcher
        spec:
          restartPolicy: OnFailure
          serviceAccountName: spark-cleanup
          containers:
            - name: watcher
              image: python:3.11-slim
              command: ["python3", "-c"]
              args:
                - |
                  import json, sys, time, urllib.request, urllib.error

                  KSQL    = "http://ksqldb.prod.svc.cluster.local:8088"

                  # All three Debezium Connect workers — add more here if new
                  # workers are ever deployed; topic-prefix and table discovery
                  # is fully dynamic so no other change is needed.
                  CONNECT_WORKERS = [
                      "http://debezium-connect-postgres.prod.svc.cluster.local:8083",
                      "http://debezium-connect-oracle.prod.svc.cluster.local:8084",
                      "http://debezium-connect-mongodb.prod.svc.cluster.local:8085",
                  ]

                  # Topics matching these patterns are not raw CDC data topics
                  SKIP_SUFFIXES = ("_sd", "_hist", "_standard", "_SD", "_HIST", "_STANDARD", "_TBL")
                  SKIP_PREFIXES = ("__", "_confluent", "schema-changes", "connect-")

                  # Kafka topic defaults for pre-created topics
                  TOPIC_PARTITIONS  = 3
                  TOPIC_REPLICAS    = 1
                  TOPIC_RETENTION   = 604800000   # 7 days in ms

                  # ── helpers ────────────────────────────────────────────────
                  def http_get(url, timeout=15):
                      try:
                          with urllib.request.urlopen(url, timeout=timeout) as r:
                              return json.loads(r.read())
                      except Exception as e:
                          print(f"  [WARN] GET {url}: {e}")
                          return None

                  def ksql_exec(stmt):
                      body = json.dumps({"ksql": stmt, "streamsProperties": {}}).encode()
                      req  = urllib.request.Request(
                          f"{KSQL}/ksql", data=body,
                          headers={"Content-Type": "application/vnd.ksql.v1+json"},
                      )
                      try:
                          with urllib.request.urlopen(req, timeout=30) as r:
                              d = json.loads(r.read())
                              status = (d[0].get("commandStatus", {}).get("status", "OK")
                                        if isinstance(d, list) else d.get("message", "OK")[:80])
                              return True, status
                      except urllib.error.HTTPError as e:
                          err = e.read().decode()
                          if "already exists" in err.lower():
                              return True, "EXISTS"
                          return False, err[:160]

                  def list_ksql_streams():
                      body = json.dumps({"ksql": "SHOW STREAMS;", "streamsProperties": {}}).encode()
                      req  = urllib.request.Request(
                          f"{KSQL}/ksql", data=body,
                          headers={"Content-Type": "application/vnd.ksql.v1+json"},
                      )
                      with urllib.request.urlopen(req, timeout=15) as r:
                          d = json.loads(r.read())
                          return {s["name"].upper() for s in d[0].get("streams", [])}

                  def list_ksql_tables():
                      body = json.dumps({"ksql": "SHOW TABLES;", "streamsProperties": {}}).encode()
                      req  = urllib.request.Request(
                          f"{KSQL}/ksql", data=body,
                          headers={"Content-Type": "application/vnd.ksql.v1+json"},
                      )
                      with urllib.request.urlopen(req, timeout=15) as r:
                          d = json.loads(r.read())
                          return {t["name"].upper() for t in d[0].get("tables", [])}

                  # ── wait for ksqlDB ────────────────────────────────────────
                  print("Waiting for ksqlDB…")
                  for attempt in range(20):
                      try:
                          with urllib.request.urlopen(f"{KSQL}/info", timeout=5) as r:
                              info = json.loads(r.read())
                              if info.get("KsqlServerInfo", {}).get("serverStatus") == "RUNNING":
                                  print(f"ksqlDB ready (attempt {attempt+1})")
                                  break
                      except Exception as e:
                          print(f"  [{attempt+1}] not ready: {e}")
                      time.sleep(5)
                  else:
                      sys.exit("ksqlDB never became ready — aborting")

                  # ── step 1: discover all connectors → build expected topic list ──
                  # For every connector we read:
                  #   topic.prefix        — e.g. "postgres.cache_testing"
                  #   table.include.list  — e.g. "public.customers,public.testing2"
                  # We derive the expected Kafka topic name for each table:
                  #   postgres.cache_testing  +  public.testing2
                  #   → apply any transforms (RegexRouter dropSchema strips schema segment)
                  #   → postgres.cache_testing.testing2
                  # The topic is then pre-created via ksqlDB if it does not exist yet,
                  # so the watcher never blocks on "table is empty → no topic yet".
                  expected_topics  = {}   # topic_name → pfx
                  prefix_by_worker = {}   # pfx → set of topic names

                  for worker in CONNECT_WORKERS:
                      names = http_get(f"{worker}/connectors")
                      if not names:
                          print(f"  [WARN] Could not reach {worker} — skipping")
                          continue
                      for name in names:
                          cfg = http_get(f"{worker}/connectors/{name}/config")
                          if not cfg:
                              continue
                          pfx = cfg.get("topic.prefix", "").strip()
                          if not pfx:
                              continue

                          # Detect whether a RegexRouter drops the schema segment.
                          # Pattern: transforms.*.type = RegexRouter AND
                          #          transforms.*.regex contains '\.public\.'
                          has_drop_schema = any(
                              "RegexRouter" in str(v) and "public" in str(cfg.get(k.replace(".type", ".regex"), ""))
                              for k, v in cfg.items() if k.endswith(".type")
                          )

                          # table.include.list: "public.customers,public.testing2"
                          # collection.include.list (MongoDB): "cache_testing.customers"
                          raw_list = cfg.get("table.include.list") or cfg.get("collection.include.list", "")
                          tables   = [t.strip() for t in raw_list.split(",") if t.strip()]

                          for tbl_entry in tables:
                              # Strip schema prefix if RegexRouter is dropping it
                              if has_drop_schema and "." in tbl_entry:
                                  tbl_name = tbl_entry.split(".", 1)[1]
                              else:
                                  tbl_name = tbl_entry
                              topic_name = f"{pfx}.{tbl_name}"
                              expected_topics[topic_name] = pfx
                              prefix_by_worker.setdefault(pfx, set()).add(topic_name)
                              print(f"  connector '{name}' → expected topic '{topic_name}'")

                  if not expected_topics:
                      sys.exit("No tables found in any connector config — aborting")

                  # ── step 2: list existing Kafka topics ────────────────────
                  try:
                      body = json.dumps({"ksql": "SHOW TOPICS;", "streamsProperties": {}}).encode()
                      req  = urllib.request.Request(
                          f"{KSQL}/ksql", data=body,
                          headers={"Content-Type": "application/vnd.ksql.v1+json"},
                      )
                      with urllib.request.urlopen(req, timeout=15) as r:
                          d = json.loads(r.read())
                          all_topics = {t["name"] for t in d[0].get("topics", [])}
                  except Exception as e:
                      sys.exit(f"Cannot list Kafka topics from ksqlDB: {e}")

                  print(f"\nKafka topics visible: {len(all_topics)}")

                  # ── step 3: pre-create any missing topics via ksqlDB ──────
                  # Uses "CREATE STREAM … IF NOT EXISTS" as a lightweight way to
                  # force-create the backing Kafka topic immediately — before any
                  # DML arrives from the source.  A temporary scratch stream is
                  # created then immediately dropped, leaving only the topic.
                  # This means the watcher never has to wait for a source INSERT.
                  for topic_name in sorted(expected_topics):
                      if topic_name in all_topics:
                          continue
                      if any(topic_name.endswith(s) for s in SKIP_SUFFIXES):
                          continue
                      if any(topic_name.startswith(s) for s in SKIP_PREFIXES):
                          continue

                      # Derive a safe ksqlDB stream name for the temp object
                      tmp_stream = "_WATCHER_TMP_" + topic_name.replace(".", "_").replace("-", "_").upper()
                      print(f"\n  [PRE-CREATE] topic '{topic_name}' does not exist — creating now…")

                      # Create a temporary stream — this forces Kafka to create the topic
                      ok, status = ksql_exec(
                          f"CREATE STREAM IF NOT EXISTS {tmp_stream} "
                          f"(ROWKEY STRING KEY, PAYLOAD STRING) "
                          f"WITH (KAFKA_TOPIC='{topic_name}', VALUE_FORMAT='JSON', "
                          f"PARTITIONS={TOPIC_PARTITIONS}, REPLICAS={TOPIC_REPLICAS}, "
                          f"RETENTION_MS={TOPIC_RETENTION}, WRAP_SINGLE_VALUE=false);"
                      )
                      if ok:
                          print(f"  [PRE-CREATE] topic created via temp stream: {status}")
                          # Drop the temp stream — topic persists in Kafka
                          ksql_exec(f"DROP STREAM IF EXISTS {tmp_stream};")
                          all_topics.add(topic_name)   # update local view
                      else:
                          print(f"  [PRE-CREATE] failed: {status}")

                  # ── step 4: find raw CDC topics across all known prefixes ──
                  all_pfx = set(expected_topics.values())
                  raw_by_prefix = {}
                  for pfx in all_pfx:
                      raw = [
                          t for t in all_topics
                          if t.startswith(pfx + ".")
                          and not any(t.endswith(s) for s in SKIP_SUFFIXES)
                          and not any(t.startswith(s) for s in SKIP_PREFIXES)
                      ]
                      if raw:
                          raw_by_prefix[pfx] = raw

                  print(f"\nRaw CDC topics by prefix:")
                  for pfx, topics in sorted(raw_by_prefix.items()):
                      print(f"  {pfx}: {sorted(topics)}")

                  # ── step 5: load existing ksqlDB streams + tables ──────────
                  known_streams = list_ksql_streams()
                  known_tables  = list_ksql_tables()
                  print(f"\nExisting ksqlDB streams: {len(known_streams)}, tables: {len(known_tables)}")

                  # ── step 6: provision missing source stream + mat table ────
                  # Naming:  postgres.cache_testing + orders
                  #        → stream  POSTGRES_CACHE_TESTING_ORDERS
                  #        → table   POSTGRES_CACHE_TESTING_ORDERS_TBL
                  errors    = 0
                  new_items = 0

                  for pfx, raw_topics in sorted(raw_by_prefix.items()):
                      pfx_upper = pfx.replace(".", "_").replace("-", "_").upper()

                      for raw_topic in sorted(raw_topics):
                          tbl       = raw_topic[len(pfx) + 1:]
                          TBL_upper = tbl.replace(".", "_").replace("-", "_").upper()

                          src_stream = f"{pfx_upper}_{TBL_upper}"
                          mat_table  = f"{src_stream}_TBL"

                          # Skip if both already exist
                          if src_stream in known_streams and mat_table in known_tables:
                              continue

                          print(f"\n>>> Provisioning: {raw_topic}")
                          new_items += 1

                          # 1. Source stream
                          if src_stream not in known_streams:
                              ok, status = ksql_exec(
                                  f"CREATE STREAM IF NOT EXISTS {src_stream} "
                                  f"(ROWKEY STRING KEY, PAYLOAD STRING) "
                                  f"WITH (KAFKA_TOPIC='{raw_topic}', VALUE_FORMAT='JSON', "
                                  f"WRAP_SINGLE_VALUE=false);"
                              )
                              print(f"  source stream  {src_stream}: {status}")
                              if not ok:
                                  errors += 1
                                  continue

                          # 2. Materialised table (ksqlDB 7.9: only KAFKA_TOPIC/PARTITIONS/REPLICAS in WITH)
                          if mat_table not in known_tables:
                              ok, status = ksql_exec(
                                  f"CREATE TABLE IF NOT EXISTS {mat_table} "
                                  f"WITH (KAFKA_TOPIC='{mat_table}', PARTITIONS=3, REPLICAS=1) AS "
                                  f"SELECT ROWKEY, LATEST_BY_OFFSET(PAYLOAD) AS PAYLOAD "
                                  f"FROM {src_stream} GROUP BY ROWKEY EMIT CHANGES;"
                              )
                              print(f"  mat table      {mat_table}: {status}")
                              if not ok:
                                  errors += 1

                  print(f"\n{'='*60}")
                  print(f"Watcher complete — new items provisioned: {new_items}, errors: {errors}")
                  if errors:
                      sys.exit(1)
