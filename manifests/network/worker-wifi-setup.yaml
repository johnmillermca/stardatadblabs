# =============================================================================
# worker-wifi-setup — DaemonSet
# Runs on ALL worker nodes.
#
# GOAL
# ────
#   • LAN ethernet (eno1 or enp1s0) = static IP, k8s cluster traffic
#   • WiFi (wlp3s0)                 = internet uplink only (default route)
#
# HOW IT WORKS
# ────────────
#   1. Auto-detects LAN interface (eno1 on worker1-5, enp1s0 on worker6-10)
#   2. Writes static IP into the LAN NM connection (address1=192.168.1.x/24)
#      → LAN IP is stable across reboots, no DHCP race, no WiFi conflict
#   3. Sets LAN never-default=true → NM never adds a default route via LAN
#   4. Writes WiFi NM keyfile with ignore-auto-routes=true → WiFi only
#      provides the default gateway, NOT a competing 192.168.1.0/24 subnet route
#   5. Installs NM dispatcher for extra reboot safety
#   6. Applies routing immediately (no reboot needed for currently-running nodes)
#
# INTERFACES
#   wlp3s0        — WiFi (twinkly36)   internet uplink
#   eno1/enp1s0   — Ethernet           k8s cluster LAN (auto-detected)
# =============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: worker-wifi-setup
  namespace: kube-system
  labels:
    app: worker-wifi-setup
spec:
  selector:
    matchLabels:
      app: worker-wifi-setup
  template:
    metadata:
      labels:
        app: worker-wifi-setup
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: worker
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "stardata"
          effect: "NoSchedule"
        - operator: Exists
      hostNetwork: true
      hostPID: true
      priorityClassName: system-node-critical

      initContainers:
        - name: wifi-setup
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          command:
            - sh
            - -c
            - |
              set -e
              SSID="twinkly36"
              WIFI="wlp3s0"
              HOST="nsenter -t 1 -m -u -i -n --"

              echo "[worker-wifi] Starting on $(hostname)  node_ip=${NODE_IP}"

              # ── Auto-detect LAN interface ────────────────────────────────────
              # Find whichever interface holds the node's k8s IP (NODE_IP).
              # Works for eno1 (worker1-5) and enp1s0 (worker6-10).
              LAN=$($HOST ip -4 addr show 2>/dev/null \
                | awk -v ip="${NODE_IP}" '/inet /{split($2,a,"/"); if(a[1]==ip) print $NF}' \
                | head -1)
              if [ -z "$LAN" ]; then
                echo "[worker-wifi] ERROR: cannot detect LAN interface for IP ${NODE_IP} — skipping"
                exit 0
              fi
              echo "[worker-wifi] LAN interface: ${LAN}"

              # ── 1. Set static IP on LAN NM connection ────────────────────────
              # Static IP means NM always brings up LAN with the correct IP
              # regardless of DHCP timing or WiFi state after reboot.
              # Look up the actual NM connection name bound to the LAN interface,
              # then run nmcli inside the host's full namespace via chroot.
              LAN_CON=$(nsenter -t 1 -m -u -i -n -- \
                nmcli -t -f GENERAL.CONNECTION dev show "${LAN}" 2>/dev/null | cut -d: -f2)
              if [ -n "${LAN_CON}" ]; then
                nsenter -t 1 -m -u -i -n -- \
                  nmcli con modify "${LAN_CON}" \
                    ipv4.method manual \
                    ipv4.addresses "${NODE_IP}/24" \
                    ipv4.gateway "" \
                    ipv4.never-default yes \
                    ipv4.route-metric 100 \
                    ipv6.method ignore 2>/dev/null || true
                echo "[worker-wifi] ✓ ${LAN} (con=${LAN_CON}) static IP ${NODE_IP}/24 set"
              else
                echo "[worker-wifi] WARNING: could not find NM connection for ${LAN}"
              fi

              # ── 2. Write WiFi NM keyfile ─────────────────────────────────────
              # ignore-auto-routes=true: WiFi DHCP only provides the default
              # gateway — it must NOT inject a 192.168.1.0/24 subnet route
              # (that would compete with the LAN interface on worker6-10).
              # never-default=false: WiFi IS the internet default (metric 50).
              NM_CONN="/host/etc/NetworkManager/system-connections/twinkly36.nmconnection"
              mkdir -p /host/etc/NetworkManager/system-connections
              printf '[connection]\nid=twinkly36\nuuid=11111111-1111-1111-1111-111111111111\ntype=wifi\nautoconnect=true\nautoconnect-priority=10\n\n[wifi]\nssid=twinkly36\nmode=infrastructure\n\n[wifi-security]\nkey-mgmt=wpa-psk\npsk=gogoboys1316\n\n[ipv4]\nmethod=auto\nroute-metric=50\nignore-auto-routes=true\nnever-default=false\nroutes1=0.0.0.0/0,192.168.1.254,50\n\n[ipv6]\nmethod=ignore\n' > "${NM_CONN}"
              chmod 600 "${NM_CONN}"
              echo "[worker-wifi] ✓ WiFi NM keyfile written (ignore-auto-routes=true)"

              # ── 3. Install NM dispatcher — reboot safety net ─────────────────
              # Even with static IP + never-default, install a dispatcher as a
              # belt-and-suspenders guard: ensures LAN route is always correct
              # and removes any competing WiFi subnet route.
              mkdir -p /host/etc/NetworkManager/dispatcher.d
              DISP="/host/etc/NetworkManager/dispatcher.d/51-worker-wifi-routing.sh"
              printf '#!/bin/sh\n# Injected by worker-wifi-setup DaemonSet\n# Safety net: auto-detects LAN interface and fixes routes on every interface-up.\nIFACE="$1"\nACTION="$2"\n[ "$ACTION" = "up" ] || exit 0\n[ "$IFACE" = "wlp3s0" ] || echo "$IFACE" | grep -qE "^(eno|enp|eth)" || exit 0\n\nLAN=$(ip -4 addr show 2>/dev/null | awk '"'"'/inet 192\.168\.1\./{iface=$NF} /inet 192\.168\.1\./{print iface}'"'"' | grep -v "^wlp3s0$" | grep -v lo | head -1)\n[ -z "$LAN" ] && exit 0\n\nLAN_IP=$(ip -4 addr show "$LAN" 2>/dev/null | awk '"'"'/inet 192\.168\.1\./{split($2,a,"/"); print a[1]}'"'"')\n[ -z "$LAN_IP" ] && exit 0\n\nip route replace 192.168.1.0/24 dev "$LAN" src "$LAN_IP" 2>/dev/null || true\nip route del default dev "$LAN" 2>/dev/null || true\nip route del 192.168.1.0/24 dev wlp3s0 2>/dev/null || true\nip route flush cache 2>/dev/null || true\n' > "${DISP}"
              chmod +x "${DISP}"
              echo "[worker-wifi] ✓ NM dispatcher installed"

              # ── 4. Reload NM + activate WiFi ────────────────────────────────
              $HOST nmcli con reload 2>&1 || true
              $HOST nmcli con up twinkly36 2>&1 || \
                $HOST nmcli dev wifi connect "${SSID}" password "gogoboys1316" ifname "${WIFI}" 2>&1 || true

              echo "[worker-wifi] Waiting for DHCP on ${WIFI}..."
              for i in $(seq 1 45); do
                $HOST ip addr show "${WIFI}" 2>/dev/null | grep -q "inet " && break
                sleep 1
              done
              WIFI_IP=$($HOST ip addr show "${WIFI}" 2>/dev/null | awk '/inet /{print $2}' | cut -d/ -f1)
              echo "[worker-wifi] ${WIFI} IP: ${WIFI_IP:-NOT ASSIGNED}"

              # ── 5. Apply routing immediately ────────────────────────────────
              LAN_IP=$($HOST ip -4 addr show "${LAN}" 2>/dev/null | awk '/inet 192\.168\.1\./{split($2,a,"/"); print a[1]}')
              if [ -n "${LAN_IP}" ]; then
                $HOST ip route replace 192.168.1.0/24 dev "${LAN}" src "${LAN_IP}" 2>/dev/null || true
                echo "[worker-wifi] ✓ LAN route: 192.168.1.0/24 dev ${LAN} src ${LAN_IP}"
              fi
              $HOST ip route del default dev "${LAN}" 2>/dev/null || true
              $HOST ip route del 192.168.1.0/24 dev "${WIFI}" 2>/dev/null || true
              $HOST ip rule del priority 100 2>/dev/null || true
              $HOST ip rule del priority 101 2>/dev/null || true
              $HOST ip route flush table 100 2>/dev/null || true
              $HOST ip route flush cache 2>/dev/null || true

              echo "[worker-wifi] Route table (main):"
              $HOST ip route show 2>/dev/null || true

              echo "[worker-wifi] Init done."
          volumeMounts:
            - name: host-root
              mountPath: /host

      containers:
        - name: pause
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "sleep infinity"]

      volumes:
        - name: host-root
          hostPath:
            path: /
