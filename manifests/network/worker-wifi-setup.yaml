# =============================================================================
# worker-wifi-setup — DaemonSet
# Runs once on worker2/3/4 to:
#   1. Bring wlp3s0 under NetworkManager management
#   2. Connect to WiFi SSID twinkly36 (internet uplink)
#   3. Remove the default route from eno1 (LAN stays for k8s cluster traffic)
#   4. Set default route via wlp3s0 (WiFi = internet)
#   5. Persist the routing config so it survives reboots
#
# Apply:   kubectl apply -f manifests/network/worker-wifi-setup.yaml
# Remove:  kubectl delete -f manifests/network/worker-wifi-setup.yaml
# =============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: worker-wifi-setup
  namespace: kube-system
  labels:
    app: worker-wifi-setup
spec:
  selector:
    matchLabels:
      app: worker-wifi-setup
  template:
    metadata:
      labels:
        app: worker-wifi-setup
    spec:
      # ── Run only on worker2/3/4 (stardata nodes) ───────────────────────────
      nodeSelector:
        stardata: "true"
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "stardata"
          effect: "NoSchedule"
      hostNetwork: true
      hostPID: true

      # Restart only if the pod fails — once WiFi is up, don't re-run
      restartPolicy: Always

      containers:
        - name: wifi-setup
          # Using the host image (via nsenter) so we can call nmcli/systemctl
          # from the host's own binary paths
          image: 192.168.1.50:30500/busybox:1.36
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              set -e
              SSID="twinkly36"
              IFACE="wlp3s0"
              LAN="eno1"

              echo "[wifi-setup] Starting on $(hostname)"

              # All commands execute inside the host's full namespace
              HOST="nsenter -t 1 -m -u -i -n --"

              # ── 1. Write NM keyfile directly to host filesystem ──────────────
              # The privileged pod has /host mounted = host /
              # Write straight to host's NM connection directory — no D-Bus needed.
              mkdir -p /host/etc/NetworkManager/system-connections

              cat > /host/etc/NetworkManager/system-connections/twinkly36.nmconnection << 'NMEOF'
[connection]
id=twinkly36
uuid=11111111-1111-1111-1111-111111111111
type=wifi
autoconnect=true
autoconnect-priority=10

[wifi]
ssid=twinkly36
mode=infrastructure

[wifi-security]
key-mgmt=wpa-psk
psk=gogoboys1316

[ipv4]
method=auto
never-default=false
route-metric=50

[ipv6]
method=ignore
NMEOF
              chmod 600 /host/etc/NetworkManager/system-connections/twinkly36.nmconnection
              echo "[wifi-setup] NM keyfile written to host"

              # ── 2. Set eno1 to never-default (LAN only, no internet route) ──
              # Read eno1 connection file path from host NM
              ENO1_CFG=$($HOST nmcli -t -f filename con show eno1 2>/dev/null | cut -d: -f2 | tr -d ' ')
              if [ -n "${ENO1_CFG}" ] && [ -f "/host${ENO1_CFG}" ]; then
                grep -q 'never-default=true' "/host${ENO1_CFG}" 2>/dev/null || \
                  sed -i '/\[ipv4\]/a never-default=true' "/host${ENO1_CFG}"
                echo "[wifi-setup] eno1 never-default=true set in ${ENO1_CFG}"
              fi

              # ── 3. Reload NM + activate WiFi connection ──────────────────────
              # nmcli con reload reads the new keyfile from disk (no D-Bus issue)
              $HOST nmcli con reload 2>&1 || true

              # Bring up the WiFi connection explicitly
              $HOST nmcli con up twinkly36 2>&1 || \
              $HOST nmcli dev wifi connect "${SSID}" password "gogoboys1316" ifname "${IFACE}" 2>&1 || true

              # Wait for IP (up to 45s)
              echo "[wifi-setup] Waiting for DHCP on ${IFACE}..."
              for i in $(seq 1 45); do
                $HOST ip addr show ${IFACE} 2>/dev/null | grep -q "inet " && break
                sleep 1
              done

              # ── 4. Show result ───────────────────────────────────────────────
              WIFI_IP=$($HOST ip addr show ${IFACE} 2>/dev/null | awk '/inet / {print $2}' | cut -d/ -f1)
              echo "[wifi-setup] ${IFACE} IP: ${WIFI_IP:-NOT ASSIGNED}"

              # ── 5. Fix default route: WiFi = internet, eno1 = LAN only ───────
              WIFI_GW=$($HOST ip route show dev ${IFACE} 2>/dev/null | awk '/default/ {print $3}' | head -1)
              echo "[wifi-setup] WiFi gateway: ${WIFI_GW:-not yet}"

              # Remove LAN default route if still present
              $HOST ip route del default via 192.168.1.50 dev ${LAN} 2>/dev/null && \
                echo "[wifi-setup] Removed LAN default route" || true

              # Verify internet
              echo "[wifi-setup] Testing S3..."
              $HOST wget -q --timeout=15 -O /dev/null https://s3.us-east-2.amazonaws.com \
                && echo "[wifi-setup] ✅ S3 reachable — WiFi internet working" \
                || echo "[wifi-setup] ⚠️  S3 not yet reachable"

              echo "[wifi-setup] Done. Sleeping..."
              while true; do sleep 3600; done
          volumeMounts:
            - name: host-root
              mountPath: /host
      volumes:
        - name: host-root
          hostPath:
            path: /
