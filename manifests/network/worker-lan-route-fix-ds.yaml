# =============================================================================
# worker-lan-route-fix-ds.yaml
# DaemonSet — runs on worker2/3/4 (stardata=true nodes) only.
#
# Problem (original)
# ───────────────────
# worker2/3/4 are dual-homed:
#   eno1   192.168.1.52/53/54  — cluster LAN (K8s node IP)
#   wlp3s0 192.168.1.1xx       — WiFi (internet uplink, metric 50)
#
# Because wlp3s0 has metric=50 and eno1 has metric=100, NM can momentarily
# install a default route via eno1 before never-default takes effect, which
# can displace the eno1 subnet route from the main routing table. This causes
# BGP (TCP/179) and IPIP cross-node pod traffic to pick the wrong source IP.
#
# Fix (this DaemonSet)
# ────────────────────
# After every reboot / NM event, ensure:
#   1. eno1 LAN subnet (192.168.1.0/24) is in the MAIN routing table
#      with src = eno1's IP. BGP, IPIP, and all k8s traffic uses the
#      main table — no policy tables, no ip rules needed.
#   2. Any stray default route NM may have added via eno1 is removed.
#      (never-default=true on eno1 should prevent this, but be defensive)
#
# WHY NO POLICY TABLE 100 (old approach was broken)
# ──────────────────────────────────────────────────
# The old approach added ip rule + table 100 which caused asymmetric routing:
#   - Packets FROM workers arrived at 192.168.1.50 via eno1 (correct)
#   - But master's replies LEFT via WiFi (main table had no eno1 default)
#   → 192.168.1.50 became unreachable from all other nodes
# The main table with eno1's subnet route and never-default on the NM
# profile is sufficient and correct. All k8s components use the main table.
# =============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: worker-lan-route-fix
  namespace: kube-system
  labels:
    app: worker-lan-route-fix
spec:
  selector:
    matchLabels:
      app: worker-lan-route-fix
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: worker-lan-route-fix
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: worker
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "stardata"
          effect: "NoSchedule"
        - operator: Exists
      hostNetwork: true
      hostPID: true
      priorityClassName: system-node-critical
      initContainers:
        - name: fix-lan-route
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              set -e
              HOST="nsenter -t 1 -m -u -i -n --"

              # ── Auto-detect LAN interface ─────────────────────────────────────
              # Works for eno1 (worker1-5) and enp1s0 (worker6-10).
              LAN=$($HOST ip -4 addr show 2>/dev/null \
                | awk '/inet 192\.168\.1\./{iface=$NF} /inet 192\.168\.1\./{print iface}' \
                | grep -v "^wlp3s0$" | grep -v "lo" | head -1)
              if [ -z "$LAN" ]; then
                echo "[lan-route-fix] ERROR: cannot detect LAN interface — skipping"
                exit 0
              fi
              LAN_IP=$($HOST ip -4 addr show "${LAN}" 2>/dev/null | awk '/inet 192\.168\.1\./{split($2,a,"/"); print a[1]}')
              echo "[lan-route-fix] LAN interface: ${LAN}  IP: ${LAN_IP}"

              # ── 1. Ensure LAN subnet is in the MAIN table ────────────────────
              $HOST ip route replace 192.168.1.0/24 dev "${LAN}" src "${LAN_IP}" 2>/dev/null || true
              echo "[lan-route-fix] ✓ 192.168.1.0/24 dev ${LAN} src ${LAN_IP} (main table)"

              # ── 2. Remove stray LAN default + competing WiFi subnet route ─────
              $HOST ip route del default dev "${LAN}" 2>/dev/null || true
              $HOST ip route del 192.168.1.0/24 dev wlp3s0 2>/dev/null || true

              # ── 3. Remove leftover policy rules from old broken setup ─────────
              $HOST ip rule del priority 100 2>/dev/null || true
              $HOST ip rule del priority 101 2>/dev/null || true
              $HOST ip route flush table 100 2>/dev/null || true
              $HOST ip route flush cache 2>/dev/null || true

              echo "[lan-route-fix] Route table (main):"
              $HOST ip route show 2>/dev/null || true

              # ── 4. Persist via NM dispatcher ─────────────────────────────────
              mkdir -p /host/etc/NetworkManager/dispatcher.d
              printf '#!/bin/sh\n# Injected by worker-lan-route-fix DaemonSet\n# Auto-detects LAN interface (eno1 or enp1s0) at runtime.\nIFACE="$1"\nACTION="$2"\n[ "$ACTION" = "up" ] || exit 0\nLAN=$(ip -4 addr show 2>/dev/null | awk '"'"'/inet 192\.168\.1\./{iface=$NF} /inet 192\.168\.1\./{print iface}'"'"' | grep -v "^wlp3s0$" | grep -v lo | head -1)\n[ -z "$LAN" ] && exit 0\n[ "$IFACE" = "$LAN" ] || exit 0\nLAN_IP=$(ip -4 addr show "$LAN" 2>/dev/null | awk '"'"'/inet 192\.168\.1\./{split($2,a,"/"); print a[1]}'"'"')\n[ -z "$LAN_IP" ] && exit 0\nip route replace 192.168.1.0/24 dev "$LAN" src "$LAN_IP" 2>/dev/null || true\nip route del default dev "$LAN" 2>/dev/null || true\nip route del 192.168.1.0/24 dev wlp3s0 2>/dev/null || true\nip route flush cache 2>/dev/null || true\n' > /host/etc/NetworkManager/dispatcher.d/50-lan-route-fix.sh
              chmod +x /host/etc/NetworkManager/dispatcher.d/50-lan-route-fix.sh
              echo "[lan-route-fix] ✓ NM dispatcher installed"

              echo "[lan-route-fix] ✓ Done"
          volumeMounts:
            - name: host-root
              mountPath: /host
      containers:
        - name: pause
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "sleep infinity"]
      volumes:
        - name: host-root
          hostPath:
            path: /
