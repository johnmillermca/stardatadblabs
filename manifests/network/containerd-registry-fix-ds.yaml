# =============================================================================
# containerd-registry-fix-ds.yaml
# DaemonSet that permanently fixes containerd registry config on every node.
#
# What it does (idempotent, runs at every pod start):
#   1. Writes the private registry CA cert to /etc/ssl/certs/registry.crt
#   2. Creates /etc/containerd/certs.d/192.168.1.50:30500/hosts.toml
#      and /etc/containerd/certs.d/registry.local:30500/hosts.toml
#   3. Patches /etc/containerd/config.toml to set
#        config_path = '/etc/containerd/certs.d'
#      (only if not already set)
#   4. Restarts containerd so the new config is live
#
# Permanent: the DaemonSet is always scheduled, so any node that reboots,
# gets reimaged, or is freshly added to the cluster gets fixed automatically.
# =============================================================================
