apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: containerd-registry-fix
  namespace: kube-system
  labels:
    app: containerd-registry-fix
spec:
  selector:
    matchLabels:
      app: containerd-registry-fix
  template:
    metadata:
      labels:
        app: containerd-registry-fix
    spec:
      tolerations:
        - operator: Exists        # run on every node including masters/taints
      hostPID: true
      hostNetwork: true
      priorityClassName: system-node-critical
      initContainers:
        - name: fix-registry
          image: 192.168.1.50:30500/busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-etc-containerd
              mountPath: /host/etc/containerd
            - name: host-etc-ssl
              mountPath: /host/etc/ssl/certs
            - name: registry-cert
              mountPath: /certs
          command:
            - sh
            - -c
            - |
              set -e

              # 1. Install CA cert
              cp /certs/registry.crt /host/etc/ssl/certs/registry.crt
              echo "✓ CA cert installed"

              # 2. Create certs.d entries for both hostnames.
              #    Primary endpoint: NodePort 192.168.1.50:30500
              #    Mirror fallback : ClusterIP 10.102.177.220:5000 (registry svc)
              #    This ensures nodes where NodePort is unreachable (worker4)
              #    still pull via the Calico overlay ClusterIP path.
              for HOST in "192.168.1.50:30500" "registry.local:30500"; do
                mkdir -p "/host/etc/containerd/certs.d/${HOST}"
                cat > "/host/etc/containerd/certs.d/${HOST}/hosts.toml" <<EOF
              server = "https://192.168.1.50:30500"
              [host."https://192.168.1.50:30500"]
                capabilities = ["pull", "resolve", "push"]
                ca = "/etc/ssl/certs/registry.crt"
                skip_verify = false
              [host."http://10.102.177.220:5000"]
                capabilities = ["pull", "resolve", "push"]
                skip_verify = true
              EOF
              done
              echo "✓ certs.d hosts.toml written (with ClusterIP fallback)"

              # 3. Patch config.toml: set config_path if not already set
              CFG=/host/etc/containerd/config.toml
              if grep -q "config_path = ''" "${CFG}"; then
                sed -i "s|config_path = ''|config_path = '/etc/containerd/certs.d'|g" "${CFG}"
                echo "✓ config.toml patched — config_path set"
              else
                echo "✓ config.toml already has config_path set — no change"
              fi

              # 4. Restart containerd via nsenter into host PID namespace
              nsenter -t 1 -m -u -i -n -p -- systemctl restart containerd
              echo "✓ containerd restarted"
      containers:
        - name: pause
          image: 192.168.1.50:30500/busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "sleep infinity"]
      volumes:
        - name: host-etc-containerd
          hostPath:
            path: /etc/containerd
            type: Directory
        - name: host-etc-ssl
          hostPath:
            path: /etc/ssl/certs
            type: Directory
        - name: registry-cert
          configMap:
            name: registry-cert
