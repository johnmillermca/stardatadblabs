# =============================================================================
# tableflow.yaml
# ==============
# Kafka-native TableFlow — 3 Deployments (one per CDC source).
#
# Architecture:
#   ksqlDB derives _sd + _hist topics from raw Debezium topics (stateless).
#   Each tableflow pod consumes those derived topics and writes directly to
#   Iceberg via PyIceberg + Polaris REST.  No Spark involved.
#
#   Write modes per derived topic:
#     *_sd   → UPSERT by PK_ID  (current soft-delete state)
#     *_hist → APPEND            (full row-level history)
#
# Sources:
#   tableflow-postgres  → postgres.cache_testing.*_sd / *_hist → pg_lakehouse
#   tableflow-oracle    → oracle.cache_testing.*_sd  / *_hist  → ora_lakehouse
#   tableflow-mongodb   → mongodb.cache_testing.*_sd / *_hist  → mgo_lakehouse
#
# Credentials:
#   All from OpenBao via K8s SA JWT (role: platform-secrets-read).
#   ServiceAccount: spark-cleanup (already has OpenBao role binding).
#
# Tuning:
#   BATCH_SIZE     — rows buffered before Iceberg write (default 500)
#   FLUSH_INTERVAL — max seconds between forced flushes (default 10)
#
# Signal API (port 8090 on each pod, exposed via ClusterIP Service):
#   POST /refresh-topics  — immediate topic re-discovery (called by Lakehouse UI)
#   GET  /healthz         — liveness/readiness probe
#
# Image:
#   192.168.1.50:30500/tableflow:1.0.15
#   Built from docker/tableflow/Dockerfile
# =============================================================================

# ── ConfigMap: shared tableflow config ───────────────────────────────────────
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tableflow-config
  namespace: prod
  labels:
    app: tableflow
    pipeline.type: tableflow
data:
  BATCH_SIZE:                    "500"
  FLUSH_INTERVAL:                "10"
  TOPIC_REFRESH_INTERVAL:        "60"
  # Rebuild the Polaris RestCatalog (re-authenticate) every 3000 s — safely
  # within the 3600 s Polaris OAuth token TTL.  A reactive rebuild also fires
  # immediately whenever a 401 is detected, so no writes are permanently lost.
  CATALOG_REFRESH_INTERVAL:      "3000"
  DRY_RUN:                       "0"
  S3_BUCKET:                     "xdatatoiceberg1"
  ICEBERG_ACCESS_DELEGATION:     "none"

# =============================================================================
# tableflow-postgres
# =============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: tableflow-postgres
  namespace: prod
  labels:
    app: tableflow
    tableflow/source: postgres
spec:
  selector:
    app: tableflow
    tableflow/source: postgres
  ports:
    - name: signal
      port: 8090
      targetPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tableflow-postgres
  namespace: prod
  labels:
    app: tableflow
    tableflow/source: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tableflow
      tableflow/source: postgres
  template:
    metadata:
      labels:
        app: tableflow
        tableflow/source: postgres
    spec:
      serviceAccountName: spark-cleanup
      nodeSelector:
        kubernetes.io/hostname: worker7.local
      enableServiceLinks: false
      containers:
        - name: tableflow
          image: 192.168.1.50:30500/tableflow:1.0.15
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: tableflow-config
          env:
            - name: SOURCE
              value: "postgres"
          ports:
            - containerPort: 8090
              name: signal
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: tableflow-script
              mountPath: /app/tableflow.py
              subPath: tableflow.py
      volumes:
        - name: tableflow-script
          configMap:
            name: tableflow-script

