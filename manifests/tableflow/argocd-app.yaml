apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tableflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/star-master/k8s-platform.git
    targetRevision: HEAD
    path: manifests/tableflow
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
