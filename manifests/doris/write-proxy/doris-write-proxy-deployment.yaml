# =============================================================================
# Doris Write Proxy — Deployment + Service
# Namespace : prod
# Node      : worker1.local  (same node as Doris FE)
#
# Purpose:
#   Optional MySQL protocol proxy for DML write-pushdown to Apache Spark.
#   Apps that need to INSERT/UPDATE/DELETE against managed Iceberg catalogs
#   connect on port 30091 instead of 30090.
#
#   For all statements except DML against managed Iceberg catalogs, packets
#   are forwarded to Doris unchanged.
#
#   For DML against managed catalogs (polaris, databricks, postgres, oracle,
#   mongodb) the proxy:
#     1. Intercepts the statement BEFORE sending it to Doris.
#     2. Submits it via the in-process SparkSession (local[*] mode).
#     3. Returns MySQL OK (rows affected = 0) on success.
#     4. Returns MySQL ERR with the Spark error on failure.
#
#   The client never sees a "not writable" error from Doris.
#   Local Doris DML (internal tables) passes through to Doris unmodified.
#
# Routing:
#   Client → :30091 (NodePort) → proxy :9040 → Doris FE :9030 (in-cluster)
#
# Note: The write proxy connects directly to Doris FE on :9030 via the
#   in-cluster headless FQDN — it is a trusted in-cluster component.
#
# Image: 192.168.1.50:30500/doris-write-proxy:1.0.22
#   1.0.18 — initial release
#   1.0.19 — OpenBao admin_user key support
#   1.0.20 — SelectGuard added (CACHE_MANAGER_URL)
#   1.0.21 — port change to 9030/30090 (reverted)
#   1.0.22 — add DORIS_USER constant; restore to 9040/30091
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doris-write-proxy
  namespace: prod
  labels:
    app: doris-write-proxy
    component: write-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doris-write-proxy
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: doris-write-proxy
        component: write-proxy
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker1.local
      terminationGracePeriodSeconds: 30
      containers:
        - name: write-proxy
          image: 192.168.1.50:30500/doris-write-proxy:1.0.22
          imagePullPolicy: Always
          command: ["python", "/app/doris_write_proxy.py"]
          env:
            # ── Doris FE — direct in-cluster ──────────────────────────────────
            - name: DORIS_HOST
              value: "doris-fe-0.doris-fe-headless.prod.svc.cluster.local"
            - name: DORIS_PORT
              value: "9030"
            - name: DORIS_USER
              value: "admin"
            # ── Proxy listen ─────────────────────────────────────────────────
            - name: LISTEN_HOST
              value: "0.0.0.0"
            - name: LISTEN_PORT
              value: "9040"
            # ── Spark ────────────────────────────────────────────────────────
            - name: SPARK_INIT_TIMEOUT_S
              value: "120"
            - name: SPARK_SQL_TIMEOUT_S
              value: "300"
            # ── OpenBao ──────────────────────────────────────────────────────
            - name: ADDR
              value: "http://openbao.prod.svc.cluster.local:8200"
            # ── SelectGuard disabled — cache guard runs in cache-manager ─────
            - name: CACHE_MANAGER_URL
              value: ""
            - name: DORIS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rbac-plane-credentials
                  key: DORIS_ADMIN_PASSWORD
          ports:
            - name: mysql-proxy
              containerPort: 9040
              protocol: TCP
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 2Gi
              cpu: 1000m
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "grep -q doris_write_proxy /proc/1/cmdline"
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "grep -q doris_write_proxy /proc/1/cmdline"
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
---
# NodePort 30091 — optional Iceberg DML write-pushdown path only.
# All normal query/read clients use port 30090 (krb-doris-guard).
apiVersion: v1
kind: Service
metadata:
  name: doris-write-proxy
  namespace: prod
  labels:
    app: doris-write-proxy
    component: write-proxy
spec:
  selector:
    app: doris-write-proxy
  type: NodePort
  ports:
    - name: mysql-proxy
      port: 9040
      targetPort: 9040
      nodePort: 30091
      protocol: TCP
