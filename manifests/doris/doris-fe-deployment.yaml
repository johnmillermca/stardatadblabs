# =============================================================================
# Apache Doris FE (Frontend) — ConfigMap + PVC + StatefulSet
# Namespace : prod
# Node      : worker1.local
# Access    : http://192.168.1.50:30030 (HTTP/WebUI)
#             jdbc:mysql://192.168.1.50:30090 (MySQL — routes through krb-doris-guard)
# Secret    : doris-credentials  (key: admin-password)
# PVC       : 100Gi on /home (worker1.local)
#
# Kerberos enforcement — krb-doris-guard sidecar:
#   Doris 4.0.x has no native Kerberos/GSSAPI. The krb-doris-guard sidecar
#   implements KDC enforcement at the MySQL protocol layer.
#
#   Architecture:
#     Client → :19030 (guard) → KDC check → :9030 (Doris FE)
#
#   The guard:
#     1. Intercepts the MySQL HandshakeResponse and extracts the username.
#     2. Runs:  kinit -V -n <username>@REALM </dev/null
#        to check whether the KDC principal exists.
#     3. If the principal does NOT exist → MySQL ERR_Packet 1045 (Access denied)
#        with message:
#          "principal <user>@REALM not found in Kerberos KDC"
#     4. If the principal DOES exist → transparent proxy to Doris :9030.
#        Doris validates the password; Ranger enforces authorization.
#
#   The Service routes port 9030 → guard port 19030 (not Doris port 9030).
#   Doris FE is only accessible via the guard; port 9030 is not exposed directly.
#   root is exempt (EXEMPT_USERS=root) so admin operations are unaffected.
#
# Ranger    : Image fe-4.0.7-ranger includes ranger-hive-plugin JARs on classpath.
#             Ranger config XMLs are mounted from doris-ranger-config ConfigMap.
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: doris-ranger-config
  namespace: prod
data:
  ranger-doris-security.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property>
        <name>ranger.plugin.doris.policy.source.impl</name>
        <value>org.apache.ranger.admin.client.RangerAdminRESTClient</value>
      </property>
      <!-- Service 'doris' now uses the native 'doris' service definition (ID 207)
           with catalog/database/table/column resource hierarchy — matching exactly
           what RangerDorisResource sends. The old hive-backed service was deleted. -->
      <property>
        <name>ranger.plugin.doris.service.name</name>
        <value>doris</value>
      </property>
      <property>
        <name>ranger.plugin.doris.policy.rest.url</name>
        <value>http://ranger-admin.prod.svc.cluster.local:6080</value>
      </property>
      <property>
        <name>ranger.plugin.doris.policy.pollIntervalMs</name>
        <value>30000</value>
      </property>
      <property>
        <name>ranger.plugin.doris.policy.cache.dir</name>
        <value>/opt/apache-doris/fe/ranger-cache</value>
      </property>
      <!-- Enable Ranger user store so group membership is resolved from
           Ranger Admin rather than relying on the calling application to
           supply group information. Required for group-based policies to
           work — without this the plugin only evaluates user-level policies.
           Property key sourced from RangerPluginConfig bytecode:
           propertyPrefix + ".use.rangerGroups" -->
      <property>
        <name>ranger.plugin.doris.use.rangerGroups</name>
        <value>true</value>
      </property>
      <!-- Super-users bypass Ranger policy checks entirely.
           root needs this to run system DDL (ALTER SYSTEM ADD BACKEND,
           CREATE USER, GRANT) which have no equivalent access type.
           Property sourced from RangerBasePlugin.setSuperUsersAndGroups
           via the .super.users suffix. -->
      <property>
        <name>ranger.plugin.doris.super.users</name>
        <value>root</value>
      </property>
    </configuration>
  ranger-doris-audit.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property>
        <name>xasecure.audit.is.enabled</name>
        <value>true</value>
      </property>
      <property>
        <name>xasecure.audit.db.is.enabled</name>
        <value>false</value>
      </property>
      <property>
        <name>xasecure.audit.solr.is.enabled</name>
        <value>false</value>
      </property>
    </configuration>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: doris-fe-config
  namespace: prod
data:
  fe.conf: |
    LOG_DIR = ${DORIS_HOME}/log
    sys_log_level = INFO
    meta_dir = /opt/apache-doris/fe/doris-meta
    http_port = 8030
    rpc_port = 9020
    query_port = 9030
    edit_log_port = 9010
    jdbc_drivers_dir = /opt/apache-doris/fe/jdbc_drivers
    JAVA_OPTS = "-Xmx4096m -XX:+UseMembar -XX:SurvivorRatio=8"
    JAVA_OPTS_FOR_JDK_17 = "-Xmx4096m -XX:SurvivorRatio=8 --add-opens=java.base/java.nio=ALL-UNNAMED"
    # ── Stable identity across pod restarts ──────────────────────────────────
    # BdbJE stores this FQDN instead of the ephemeral pod IP, so the membership
    # record remains valid after every reboot or pod reschedule.
    enable_fqdn_mode = true
    advertised_address = doris-fe-0.doris-fe-headless.prod.svc.cluster.local
    priority_networks = 10.244.0.0/16
    # ── Ranger RBAC ──────────────────────────────────────────────────────────
    access_controller_type = ranger-doris
    # root bypass is configured in ranger-doris-security.xml via
    # ranger.plugin.doris.super.user — no fe.conf entry needed.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: doris-fe-meta
  namespace: prod
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: doris-fe
  namespace: prod
  labels:
    app: doris-fe
    component: fe
spec:
  replicas: 1
  serviceName: doris-fe-headless
  selector:
    matchLabels:
      app: doris-fe
  template:
    metadata:
      labels:
        app: doris-fe
        component: fe
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker1.local
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: copy-fe-config
          image: 192.168.1.50:30500/busybox:1.36
          command: ["sh", "-c", "cp /config-ro/fe.conf /config-rw/fe.conf"]
          volumeMounts:
            - name: fe-config
              mountPath: /config-ro
            - name: fe-config-rw
              mountPath: /config-rw
      containers:
        # ── krb-doris-guard sidecar ──────────────────────────────────────────
        # Listens on :19030, validates KDC principal, proxies to Doris :9030.
        # Built from docker/krb-doris-guard/ — see build-and-push.sh.
        - name: krb-doris-guard
          image: 192.168.1.50:30500/krb-doris-guard:1.0.0
          env:
            - name: KDC_REALM
              value: "STARDATADBLABS.LOCAL"
            - name: KRB5_CONFIG
              value: "/etc/krb5.conf.d/cluster.conf"
            - name: DORIS_HOST
              value: "127.0.0.1"
            - name: DORIS_PORT
              value: "9030"
            - name: LISTEN_PORT
              value: "19030"
            - name: EXEMPT_USERS
              value: "root"
            - name: LOG_LEVEL
              value: "INFO"
          ports:
            - name: guard-mysql
              containerPort: 19030
          volumeMounts:
            - name: krb5-conf
              mountPath: /etc/krb5.conf.d/cluster.conf
              subPath: krb5.conf
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          readinessProbe:
            tcpSocket:
              port: 19030
            initialDelaySeconds: 5
            periodSeconds: 10

        # ── Doris FE ─────────────────────────────────────────────────────────
        - name: doris-fe
          image: 192.168.1.50:30500/apache/doris:fe-4.0.7-ranger
          command:
            - /opt/apache-doris/fe_entrypoint.sh
            - doris-fe-headless.prod.svc.cluster.local
          ports:
            - name: http
              containerPort: 8030
            - name: rpc
              containerPort: 9020
            - name: query
              containerPort: 9030
            - name: edit-log
              containerPort: 9010
          env:
            - name: DORIS_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: doris-credentials
                  key: admin-password
          volumeMounts:
            - name: fe-config-rw
              mountPath: /opt/apache-doris/fe/conf/fe.conf
              subPath: fe.conf
            - name: fe-meta
              mountPath: /opt/apache-doris/fe/doris-meta
            - name: ranger-config
              mountPath: /opt/apache-doris/fe/conf/ranger-doris-security.xml
              subPath: ranger-doris-security.xml
            - name: ranger-config
              mountPath: /opt/apache-doris/fe/conf/ranger-doris-audit.xml
              subPath: ranger-doris-audit.xml
            # ── Kerberos (Phase 1 — prep, no auth change) ────────────────────
            # krb5.conf included by /etc/krb5.conf via includedir — gives JVM
            # JAAS the correct KDC address when Kerberos is later enabled.
            - name: krb5-conf
              mountPath: /etc/krb5.conf.d/cluster.conf
              subPath: krb5.conf
            # doris-keytab is pre-staged; used when LDAP/SPNEGO auth is enabled
            # (Phase 5 — requires FreeIPA or 389-DS LDAP server).
            - name: doris-keytab
              mountPath: /etc/security/keytabs/doris.service.keytab
              subPath: keytab
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 4Gi
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /api/bootstrap
              port: 8030
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
      volumes:
        - name: fe-config
          configMap:
              name: doris-fe-config
        - name: fe-config-rw
          emptyDir: {}
        - name: fe-meta
          persistentVolumeClaim:
            claimName: doris-fe-meta
        - name: ranger-config
          configMap:
            name: doris-ranger-config
        # ── Kerberos volumes ─────────────────────────────────────────────────
        - name: krb5-conf
          configMap:
            name: kerberos-integration-config
            items:
              - key: krb5.conf
                path: krb5.conf
        - name: doris-keytab
          secret:
            secretName: doris-keytab
