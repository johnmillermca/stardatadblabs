# =============================================================================
# Apache Doris BE (Backend) — ConfigMap + PVC + StatefulSet
# Namespace : prod
# Node      : worker1.local
# Connects  : to FE via stable FQDN doris-fe-0.doris-fe-headless.prod.svc.cluster.local
# PVC       : 400Gi on /home (worker1.local) — pre-existing PVC doris-be-storage
# Replicas  : 1
# FE_SERVERS: static FQDN — no init-container IP resolution needed now that FE
#             runs as a StatefulSet with enable_fqdn_mode = true.
#
# NOTE: Previously a Deployment. Converted to StatefulSet so that:
#   1. Pod gets a stable identity (doris-be-0) — BE registers itself in the FE
#      catalog under its hostname; a Deployment can produce a random suffix on
#      restart, which would create a ghost entry in the FE backend table.
#   2. A StatefulSet guarantees at-most-one-pod-at-a-time (same as Recreate
#      strategy on a Deployment, but enforced by the controller even if replicas
#      is accidentally changed).
#   3. Safe to scale in future — each replica would get its own PVC via
#      volumeClaimTemplates.
#
# MIGRATION: The existing PVC 'doris-be-storage' is referenced directly via
# volumes (not volumeClaimTemplates) so no data migration is needed. The PVC
# pre-dates this StatefulSet and must not be owned by the StatefulSet controller.
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: doris-be-config
  namespace: prod
data:
  be.conf: |
    sys_log_level = INFO
    be_port = 9060
    webserver_port = 8040
    heartbeat_service_port = 9050
    brpc_port = 8060
    storage_root_path = /opt/apache-doris/be/storage
    JAVA_OPTS = "-Xmx1024m -DlogPath=$DORIS_HOME/log/jni.log"
---
# Headless service required by StatefulSet for stable DNS (doris-be-0.doris-be-headless)
apiVersion: v1
kind: Service
metadata:
  name: doris-be-headless
  namespace: prod
  labels:
    app: doris-be
    component: be
spec:
  clusterIP: None
  selector:
    app: doris-be
    component: be
  ports:
    - name: heartbeat
      port: 9050
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: doris-be
  namespace: prod
  labels:
    app: doris-be
    component: be
spec:
  replicas: 1
  serviceName: doris-be-headless
  selector:
    matchLabels:
      app: doris-be
  template:
    metadata:
      labels:
        app: doris-be
        component: be
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker1.local
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: copy-be-config
          image: 192.168.1.50:30500/busybox:1.36
          command: ["sh", "-c", "cp /config-ro/be.conf /config-rw/be.conf"]
          volumeMounts:
            - name: be-config
              mountPath: /config-ro
            - name: be-config-rw
              mountPath: /config-rw
      containers:
        - name: doris-be
          image: 192.168.1.50:30500/apache/doris:be-4.0.7
          command:
            - sh
            - -c
            - |
              ulimit -n 524288
              exec /opt/apache-doris/be_entrypoint.sh doris-fe-headless.prod.svc.cluster.local
          ports:
            - name: be-port
              containerPort: 9060
            - name: webserver
              containerPort: 8040
            - name: heartbeat
              containerPort: 9050
            - name: brpc
              containerPort: 8060
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: BE_ADDR
              value: "$(POD_IP):9050"
          volumeMounts:
            - name: be-config-rw
              mountPath: /opt/apache-doris/be/conf/be.conf
              subPath: be.conf
            - name: be-storage
              mountPath: /opt/apache-doris/be/storage
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 4Gi
              cpu: "2"
          # ── Probes ─────────────────────────────────────────────────────────
          # startupProbe: gates readiness until BE is reachable; allows FE up to
          # 5 min (20 × 15s) to start and send the first heartbeat before we
          # declare the pod unhealthy. Once BE passes startup, readinessProbe
          # takes over with a generous failureThreshold so transient FE hiccups
          # (e.g. FE leader election on reboot) don't evict BE from Service.
          startupProbe:
            httpGet:
              path: /api/health
              port: 8040
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 20   # 30 + 20×15 = 330s max wait for FE heartbeat
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8040
            initialDelaySeconds: 0
            periodSeconds: 15
            failureThreshold: 5    # 5×15 = 75s tolerance for transient failures
      volumes:
        - name: be-config
          configMap:
            name: doris-be-config
        - name: be-config-rw
          emptyDir: {}
        # The PVC is referenced by name (not via volumeClaimTemplates) so it is
        # not owned or deleted by the StatefulSet controller.
        - name: be-storage
          persistentVolumeClaim:
            claimName: doris-be-storage
