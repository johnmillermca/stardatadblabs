# =============================================================================
# doris-cache-manager-deployment.yaml
# Kubernetes Deployment for the Doris Dynamic Cache Manager daemon.
#
# Namespace : prod
# Node      : worker1.local  (same as Doris — direct in-cluster MySQL access)
#
# Credentials (all from OpenBao at runtime — none hard-coded):
#   secret/data/platform/doris   → admin_password
#   secret/data/platform/polaris → spark_svc_id, spark_svc_secret
#
# The cache manager:
#   • Scrapes the Doris audit log every 5 minutes (SCAN_INTERVAL_S=300)
#   • Warms up segments for hot tables (select_interval × 2/3 cadence)
#   • Evicts cold tables after 24 h of inactivity
#   • Runs up to 32 concurrent warm-up jobs
#
# Image: 192.168.1.50:30500/doris-cache-manager:1.4.0
#   Built from manifests/doris/cache_manager/ — see runbook-25 for build steps.
#   1.1.0 — fix audit_log catalog detection (use stmt LIKE, not catalog IN);
#            make MANAGED_CATALOGS and CATALOG_WAREHOUSES env-var driven.
#   1.2.0 — replace WARM UP CACHE … USING JOB (Cloud Edition only, unsupported
#            on Community Edition 4.0) with full-scan SELECT COUNT(*) +
#            enable_file_cache=true to populate the BE file cache.
#            Remove COLD_DOWN SQL (also Cloud only); eviction now records to
#            audit table only and relies on BE native LRU.
#   1.3.0 — per-BE cache warm-up fan-out: daemon now discovers all alive BE
#            nodes via SHOW BACKENDS + BE HTTP /api/show_config, then issues
#            one warm-up SELECT per (table, BE) pair using
#            SET_VAR(file_cache_base_path=<be_path>) to pin the scan fragment
#            to each BE's local cache.  This ensures every BE in a multi-node
#            cluster is warmed, not just the one the FE randomly assigns to.
#            Also: ghost-row auto-deletion (table/db does not exist errors),
#            per-thread meta DorisClient to fix concurrent update_last_warmed
#            connection corruption, DORIS_USER and SPARK_VERSION env vars.
#   1.5.0 — rename metadata database from platform_meta / system to cache_system
#            (system is a reserved keyword in Doris; all SQL references updated).
#   1.4.0 — CacheMetricsCollector: new background thread per cycle writes
#            per-table, per-BE I/O metrics to cache_system.table_cache_metrics.
#            Tracks local_scan_bytes, remote_scan_bytes, cache_hit_pct,
#            query_count, avg_query_time_ms, warmup_count, spark_pushdown_count.
#            Runs in its own daemon thread with its own DorisClient — zero
#            impact on warm-up or write-pushdown concurrency.
# =============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: doris-cache-manager
  namespace: prod
  annotations:
    # Bound to OpenBao K8s auth role 'doris-cache-manager' → policy platform-secrets-read
    openbao.org/role: "doris-cache-manager"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doris-cache-manager
  namespace: prod
  labels:
    app: doris-cache-manager
    component: cache-daemon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doris-cache-manager
  # Only one replica should run at a time. Recreate ensures no overlap during
  # rollout — avoids two daemons issuing warm-up jobs simultaneously.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: doris-cache-manager
        component: cache-daemon
    spec:
      serviceAccountName: doris-cache-manager
      nodeSelector:
        kubernetes.io/hostname: worker1.local
      terminationGracePeriodSeconds: 60
      containers:
        - name: cache-manager
          image: 192.168.1.50:30500/doris-cache-manager:1.5.1
          imagePullPolicy: Always
          command: ["python", "/app/doris_cache_manager.py"]
          env:
            # ── OpenBao address (in-cluster) ────────────────────────────────
            - name: ADDR
              value: "http://openbao.prod.svc.cluster.local:8200"
            - name: BAO_ROLE
              value: "doris-cache-manager"
            # ── Doris password injected directly from cluster secret ─────────
            # The daemon reads admin_password from OpenBao secret/data/platform/doris.
            # To avoid a chicken-and-egg bootstrap problem (needing OpenBao to get the
            # Doris password used to connect to Doris), the root password is also
            # available as TOKEN env-var fallback — but here we pass it via OpenBao.
            # NOTE: DORIS_ADMIN_PASSWORD is used only as a last-resort env fallback
            # if OpenBao K8s auth fails during the initial startup grace period.
            - name: DORIS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rbac-plane-credentials
                  key: DORIS_ADMIN_PASSWORD
            # ── Doris FE address (direct, bypasses krb-doris-guard sidecar)
            # The cache manager uses the root account which is EXEMPT_USERS in
            # the guard config — connects on port 9030 directly in-cluster.
            - name: DORIS_HOST
              value: "doris-fe.prod.svc.cluster.local"
            - name: DORIS_PORT
              value: "9030"
            # ── Tuning ─────────────────────────────────────────────────────
            - name: SCAN_INTERVAL_S
              value: "300"
            - name: LRU_EVICT_HOURS
              value: "24"
            - name: MAX_CONCURRENT
              value: "32"
            - name: WARMUP_STALE_MIN
              value: "5"
            # ── Catalog list (env-driven — no image rebuild needed to add catalogs) ─
            - name: MANAGED_CATALOGS
              value: "polaris,databricks,postgres,oracle,mongodb"
            - name: CATALOG_WAREHOUSES
              value: "polaris:IcebergCatalog,databricks:star_lakehouse,postgres:pg_lakehouse,oracle:ora_lakehouse,mongodb:mgo_lakehouse"
            # ── Doris user (default: root) ─────────────────────────────────
            - name: DORIS_USER
              value: "root"
            # ── Spark REST URL for write-pushdown ───────────────────────────
            - name: SPARK_REST_URL
              value: "http://spark-master-svc.prod.svc.cluster.local:6066"
            - name: SPARK_MASTER_URL
              value: "spark://spark-master-internal.prod.svc.cluster.local:17077"
            - name: SPARK_VERSION
              value: "3.5.1"
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            # The daemon writes a heartbeat file each cycle so liveness can be
            # checked without a listening port.
            exec:
              command:
                - sh
                - -c
                - "test -f /tmp/cache_manager_alive && test $(( $(date +%s) - $(stat -c %Y /tmp/cache_manager_alive) )) -lt 900"
            initialDelaySeconds: 120
            periodSeconds: 300
            failureThreshold: 3
      restartPolicy: Always
