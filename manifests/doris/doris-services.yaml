# =============================================================================
# Apache Doris Services
# Namespace : prod
# FE NodePort: http://192.168.1.50:30030 (HTTP)
#
# MySQL entry point:
#   All MySQL clients connect to NodePort 30090, which now routes to the
#   doris-write-proxy (port 9030) — NOT directly to Doris FE.
#   The write-proxy enforces the SELECT cache guard, handles write-pushdown
#   to Spark, and forwards everything else to Doris FE :9030 internally.
#
#   doris-fe query port (9030) is NO LONGER exposed as a NodePort.
#   External clients cannot bypass the write-proxy.
#   The krb-doris-guard sidecar (19030) is also no longer reachable externally.
# =============================================================================
---
# External NodePort for FE — HTTP WebUI only (MySQL removed — now via write-proxy)
apiVersion: v1
kind: Service
metadata:
  name: doris-fe
  namespace: prod
spec:
  selector:
    app: doris-fe
  type: NodePort
  ports:
    - name: http
      port: 8030
      targetPort: 8030
      nodePort: 30030
    # query port intentionally NOT exposed as NodePort —
    # all MySQL traffic enters via doris-write-proxy NodePort 30090.
    - name: edit-log
      port: 9010
      targetPort: 9010
    - name: rpc
      port: 9020
      targetPort: 9020
---
# Headless service for stable FE DNS (required for enable_fqdn_mode=true)
apiVersion: v1
kind: Service
metadata:
  name: doris-fe-headless
  namespace: prod
spec:
  clusterIP: None
  selector:
    app: doris-fe
  ports:
    - name: edit-log
      port: 9010
    - name: rpc
      port: 9020
---
# Internal ClusterIP for BE — not exposed externally
apiVersion: v1
kind: Service
metadata:
  name: doris-be
  namespace: prod
spec:
  selector:
    app: doris-be
  type: ClusterIP
  ports:
    - name: be-port
      port: 9060
    - name: webserver
      port: 8040
    - name: heartbeat
      port: 9050
    - name: brpc
      port: 8060
