# =============================================================================
# Apache Doris Services
# Namespace : prod
# FE NodePort: http://192.168.1.50:30030 (HTTP)
#
# MySQL entry point:
#   All MySQL clients connect to NodePort 30090 → write-proxy → krb-doris-guard
#   (port 19030 on doris-fe ClusterIP) → Doris :9030 on 127.0.0.1.
#   The write-proxy enforces the SELECT cache guard and write-pushdown, then
#   forwards all other traffic to krb-doris-guard which proxies to Doris
#   on loopback — so Doris always sees the connection from 127.0.0.1 and
#   root/other users are authenticated normally.
#
#   doris-fe query port (9030) is NOT exposed externally or in-cluster.
#   External clients cannot bypass the write-proxy or the guard.
# =============================================================================
---
# External NodePort for FE — HTTP WebUI only (MySQL now via write-proxy → guard)
apiVersion: v1
kind: Service
metadata:
  name: doris-fe
  namespace: prod
spec:
  selector:
    app: doris-fe
  type: NodePort
  ports:
    - name: http
      port: 8030
      targetPort: 8030
      nodePort: 30030
    # krb-doris-guard port — reachable in-cluster by the write-proxy.
    # NOT exposed as a NodePort; only the write-proxy uses this path.
    - name: guard
      port: 19030
      targetPort: 19030
    - name: edit-log
      port: 9010
      targetPort: 9010
    - name: rpc
      port: 9020
      targetPort: 9020
---
# Headless service for stable FE DNS (required for enable_fqdn_mode=true)
apiVersion: v1
kind: Service
metadata:
  name: doris-fe-headless
  namespace: prod
spec:
  clusterIP: None
  selector:
    app: doris-fe
  ports:
    - name: edit-log
      port: 9010
    - name: rpc
      port: 9020
---
# Internal ClusterIP for BE — not exposed externally
apiVersion: v1
kind: Service
metadata:
  name: doris-be
  namespace: prod
spec:
  selector:
    app: doris-be
  type: ClusterIP
  ports:
    - name: be-port
      port: 9060
    - name: webserver
      port: 8040
    - name: heartbeat
      port: 9050
    - name: brpc
      port: 8060
