# =============================================================================
# KEDA ScaledObjects — document-processing autoscaling
# Namespace : prod
# Cluster   : strimzi-kafka (bootstrap port 9092, SCRAM-SHA-512)
#
# ScaledObjects defined:
#   1. document-ingestor     — scales on Kafka topic `documents.raw` lag
#   2. document-processor    — scales on Kafka topic `documents.parsed` lag
#   3. document-embedder     — scales on Kafka topic `documents.chunked` lag
#
# TriggerAuthentication uses the existing kafka-app-user SCRAM secret
# generated by the Strimzi UserOperator.
# =============================================================================

# ── TriggerAuthentication (shared by all ScaledObjects) ─────────────────────
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-kafka-scram-auth
  namespace: prod
spec:
  secretTargetRef:
    - parameter: username
      name: kafka-app-user
      key: sasl.jaas.config
    - parameter: password
      name: kafka-app-user
      key: password
    - parameter: sasl
      name: keda-kafka-auth-params
      key: sasl
    - parameter: tls
      name: keda-kafka-auth-params
      key: tls

# ── ConfigMap: shared KEDA Kafka auth params ─────────────────────────────────
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keda-kafka-auth-params
  namespace: prod
data:
  # SASL mechanism — matches Strimzi listener config
  sasl: scram_sha512
  # TLS disabled on the internal SCRAM listener (plain port 9092)
  tls: "false"

# ── ScaledObject: document-ingestor ─────────────────────────────────────────
# Autoscales the document-ingestor Deployment based on lag on topic
# `documents.raw`.  Min 1 replica at all times (no scale-to-zero) so the first
# document is processed without cold-start latency.
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: document-ingestor-scaler
  namespace: prod
spec:
  scaleTargetRef:
    name: document-ingestor
  minReplicaCount: 1
  maxReplicaCount: 6           # 2 replicas per kafka broker
  pollingInterval: 15          # check lag every 15 s
  cooldownPeriod: 60           # wait 60 s before scaling down
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: strimzi-kafka-kafka-bootstrap.prod.svc.cluster.local:9092
        consumerGroup: document-ingestor-group
        topic: documents.raw
        lagThreshold: "100"    # scale up when lag > 100 messages per partition
        offsetResetPolicy: latest
        allowIdleConsumers: "false"
      authenticationRef:
        name: keda-kafka-scram-auth

# ── ScaledObject: document-processor ────────────────────────────────────────
# Processes parsed documents (OCR, NLP, metadata extraction).
# Higher threshold than ingestor — processing is CPU-bound and slower.
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: document-processor-scaler
  namespace: prod
spec:
  scaleTargetRef:
    name: document-processor
  minReplicaCount: 1
  maxReplicaCount: 9
  pollingInterval: 15
  cooldownPeriod: 120           # longer cooldown — processor pods are expensive
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: strimzi-kafka-kafka-bootstrap.prod.svc.cluster.local:9092
        consumerGroup: document-processor-group
        topic: documents.parsed
        lagThreshold: "50"     # scale up when lag > 50 messages per partition
        offsetResetPolicy: latest
        allowIdleConsumers: "false"
      authenticationRef:
        name: keda-kafka-scram-auth

# ── ScaledObject: document-embedder ─────────────────────────────────────────
# Vector-embeds chunked document text for downstream search indexes.
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: document-embedder-scaler
  namespace: prod
spec:
  scaleTargetRef:
    name: document-embedder
  minReplicaCount: 1
  maxReplicaCount: 6
  pollingInterval: 30
  cooldownPeriod: 180
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: strimzi-kafka-kafka-bootstrap.prod.svc.cluster.local:9092
        consumerGroup: document-embedder-group
        topic: documents.chunked
        lagThreshold: "200"
        offsetResetPolicy: latest
        allowIdleConsumers: "false"
      authenticationRef:
        name: keda-kafka-scram-auth
