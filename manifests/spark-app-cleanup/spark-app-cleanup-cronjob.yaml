---
# =============================================================================
# Spark Orphan App Cleanup — RBAC
# =============================================================================
#
# spark-guardian sidecar (spark-master pod) handles all cleanup dynamically —
# polls localhost:8080/json/ every 15s, evicts stalled apps, and autoscales
# the spark-worker Deployment up/down via the K8s API.
#
# Two ServiceAccounts:
#   spark-cleanup   — kept for the manual ad-hoc kill tool (kubectl exec)
#   spark-guardian  — used by the spark-master pod; needs deployment scale RBAC
#
# Manual one-shot kill (ad-hoc)
# ----------------------------------------------------------------
#   SPARK_POD=$(kubectl get pods -n prod -l app=spark,component=master \
#     --no-headers -o custom-columns=NAME:.metadata.name | head -1)
#   kubectl exec -n prod $SPARK_POD -c spark-master -- \
#     /usr/local/bin/spark-app-cleanup
#
# =============================================================================

# ── spark-cleanup: manual ad-hoc kill tool ───────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-cleanup
  namespace: prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-cleanup
  namespace: prod
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-cleanup
  namespace: prod
subjects:
  - kind: ServiceAccount
    name: spark-cleanup
    namespace: prod
roleRef:
  kind: Role
  name: spark-cleanup
  apiGroup: rbac.authorization.k8s.io

# ── spark-guardian: used by spark-master pod ─────────────────────────────────
# Needs to GET and PATCH the spark-worker Deployment replicas for autoscaling.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-guardian
  namespace: prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-guardian
  namespace: prod
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-guardian
  namespace: prod
subjects:
  - kind: ServiceAccount
    name: spark-guardian
    namespace: prod
roleRef:
  kind: Role
  name: spark-guardian
  apiGroup: rbac.authorization.k8s.io
