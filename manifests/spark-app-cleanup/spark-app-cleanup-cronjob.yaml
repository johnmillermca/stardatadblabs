---
# =============================================================================
# Spark Orphan App Cleanup — RBAC + manual tool
# =============================================================================
#
# The periodic CronJob has been REPLACED by the spark-guardian sidecar
# running continuously inside the spark-master pod (see manifests/spark/spark.yaml).
#
# spark-guardian polls localhost:8080/json/ every 15 seconds and evicts stalled
# apps within one poll cycle — replacing the previous 10-minute CronJob lag.
#
# This file retains only the ServiceAccount / Role / RoleBinding needed for
# the kubectl exec manual kill command below.  The CronJob resource itself has
# been removed.
#
# Manual one-shot kill (ad-hoc, from any node with cluster access)
# ----------------------------------------------------------------
#   SPARK_POD=$(kubectl get pods -n prod -l app=spark,component=master \
#     --no-headers -o custom-columns=NAME:.metadata.name | head -1)
#   kubectl exec -n prod $SPARK_POD -c spark-master -- \
#     /usr/local/bin/spark-app-cleanup
#
# Tune guardian thresholds
# ------------------------
#   Edit the env vars on the spark-guardian container in manifests/spark/spark.yaml:
#     ORPHAN_RUNNING_S   Rule A/B — dead-driver / no-executor timeout (default 120 s)
#     ORPHAN_WAITING_S   Rule C   — resource-starvation timeout       (default 120 s)
#     IDLE_SINCE_S       Rule D   — idle-session timeout               (default 1800 s)
#     POLL_INTERVAL_S              poll cadence                        (default 15 s)
#
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-cleanup
  namespace: prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-cleanup
  namespace: prod
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-cleanup
  namespace: prod
subjects:
  - kind: ServiceAccount
    name: spark-cleanup
    namespace: prod
roleRef:
  kind: Role
  name: spark-cleanup
  apiGroup: rbac.authorization.k8s.io
---
# CronJob removed — spark-guardian sidecar handles cleanup dynamically.
# See manifests/spark/spark.yaml → containers[spark-guardian].
