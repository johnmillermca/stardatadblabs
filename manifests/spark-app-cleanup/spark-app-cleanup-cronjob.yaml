# =============================================================================
# spark-cleanup ServiceAccount + RBAC
# =====================================
# The spark-cleanup ServiceAccount is shared by several non-Spark workloads:
#   - tableflow pods       (OpenBao credential lookups via K8s SA JWT)
#   - ksqldb-new-table-watcher CronJob
#   - polaris-bootstrap Job
#
# Spark has been removed from the platform; this manifest retains only the
# ServiceAccount and its minimal RBAC so those workloads continue to function.
# =============================================================================

# ── spark-cleanup ServiceAccount ─────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-cleanup
  namespace: prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-cleanup
  namespace: prod
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-cleanup
  namespace: prod
subjects:
  - kind: ServiceAccount
    name: spark-cleanup
    namespace: prod
roleRef:
  kind: Role
  name: spark-cleanup
  apiGroup: rbac.authorization.k8s.io
