apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-reset-password
  namespace: prod
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: master2.local
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: workload
          operator: Equal
          value: master
          effect: NoSchedule
      initContainers:
        - name: fix-keyfile-perms
          image: 192.168.1.50:30500/library/mongo:8.0
          command: ["bash", "-c", "cp /secret/keyfile /data/keyfile && chmod 400 /data/keyfile && chown 999:999 /data/keyfile"]
          volumeMounts:
            - name: mongodb-keyfile
              mountPath: /secret/keyfile
              subPath: keyfile
            - name: mongodb-keyfile-rw
              mountPath: /data
      containers:
        - name: reset
          image: 192.168.1.50:30500/library/mongo:8.0
          env:
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: mongodb-root-password
          command:
            - bash
            - -c
            - |
              set -e
              echo "Starting mongod in standalone mode (no replSet, no auth) to reset password..."
              mongod --bind_ip 127.0.0.1 --dbpath /data/db \
                --logpath /tmp/mongod-reset.log --fork --port 27017

              echo "Waiting for mongod to be ready..."
              for i in $(seq 1 30); do
                mongosh --quiet --port 27017 \
                  --eval "db.adminCommand('ping')" >/dev/null 2>&1 && break
                sleep 1
              done

              echo "Resetting root password to value from secret..."
              mongosh --quiet --port 27017 \
                --eval "db.getSiblingDB('admin').updateUser('root', {pwd: '${MONGO_INITDB_ROOT_PASSWORD}'})"

              echo "Password reset complete. Shutting down."
              mongosh --quiet --port 27017 \
                --eval "db.adminCommand({shutdown: 1})" || true
              sleep 2
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
            - name: mongodb-keyfile-rw
              mountPath: /etc/mongodb/keyfile
              subPath: keyfile
              readOnly: false
      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: mongodb-data
        - name: mongodb-keyfile
          secret:
            secretName: mongodb-keyfile
            defaultMode: 0400
        - name: mongodb-keyfile-rw
          emptyDir: {}
