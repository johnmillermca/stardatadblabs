resolver 10.96.0.10 valid=10s ipv6=off;

# ── www.stardatadb.com → S3 static website ────────────────────────────────
server {
    listen 80;
    server_name www.stardatadb.com stardatadb.com _;

    location / {
        set $s3 "stardatadb-web.s3-website.us-east-2.amazonaws.com";
        proxy_pass       http://$s3;
        proxy_set_header Host $s3;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# ── auth.stardatadb.com → Pocket ID ───────────────────────────────────────
server {
    listen 80;
    server_name auth.stardatadb.com;

    location / {
        set $pocket_id "pocket-id.access.svc.cluster.local";
        proxy_pass         http://$pocket_id:1411;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# ── console.stardatadb.com → static console.html on worker1 ──────────────
server {
    listen 80;
    server_name console.stardatadb.com;

    location / {
        set $console "console-spa.access.svc.cluster.local";
        proxy_pass         http://$console:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# ── Health probe port ────────────────────────────────────────────────────
server {
    listen 8081;
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
